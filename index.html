}

function mpArmJoinTimer(ms) {
  clearTimeout(mp.joinTimer);
  mp.joinTimer = setTimeout(() => {
    if (!mp.active || mp.synced) return;
    // Friends are there but nobody has sent the world yet — give them a moment
    if (mp.players.size && !mp.joinExtended) {
      mp.joinExtended = true;
      mpArmJoinTimer(MP_JOIN_WAIT_MS);
      return;
    }
    document.getElementById('emptyText').textContent = `Nobody is playing in world ${mp.code} right now.`;
    showMenu('menuEmpty');
  }, ms);
}

function mpFail(err, screen, errorId) {
  if (err && err.message === 'cancelled') return;
  console.warn('Multiplayer connection failed', err);
  mpLeave();
  showMenu(screen);
  setMenuError(errorId, "Couldn't connect. Check the internet and try again!");
}

// Connect to a world's channel. Resolves once PubNub says we're subscribed.
async function mpOpen(code) {
  mpLeave();
  const session = mp.session;
  mp.active = true;
  mp.code = code;
  mp.channel = MP_CHANNEL_PREFIX + code;
  mp.items = await mpLoadAllMaps();
  if (session !== mp.session) throw new Error('cancelled');

  const pn = new PubNub({
    publishKey: PUBNUB_PUBLISH_KEY,
    subscribeKey: PUBNUB_SUBSCRIBE_KEY,
    userId: mp.myId
  });
  mp.pubnub = pn;
  await new Promise((resolve, reject) => {
    const timer = setTimeout(() => { mp.connectWaiter = null; reject(new Error('timeout')); }, 12000);
    mp.connectWaiter = {
      resolve: () => { clearTimeout(timer); resolve(); },
      reject: (e) => { clearTimeout(timer); reject(e); }
    };
    pn.addListener({
      message: (ev) => { if (mp.pubnub === pn) mpOnMessage(ev); },
      status: (st) => { if (mp.pubnub === pn) mpOnStatus(st); }
    });
    pn.subscribe({ channels: [mp.channel] });
  });
  if (session !== mp.session) throw new Error('cancelled');
}

function mpLeave() {
  if (mp.connectWaiter) {
    const w = mp.connectWaiter;
    mp.connectWaiter = null;
    w.reject(new Error('cancelled'));
  }
  clearTimeout(mp.joinTimer);
  clearTimeout(mp.cacheTimer);
  for (const t of mp.snapReplies.values()) clearTimeout(t);
  if (mp.cacheTimer) mpCacheWorld();
  const pn = mp.pubnub;
  if (pn) {
    const done = () => { try { pn.unsubscribeAll(); pn.destroy(); } catch (_) { /* already gone */ } };
    if (mp.present) {
      pn.publish({ channel: mp.channel, message: { t: 'bye', from: mp.myId }, storeInHistory: false })
        .catch(() => {}).finally(done);
    } else {
      done();
    }
  }
  if (talkingTo && talkingTo.remote) endConversation();
  speechBubbles = speechBubbles.filter(b => !(b.owner && b.owner.remote) && !(b.partner && b.partner.remote));
  mapBoss.busyWith = null;
  mapBoss.tfx = mapBoss.tfy = null;
  mpBossKeeperWas = false;
  Object.assign(mp, {
    active: false, code: null, channel: null, pubnub: null,
    connected: false, wasDisconnected: false, synced: false,
    lastOpTT: 0n, buffer: [], items: {}, lastTaker: {},
    present: false, lastPosAt: 0, lastPosKey: '',
    joinTimer: null, joinExtended: false, onSynced: null, cacheTimer: null
  });
  mp.players.clear();
  mp.pendingTakes.clear();
  mp.pendingDrops.clear();
  mp.snapReplies.clear();
  mp.session++;
}

// Connected and synced: on to picking a camper
function mpEnterWorld() {
  hideMenu();
  if (mapConfig) hotspotItems = mpItemsFor(currentMapPath, mapConfig);
  charSelectNote = null;
  state = GameState.CHARACTER_SELECT;
}

// Called by selectCharacter() in a world. Your backpack + journal are saved
// per world and camper, so coming back to the same world picks up where you were.
function mpStartPlaying() {
  const save = mpLoadSave();
  const items = arr => Array.isArray(arr) ? arr.map(mpCleanItem).filter(Boolean) : [];
  backpack      = save ? items(save.backpack).slice(0, BACKPACK_CAPACITY) : [];
  completedUses = save && Array.isArray(save.completedUses) ? save.completedUses.map(u => ({ ...u })) : [];
  dishesMade    = save && Array.isArray(save.dishesMade) ? [...save.dishesMade] : [];
  customRecipes = cleanCustomRecipes(save && save.customRecipes);
  resetDraftRecipe();
  strengthBoost = save ? clamp(Number(save.strengthBoost) || 0, 0, STRENGTH_BOOST_MAX) : 0;
  swordRating   = savedSwordRating(save);
  bossWins      = save ? Math.max(0, Math.floor(Number(save.bossWins) || 0)) : 0;
  allMapSaves = {};
  hotspotItems = mpItemsFor(currentMapPath, mapConfig);
  // Arrive beside (not on top of) any friends standing at the start
  const friends = mpPlayersHere();
  const startX = player.x;
  let best = startX, bestGap = -1;
  for (const dx of [0, -110, 110, -220, 220, -330, 330]) {
    const x = clamp(startX + dx, 10, scaledMapW - 10);
    const gap = Math.min(Infinity, ...friends.map(rp => Math.hypot(rp.x - x, rp.y - player.y)));
    if (gap >= 100) { best = x; break; }          // nearest spot with room to stand
    if (gap > bestGap) { best = x; bestGap = gap; }
  }
  player.x = best;
  state = GameState.PLAYING;
  const others = mp.players.size;
  useToast = {
    text: others ? `Welcome to world ${mp.code}! 👋` : `World ${mp.code} — give your friends this code!`,
    age: 0
  };
  writeSave();
  checkSwordSoon();
  if (save && save.currentMap && save.currentMap !== currentMapPath && mp.items[save.currentMap]) {
    switchMap(save.currentMap, null);
  }
}

// Every map's default items, found by following portals from the main map
async function mpLoadAllMaps() {
  const queue = [MP_MAIN_MAP];
  const seen = new Set(queue);
  const out = {};
  while (queue.length) {
    const path = queue.shift();
    let cfg = mp.mapConfigs[path];
    if (!cfg) {
      try {
        cfg = await (await fetch(path)).json();
        mp.mapConfigs[path] = cfg;
      } catch (_) { continue; }
    }
    out[path] = restoreOrDefaultHotspots(cfg, {});
    for (const h of cfg.hotspots || []) {
      if (h.targetMap && !seen.has(h.targetMap)) {
        seen.add(h.targetMap);
        queue.push(h.targetMap);
      }
    }
  }
  return out;
}

// The shared item lists for one map (filling in any hotspot we don't know yet)
function mpItemsFor(path, config) {
  const m = mp.items[path] || (mp.items[path] = {});
  for (const def of config.hotspots) {
    if (!Array.isArray(m[def.id])) m[def.id] = (def.items || []).map(it => ({ ...it }));
  }
  return m;
}

// --- Saves ---
function mpSaveKey() {
  return `louisas-game:mp:${mp.code}:${player.character.name}`;
}
function mpLoadSave() {
  try {
    const raw = localStorage.getItem(mpSaveKey());
    return raw ? JSON.parse(raw) : null;
  } catch (_) { return null; }
}
function mpWriteSave() {
  try {
    localStorage.setItem(mpSaveKey(), JSON.stringify({
      version: SAVE_VERSION, currentMap: currentMapPath, backpack, completedUses, dishesMade, customRecipes, strengthBoost, swordRating, bossWins
    }));
  } catch (e) { console.warn('Failed to write save', e); }
}
function mpWorldKey() {
  return `louisas-game:world:${mp.code}`;
}
function mpCacheWorld() {
  mp.cacheTimer = null;
  if (!mp.code) return;
  try { localStorage.setItem(mpWorldKey(), JSON.stringify({ items: mp.items, savedAt: Date.now() })); } catch (_) { /* full */ }
}
function mpCacheWorldSoon() {
  if (!mp.cacheTimer) mp.cacheTimer = setTimeout(mpCacheWorld, 1000);
}
// Nobody answered: use our own last copy of this world (or a fresh one)
function mpUseCachedWorld() {
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(mpWorldKey()) || 'null'); } catch (_) { /* ignore */ }
  mpApplySnapshot({ at: '0', items: (cached && cached.items) || mp.items });
}

// --- Sending ---
function mpPublish(message, byPost) {
  if (!mp.pubnub) return Promise.reject(new Error('not connected'));
  return mp.pubnub.publish({
    channel: mp.channel,
    message: { ...message, from: mp.myId },
    storeInHistory: false,
    sendByPost: !!byPost
  });
}
function mpSend(message, byPost) {
  mpPublish(message, byPost).catch(err => console.warn('PubNub publish failed', err));
}

// Is our camper out in the world (visible to friends)?
function mpInWorld() {
  return !!player.character && [
    GameState.PLAYING, GameState.TALKING, GameState.INTERACTING, GameState.ITEM_ACTION,
    GameState.USING_ITEM, GameState.CONFIRM_DIALOG, GameState.FIGHTING, GameState.KITCHEN_MODAL
  ].includes(state);
}

function mpSendPos(force) {
  if (!mp.active || !mp.connected || !mpInWorld() || !scaledMapW) return;
  const now = performance.now();
  const msg = {
    t: 'pos',
    char: player.character.name,
    map: currentMapPath,
    x: +(player.x / scaledMapW).toFixed(4),
    y: +(player.y / scaledMapH).toFixed(4),
    f: player.facing,
    w: player.walking ? 1 : 0,
    r: player.rotation,
    h: heldItem ? heldItem.emoji : null,
    fi: state === GameState.FIGHTING || bossEngage ? 1 : 0,
    sw: hasSword() ? 1 : 0
  };
  if (sidekick) {
    // My sidekick: which NPC (and who they are), and where they are on my map
    msg.sk = {
      id: sidekick.npc.id,
      c: sidekick.char.name,
      x: +(sidekick.x / scaledMapW).toFixed(4),
      y: +(sidekick.y / scaledMapH).toFixed(4),
      f: sidekick.facing,
      w: sidekick.walking ? 1 : 0
    };
  }
  const sk = msg.sk;
  const key = [msg.char, msg.map, msg.x, msg.y, msg.f, msg.w, msg.r, msg.h, msg.fi, msg.sw,
    sk ? [sk.id, sk.x, sk.y, sk.f, sk.w].join(',') : ''].join('|');
  const due = force ||
    (key !== mp.lastPosKey && now - mp.lastPosAt >= MP_POS_EVERY_MS) ||
    now - mp.lastPosAt >= MP_HEARTBEAT_MS;
  if (!due) return;
  mp.lastPosKey = key;
  mp.lastPosAt = now;
  mp.present = true;
  mpSend(msg);
}

function mpSendBye() {
  if (mp.present) mpSend({ t: 'bye' });
  mp.present = false;
  mp.lastPosKey = '';
}

function mpSendSnapshot(to) {
  mpSend({ t: 'snap', to, at: String(mp.lastOpTT), items: mp.items }, true);
}

// A line of speech, so friends on this map see the bubble.
// `to` is 'player' (me), an NPC def or a remote player; `npcSpeaker` set
// when it's an NPC's reply to me.
function mpSay(text, to, npcSpeaker) {
  if (!mp.active || !mp.present) return;
  const msg = { t: 'say', map: currentMapPath, text };
  if (npcSpeaker) {
    msg.npc = npcSpeaker.id;
    msg.to = mp.myId;
  } else {
    msg.to = to === 'player' ? mp.myId : (to && to.id) || null;
  }
  mpSend(msg);
}

// --- Receiving ---
function mpOnStatus(st) {
  const c = st && st.category;
  if (c === 'PNConnectedCategory' || c === 'PNReconnectedCategory' || c === 'PNSubscriptionChangedCategory') {
    mp.connected = true;
    if (mp.connectWaiter) {
      const w = mp.connectWaiter;
      mp.connectWaiter = null;
      w.resolve();
    } else if (mp.wasDisconnected) {
      mpResync();   // we may have missed item moves while offline
    }
    mp.wasDisconnected = false;
  } else if (['PNNetworkDownCategory', 'PNNetworkIssuesCategory', 'PNTimeoutCategory',
              'PNDisconnectedUnexpectedlyCategory', 'PNConnectionErrorCategory',
              'PNAccessDeniedCategory'].includes(c)) {
    if (mp.connectWaiter) {
      const w = mp.connectWaiter;
      mp.connectWaiter = null;
      w.reject(new Error(c));
      return;
    }
    mp.connected = false;
    mp.wasDisconnected = true;
  }
}

// After a dropped connection: ask for the world again (keep ours if nobody answers)
function mpResync() {
  if (!mp.synced) return;
  mp.synced = false;
  mp.buffer = [];
  mpSend({ t: 'hello' });
  clearTimeout(mp.joinTimer);
  mp.joinTimer = setTimeout(() => {
    if (mp.active && !mp.synced) mpApplySnapshot({ at: String(mp.lastOpTT), items: mp.items });
  }, MP_JOIN_WAIT_MS);
}

function mpOnMessage(ev) {
  const m = ev && ev.message;
  if (!m || typeof m !== 'object' || typeof m.t !== 'string') return;
  const from = String(ev.publisher || m.from || '');
  if (!from) return;
  let tt;
  try { tt = BigInt(ev.timetoken); } catch (_) { return; }
  const known = mp.players.get(from);
  if (known) known.lastSeen = performance.now();

  switch (m.t) {
    case 'take':
    case 'drop':
      if (mp.synced) mpApplyOp(m, from, tt);
      else mp.buffer.push({ m, from, tt });
      break;
    case 'snap':
      if (m.to === mp.myId) {
        if (!mp.synced) mpApplySnapshot(m);
      } else if (mp.snapReplies.has(m.to)) {
        // someone else already answered that newcomer
        clearTimeout(mp.snapReplies.get(m.to));
        mp.snapReplies.delete(m.to);
      }
      break;
    case 'hello':
      if (from === mp.myId) break;
      if (mp.present) setTimeout(() => mpSendPos(true), Math.random() * 300);
      if (mp.synced && !mp.snapReplies.has(from)) {
        mp.snapReplies.set(from, setTimeout(() => {
          mp.snapReplies.delete(from);
          mpSendSnapshot(from);
        }, 50 + Math.random() * 450));
      }
      break;
    case 'pos':
      if (from !== mp.myId) mpOnPos(m, from);
      break;
    case 'say':
      if (from !== mp.myId) mpOnSay(m, from);
      break;
    case 'bye':
      if (from !== mp.myId) mpRemovePlayer(from, 'left');
      break;
    case 'boss':
      if (from !== mp.myId) mpOnBossState(m, from);
      break;
    case 'bossfight':
      if (from !== mp.myId) mpOnBossFight(m, from);
      break;
  }
}

function mpCleanItem(it) {
  if (!it || typeof it.id !== 'string' || !it.id) return null;
  const o = {
    id: it.id.slice(0, 60),
    name: String(it.name || it.id).slice(0, 60),
    emoji: String(it.emoji || '❓').slice(0, 12)
  };
  if (typeof it.pickedUpFrom === 'string') o.pickedUpFrom = it.pickedUpFrom.slice(0, 60);
  return o;
}

function mpApplySnapshot(m) {
  if (!m.items || typeof m.items !== 'object') return;
  let at = 0n;
  try { at = BigInt(m.at || 0); } catch (_) { /* treat as 0 */ }
  const items = {};
  for (const [path, hotspots] of Object.entries(m.items)) {
    if (!hotspots || typeof hotspots !== 'object') continue;
    const out = {};
    for (const [hsId, list] of Object.entries(hotspots)) {
      if (Array.isArray(list)) out[hsId] = list.map(mpCleanItem).filter(Boolean).slice(0, HOTSPOT_CAPACITY);
    }
    items[path] = out;
  }
  // Maps the sender didn't know about keep their defaults
  for (const [path, defaults] of Object.entries(mp.items)) {
    if (!items[path]) items[path] = defaults;
  }
  mp.items = items;
  mp.lastOpTT = at;
  mp.synced = true;
  clearTimeout(mp.joinTimer);
  // Item moves that happened after the snapshot was taken
  const later = mp.buffer;
  mp.buffer = [];
  for (const b of later) if (b.tt > at) mpApplyOp(b.m, b.from, b.tt);
  if (mapConfig && mp.items[currentMapPath]) hotspotItems = mpItemsFor(currentMapPath, mapConfig);
  mpCacheWorldSoon();
  if (mp.onSynced) {
    const f = mp.onSynced;
    mp.onSynced = null;
    f();
  }
}

// Apply one take/drop. Every computer runs this in the same order.
function mpApplyOp(m, from, tt) {
  if (tt > mp.lastOpTT) mp.lastOpTT = tt;
  const mapItems = mp.items[m.map];
  if (!mapItems || typeof m.hs !== 'string' || !Array.isArray(mapItems[m.hs])) return;
  const list = mapItems[m.hs];
  if (m.t === 'take') {
    const idx = list.findIndex(it => it.id === m.item);
    const item = idx >= 0 ? list.splice(idx, 1)[0] : null;
    if (item) mp.lastTaker[`${m.map}|${m.hs}|${m.item}`] = from;
    if (from === mp.myId) mpOwnTakeResult(m, item);
  } else {
    const item = mpCleanItem(m.item);
    if (!item) return;
    const ok = list.length < HOTSPOT_CAPACITY;
    if (ok) list.push(item);
    if (from === mp.myId) mpOwnDropResult(m, item, ok);
  }
  mpCacheWorldSoon();
}

function mpHotspotName(map, hsId) {
  const cfg = mp.mapConfigs[map] || (map === currentMapPath ? mapConfig : null);
  const def = cfg && cfg.hotspots.find(h => h.id === hsId);
  return def ? def.name : 'there';
}

function mpOwnTakeResult(m, item) {
  mp.pendingTakes.delete(`${m.map}|${m.hs}|${m.item}`);
  if (item) {
    if (backpack.length < BACKPACK_CAPACITY) {
      item.pickedUpFrom = m.hs;   // record origin so it can't be used there
      backpack.push(item);
      writeSave();
      if (item.id === SWORD_ITEM.id) onSwordPickedUp(m.map, m.hs);
    } else {
      mpRequestDrop(m.hs, item, m.map);   // no room after all: put it back
    }
    return;
  }
  const taker = mp.players.get(mp.lastTaker[`${m.map}|${m.hs}|${m.item}`]);
  mpToast(taker ? `So close! ${taker.name} got it first. 😄` : 'Oops — that one is already gone!');
}

function mpOwnDropResult(m, item, ok) {
  const k = `${m.map}|${m.hs}`;
  const n = (mp.pendingDrops.get(k) || 1) - 1;
  if (n > 0) mp.pendingDrops.set(k, n); else mp.pendingDrops.delete(k);
  if (ok) return;
  // Someone filled the spot first: it comes back to the backpack
  if (backpack.length < BACKPACK_CAPACITY) backpack.push(item);
  writeSave();
  mpToast(`No room at the ${mpHotspotName(m.map, m.hs)} any more — it's back in your backpack.`);
}

function mpToast(text) {
  if (state === GameState.INTERACTING) interactionHintText = text;
  else useToast = { text, age: 0 };
}

// Ask the world for an item. Returns false only if the backpack is full.
function mpRequestTake(hotspotId, index) {
  const item = (hotspotItems[hotspotId] || [])[index];
  if (!item) return true;
  if (backpack.length + mp.pendingTakes.size >= BACKPACK_CAPACITY) return false;
  const key = `${currentMapPath}|${hotspotId}|${item.id}`;
  if (mp.pendingTakes.has(key)) return true;
  mp.pendingTakes.add(key);
  mpPublish({ t: 'take', map: currentMapPath, hs: hotspotId, item: item.id }).catch(() => {
    mp.pendingTakes.delete(key);
    mpToast("Couldn't reach your friends — try again!");
  });
  return true;
}

// The item has already left the backpack; it comes back if the drop fails.
function mpRequestDrop(hotspotId, item, map = currentMapPath) {
  const k = `${map}|${hotspotId}`;
  mp.pendingDrops.set(k, (mp.pendingDrops.get(k) || 0) + 1);
  mpPublish({ t: 'drop', map, hs: hotspotId, item: mpCleanItem(item) }).catch(() => {
    const n = (mp.pendingDrops.get(k) || 1) - 1;
    if (n > 0) mp.pendingDrops.set(k, n); else mp.pendingDrops.delete(k);
    if (backpack.length < BACKPACK_CAPACITY) backpack.push(item);
    writeSave();
    mpToast("Couldn't reach your friends — try again!");
  });
}

function mpPendingDropsAt(hotspotId) {
  return mp.active ? (mp.pendingDrops.get(`${currentMapPath}|${hotspotId}`) || 0) : 0;
}

// --- Remote players ---
// { id, remote: true, char, name, color, map, tx/ty (latest 0–1 position),
//   fx/fy (smoothed), x/y (map px), facing, walking, rotation, held, frame }
function mpOnPos(m, from) {
  const ch = characterByName(m.char);
  if (!ch || typeof m.map !== 'string') return;
  const x = clamp(Number(m.x) || 0, 0, 1);
  const y = clamp(Number(m.y) || 0, 0, 1);
  let rp = mp.players.get(from);
  const isNew = !rp;
  if (isNew) {
    rp = { id: from, remote: true, frame: 0, frameTimer: 0 };
    mp.players.set(from, rp);
  }
  if (isNew || rp.map !== m.map) { rp.fx = x; rp.fy = y; }   // pop in, don't slide across the map
  Object.assign(rp, {
    char: ch, name: ch.name, color: ch.color, map: m.map, tx: x, ty: y,
    facing: m.f === 'left' ? 'left' : 'right',
    walking: !!m.w,
    rotation: [0, 90, 180, 270].includes(m.r) ? m.r : 0,
    held: typeof m.h === 'string' ? m.h.slice(0, 12) : null,
    fighting: !!m.fi,
    sword: m.sw !== 0,          // the Blob doesn't chase campers without one
    lastSeen: performance.now()
  });
  rp.x = rp.fx * scaledMapW;
  rp.y = rp.fy * scaledMapH;
  mpOnFriendSidekick(rp, m.sk, isNew);
  if (rp.fighting && !mapBoss.busyWith && m.map === mpBossMap()) {
    mpOnBossFight({ on: true, map: m.map }, from);   // we joined while they were fighting
  } else if (!rp.fighting && mapBoss.busyWith === from && performance.now() - mapBoss.busySince > 2000) {
    mpBossGoHome();                                  // missed their "fight over"
  }
  if (isNew && mpInWorld()) mpToast(`👋 ${ch.name} joined the world!`);
}

// A friend's sidekick (pos.sk), drawn following them: a remote-style speaker
// { remote, sidekickOf, npcId, char, name, color, tx/ty, fx/fy, x/y, facing, walking, frame }
function mpOnFriendSidekick(rp, sk, isNew) {
  const ch = sk && typeof sk === 'object' && typeof sk.id === 'string' && characterByName(sk.c);
  if (!ch) { rp.sk = null; return; }
  const x = clamp(Number(sk.x) || 0, 0, 1);
  const y = clamp(Number(sk.y) || 0, 0, 1);
  const npcId = sk.id.slice(0, 64);
  if (!rp.sk || rp.sk.npcId !== npcId || rp.sk.map !== rp.map || isNew) {
    rp.sk = { remote: true, sidekickOf: rp.id, owner: rp, npcId, id: npcId, map: rp.map, fx: x, fy: y, frame: 0, frameTimer: 0 };
  }
  Object.assign(rp.sk, {
    char: ch, name: ch.name, color: ch.color, tx: x, ty: y,
    facing: sk.f === 'left' ? 'left' : 'right', walking: !!sk.w
  });
  rp.sk.x = rp.sk.fx * scaledMapW;
  rp.sk.y = rp.sk.fy * scaledMapH;
  // Both of us asked the same NPC at once: the lower player id keeps them
  if (sidekick && sidekick.npc.id === npcId && rp.id < mp.myId) {
    const name = sidekickName();
    sidekick = null;
    mpToast(`${name} went off with ${rp.name}! 🤝`);
  }
}

function mpRemovePlayer(id, why) {
  const rp = mp.players.get(id);
  if (!rp) return;
  mp.players.delete(id);
  speechBubbles = speechBubbles.filter(b => b.owner !== rp && b.partner !== rp &&
    !(rp.sk && (b.owner === rp.sk || b.partner === rp.sk)));
  if (talkingTo === rp) endConversation();
  if (nearbyNpc === rp) nearbyNpc = null;
  if (mapBoss.busyWith === id) mpBossGoHome();   // they left mid-fight
  if (mpInWorld()) mpToast(why === 'left' ? `${rp.name} went home. 🏠` : `${rp.name} lost connection.`);
}

function mpPlayersHere() {
  if (!mp.active) return [];
  const out = [];
  for (const rp of mp.players.values()) if (rp.map === currentMapPath && rp.char) out.push(rp);
  return out;
}

function mpCharacterTaken(name) {
  if (!mp.active) return false;
  for (const rp of mp.players.values()) if (rp.name === name) return true;
  return false;
}

function mpOnSay(m, from) {
  if (typeof m.text !== 'string' || m.map !== currentMapPath || !mpInWorld()) return;
  const text = m.text.replace(/\s+/g, ' ').trim().slice(0, 160);
  const speaker = mp.players.get(from);
  if (!text || !speaker) return;
  let owner, partner;
  if (m.npc) {
    // An NPC answering a friend
    owner = currentNpcs().find(n => n.id === m.npc) ||
      (speaker.sk && speaker.sk.npcId === m.npc && speaker.sk.map === currentMapPath ? speaker.sk : null);
    if (!owner || owner === talkingTo) return;   // we're chatting with them ourselves
    partner = speaker;
  } else {
    owner = speaker;
    partner = m.to === mp.myId ? 'player'
      : (mp.players.get(m.to) || currentNpcs().find(n => n.id === m.to) || null);
  }
  say(owner, text, partner);
  const b = speechBubbles[speechBubbles.length - 1];
  b.fadeStart = b.start + b.duration + 6000;   // friends' lines linger, then fade
  if (partner === 'player' && talkingTo !== owner && state === GameState.PLAYING) {
    mpToast(`💬 ${owner.name} is talking to you! ${isTouchDevice() ? 'Tap them' : 'Press T'} to answer.`);
    mp.talkToast = useToast;
  }
}

// Called every frame
function mpTick() {
  if (!mp.active) return;
  mpSendPos(false);
  mpTickBoss();
  for (const rp of mp.players.values()) {
    rp.fx += (rp.tx - rp.fx) * 0.2;
    rp.fy += (rp.ty - rp.fy) * 0.2;
    rp.x = rp.fx * scaledMapW;
    rp.y = rp.fy * scaledMapH;
    for (const a of rp.sk ? [rp, rp.sk] : [rp]) {
      if (a !== rp) {
        a.fx += (a.tx - a.fx) * 0.2;
        a.fy += (a.ty - a.fy) * 0.2;
        a.x = a.fx * scaledMapW;
        a.y = a.fy * scaledMapH;
      }
      const moving = a.walking || Math.hypot(a.tx - a.fx, a.ty - a.fy) > 0.002;
      if (moving) {
        if (++a.frameTimer > 8) { a.frame = (a.frame + 1) % 4; a.frameTimer = 0; }
      } else {
        a.frame = 0;
        a.frameTimer = 0;
      }
    }
  }
  // The friend you're chatting with walked off or went into another room
  if (state === GameState.TALKING && talkingTo && talkingTo.remote) {
    const rp = talkingTo;
    const k = SPRITE_SCALE / BASE_SPRITE_SCALE;
    if (rp.map !== currentMapPath || Math.hypot(rp.x - player.x, rp.y - player.y) > NPC_TALK_RANGE * k * 2.5) {
      endConversation();
      mpToast(`${rp.name} walked away.`);
    }
  }
}

// --- The Blob in a shared world ---
// One player, the "keeper" (lowest player id on the Blob's map, so every
// computer agrees), runs the Blob's brain: it roams and chases whichever
// camper is closest. The keeper sends `boss` messages; everyone else draws it
// where the keeper says. Each camper's own computer notices when it catches
// THEM, and that camper sends `bossfight` on/off so the Blob leaves the map
// for everyone while the duel is on, then goes home to its cave.
let mpBossKeeperWas = false;
let mpBossLastSent = 0;
let mpBossLastKey = '';

function mpBossMap() {
  for (const [path, cfg] of Object.entries(mp.mapConfigs)) if (cfg.boss) return path;
  return null;
}
function mpBossKeeper() {
  const bm = mpBossMap();
  if (!bm) return null;
  let best = mpInWorld() && currentMapPath === bm ? mp.myId : null;
  for (const rp of mp.players.values()) {
    if (rp.map === bm && rp.char && (best === null || rp.id < best)) best = rp.id;
  }
  return best;
}
function mpRunsBoss() {
  return mp.active && !mapBoss.busyWith && mpBossKeeper() === mp.myId;
}
function mpBossFighterName() {
  const rp = mp.players.get(mapBoss.busyWith);
  return rp ? rp.name : 'someone';
}

function mpTickBoss() {
  const keeper = mpRunsBoss();
  const now = performance.now();
  if (keeper && !mpBossKeeperWas) {
    // Just took over (first one here, or the old keeper left): carry on from here
    mapBoss.lastT = now;
    if (mapBoss.map !== currentMapPath) resetMapBoss(randBetween(8000, 20000));
    mapBoss.homeUntil = Math.min(mapBoss.homeUntil, now + randBetween(5000, 15000));
    mapBoss.outUntil = now + randBetween(10000, 25000);
    mpBossLastKey = '';
  }
  mpBossKeeperWas = keeper;
  if (keeper) {
    if (state !== GameState.PLAYING) updateMapBoss();   // update() only runs while PLAYING
    mpSendBoss(now);
    return;
  }
  // Glide toward where the keeper last said it is
  if (mapBoss.tfx != null && (mapBoss.where === 'out' || mapBoss.where === 'returning')) {
    mapBoss.fx += (mapBoss.tfx - mapBoss.fx) * 0.2;
    mapBoss.fy += (mapBoss.tfy - mapBoss.fy) * 0.2;
    if (mapBoss.moving) mapBoss.walk += 1 / 60;
  }
  if (mapBoss.shout && now - mapBoss.shout.start > mapBoss.shout.dur) mapBoss.shout = null;
}

function mpSendBoss(now) {
  if (!mp.connected || mapBoss.map !== currentMapPath) return;
  if (!mp.players.size) { mpBossLastKey = ''; return; }   // nobody to tell
  const sh = mapBoss.shout;
  const msg = {
    t: 'boss', map: mapBoss.map, w: mapBoss.where,
    x: +mapBoss.fx.toFixed(4), y: +mapBoss.fy.toFixed(4),
    f: mapBoss.facing, mv: mapBoss.moving ? 1 : 0,
    s: sh ? sh.text : null, sid: sh ? sh.id : null, sd: sh ? sh.dur : 0
  };
  const key = [msg.map, msg.w, msg.x, msg.y, msg.f, msg.mv, msg.sid].join('|');
  const every = msg.w === 'home' ? 0 : 150;
  const due = (key !== mpBossLastKey && now - mpBossLastSent >= every) || now - mpBossLastSent >= 3000;
  if (!due) return;
  mpBossLastKey = key;
  mpBossLastSent = now;
  mpSend(msg);
}

function mpOnBossState(m, from) {
  if (mapBoss.busyWith) return;
  if (mpRunsBoss() && from > mp.myId) return;   // we're the keeper; they'll notice soon
  if (typeof m.map !== 'string' || !['home', 'out', 'returning'].includes(m.w)) return;
  const x = clamp(Number(m.x) || 0, 0, 1);
  const y = clamp(Number(m.y) || 0, 0, 1);
  const appeared = mapBoss.tfx == null || mapBoss.map !== m.map ||
    mapBoss.where === 'home' || mapBoss.where === 'fighting';
  mapBoss.map = m.map;
  mapBoss.where = m.w;
  mapBoss.tfx = x;
  mapBoss.tfy = y;
  if (appeared) { mapBoss.fx = x; mapBoss.fy = y; }
  mapBoss.facing = m.f === 'right' ? 'right' : 'left';
  mapBoss.moving = !!m.mv;
  if (m.sid && m.sid !== mapBoss.lastSid && typeof m.s === 'string') {
    mapBoss.lastSid = m.sid;
    bossShout(m.s.slice(0, 60), clamp(Number(m.sd) || 1600, 300, 4000));
  }
}

// Not the keeper: did the Blob (where the keeper says it is) just catch me?
function mpBossCatchCheck() {
  if (!bossCave() || !player.character || mapBoss.map !== currentMapPath) return;
  if (mapBoss.where !== 'out' && mapBoss.where !== 'returning') return;
  const k = bossK();
  const pos = mapBossPos();
  const dist = Math.hypot(player.x - pos.x, player.y - pos.y);
  nearBoss = dist < 190 * k;
  if (mapBoss.where === 'out' && dist < 55 * k && !doorOpening) engageBoss(true);
}

// I'm starting (on) or finished (off) a fight with the Blob
function mpBossFight(on, won) {
  if (!mp.active) return;
  mapBoss.busyWith = on ? mp.myId : null;
  mapBoss.tfx = mapBoss.tfy = null;
  mpSend({ t: 'bossfight', map: currentMapPath, on: !!on, won: !!won });
}

function mpOnBossFight(m, from) {
  if (m.on) {
    mapBoss.busyWith = from;
    mapBoss.busySince = performance.now();
    mapBoss.where = 'fighting';
    if (typeof m.map === 'string') mapBoss.map = m.map;
    mapBoss.shout = null;
    mapBoss.tfx = mapBoss.tfy = null;
    nearBoss = false;
  } else if (mapBoss.busyWith === from) {
    mpBossGoHome(m.won);
  }
}

function mpBossGoHome(beaten) {
  mapBoss.busyWith = null;
  mapBoss.where = 'home';
  mapBoss.shout = null;
  mapBoss.tfx = mapBoss.tfy = null;
  mapBoss.homeUntil = performance.now() + bossRestMs(!!beaten);
}

// Runs even when the tab is in the background (rAF pauses there)
setInterval(() => {
  if (!mp.active) return;
  mpSendPos(false);
  const now = performance.now();
  for (const [id, rp] of mp.players) if (now - rp.lastSeen > MP_TIMEOUT_MS) mpRemovePlayer(id, 'lost');
  if (mp.pubnub && !mp.connected && !mp.connectWaiter && typeof mp.pubnub.reconnect === 'function') {
    try { mp.pubnub.reconnect(); } catch (_) { /* try again next time */ }
  }
}, 1000);

// Closing the tab: a "keepalive" request still gets the goodbye out
window.addEventListener('pagehide', () => {
  if (!mp.active || !mp.present) return;
  const msg = encodeURIComponent(JSON.stringify({ t: 'bye', from: mp.myId }));
  const url = `https://ps.pndsn.com/publish/${PUBNUB_PUBLISH_KEY}/${PUBNUB_SUBSCRIBE_KEY}/0/` +
    `${encodeURIComponent(mp.channel)}/0/${msg}?uuid=${encodeURIComponent(mp.myId)}&store=0`;
  try { fetch(url, { keepalive: true, mode: 'no-cors' }); } catch (_) { /* best effort */ }
});

// --- Drawing friends ---
function drawRemotePlayer(rp) {
  const k = SPRITE_SCALE / BASE_SPRITE_SCALE;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
  ctx.beginPath();
  ctx.ellipse(rp.x, rp.y + 2, 42 * k, 15 * k, 0, 0, Math.PI * 2);
  ctx.fill();
  const draw = () => drawCharacterSprite(
    rp.x - player.width / 2, rp.y - player.height, rp.char, rp.frame, rp.facing,
    SPRITE_SCALE, mouthOpenFor(rp), rp.held
  );
  if (rp.rotation) {
    const cx = rp.x, cy = rp.y - player.height / 2;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rp.rotation * Math.PI / 180);
    ctx.translate(-cx, -cy);
    draw();
    ctx.restore();
  } else {
    draw();
  }
}

// Small name label over a friend's head
function drawNameTag(rp) {
  const head = speakerHead(rp);
  ctx.font = 'bold 12px "Comic Sans MS", cursive';
  ctx.textAlign = 'center';
  const label = rp.fighting ? `⚔️ ${rp.name} is fighting the Blob!` : `⭐ ${rp.name}`;
  const w = ctx.measureText(label).width + 14;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
  roundRect(head.x - w / 2, head.top - 30, w, 20, 6);
  ctx.fill();
  ctx.fillStyle = rp.color;
  ctx.fillText(label, head.x, head.top - 16);
}

// HUD badge under the camper name: world code + how many campers are here
function drawMpHudBadge() {
  const n = 1 + mp.players.size;
  let text = `🌍 World ${mp.code}  ·  👥 ${n} camper${n === 1 ? '' : 's'}`;
  if (!mp.connected) text += '  ·  ⚠️ reconnecting…';
  ctx.font = 'bold 14px "Comic Sans MS", cursive';
  const w = ctx.measureText(text).width + 20;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
  roundRect(10, 52, w, 30, 8);
  ctx.fill();
  ctx.fillStyle = '#FFE082';
  ctx.textAlign = 'left';
  ctx.fillText(text, 20, 72);
}

// Character screen in a world: the code to share, and who's here
function drawWorldCodeBanner() {
  const code = `${mp.code.slice(0, 3)} ${mp.code.slice(3)}`;
  const n = mp.players.size;
  const sub = n
    ? `${n} friend${n === 1 ? ' is' : 's are'} here!  Tell others the code to join.`
    : 'Give your friends this code so they can join you!';
  const w = Math.min(canvas.width - 24, 440), h = 62;
  const x = canvas.width / 2 - w / 2, y = 136;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
  ctx.strokeStyle = '#FFD54F';
  ctx.lineWidth = 2;
  roundRect(x, y, w, h, 12);
  ctx.fill();
  ctx.stroke();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#FFD54F';
  ctx.font = 'bold 24px "Comic Sans MS", cursive';
  ctx.fillText(`🌍 World code: ${code}`, canvas.width / 2, y + 28);
  ctx.fillStyle = '#FFE0B2';
  ctx.font = '13px "Comic Sans MS", cursive';
  ctx.fillText(sub, canvas.width / 2, y + 50);
}

// ============================================================
// BOSS — Glug Glub Blob (a.k.a. the I Eat You Blob)
// ============================================================
// A map JSON may have a `boss` ({ name, aka, cave, phrases, hitPhrases,
// hurtPhrases, pointsToWin, reward }). The boss lives in the `cave` hotspot
// (drawn over the map as a rocky hill with a dark mouth) and comes out
// whenever it likes to roam the map. Knock on the cave, press Space next to
// it, or let it catch you: it shouts something (never in proper English) and
// the fight view opens — a side-on sword duel, Street Fighter style.
// Unblocked hits score a point; first to `pointsToWin` wins.
// Win → the `reward` coin goes in your backpack. Lose (or run away) → the
// Blob takes every coin in your backpack.

const BOSS_ENGAGE_MS = 1100;   // map freezes while the Blob shouts, then the fight opens
const BOSS_DEFAULT_PHRASES = ['EAT!', 'nom nom you!', 'gobble up yous!'];
const DEFAULT_BOSS_REWARD = { id: 'ten_dollar_coin', name: '$10 Coin', emoji: '🪙', coin: true, value: 10 };

function randBetween(a, b) { return a + Math.random() * (b - a); }
function pickOne(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function lerp(a, b, t) { return a + (b - a) * t; }
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function isCoin(item) { return !!(item && (item.coin || /coin/i.test(item.id || ''))); }

function bossDef() { return (fight && fight.def) || (mapConfig && mapConfig.boss) || null; }
function isBossCave(obj) {
  const b = mapConfig && mapConfig.boss;
  return !!(b && obj && obj.id === b.cave);
}
function bossCave() {
  const b = mapConfig && mapConfig.boss;
  return b ? interactiveObjects.find(o => o.id === b.cave) || null : null;
}
function bossName() { const b = bossDef(); return (b && b.name) || 'Glug Glub Blob'; }
function bossSays(kind) {
  const b = bossDef() || {};
  return pickOne(b[kind] && b[kind].length ? b[kind] : BOSS_DEFAULT_PHRASES);
}

// ---------- The Blob on the map ----------
const mapBoss = {
  map: null,          // which map it was set up on
  where: 'home',      // 'home' (in the cave) | 'out' (roaming) | 'returning'
  fx: 0, fy: 0,       // FEET position, fractions of the map
  facing: 'left',
  walk: 0,            // walk-cycle clock (s)
  moving: false,
  target: null,       // { fx, fy } wander target
  homeUntil: 0,       // when it next comes out
  outUntil: 0,        // when it heads back home
  shout: null,        // { text, start, dur }
  nextShoutAt: 0,
  lastT: 0,
  // Multiplayer: one player (the "keeper") runs the Blob and broadcasts it
  busyWith: null,     // player id it's fighting ('fighting' hides it from the map)
  tfx: null, tfy: null,   // latest broadcast position (non-keepers glide to it)
  lastSid: null       // id of the last broadcast shout we showed
};
// How long the Blob stays in its cave after a fight: longer when it was beaten
const BOSS_REST_BEATEN_MS = [30000, 60000];
const BOSS_REST_MS = [30000, 50000];
function bossRestMs(beaten) {
  const [lo, hi] = beaten ? BOSS_REST_BEATEN_MS : BOSS_REST_MS;
  return randBetween(lo, hi);
}
// --- Your sword ---
// You fight the Blob with a sword rated 0–100 (`swordRating`, saved). Every
// swing wears it by 1, and every swing that touches the Blob (or its sword) by
// 4 more. At 0 it still works until the fight ends, but then it's done: a new
// 🗡️ Sword is dropped at a random spot on a random map, and you need to pick it
// up before you can fight again. Until then the Blob ignores you (it won't
// chase or catch you), and trying to fight it tells you which map to search.
// A sword picked up while yours still works waits in the backpack as a spare.
// There's always at least one sword lying somewhere in the world (so in a
// multiplayer world there's one for whoever needs it): one is dropped when a
// game starts if there isn't, and picking one up drops another somewhere else.
const SWORD_MAX = 100;
const SWORD_SWING_WEAR = 1;
const SWORD_HIT_WEAR = 4;
const SWORD_ITEM = { id: 'sword', name: 'Sword', emoji: '🗡️' };
let swordRating = SWORD_MAX;
let swordSearch = null;      // the find-or-drop in progress (it may fetch map files)
let lastSwordDrop = null;    // { path, hs, at } — a multiplayer drop takes a moment to arrive
const swordMapConfigs = {};  // maps fetched to find a spot (kept apart from allMapConfigs, which the journal counts)

function hasSpareSword() { return backpack.some(it => it.id === SWORD_ITEM.id); }
function hasSword() { return swordRating > 0 || hasSpareSword(); }

// Use the spare sword from the backpack (when yours is worn out)
function equipSpareSword() {
  const i = backpack.findIndex(it => it.id === SWORD_ITEM.id);
  if (i < 0 || swordRating > 0) return false;
  backpack.splice(i, 1);
  swordRating = SWORD_MAX;
  writeSave();
  return true;
}

// A sword just went into the backpack (from hotspot `hs` on map `path`): if
// yours is worn out, it's your new one. Either way another one turns up
// somewhere else, so there's still one lying around for the next camper.
function onSwordPickedUp(path, hs) {
  lastSwordDrop = null;
  const wait = swordSearch || Promise.resolve();
  wait.then(() => findOrDropSword({ path, hs }));
  if (!equipSpareSword()) return;
  const msg = `🗡️ You found a new sword! It's as good as new (${SWORD_MAX}). Now you can fight the Blob again!`;
  if (state === GameState.INTERACTING) interactionHintText = msg;
  else useToast = { text: msg, age: 0 };
}

// Where a map is, for hints ("out at the camp", "in the Camp Kitchen")
function mapWhere(cfg) {
  return cfg.where || `in the ${cfg.name}`;
}

// Every map, found by following portals from the main map
async function crawlMapConfigs() {
  if (mp.active && Object.keys(mp.mapConfigs).length) return mp.mapConfigs;
  const queue = [MP_MAIN_MAP], seen = new Set(queue), out = {};
  while (queue.length) {
    const path = queue.shift();
    let cfg = allMapConfigs[path] || swordMapConfigs[path];
    if (!cfg) {
      try {
        cfg = await (await fetch(path)).json();
        swordMapConfigs[path] = cfg;
      } catch (_) { continue; }
    }
    out[path] = cfg;
    for (const h of cfg.hotspots || []) {
      if (h.targetMap && !seen.has(h.targetMap)) { seen.add(h.targetMap); queue.push(h.targetMap); }
    }
  }
  return out;
}

// The items at every hotspot of a map, as they are right now
function worldItemsFor(path, cfg) {
  if (mp.active) return mpItemsFor(path, cfg);
  if (path === currentMapPath) return hotspotItems;
  return restoreOrDefaultHotspots(cfg, allMapSaves[path] || {});
}

function findSword(configs) {
  for (const [path, cfg] of Object.entries(configs)) {
    const items = worldItemsFor(path, cfg);
    for (const [hs, list] of Object.entries(items)) {
      if ((list || []).some(it => it.id === SWORD_ITEM.id)) return { path, hs };
    }
  }
  if (lastSwordDrop && performance.now() - lastSwordDrop.at < 10000) return lastSwordDrop;
  return null;
}

// Put a new sword at a random spot (one you can open and pick things up from).
// `avoid` ({ path, hs }): where one was just picked up — try another map.
function dropSword(configs, avoid) {
  const spots = {};
  for (const [path, cfg] of Object.entries(configs)) {
    const items = worldItemsFor(path, cfg);
    const cave = cfg.boss && cfg.boss.cave;
    const ok = (cfg.hotspots || []).filter(h => !h.targetMap && !h.station && h.id !== cave &&
      !(avoid && avoid.path === path && avoid.hs === h.id) &&
      (items[h.id] || []).length < HOTSPOT_CAPACITY);
    if (ok.length) spots[path] = ok.map(h => h.id);
  }
  let paths = Object.keys(spots);
  if (avoid && paths.length > 1) paths = paths.filter(p => p !== avoid.path);
  if (!paths.length) return null;
  const path = pickOne(paths), hs = pickOne(spots[path]);
  if (mp.active) {
    mpRequestDrop(hs, { ...SWORD_ITEM }, path);     // everyone sees it appear
  } else if (path === currentMapPath) {
    (hotspotItems[hs] || (hotspotItems[hs] = [])).push({ ...SWORD_ITEM });
  } else {
    const ms = allMapSaves[path] || (allMapSaves[path] = {});
    ms.hotspots = restoreOrDefaultHotspots(configs[path], ms);
    ms.hotspots[hs].push({ ...SWORD_ITEM });
  }
  writeSave();
  lastSwordDrop = { path, hs, at: performance.now() };
  return lastSwordDrop;
}

// Where's a sword I can pick up? Drops a new one if there isn't one anywhere.
function findOrDropSword(avoid) {
  if (!swordSearch) {
    swordSearch = crawlMapConfigs()
      .then(configs => {
        if (!swordWorldReady()) return null;     // changed maps / left while loading: next check will do it
        const at = findSword(configs) || dropSword(configs, avoid);
        return at ? { ...at, cfg: configs[at.path] } : null;
      })
      .finally(() => { swordSearch = null; });
  }
  return swordSearch;
}

// Is everything loaded enough to look for (and drop) a sword?
function swordWorldReady() {
  return !!player.character && mpInWorld() && (!mp.active || mp.synced);
}

// A game just started: make sure a sword is lying somewhere (once things load)
function checkSwordSoon() {
  let tries = 0;
  const go = () => {
    if (swordWorldReady()) findOrDropSword();
    else if (++tries < 30) setTimeout(go, 500);
  };
  setTimeout(go, 500);
}

// And keep checking, in case one went missing (a friend left before dropping
// the next one...). In a multiplayer world only one computer checks — the
// lowest player id — and only after two misses in a row, so a sword that's on
// its way from a friend isn't doubled up.
let swordCheckMisses = 0;
setInterval(() => {
  if (!swordWorldReady() || swordSearch) return;
  if (mp.active && [...mp.players.keys()].some(id => id < mp.myId)) return;
  crawlMapConfigs().then(configs => {
    if (findSword(configs)) { swordCheckMisses = 0; return; }
    if (!mp.active || ++swordCheckMisses >= 2) { swordCheckMisses = 0; findOrDropSword(); }
  });
}, 15000);

// Tried to fight the Blob with no sword: say where to look
function swordNeededHint() {
  kitchenToast('🗡️ You need a sword to fight the Blob! Looking for one...');
  findOrDropSword().then(at => {
    if (!at) { kitchenToast('🗡️ You need a sword to fight the Blob!'); return; }
    kitchenToast(at.path === currentMapPath
      ? `🗡️ You need a sword to fight the Blob! There's one right here ${mapWhere(at.cfg)}. Look around!`
      : `🗡️ You need a sword to fight the Blob! I think there's one ${mapWhere(at.cfg)}.`);
  });
}

// Items at hotspots are only listed in the hotspot's dialog, so a sword lying
// at one is drawn on the map too (bobbing and sparkling) so campers can find it
function drawLyingSwords() {
  const now = performance.now();
  const size = 44 * SPRITE_SCALE / BASE_SPRITE_SCALE;
  for (const obj of interactiveObjects) {
    if (!(hotspotItems[obj.id] || []).some(it => it.id === SWORD_ITEM.id)) continue;
    const x = obj.x + obj.width / 2;
    const y = obj.y + obj.height * 0.82 - Math.abs(Math.sin(now / 350)) * size * 0.2;
    ctx.save();
    ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
    ctx.beginPath();
    ctx.ellipse(x, obj.y + obj.height * 0.82 + size * 0.45, size * 0.45, size * 0.12, 0, 0, Math.PI * 2);
    ctx.fill();
    const glow = ctx.createRadialGradient(x, y, 0, x, y, size * 0.9);
    glow.addColorStop(0, `rgba(255, 241, 118, ${0.65 + 0.2 * Math.sin(now / 250)})`);
    glow.addColorStop(1, 'rgba(255, 241, 118, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(x, y, size * 0.9, 0, Math.PI * 2);
    ctx.fill();
    drawFoodEmoji(SWORD_ITEM.emoji, x, y, size);
    ctx.restore();
    for (let i = 0; i < 3; i++) {
      const a = now / 600 + i * 2.1;
      drawFoodEmoji('✨', x + Math.cos(a) * size * 0.7, y + Math.sin(a) * size * 0.5, size * 0.35, 0.5 + 0.5 * Math.sin(now / 180 + i));
    }
  }
}

// One swing (n = SWORD_SWING_WEAR) or one hit (n = SWORD_HIT_WEAR)
function wearSword(f, n) {
  if (swordRating <= 0) return;
  swordRating = Math.max(0, swordRating - n);
  f.swordWornAt = performance.now();
  if (swordRating === 0) fightPop(f, 'SWORD WORN OUT! 🗡️', f.p.x, 400, '#FFAB91', 0.9);
}

let bossEngage = null;  // { start } — the Blob is shouting; the fight view opens next
let nearBoss = false;   // close enough to pick a fight

function resetMapBoss(delayMs) {
  mapBoss.map = currentMapPath;
  mapBoss.where = 'home';
  mapBoss.homeUntil = performance.now() + (delayMs != null ? delayMs : randBetween(15000, 30000));
  mapBoss.shout = null;
  mapBoss.target = null;
  mapBoss.moving = false;
  bossEngage = null;
  nearBoss = false;
}

function bossK() { return SPRITE_SCALE / BASE_SPRITE_SCALE; }
function mapBossHeight() { return 135 * bossK(); }
function mapBossPos() { return { x: mapBoss.fx * scaledMapW, y: mapBoss.fy * scaledMapH }; }
function caveMouth() {
  const c = bossCave();
  return { x: c.x + c.width * 0.5, y: c.y + c.height * 0.97 };
}
function mapBossVisible() {
  return !!(bossCave() && mapBoss.map === currentMapPath &&
    mapBoss.where !== 'home' && mapBoss.where !== 'fighting');
}
function bossShout(text, dur) {
  mapBoss.shout = { text, start: performance.now(), dur: dur || 1600, id: Math.random().toString(36).slice(2, 8) };
}
// Mouth flapping while a shout is still being yelled
function shoutMouth(sh, now) {
  if (!sh) return 0;
  const age = now - sh.start;
  if (age > sh.dur * 0.75) return 0;
  return 0.3 + 0.7 * Math.abs(Math.sin(age / 80));
}

function updateMapBoss() {
  nearBoss = false;
  if (mp.active && !mpRunsBoss()) { mpBossCatchCheck(); return; }
  if (!bossCave() || !player.character) return;
  const now = performance.now();
  if (mapBoss.map !== currentMapPath) resetMapBoss();
  const dt = Math.min(50, now - (mapBoss.lastT || now));
  mapBoss.lastT = now;
  if (mapBoss.shout && now - mapBoss.shout.start > mapBoss.shout.dur) mapBoss.shout = null;
  mapBoss.moving = false;

  if (mapBoss.where === 'home') {
    if (now < mapBoss.homeUntil) return;
    // Out it comes, whenever it feels like it
    const m = caveMouth();
    mapBoss.fx = m.x / scaledMapW;
    mapBoss.fy = m.y / scaledMapH;
    mapBoss.where = 'out';
    mapBoss.outUntil = now + randBetween(25000, 45000);
    mapBoss.target = null;
    bossShout('GLUG GLUB!');
    mapBoss.nextShoutAt = now + randBetween(2500, 4000);
    return;
  }

  const k = bossK();
  const pos = mapBossPos();
  const dist = Math.hypot(player.x - pos.x, player.y - pos.y);
  // In a multiplayer world it chases whichever camper is closest
  // (campers without a sword aren't worth chasing)
  const chase = { x: player.x, y: player.y, dist: state === GameState.PLAYING && hasSword() ? dist : Infinity };
  for (const rp of mpPlayersHere()) {
    const d = Math.hypot(rp.x - pos.x, rp.y - pos.y);
    if (!rp.fighting && rp.sword !== false && d < chase.dist) Object.assign(chase, { x: rp.x, y: rp.y, dist: d });
  }
  if (mapBoss.where === 'out' && now > mapBoss.outUntil) mapBoss.where = 'returning';

  let tx, ty, speed;   // speed: map px per 60fps frame (the player walks at 4)
  if (mapBoss.where === 'returning') {
    const m = caveMouth();
    tx = m.x; ty = m.y; speed = 2.6 * k;
    if (Math.hypot(tx - pos.x, ty - pos.y) < 6 * k) {
      mapBoss.where = 'home';
      mapBoss.homeUntil = now + randBetween(15000, 40000);
      mapBoss.shout = null;
      return;
    }
  } else if (chase.dist < 480 * k) {
    // Smells a camper! Chase them, shouting
    tx = chase.x; ty = chase.y; speed = 2.7 * k;
    if (now >= mapBoss.nextShoutAt) {
      bossShout(bossSays('phrases'));
      mapBoss.nextShoutAt = now + randBetween(2200, 3600);
    }
  } else {
    const t = mapBoss.target;
    if (!t || Math.hypot(t.fx * scaledMapW - pos.x, t.fy * scaledMapH - pos.y) < 10) {
      mapBoss.target = { fx: randBetween(0.08, 0.92), fy: randBetween(0.22, 0.95) };
    }
    tx = mapBoss.target.fx * scaledMapW; ty = mapBoss.target.fy * scaledMapH; speed = 1.6 * k;
  }
  const dx = tx - pos.x, dy = ty - pos.y;
  const d = Math.hypot(dx, dy);
  if (d > 0.5) {
    const step = Math.min(d, speed * dt * 0.06);
    mapBoss.fx = (pos.x + dx / d * step) / scaledMapW;
    mapBoss.fy = (pos.y + dy / d * step) / scaledMapH;
    if (Math.abs(dx) > 2) mapBoss.facing = dx < 0 ? 'left' : 'right';
    mapBoss.walk += dt / 1000;
    mapBoss.moving = true;
  }

  nearBoss = dist < 190 * k;
  // Caught you! (Not while it's heading home for a rest.)
  if (mapBoss.where === 'out' && dist < 55 * k && !doorOpening) engageBoss(true);
}

// The Blob yells something, then the fight view opens (see update())
// `auto`: the Blob caught you (rather than you picking the fight)
function engageBoss(auto) {
  if (state !== GameState.PLAYING || bossEngage || doorOpening || !bossCave()) return;
  if (swordRating <= 0 && !equipSpareSword()) {
    if (!auto) swordNeededHint();     // no sword: the Blob leaves you alone
    return;
  }
  if (mp.active && mapBoss.busyWith && mapBoss.busyWith !== mp.myId) {
    kitchenToast(`The Blob is busy fighting ${mpBossFighterName()}! 👀`);
    return;
  }
  mpBossFight(true);
  if (mapBoss.where === 'home') {
    const m = caveMouth();
    mapBoss.fx = m.x / scaledMapW;
    mapBoss.fy = m.y / scaledMapH;
  }
  mapBoss.where = 'out';
  const pos = mapBossPos();
  mapBoss.facing = player.x < pos.x ? 'left' : 'right';
  player.facing = player.x < pos.x ? 'right' : 'left';
  player.walking = false;
  player.frame = 0;
  tapTarget = null;
  backpackOpen = false;
  journalOpen = false;
  bossShout(bossSays('phrases'), BOSS_ENGAGE_MS + 200);
  bossEngage = { start: performance.now() };
}

function drawMapBoss() {
  const p = mapBossPos();
  const now = performance.now();
  const tail = bossEngage
    ? { ...BLOB_POSES.windup, a: BLOB_POSES.windup.a + Math.sin(now / 30) * 0.06 }
    : { ...BLOB_POSES.idle, a: BLOB_POSES.idle.a + Math.sin(now / 400) * 0.12 };
  drawBlob(p.x, p.y, mapBossHeight(), mapBoss.facing, {
    tail, moving: mapBoss.moving, walk: mapBoss.walk,
    mouth: shoutMouth(mapBoss.shout, now), t: now
  });
}

function drawMapBossHint() {
  const p = mapBossPos();
  const x = p.x;
  const y = p.y - mapBossHeight() - 12;
  ctx.textAlign = 'center';
  ctx.font = 'bold 13px "Comic Sans MS", cursive';
  const label = bossLevel() ? `${bossName()} · Lv ${bossLevel()}` : bossName();
  const lw = ctx.measureText(label).width + 16;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
  roundRect(x - lw / 2, y - 14, lw, 22, 6);
  ctx.fill();
  ctx.fillStyle = '#FF9E5E';
  ctx.fillText(label, x, y + 2);
  const hint = !hasSword() ? '🗡️ Find a sword first!'
    : isTouchDevice() ? '⚔️ [ TAP ME ] Fight!' : '⚔️ [ SPACE ] Fight!';
  ctx.font = '11px "Comic Sans MS", cursive';
  const hw = ctx.measureText(hint).width + 12;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
  roundRect(x - hw / 2, y - 38, hw, 18, 4);
  ctx.fill();
  ctx.fillStyle = '#FFF9C4';
  ctx.fillText(hint, x, y - 25);
}

// Screen space, after the map is drawn
function drawMapBossShout() {
  if (!mapBossVisible() || !mapBoss.shout) return;
  const p = mapBossPos();
  const H = mapBossHeight();
  const dir = mapBoss.facing === 'left' ? -1 : 1;
  const age = performance.now() - mapBoss.shout.start;
  drawShout(p.x - camera.x + dir * 0.4 * H, p.y - 0.85 * H - camera.y, mapBoss.shout.text, age, 20);
}

// The cave: a rocky hill with a dark mouth, drawn over the map in the
// cave hotspot's box. Glowing eyes blink inside while the Blob is home.
function drawBossCave() {
  const c = bossCave();
  if (!c) return;
  const { x, y, width: w, height: h } = c;
  const now = performance.now();
  const ink = '#2b2320';
  const hill = [[0, 1], [0.04, 0.62], [0.16, 0.38], [0.27, 0.42], [0.4, 0.12], [0.52, 0.2],
                [0.62, 0.02], [0.76, 0.26], [0.86, 0.22], [0.97, 0.5], [1, 1]];
  const hillPath = () => {
    ctx.beginPath();
    hill.forEach(([px, py], i) => i ? ctx.lineTo(x + px * w, y + py * h) : ctx.moveTo(x + px * w, y + py * h));
    ctx.closePath();
  };
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  hillPath();
  ctx.fillStyle = '#8d8a94';
  ctx.fill();
  // marker streaks + a few lighter rocks
  ctx.save();
  ctx.clip();
  ctx.strokeStyle = 'rgba(70, 64, 80, 0.35)';
  ctx.lineWidth = Math.max(3, w * 0.025);
  for (let i = 0; i < 14; i++) {
    const sx = x + (i / 14) * w * 1.1 - w * 0.05;
    ctx.beginPath();
    ctx.moveTo(sx, y + h);
    ctx.lineTo(sx + w * 0.18, y);
    ctx.stroke();
  }
  ctx.fillStyle = '#aaa7b1';
  for (const [rx, ry, rr] of [[0.2, 0.72, 0.07], [0.8, 0.64, 0.06], [0.55, 0.32, 0.05], [0.32, 0.52, 0.04], [0.9, 0.86, 0.05]]) {
    ctx.beginPath();
    ctx.ellipse(x + rx * w, y + ry * h, rr * w, rr * w * 0.7, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
  hillPath();
  ctx.lineWidth = Math.max(3, w * 0.022);
  ctx.strokeStyle = ink;
  ctx.stroke();

  // the dark mouth (an arch)
  const mw = w * 0.46, mh = h * 0.6;
  const mcx = x + w * 0.5, mBottom = y + h;
  const archY = mBottom - mh + mw / 2;
  ctx.beginPath();
  ctx.moveTo(mcx - mw / 2, mBottom);
  ctx.lineTo(mcx - mw / 2, archY);
  ctx.arc(mcx, archY, mw / 2, Math.PI, 0);
  ctx.lineTo(mcx + mw / 2, mBottom);
  ctx.closePath();
  const g = ctx.createLinearGradient(0, mBottom - mh, 0, mBottom);
  g.addColorStop(0, '#0d0810');
  g.addColorStop(1, '#2a1c26');
  ctx.fillStyle = g;
  ctx.fill();
  ctx.stroke();
  // little rock teeth around the mouth
  ctx.fillStyle = '#d9d4cc';
  for (const f of [-0.6, -0.2, 0.2, 0.6]) {
    const tx = mcx + f * mw * 0.45;
    const ty = archY - Math.sqrt(Math.max(0, 1 - f * f * 0.2)) * mw * 0.5 + 2;
    ctx.beginPath();
    ctx.moveTo(tx - mw * 0.05, ty);
    ctx.lineTo(tx + mw * 0.05, ty);
    ctx.lineTo(tx, ty + mw * 0.12);
    ctx.closePath();
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
  // glowing eyes when the Blob is home (blinking now and then)
  if (mapBoss.map === currentMapPath && mapBoss.where === 'home') {
    const blink = (now % 3200) < 160;
    const ey = mBottom - mh * 0.45;
    const look = Math.sin(now / 900) * mw * 0.05;
    ctx.save();
    ctx.shadowColor = '#FFEB3B';
    ctx.shadowBlur = 14;
    ctx.fillStyle = '#FFEB3B';
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.ellipse(mcx + side * mw * 0.14 + look, ey, mw * 0.065, blink ? 1.5 : mw * 0.085, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
    if (!blink) {
      ctx.fillStyle = '#3a1d0a';
      for (const side of [-1, 1]) {
        ctx.beginPath();
        ctx.arc(mcx + side * mw * 0.14 + look * 1.4, ey + mw * 0.02, mw * 0.03, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
  // "BEWARE OF BLOB" sign on the left
  const sw = w * 0.28, sh = h * 0.2;
  const sx = x + w * 0.02, sy = y + h * 0.62;
  ctx.fillStyle = '#7b4a26';
  ctx.fillRect(sx + sw / 2 - w * 0.012, sy + sh * 0.5, w * 0.024, h * 0.36);
  ctx.save();
  ctx.translate(sx + sw / 2, sy + sh / 2);
  ctx.rotate(-0.08);
  ctx.fillStyle = '#c98b4f';
  ctx.fillRect(-sw / 2, -sh / 2, sw, sh);
  ctx.lineWidth = 2;
  ctx.strokeStyle = ink;
  ctx.strokeRect(-sw / 2, -sh / 2, sw, sh);
  ctx.fillStyle = '#b71c1c';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `bold ${Math.max(7, sh * 0.34)}px "Comic Sans MS", cursive`;
  ctx.fillText('BEWARE', 0, -sh * 0.2);
  ctx.fillText('OF BLOB!', 0, sh * 0.22);
  ctx.restore();
  // bones by the door
  ctx.font = `${Math.round(w * 0.1)}px ${SCENE_EMOJI_FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#000';
  ctx.fillText('🦴', x + w * 0.84, y + h * 0.93);
  ctx.textBaseline = 'alphabetic';
  ctx.restore();
}

// ---------- Drawing the Blob (human head, fox body, sword in its tail) ----------
// Tail tip + sword angle per pose, in the Blob's own units (100 = its height),
// facing right: angle 0 points forward, -π/2 straight up.
const BLOB_POSES = {
  idle:   { tx: -50, ty: -84,  a: -1.9 },
  windup: { tx: -22, ty: -118, a: -2.7 },
  strike: { tx: 38,  ty: -96,  a: 0.55 },
  block:  { tx: 62,  ty: -46,  a: -1.45 },
  hit:    { tx: -62, ty: -70,  a: -2.4 }
};
function lerpPose(p, q, t) {
  return { tx: lerp(p.tx, q.tx, t), ty: lerp(p.ty, q.ty, t), a: lerp(p.a, q.a, t) };
}

// A sword along +x from the current origin (the hand / tail tip)
function drawSword(len, w) {
  const ink = '#2b2320';
  ctx.lineJoin = 'round';
  ctx.fillStyle = '#6d4c41';                      // grip
  ctx.fillRect(-len * 0.2, -w * 0.6, len * 0.2, w * 1.2);
  ctx.beginPath();                                // pommel
  ctx.arc(-len * 0.2, 0, w * 0.9, 0, Math.PI * 2);
  ctx.fillStyle = '#FFC107';
  ctx.fill();
  ctx.beginPath();                                // blade
  ctx.moveTo(0, -w);
  ctx.lineTo(len * 0.86, -w);
  ctx.lineTo(len, 0);
  ctx.lineTo(len * 0.86, w);
  ctx.lineTo(0, w);
  ctx.closePath();
  ctx.fillStyle = '#E3E9F0';
  ctx.fill();
  ctx.lineWidth = Math.max(1, w * 0.45);
  ctx.strokeStyle = ink;
  ctx.stroke();
  ctx.beginPath();                                // shine
  ctx.moveTo(len * 0.08, -w * 0.35);
  ctx.lineTo(len * 0.78, -w * 0.35);
  ctx.lineWidth = Math.max(1, w * 0.35);
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
  ctx.stroke();
  ctx.fillStyle = '#FFC107';                      // cross-guard
  ctx.fillRect(-w * 0.7, -w * 2.6, w * 1.4, w * 5.2);
  ctx.lineWidth = Math.max(1, w * 0.4);
  ctx.strokeStyle = ink;
  ctx.strokeRect(-w * 0.7, -w * 2.6, w * 1.4, w * 5.2);
}

// x, feetY: screen/map px of the feet. H: height in px.
// o: { tail, moving, walk, mouth, t, dizzy, swoosh }
function drawBlob(x, feetY, H, facing, o) {
  const s = H / 100;
  const t = o.t || performance.now();
  const tail = o.tail || BLOB_POSES.idle;
  const stride = o.moving ? Math.sin(o.walk * 11) : 0;
  const bob = o.moving ? Math.abs(Math.sin(o.walk * 11)) * 2 : Math.sin(t / 380) * 1.2;
  const by = -bob;
  const ink = '#3a1d0a';
  const fur = '#E8762A';

  ctx.save();
  ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
  ctx.beginPath();
  ctx.ellipse(x, feetY, 46 * s, 7 * s, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.translate(x, feetY);
  ctx.scale(facing === 'left' ? -s : s, s);
  if (o.dizzy) ctx.translate(Math.sin(t / 25) * 2, 0);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  // Fox legs: orange on top, black socks
  const leg = (lx, ph, far) => {
    const swing = stride * 7 * ph;
    const knee = { x: lx + swing * 0.4, y: -14 + by * 0.5 };
    const paw = { x: lx + swing, y: -2 };
    ctx.strokeStyle = ink;
    ctx.lineWidth = 9;
    ctx.beginPath();
    ctx.moveTo(lx, -28 + by);
    ctx.lineTo(knee.x, knee.y);
    ctx.lineTo(paw.x, paw.y);
    ctx.stroke();
    ctx.lineWidth = 6;
    ctx.strokeStyle = far ? '#c25e1c' : fur;
    ctx.beginPath();
    ctx.moveTo(lx, -28 + by);
    ctx.lineTo(knee.x, knee.y);
    ctx.stroke();
    ctx.strokeStyle = far ? '#1a110b' : '#2b1d15';
    ctx.beginPath();
    ctx.moveTo(knee.x, knee.y);
    ctx.lineTo(paw.x, paw.y);
    ctx.stroke();
    ctx.fillStyle = '#1a110b';
    ctx.beginPath();
    ctx.ellipse(paw.x + 2, paw.y, 5, 2.8, 0, 0, Math.PI * 2);
    ctx.fill();
  };
  leg(-30, 1, true);
  leg(14, -1, true);

  // Big bushy tail, curling up from the rump to where it holds the sword
  const tail0 = { x: -42, y: -40 + by };
  const tip = { x: tail.tx, y: tail.ty + by };
  const cp = { x: (tail0.x + tip.x) / 2 - 24, y: Math.min(tail0.y, tip.y) - 20 };
  ctx.beginPath();
  ctx.moveTo(tail0.x, tail0.y);
  ctx.quadraticCurveTo(cp.x, cp.y, tip.x, tip.y);
  ctx.strokeStyle = ink;
  ctx.lineWidth = 22;
  ctx.stroke();
  ctx.strokeStyle = fur;
  ctx.lineWidth = 17;
  ctx.stroke();

  // Body + creamy belly + marker streaks
  ctx.beginPath();
  ctx.ellipse(-6, -38 + by, 40, 17, 0, 0, Math.PI * 2);
  ctx.fillStyle = fur;
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = ink;
  ctx.stroke();
  ctx.save();
  ctx.clip();
  ctx.fillStyle = '#FFF3E0';
  ctx.beginPath();
  ctx.ellipse(2, -25 + by, 30, 8, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(160, 70, 10, 0.35)';
  ctx.lineWidth = 2.5;
  for (let i = 0; i < 6; i++) {
    ctx.beginPath();
    ctx.moveTo(-40 + i * 13, -52 + by);
    ctx.lineTo(-32 + i * 13, -36 + by);
    ctx.stroke();
  }
  ctx.restore();
  leg(-22, -1, false);
  leg(22, 1, false);

  // Furry neck up to the (human!) head
  ctx.beginPath();
  ctx.moveTo(18, -42 + by);
  ctx.quadraticCurveTo(34, -46 + by, 38, -60 + by);
  ctx.strokeStyle = ink;
  ctx.lineWidth = 19;
  ctx.stroke();
  ctx.strokeStyle = fur;
  ctx.lineWidth = 15;
  ctx.stroke();
  ctx.fillStyle = '#FFF3E0';
  ctx.beginPath();
  ctx.ellipse(32, -44 + by, 7, 5, -0.5, 0, Math.PI * 2);
  ctx.fill();

  // Head
  ctx.save();
  ctx.translate(40, -66 + by);
  if (o.dizzy) ctx.rotate(-0.22 + Math.sin(t / 120) * 0.08);
  ctx.beginPath();                                   // face
  ctx.arc(0, 0, 16, 0, Math.PI * 2);
  ctx.fillStyle = '#F6C9A0';
  ctx.fill();
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = ink;
  ctx.stroke();
  ctx.beginPath();                                   // ears
  ctx.arc(-16, 2, 3.5, 0, Math.PI * 2);
  ctx.arc(16, 2, 3.5, 0, Math.PI * 2);
  ctx.fillStyle = '#EDB98C';
  ctx.fill();
  ctx.beginPath();                                   // messy spiky hair
  ctx.moveTo(-17, 0);
  for (let i = 0; i <= 10; i++) {
    const a = Math.PI + (i / 10) * Math.PI;
    const r = i % 2 ? 25 : 17;
    ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r - 3);
  }
  ctx.lineTo(17, 0);
  ctx.quadraticCurveTo(0, -12, -17, 0);
  ctx.closePath();
  ctx.fillStyle = '#5b3418';
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = 'rgba(244, 143, 177, 0.6)';        // rosy cheeks
  ctx.beginPath();
  ctx.arc(-9, 6, 3.5, 0, Math.PI * 2);
  ctx.arc(13, 6, 3.5, 0, Math.PI * 2);
  ctx.fill();
  if (o.dizzy) {                                     // X X eyes
    ctx.strokeStyle = ink;
    ctx.lineWidth = 2.2;
    for (const ex of [-3, 9]) {
      ctx.beginPath();
      ctx.moveTo(ex - 3.5, -5); ctx.lineTo(ex + 3.5, 2);
      ctx.moveTo(ex + 3.5, -5); ctx.lineTo(ex - 3.5, 2);
      ctx.stroke();
    }
  } else {
    ctx.fillStyle = '#fff';                          // big googly eyes
    ctx.beginPath();
    ctx.ellipse(-3, -2, 5, 6, 0, 0, Math.PI * 2);
    ctx.ellipse(9, -2, 5, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = '#1a110b';
    ctx.beginPath();
    ctx.arc(-1.2, -1, 2.4, 0, Math.PI * 2);
    ctx.arc(10.8, -1, 2.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = ink;                           // grumpy eyebrows
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(-8, -11); ctx.lineTo(1, -7.5);
    ctx.moveTo(14, -11); ctx.lineTo(5, -7.5);
    ctx.stroke();
  }
  const mouth = o.mouth || 0;
  if (mouth > 0) {                                   // CHOMP
    const mh = 2 + mouth * 6;
    ctx.beginPath();
    ctx.ellipse(4, 9, 9, mh, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#7a1f1f';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = ink;
    ctx.stroke();
    ctx.fillStyle = '#F48FB1';
    ctx.beginPath();
    ctx.ellipse(4, 9 + mh * 0.5, 5, mh * 0.35, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 4; i++) {
      const tx = -2.5 + i * 4.2;
      ctx.beginPath();
      ctx.moveTo(tx - 1.8, 9 - mh * 0.85);
      ctx.lineTo(tx + 1.8, 9 - mh * 0.85);
      ctx.lineTo(tx, 9 - mh * 0.85 + 3.2);
      ctx.closePath();
      ctx.fill();
    }
  } else {                                           // toothy grin + fangs
    ctx.beginPath();
    ctx.arc(4, 4, 9, 0.2, Math.PI - 0.2);
    ctx.lineWidth = 2.2;
    ctx.strokeStyle = ink;
    ctx.stroke();
    ctx.fillStyle = '#fff';
    for (const fx of [-1, 9]) {
      ctx.beginPath();
      ctx.moveTo(fx - 1.8, 12);
      ctx.lineTo(fx + 1.8, 12);
      ctx.lineTo(fx, 15.5);
      ctx.closePath();
      ctx.fill();
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    // a drip of drool
    const drip = (t / 900) % 1;
    ctx.fillStyle = 'rgba(179, 229, 252, 0.9)';
    ctx.beginPath();
    ctx.ellipse(12, 13 + drip * 6, 1.6, 1.6 + drip * 1.5, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  // Sword in the tail tip (in front of everything)
  if (o.swoosh) {
    ctx.save();
    ctx.globalAlpha = o.swoosh;
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.arc(tip.x, tip.y, 62, tail.a - 1.7, tail.a);
    ctx.stroke();
    ctx.restore();
  }
  ctx.save();
  ctx.translate(tip.x, tip.y);
  ctx.rotate(tail.a);
  drawSword(66, 2.6);
  ctx.restore();
  ctx.beginPath();                                   // fluffy white tail tip wraps the hilt
  ctx.arc(tip.x, tip.y, 10, 0, Math.PI * 2);
  ctx.fillStyle = '#FFF8EC';
  ctx.fill();
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = ink;
  ctx.stroke();

  if (o.dizzy) drawDizzyStars(40, -98, 18, t);
  ctx.restore();
}

function drawDizzyStars(cx, cy, r, t) {
  ctx.save();
  ctx.fillStyle = '#FFEB3B';
  ctx.strokeStyle = '#5a3d00';
  ctx.lineWidth = 1;
  for (let i = 0; i < 3; i++) {
    const a = t / 220 + i * (Math.PI * 2 / 3);
    drawStar(cx + Math.cos(a) * r, cy + Math.sin(a) * r * 0.35, r * 0.32);
  }
  ctx.restore();
}

// Spiky "shout" bubble. (x, y) is where the spike points (the Blob's mouth).
function drawShout(x, y, text, age, fontPx) {
  const fs = fontPx || 22;
  const pop = Math.min(1, age / 220);
  const sc = Math.max(0.01, easeOutBack(pop));
  ctx.save();
  ctx.font = `bold ${fs}px "Comic Sans MS", cursive`;
  const tw = ctx.measureText(text).width;
  const rx = tw / 2 + fs * 1.0, ry = fs * 1.25;
  const cx = clamp(x, rx * 1.22 + 8, canvas.width - rx * 1.22 - 8);
  const cy = Math.max(ry * 1.22 + 8, y - ry - fs * 1.4);
  const wob = Math.sin(age / 35) * 1.5;                 // it's SHOUTING, it trembles
  ctx.translate(x, y);
  ctx.scale(sc, sc);
  ctx.translate(-x, -y);
  ctx.lineJoin = 'round';
  ctx.fillStyle = '#FFF59D';
  ctx.strokeStyle = '#5a2d0c';
  ctx.lineWidth = 3;
  ctx.beginPath();                                      // spike toward the mouth
  ctx.moveTo(cx - fs * 0.5, cy + ry * 0.7);
  ctx.lineTo(x, y);
  ctx.lineTo(cx + fs * 0.5, cy + ry * 0.7);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.beginPath();                                      // starburst
  const N = 22;
  for (let i = 0; i < N; i++) {
    const a = (i / N) * Math.PI * 2;
    const r = i % 2 ? 1 : 1.22;
    const px = cx + Math.cos(a) * rx * r + wob;
    const py = cy + Math.sin(a) * ry * r;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#fff';
  ctx.strokeText(text, cx + wob, cy + 1);
  ctx.fillStyle = '#C62828';
  ctx.fillText(text, cx + wob, cy + 1);
  ctx.restore();
}

// ---------- The fight view ----------
// Arena units: 1000 wide, height measured up from the ground (y = 0).
const FIGHT_MIN_GAP = 200;     // bodies can't get closer than this (centre to centre)
const P_REACH = 300;           // player's sword hits if the Blob is this close
const B_REACH = 330;           // Blob's tail-sword reach (it also lunges forward)
const P_STARTUP = 110, P_ACTIVE = 110, P_RECOVER = 200;   // player swing (ms)
const B_ACTIVE = 160, B_RECOVER = 380;                    // Blob swing after its wind-up
const HIT_STUN = 340, BLOCK_STUN = 220, BOSS_BLOCK_MS = 500;
const ARENA_MIN_X = 110, ARENA_MAX_X = 890;
const JUMP_V = 950, GRAVITY = 2600;

let fight = null;
let bossTuneOverride = null;   // testing: force a tuning (see BOSS_TUNE_BASE)
let fightTouch = { left: false, right: false, block: false };

// Strength, for you AND the Blob: you start every fight with STRENGTH_BASE +
// the desserts you ate (strengthBoost, which you keep); the Blob starts with
// boss.strength (default STRENGTH_BASE). Each hit taken costs 1, and each
// fighter gets 1 back every STRENGTH_REGEN_MS (up to where they started). It
// sets how fast you move and swing, and how often your swings and blocks work.
const STRENGTH_REGEN_MS = 8000;      // tested: fights last ~20–30s, so 15s gave back only ~1 point; 8s gives 2–3
function strengthOdds(s) { return 1 - 0.7 * Math.exp(-s / 7); }       // 0 → 30%, 10 → 83%, 20 → 96%
function strengthSpeed(s) { return clamp(0.55 + 0.045 * s, 0.55, 1.45); }   // 10 → normal speed

// How tough the Blob is in this fight. These are multipliers / additions on the
// original Blob, which is BOSS_TUNE_BASE. See bossTuning() for how it grows.
//   strength  added to its starting strength (faster, lands more, blocks hold)
//   windup    × its wind-up before a normal attack (smaller = less time to react)
//   counter   × its wind-up before a counter-attack after blocking you
//   think     × its pauses between moves (smaller = attacks more often)
//   block     added to its chance of blocking your swings
//   aggro     added to its chance of attacking when you're in reach
//   regen     × time to get 1 strength back (smaller = recovers faster)
//   speed     × how fast it walks in and backs off
//   armor     chance a normal wind-up can't be interrupted (your swing just CLANGs)
//   stun      × how long it's stunned after you hit it
//   tough     chance a hit doesn't cost it any strength
const BOSS_TUNE_BASE = { strength: 0, windup: 1, counter: 1, think: 1, block: 0, aggro: 0, regen: 1, speed: 1, armor: 0, stun: 1, tough: 0 };
function fightTune(f) { return (f && f.tune) || BOSS_TUNE_BASE; }

// The Blob gets tougher every time you beat it, up to BOSS_LEVEL_MAX: level L
// is BOSS_TUNE_BASE moved L/BOSS_LEVEL_MAX of the way to BOSS_TUNE_TOP.
// Tuned with a simulator (tools/fight-sim.js) against three bot players. The
// "decent" bot (reacts in ~0.4s, defends ~75% of attacks) wins 100% of fights
// at level 0, then 99, 96, 86, 64 and 44% at level 5. A "good" bot still wins
// ~70% at level 5. Dessert strength makes up for it: at level 5 a decent player
// wins ~70% at strength 15 and ~90% at 20.
// What mattered: the Blob blocking more, starting stronger, and armored
// wind-ups that can't be interrupted (paired with shorter wind-ups). Just
// attacking more often or sooner made it *easier*, because your hits
// interrupt its wind-ups.
const BOSS_LEVEL_MAX = 5;
const BOSS_TUNE_TOP = { block: 0.22, strength: 3.5, armor: 0.5, windup: 0.72, think: 0.72, tough: 0.18, regen: 0.72, speed: 1.22 };
let bossWins = 0;      // Blob fights won (saved per camper)
function bossLevel() { return Math.min(bossWins, BOSS_LEVEL_MAX); }
function bossTuning(level) {
  const u = clamp(level, 0, BOSS_LEVEL_MAX) / BOSS_LEVEL_MAX;
  const out = { ...BOSS_TUNE_BASE };
  for (const [k, top] of Object.entries(BOSS_TUNE_TOP)) out[k] = BOSS_TUNE_BASE[k] + (top - BOSS_TUNE_BASE[k]) * u;
  out.strength = Math.round(out.strength);
  return out;
}

function loseStrength(f, a, now) {
  if (a.strength <= 0) return;
  if (a === f.b && Math.random() < fightTune(f).tough) {   // shrugged it off
    fightPop(f, 'TOUGH!', a.x, 330 + a.y, '#FFCC80', 0.7);
    return;
  }
  a.strength--;
  a.lostAt = now;
  if (!a.regenAt) a.regenAt = now + (a.regenMs || STRENGTH_REGEN_MS);
  fightPop(f, '-1 💪', a.x, 330 + a.y, '#FF8A65', 0.7);
}

function regenStrength(f, now) {
  for (const a of [f.p, f.b]) {
    if (a.strength >= a.maxStrength) { a.regenAt = 0; continue; }
    if (!a.regenAt) { a.regenAt = now + (a.regenMs || STRENGTH_REGEN_MS); continue; }
    if (now < a.regenAt) continue;
    a.strength++;
    a.gainAt = now;
    a.regenAt = a.strength < a.maxStrength ? now + (a.regenMs || STRENGTH_REGEN_MS) : 0;
    fightPop(f, '+1 💪', a.x, 330 + a.y, '#A5D6A7', 0.7);
  }
}

function newFighter(x, facing) {
  return { x, y: 0, vy: 0, facing, act: 'idle', actStart: 0, walk: 0, pushV: 0, score: 0, hitChecked: false, ai: 'wait' };
}

function startFight() {
  const now = performance.now();
  const def = mapConfig.boss;
  bossEngage = null;
  mapBoss.shout = null;
  backpackOpen = false;
  journalOpen = false;
  tapTarget = null;
  speechBubbles = [];
  fightTouch = { left: false, right: false, block: false };
  fight = {
    def,
    toWin: def.pointsToWin || 10,
    phase: 'intro',            // intro → fight → ko → result
    phaseStart: now,
    lastT: now,
    p: newFighter(320, 'right'),
    b: newFighter(680, 'left'),
    boost: strengthBoost,      // extra strength from desserts
    bossThinkAt: now + 2600,
    shout: null,               // { text, start, dur } — the Blob yelling
    pops: [],                  // floating words: { text, x, y, color, size, start }
    sparks: [],                // { x, y, color, start }
    shake: 0,
    pPulse: 0, bPulse: 0,      // when each score last went up
    winner: null,
    result: null
  };
  fight.level = bossLevel();
  fight.tune = bossTuneOverride ? { ...BOSS_TUNE_BASE, ...bossTuneOverride } : bossTuning(fight.level);
  fight.p.strength = fight.p.maxStrength = STRENGTH_BASE + strengthBoost;
  fight.b.strength = fight.b.maxStrength = (def.strength || STRENGTH_BASE) + fight.tune.strength;
  fight.b.regenMs = STRENGTH_REGEN_MS * fight.tune.regen;
  // Your sidekick fights beside you (in the lane just behind)
  if (sidekick) {
    fight.s = Object.assign(newFighter(200, 'right'), {
      char: sidekick.char, name: sidekickName(),
      strength: SIDEKICK_STRENGTH, maxStrength: SIDEKICK_STRENGTH,
      nextSwingAt: now + 2600 + randBetween(...SIDEKICK_SWING_GAP_MS)
    });
  }
  state = GameState.FIGHTING;
}

// ---------- Your sidekick in the fight ----------
// They stand in the lane just behind you (drawn a little smaller and higher),
// a step back from you, and:
//   • run in and swing their own sword now and then, then step back — their
//     hits count toward YOUR score (and the Blob may block them, and
//     counter-attack you!)
//   • see the Blob winding up and often put their sword up. A block covers
//     you both: the Blob's swing at you hits their guard instead.
// Your block covers them too, but the Blob only ever goes after you, so the
// sidekick never gets hurt and has no strength bar.
// Tuned with tools/fight-sim.js (see CLAUDE.md): a sidekick helps a lot but
// doesn't win the fight for you.
const SIDEKICK_STRENGTH = 10;                // for their odds (strengthOdds) and speed
const SIDEKICK_SWING_GAP_MS = [3800, 6000];  // between their swings
const SIDEKICK_BLOCK_CHANCE = 0.3;           // they try to block this often...
const SIDEKICK_REACT_MS = [320, 620];        // ...this long after the Blob starts its wind-up
const SIDEKICK_LANE = 55;                    // arena units: how far "back" their lane is
const SIDEKICK_BEHIND = 140;                 // they wait this far behind you
const SIDEKICK_GUARD = 240;                  // their guard covers you if they're this close to you

function sidekickGuarding(f) {
  const s = f.s;
  return !!s && (s.act === 'block' || s.act === 'blockstun') && Math.abs(s.x - f.p.x) <= SIDEKICK_GUARD;
}

function sidekickAI(f, now, dt) {
  const s = f.s, p = f.p, b = f.b;
  const t = now - s.actStart;
  s.facing = b.x >= s.x ? 'right' : 'left';
  if (s.act === 'attack') {
    if (!s.hitChecked && t >= P_STARTUP) { s.hitChecked = true; resolveHit(f, s, b, 'sidekick'); }
    if (s.act === 'attack' && t >= P_STARTUP + P_ACTIVE + P_RECOVER) {
      s.act = 'idle';
      s.charging = false;                      // step back behind you
      s.nextSwingAt = now + randBetween(...SIDEKICK_SWING_GAP_MS);
    }
    return;
  }
  if (s.act === 'blockstun' && t > BLOCK_STUN) { s.act = 'block'; s.actStart = now; }
  if (s.act === 'block') {
    // Hold it until the Blob's swing is over
    if (b.act !== 'windup' && b.act !== 'attack' && now - s.actStart > 250) s.act = 'idle';
    else return;
  }
  // The Blob is winding up: maybe get the sword up in time
  if (b.act === 'windup') {
    if (s.reactTo !== b.actStart) {
      s.reactTo = b.actStart;
      s.blockAt = Math.random() < SIDEKICK_BLOCK_CHANCE ? b.actStart + randBetween(...SIDEKICK_REACT_MS) : 0;
    }
    if (s.blockAt && now >= s.blockAt) {
      s.blockAt = 0;
      s.act = 'block';
      s.actStart = now;
      if (Math.random() < 0.5) fightPop(f, pickOne(SIDEKICK_LINES.block), s.x, 300 + SIDEKICK_LANE, s.char.color, 0.55);
      return;
    }
  }
  // Time for a swing? Run in at the Blob (unless it's already reeling)
  const side = p.x <= b.x ? -1 : 1;              // which side of the Blob you're both on
  if (!s.charging && now >= s.nextSwingAt && b.act !== 'hit' && b.act !== 'ko') s.charging = true;
  let rest = p.x + side * SIDEKICK_BEHIND;
  if (rest < ARENA_MIN_X + 10 || rest > ARENA_MAX_X - 10) rest = p.x - side * SIDEKICK_BEHIND * 0.8;   // backed into the wall: just in front
  const want = s.charging ? b.x + side * (P_REACH - 45) : clamp(rest, ARENA_MIN_X, ARENA_MAX_X);
  const spd = strengthSpeed(s.strength);
  if (Math.abs(want - s.x) > 14) {
    s.x += Math.sign(want - s.x) * (s.charging ? 360 : 260) * spd * dt;
    s.walk += dt * spd;
    s.act = 'walk';
  } else {
    s.act = 'idle';
  }
  if (s.charging && Math.abs(s.x - b.x) <= P_REACH - 15) {
    if (b.act === 'hit' || b.act === 'ko') { s.charging = false; s.nextSwingAt = now + 600; return; }
    s.act = 'attack';
    s.actStart = now;
    s.hitChecked = false;
    b.rolledBlock = bossMaybeBlock(f, now);
  }
}

function fightBusy(a) { return a.act === 'attack' || a.act === 'hit' || a.act === 'blockstun' || a.act === 'ko'; }

function fightAttack() {
  const f = fight;
  if (!f || f.phase !== 'fight') return;
  const p = f.p, b = f.b, now = performance.now();
  if (fightBusy(p)) return;
  p.mashing = !!(p.lastAttack && now - p.lastAttack < 560);   // swinging again the instant it can
  p.act = 'attack';
  p.actStart = now;
  p.lastAttack = now;
  p.hitChecked = false;
  p.recover = P_RECOVER / strengthSpeed(p.strength);   // tired arms swing slower
  wearSword(f, SWORD_SWING_WEAR);
  // Sometimes the Blob sees it coming and puts its sword up
  b.rolledBlock = Math.abs(p.x - b.x) < P_REACH + 60 && bossMaybeBlock(f, now);
}

// More likely right after it's been bonked, and a lot more against mashing
function bossMaybeBlock(f, now) {
  const b = f.b, p = f.p;
  if (b.act !== 'idle' && b.act !== 'walk') return false;
  const wary = b.lastHit && now - b.lastHit < 1500 ? 0.2 : 0;
  const chance = Math.min(0.8, 0.22 + fightTune(f).block + 0.02 * p.score + wary + (p.mashing ? 0.35 : 0));
  if (Math.random() < chance) {
    b.act = 'block';
    b.actStart = now;
  }
  return true;    // it had its chance
}

function fightJump() {
  const f = fight;
  if (!f || f.phase !== 'fight') return;
  const p = f.p;
  if (p.y > 0 || fightBusy(p) || p.act === 'block') return;
  p.vy = JUMP_V;
  p.act = 'jump';
}

function fightPop(f, text, x, y, color, size) {
  f.pops.push({ text, x, y, color, size: size || 1, start: performance.now() });
}

function fightSay(f, text, dur) {
  f.shout = { text, start: performance.now(), dur: dur || 1100 };
}

// One swing lands (or doesn't) on `def`
function resolveHit(f, att, def, who) {
  const now = performance.now();
  const dist = Math.abs(att.x - def.x);
  const reach = who === 'boss' ? B_REACH : P_REACH;
  const away = def.x > att.x ? 1 : -1;
  const midX = (att.x + def.x) / 2;
