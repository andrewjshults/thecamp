  if (state === GameState.FIGHTING) { handleFightTouches(e, false); return; }
  const rect = canvas.getBoundingClientRect();
  const touch = e.touches[0];
  if (devMode && devDrag) {
    handleDevPointerMove(touch.clientX - rect.left, touch.clientY - rect.top);
  } else if (journalTouchStartY !== null) {
    const sy = touch.clientY - rect.top;

canvas.addEventListener('wheel', (e) => {
  if (!journalOpen || !journalPanelRect) return;
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left;
  const sy = e.clientY - rect.top;
  const p = journalPanelRect;
  if (sx >= p.x && sx <= p.x + p.w && sy >= p.y && sy <= p.y + p.h) {
    e.preventDefault();
    journalScrollTarget += e.deltaY * 0.8;
  }
}, { passive: false });

function getHoveredCharacter(mx, my) {
  const cardW = 120;
  const cardH = 170;
  const gap = 20;
  const totalW = characters.length * (cardW + gap) - gap;
  const startX = canvas.width / 2 - totalW / 2;
  const cardY = canvas.height / 2 - 40;
  for (let i = 0; i < characters.length; i++) {
    const cx = startX + i * (cardW + gap);
    if (mx >= cx && mx <= cx + cardW && my >= cardY && my <= cardY + cardH) {
      return i;
    }
  }
  return -1;
}

let pendingResumeSave = null;

function selectCharacter(index) {
  if (mp.active && mpCharacterTaken(characters[index].name)) {
    charSelectNote = { text: `A friend is already playing ${characters[index].name}! Pick another camper.`, at: performance.now() };
    return;
  }
  player.character = characters[index];
  heldItem = null;
  sidekick = null;
  npcLeavers = [];
  resetMapBoss();
  // Friends don't remember chats with a different character
  for (const k of Object.keys(conversations)) delete conversations[k];
  speechBubbles = [];
  // Starting position comes from the map's JSON config
  const start = mapConfig.playerStart;
  player.x = scaledMapW * start.px;
  player.y = scaledMapH * start.py;
  backpackOpen = false;
  backpackSelection = { row: 'backpack', col: 0 };

  if (mp.active) { mpStartPlaying(); return; }

  const existing = loadSave(player.character.name);
  if (existing) {
    pendingResumeSave = existing;
    state = GameState.RESUME_PROMPT;
  } else {
    initFreshSave();
    state = GameState.PLAYING;
    checkSwordSoon();
  }
}

function resumePendingSave() {
  if (!pendingResumeSave) return;
  const save = pendingResumeSave;
  pendingResumeSave = null;

  // Apply global state (backpack, journal, per-map hotspot caches)
  applySave(save);
  checkSwordSoon();

  const savedMap = save.currentMap || 'assets/game_design.json';
  if (savedMap !== currentMapPath) {
    // Player saved while on a different map — switch to it
    switchMap(savedMap, null);
  } else {
    // Already on the right map — just start playing
    const start = mapConfig.playerStart;
    player.x = scaledMapW * start.px;
    player.y = scaledMapH * start.py;
    state = GameState.PLAYING;
  }
}

function startFreshSave() {
  initFreshSave();
  pendingResumeSave = null;
  state = GameState.PLAYING;
  checkSwordSoon();
}

// --- Developer Mode functions ---

function enterDevMode() {
  devMode = true;
  devSelectedHotspot = null;
  devDrag = null;
  recalcInteractiveObjects();
}

function exitDevMode() {
  devMode = false;
  devDrag = null;
  canvas.style.cursor = 'default';
  copyHotspotsToClipboard();
  recalcInteractiveObjects();
}

function copyHotspotsToClipboard() {
  // Build full map JSON — preserves all fields (items, uses, etc.)
  // and rounds fractional bounds to 4 decimal places.
  const fullConfig = {
    ...mapConfig,   // keeps npcs and any other top-level fields
    hotspots: mapConfig.hotspots.map(h => {
      const out = { ...h };
      out.px = parseFloat(h.px.toFixed(4));
      out.py = parseFloat(h.py.toFixed(4));
      out.pw = parseFloat(h.pw.toFixed(4));
      out.ph = parseFloat(h.ph.toFixed(4));
      return out;
    })
  };
  const json = JSON.stringify(fullConfig, null, 2);
  navigator.clipboard.writeText(json).catch(() => console.log(json));
}

// Returns the four corner handles for an interactiveObject in screen space
function devHandles(obj) {
  const sx = obj.x - camera.x;
  const sy = obj.y - camera.y;
  const sw = obj.width;
  const sh = obj.height;
  return [
    { corner: 'TL', x: sx,      y: sy      },
    { corner: 'TR', x: sx + sw, y: sy      },
    { corner: 'BL', x: sx,      y: sy + sh },
    { corner: 'BR', x: sx + sw, y: sy + sh }
  ];
}

function handleDevPointerDown(sx, sy) {
  // Hit-test corner handles first (highest priority)
  for (let i = 0; i < interactiveObjects.length; i++) {
    for (const h of devHandles(interactiveObjects[i])) {
      if (Math.hypot(sx - h.x, sy - h.y) <= DEV_HANDLE_R + 6) {
        devSelectedHotspot = i;
        devDrag = { index: i, corner: h.corner };
        return;
      }
    }
  }
  // Hit-test hotspot interiors for selection
  const mx = sx + camera.x;
  const my = sy + camera.y;
  for (let i = 0; i < interactiveObjects.length; i++) {
    const obj = interactiveObjects[i];
    if (mx >= obj.x && mx <= obj.x + obj.width &&
        my >= obj.y && my <= obj.y + obj.height) {
      devSelectedHotspot = i;
      return;
    }
  }
  devSelectedHotspot = null;
}

function handleDevPointerMove(sx, sy) {
  if (!devDrag) return;
  const mx = sx + camera.x;
  const my = sy + camera.y;
  const obj = interactiveObjects[devDrag.index];
  const def = mapConfig.hotspots[devDrag.index];

  let left   = obj.x;
  let top    = obj.y;
  let right  = obj.x + obj.width;
  let bottom = obj.y + obj.height;

  switch (devDrag.corner) {
    case 'TL': left  = mx; top    = my; break;
    case 'TR': right = mx; top    = my; break;
    case 'BL': left  = mx; bottom = my; break;
    case 'BR': right = mx; bottom = my; break;
  }

  // Enforce minimum 20px size and keep inside map
  if (right  - left < 20) { if (devDrag.corner.endsWith('L')) left  = right  - 20; else right  = left  + 20; }
  if (bottom - top  < 20) { if (devDrag.corner.startsWith('T')) top  = bottom - 20; else bottom = top + 20; }
  left   = Math.max(0, Math.min(left,   scaledMapW - 20));
  top    = Math.max(0, Math.min(top,    scaledMapH - 20));
  right  = Math.max(20, Math.min(right,  scaledMapW));
  bottom = Math.max(20, Math.min(bottom, scaledMapH));

  // Write back to both the runtime object and the source-of-truth def
  obj.x = left;
  obj.y = top;
  obj.width  = right  - left;
  obj.height = bottom - top;
  def.px = left   / scaledMapW;
  def.py = top    / scaledMapH;
  def.pw = obj.width  / scaledMapW;
  def.ph = obj.height / scaledMapH;
}

// Change cursor based on what's under the pointer
function updateDevCursor(sx, sy) {
  const cursorMap = { TL: 'nwse-resize', TR: 'nesw-resize', BL: 'nesw-resize', BR: 'nwse-resize' };
  for (const obj of interactiveObjects) {
    for (const h of devHandles(obj)) {
      if (Math.hypot(sx - h.x, sy - h.y) <= DEV_HANDLE_R + 6) {
        canvas.style.cursor = cursorMap[h.corner];
        return;
      }
    }
    const mx = sx + camera.x, my = sy + camera.y;
    if (mx >= obj.x && mx <= obj.x + obj.width && my >= obj.y && my <= obj.y + obj.height) {
      canvas.style.cursor = 'pointer';
      return;
    }
  }
  canvas.style.cursor = 'default';
}

function drawDevModeOverlay() {
  // Badge — top right
  const badge = '🔧 DEV MODE';
  ctx.font = 'bold 14px monospace';
  const bw = ctx.measureText(badge).width + 24;
  const bh = 30;
  const bx = canvas.width - bw - 10;
  const by = 10;
  ctx.fillStyle = 'rgba(180, 0, 0, 0.85)';
  roundRect(bx, by, bw, bh, 6);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'left';
  ctx.fillText(badge, bx + 12, by + 20);

  // All hotspot bounds + handles (drawn in map space, then offset by camera)
  ctx.save();
  ctx.translate(-camera.x, -camera.y);

  for (let i = 0; i < interactiveObjects.length; i++) {
    const obj = interactiveObjects[i];
    const isSelected = i === devSelectedHotspot;

    // Filled tint
    ctx.fillStyle = isSelected ? 'rgba(255, 235, 59, 0.18)' : 'rgba(255, 255, 255, 0.07)';
    ctx.fillRect(obj.x, obj.y, obj.width, obj.height);

    // Outline
    ctx.strokeStyle = isSelected ? '#FFD600' : 'rgba(255, 200, 0, 0.65)';
    ctx.lineWidth = isSelected ? 2.5 : 1.5;
    ctx.setLineDash(isSelected ? [] : [6, 4]);
    ctx.strokeRect(obj.x, obj.y, obj.width, obj.height);
    ctx.setLineDash([]);

    // Name label
    ctx.font = 'bold 11px monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(obj.x + 1, obj.y + 1, ctx.measureText(obj.id).width + 10, 16);
    ctx.fillStyle = isSelected ? '#FFD600' : '#ffe';
    ctx.fillText(obj.id, obj.x + 5, obj.y + 13);

    // Corner handles
    const corners = devHandles(obj);  // these are already in screen space via camera offset above — recalc in map space
    const mapCorners = [
      { corner: 'TL', x: obj.x,            y: obj.y             },
      { corner: 'TR', x: obj.x + obj.width, y: obj.y             },
      { corner: 'BL', x: obj.x,            y: obj.y + obj.height },
      { corner: 'BR', x: obj.x + obj.width, y: obj.y + obj.height }
    ];
    for (const h of mapCorners) {
      ctx.beginPath();
      ctx.arc(h.x, h.y, DEV_HANDLE_R, 0, Math.PI * 2);
      ctx.fillStyle = isSelected ? '#FFD600' : '#fff';
      ctx.fill();
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
  }

  ctx.restore();

  // Footer hint
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  const hint = 'Drag corners to resize  •  Cmd+D to save & exit';
  ctx.font = '12px monospace';
  ctx.textAlign = 'center';
  const hw = ctx.measureText(hint).width + 20;
  roundRect(canvas.width / 2 - hw / 2, canvas.height - 34, hw, 24, 5);
  ctx.fill();
  ctx.fillStyle = '#FFD600';
  ctx.fillText(hint, canvas.width / 2, canvas.height - 17);
}

// --- Interactive Objects ---
// Hotspot definitions are loaded from the map's JSON file (mapConfig.hotspots).
// Positions are stored as percentages of image dimensions (0-1)
// so they work at any scale. Converted to screen coords at runtime.

// Convert percentage-based definitions to pixel coords based on current map scale
let interactiveObjects = [];
function recalcInteractiveObjects() {
  if (!mapConfig) return;
  // Plus hotspots the game adds itself (a full chalkboard's "see all"), but not
  // while editing hotspots: dev mode matches interactiveObjects to the JSON by index
  const defs = devMode ? mapConfig.hotspots : [...mapConfig.hotspots, ...chalkboardHotspots()];
  interactiveObjects = defs.map(def => ({
    ...def,
    x: def.px * scaledMapW,
    y: def.py * scaledMapH,
    width: def.pw * scaledMapW,
    height: def.ph * scaledMapH
  }));
}

let nearbyObject = null;
let currentInteraction = null;
let interactionTimer = 0;
let interactionAnimation = 0;

// --- Touch / tap-to-move ---
let tapTarget = null;     // { x, y } in map space
let tapRipple = null;     // { x, y, age } in screen space for visual feedback

function isTouchDevice() {
  return 'ontouchstart' in window || navigator.maxTouchPoints > 0;
}

function handleCanvasTap(screenX, screenY) {
  // Journal button always takes priority (visible in most states)
  if (journalBtnRect) {
    const b = journalBtnRect;
    if (screenX >= b.x && screenX <= b.x + b.w && screenY >= b.y && screenY <= b.y + b.h) {
      journalOpen = !journalOpen;
      if (journalOpen) { journalScroll = 0; journalScrollTarget = 0; }
      return;
    }
  }
  // Taps inside open journal panel (close button / scroll) don't fall through to game
  if (journalOpen && journalPanelRect) {
    const p = journalPanelRect;
    if (screenX >= p.x && screenX <= p.x + p.w && screenY >= p.y && screenY <= p.y + p.h) {
      // Close button (top-right of panel — 36×36)
      if (screenX >= p.x + p.w - 42 && screenY <= p.y + 46) {
        journalOpen = false;
      }
      return; // swallow tap
    }
    // Tapping outside journal panel on mobile (full-screen) closes it
    if (canvas.width < 600) { journalOpen = false; return; }
  }

  if (state === GameState.USING_ITEM) {
    closeItemUse();
    return;
  }

  if (state === GameState.FIGHTING) {
    if (fight && fight.phase === 'result') endFight();
    return;
  }

  if (state === GameState.CHARACTER_SELECT) {
    const b = charSelectBackRect();
    if (screenX >= b.x && screenX <= b.x + b.w && screenY >= b.y && screenY <= b.y + b.h) {
      backToModeSelect();
      return;
    }
    const idx = getHoveredCharacter(screenX, screenY);
    if (idx >= 0) selectCharacter(idx);
  } else if (state === GameState.RESUME_PROMPT) {
    const btns = resumePromptButtonRects();
    for (const b of btns) {
      if (screenX >= b.x && screenX <= b.x + b.w && screenY >= b.y && screenY <= b.y + b.h) {
        if (b.id === 'resume') resumePendingSave();
        else if (b.id === 'fresh') startFreshSave();
        return;
      }
    }
  } else if (state === GameState.CONFIRM_DIALOG) {
    const panelW = Math.min(400, canvas.width - 40);
    const panelH = 150;
    const panelY = canvas.height / 2 - panelH / 2;
    const btnW = 80, btnH = 36, btnY = panelY + panelH - 52, btnGap = 20;
    const yesBtnX = canvas.width / 2 - btnW - btnGap / 2;
    const noBtnX = canvas.width / 2 + btnGap / 2;
    if (screenX >= yesBtnX && screenX <= yesBtnX + btnW && screenY >= btnY && screenY <= btnY + btnH) {
      goToCharacterSelect();
    } else if (screenX >= noBtnX && screenX <= noBtnX + btnW && screenY >= btnY && screenY <= btnY + btnH) {
      state = GameState.PLAYING;
    }
  } else if (state === GameState.INTERACTING) {
    // Item at this hotspot: pick it up, stay in dialog
    for (const r of interactionHereRects) {
      if (screenX >= r.x && screenX <= r.x + r.w && screenY >= r.y && screenY <= r.y + r.h) {
        interactionHintText = pickUpHotspotItem(currentInteraction.id, r.index)
          ? `${r.item.emoji} ${r.item.name} is in your backpack!`
          : 'Your backpack is full!';
        return;
      }
    }
    // Dimmed item tap: show location hint, stay in dialog
    for (const r of interactionDimmedRects) {
      if (screenX >= r.x && screenX <= r.x + r.w && screenY >= r.y && screenY <= r.y + r.h) {
        interactionHintText = `Find the ${r.item.emoji} ${r.item.name} at the ${r.location}!`;
        return;
      }
    }
    // Usable item tap: use it
    for (const r of interactionUseRects) {
      if (screenX >= r.x && screenX <= r.x + r.w && screenY >= r.y && screenY <= r.y + r.h) {
        closeInteraction();
        useItem(r.item);
        return;
      }
    }
    closeInteraction();
  } else if (state === GameState.ITEM_ACTION) {
    for (const r of itemActionButtonRects) {
      if (screenX >= r.x && screenX <= r.x + r.w && screenY >= r.y && screenY <= r.y + r.h) {
        if (!r.disabled) performItemAction(r.id);
        return;
      }
    }
  } else if (state === GameState.PLAYING) {
    // Backpack overlay hit-tests (slots) take precedence when open
    if (backpackOpen) {
      const allRects = [
        ...backpackSlotRects.hotspot.map(r => ({ ...r, row: 'hotspot' })),
        ...backpackSlotRects.backpack.map(r => ({ ...r, row: 'backpack' }))
      ];
      for (const r of allRects) {
        if (screenX >= r.x && screenX <= r.x + r.w && screenY >= r.y && screenY <= r.y + r.h) {
          backpackSelection = { row: r.row, col: r.col };
          // Open action modal when player is inside a hotspot and slot has an item
          if (nearbyObject) {
            const item = r.row === 'backpack'
              ? backpack[r.col]
              : (hotspotItems[nearbyObject.id] || [])[r.col];
            if (item) openItemAction();
          }
          return;
        }
      }
      // Tap outside any slot but still within the overlay band closes the backpack
      const overlayTop = backpackOverlayTop();
      if (screenY >= overlayTop) {
        backpackOpen = false;
        return;
      }
    }

    // Tapping the Blob when it's close picks a fight
    if (nearBoss) {
      const bp = mapBossPos();
      const bh = mapBossHeight();
      if (Math.hypot(screenX - (bp.x - camera.x), screenY - (bp.y - bh / 2 - camera.y)) < bh * 0.7) {
        engageBoss();
        return;
      }
    }

    // Tapping a nearby friend starts a conversation (tapping a far one walks there)
    const tappedNpc = npcAtScreenPoint(screenX, screenY);
    if (tappedNpc && tappedNpc === nearbyNpc) {
      startConversation(tappedNpc);
      return;
    }

    // Tapping the character sprite triggers interaction; tapping elsewhere walks there
    const spriteScreenX = player.x - camera.x;
    const spriteScreenY = player.y - player.height - camera.y;
    const hitDist = Math.hypot(screenX - spriteScreenX, screenY - (spriteScreenY + player.height / 2));
    const onCharacter = hitDist < 108;
    const now = performance.now();
    if (onCharacter && nearbyObject) {
      handleInteract();
      lastCharTapTime = now;
    } else if (onCharacter) {
      if (now - lastCharTapTime < 350) {
        toggleBackpack();
        lastCharTapTime = 0;
      } else {
        lastCharTapTime = now;
      }
    } else {
      const mapX = screenX + camera.x;
      const mapY = screenY + camera.y;
      tapTarget = { x: mapX, y: mapY };
      tapRipple = { x: screenX, y: screenY, age: 0 };
    }
  }
}

// --- Interaction handling ---
function handleInteract() {
  if (state === GameState.PLAYING && nearbyObject) {
    // Portal hotspot: switch maps, no interaction dialog. Portals with a
    // `door` rect swing that door open first (see drawDoorOpening).
    if (nearbyObject.targetMap) {
      if (doorOpening) return;
      if (nearbyObject.door) {
        doorOpening = { obj: nearbyObject, start: performance.now() };
      } else {
        switchMap(nearbyObject.targetMap, nearbyObject.targetHotspot);
      }
      return;
    }
    // "See all recipes" on a full chalkboard
    if (nearbyObject.seeAllRecipes) {
      openRecipeList();
      return;
    }
    // Kitchen station: Space picks up / puts down / cooks — no dialog
    if (nearbyObject.station && mapConfig.kitchen) {
      doStation(nearbyObject);
      return;
    }
    // The boss's cave: knock and the Blob comes out to fight
    if (isBossCave(nearbyObject)) {
      if (mp.active && mapBoss.busyWith && mapBoss.busyWith !== mp.myId) {
        kitchenToast(`The Blob is busy fighting ${mpBossFighterName()}! 👀`);
      } else if (mapBoss.where === 'home') engageBoss();
      else kitchenToast('The cave is empty... the Blob is out roaming! 👀');
      return;
    }
    state = GameState.INTERACTING;
    currentInteraction = nearbyObject;
    interactionTimer = 0;
    interactionAnimation = 0;
  }
}

function closeInteraction() {
  state = GameState.PLAYING;
  currentInteraction = null;
  interactionHintText = null;
}

// --- Backpack / Inventory ---
function toggleBackpack() {
  backpackOpen = !backpackOpen;
  if (backpackOpen) {
    // Re-anchor selection; prefer hotspot row if items are there
    if (nearbyObject && (hotspotItems[nearbyObject.id] || []).length > 0) {
      backpackSelection = { row: 'hotspot', col: 0 };
    } else {
      backpackSelection = { row: 'backpack', col: 0 };
    }
  }
}

function selectedItem() {
  if (!backpackOpen) return null;
  if (backpackSelection.row === 'backpack') {
    return backpack[backpackSelection.col] || null;
  }
  if (!nearbyObject) return null;
  const items = hotspotItems[nearbyObject.id] || [];
  return items[backpackSelection.col] || null;
}

function backpackRowCount(row) {
  if (row === 'backpack') return BACKPACK_CAPACITY;
  if (!nearbyObject) return 0;
  return HOTSPOT_CAPACITY;
}

function handleBackpackKey(e) {
  if (e.key === 'Escape' || e.key === 'b' || e.key === 'B') {
    backpackOpen = false;
    return;
  }
  if (e.key === 'ArrowLeft') {
    const n = backpackRowCount(backpackSelection.row);
    if (n > 0) backpackSelection.col = (backpackSelection.col - 1 + n) % n;
  } else if (e.key === 'ArrowRight') {
    const n = backpackRowCount(backpackSelection.row);
    if (n > 0) backpackSelection.col = (backpackSelection.col + 1) % n;
  } else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    if (nearbyObject) {
      backpackSelection.row = backpackSelection.row === 'backpack' ? 'hotspot' : 'backpack';
      const n = backpackRowCount(backpackSelection.row);
      if (n > 0) backpackSelection.col = Math.min(backpackSelection.col, n - 1);
      else backpackSelection.col = 0;
    }
  } else if (e.key === 'Enter' || e.key === ' ') {
    openItemAction();
  }
}

function openItemAction() {
  if (!nearbyObject) return;            // outside hotspot = view-only
  const item = selectedItem();
  if (!item) return;
  currentItemAction = {
    source: backpackSelection.row,
    index: backpackSelection.col,
    hotspotId: nearbyObject.id
  };
  backpackActionButton = 0;
  state = GameState.ITEM_ACTION;
}

function closeItemAction() {
  currentItemAction = null;
  state = GameState.PLAYING;
}

// --- Item use helpers ---
function getItemUseAtHotspot(item, hotspot) {
  if (!item || !hotspot) return null;
  if (item.pickedUpFrom === hotspot.id) return null; // can't use where picked up
  const def = mapConfig && mapConfig.hotspots.find(h => h.id === hotspot.id);
  if (!def || !def.uses) return null;
  return def.uses.find(u => u.itemId === item.id) || null;
}

function isUseAlreadyDone(itemId, hotspotId) {
  return completedUses.some(u => u.hotspotId === hotspotId && u.itemId === itemId);
}

function totalUsesCount() {
  // Count across all cached map configs so the journal progress bar is global
  return Object.values(allMapConfigs)
    .flatMap(c => c.hotspots)
    .reduce((sum, h) => sum + (h.uses ? h.uses.length : 0), 0);
}

function itemActionButtons() {
  if (!currentItemAction) return [];
  const a = currentItemAction;
  if (a.source === 'hotspot') {
    const backpackFull = backpack.length >= BACKPACK_CAPACITY;
    return [
      { id: 'pickup', label: 'Pick up', disabled: backpackFull },
      { id: 'cancel', label: 'Cancel',  disabled: false }
    ];
  }
  // Backpack item
  const hotspotFull = !a.hotspotId ||
    (hotspotItems[a.hotspotId] || []).length + mpPendingDropsAt(a.hotspotId) >= HOTSPOT_CAPACITY;
  return [
    { id: 'drop',   label: 'Drop here', disabled: hotspotFull },
    { id: 'cancel', label: 'Cancel',    disabled: false },
  ];
}

// Move a hotspot item into the backpack. Returns false if the backpack is full.
function pickUpHotspotItem(hotspotId, index) {
  if (mp.active) return mpRequestTake(hotspotId, index);
  if (backpack.length >= BACKPACK_CAPACITY) return false;
  const items = hotspotItems[hotspotId] || [];
  const [item] = items.splice(index, 1);
  if (item) {
    item.pickedUpFrom = hotspotId; // record origin so it can't be used there
    backpack.push(item);
  }
  writeSave();
  if (item && item.id === SWORD_ITEM.id) onSwordPickedUp(currentMapPath, hotspotId);
  return true;
}

function performItemAction(buttonId) {
  if (!currentItemAction) return;
  const a = currentItemAction;
  if (buttonId === 'cancel') {
    closeItemAction();
    return;
  }
  if (buttonId === 'pickup' && a.source === 'hotspot') {
    if (!pickUpHotspotItem(a.hotspotId, a.index)) return;
    // Snap selection to remaining hotspot items or fall back to backpack
    const remaining = (hotspotItems[a.hotspotId] || []).length;
    if (remaining > 0) {
      backpackSelection = { row: 'hotspot', col: Math.min(a.index, remaining - 1) };
    } else {
      backpackSelection = { row: 'backpack', col: Math.max(0, backpack.length - 1) };
    }
    closeItemAction();
    return;
  }
  if (buttonId === 'drop' && a.source === 'backpack') {
    const items = hotspotItems[a.hotspotId] || [];
    if (items.length + mpPendingDropsAt(a.hotspotId) >= HOTSPOT_CAPACITY) return;
    const [item] = backpack.splice(a.index, 1);
    if (mp.active) {
      // The world decides: it lands once the drop comes back from PubNub
      if (item) mpRequestDrop(a.hotspotId, item);
    } else {
      if (item) items.push(item);
      hotspotItems[a.hotspotId] = items;
    }
    writeSave();
    // Keep cursor on backpack row at a valid position
    const newCol = Math.min(a.index, Math.max(0, backpack.length - 1));
    backpackSelection = { row: 'backpack', col: newCol };
    closeItemAction();
    return;
  }
}

function useItem(item) {
  const use = getItemUseAtHotspot(item, nearbyObject);
  if (!use) return;
  // Record completion (item stays in backpack)
  completedUses.push({
    hotspotId: nearbyObject.id,
    hotspotName: nearbyObject.name,
    itemId: item.id,
    itemName: item.name,
    itemEmoji: item.emoji || '?',
    text: use.text
  });
  writeSave();
  // Check for all-done celebration
  if (completedUses.length === totalUsesCount()) {
    completionToast = { age: 0 };
  }
  // Transition to use dialog
  currentItemUse = {
    item,
    use,
    hotspot: nearbyObject,
    timer: 0,
    animation: use.animation || nearbyObject.action
  };
  itemUseAnimation = 0;
  backpackOpen = false;
  state = GameState.USING_ITEM;
}

function closeItemUse() {
  currentItemUse = null;
  state = GameState.PLAYING;
}

function handleItemActionKey(e) {
  const btns = itemActionButtons();
  if (e.key === 'Escape') {
    closeItemAction();
    return;
  }
  if (e.key === 'ArrowLeft') {
    backpackActionButton = (backpackActionButton - 1 + btns.length) % btns.length;
  } else if (e.key === 'ArrowRight') {
    backpackActionButton = (backpackActionButton + 1) % btns.length;
  } else if (e.key === 'Enter' || e.key === ' ') {
    const b = btns[backpackActionButton];
    if (b && !b.disabled) performItemAction(b.id);
  }
}

// ============================================================
// --- NPC friends & conversations ---
// ============================================================
// Each map JSON may list `npcs`: [{ id, character, px, py, personality }].
// `character` names an entry in `characters` (the player's own character is
// hidden); px/py are the NPC's FEET position as fractions of the image.
// The player types a line, it pops out of their mouth as a speech bubble,
// then the NPC answers. Replies come from Claude via POST /api/npc-reply
// (server.js); if that's unavailable we fall back to localNpcReply().
const talkBar   = document.getElementById('talkBar');
const talkInput = document.getElementById('talkInput');
const talkSay   = document.getElementById('talkSay');
const talkBye   = document.getElementById('talkBye');
const talkTo    = document.getElementById('talkTo');

const NPC_TALK_RANGE = 170;          // map px between feet to be able to chat
const conversations  = {};           // character name → [{ speaker:'player'|'npc', text }]
let nearbyNpc   = null;              // npc def the player can talk to right now
let talkingTo   = null;              // npc def in the active conversation
let talkPhase   = 'input';           // 'input' | 'playerSpeaking' | 'npcSpeaking'
let talkToken   = 0;                 // bumped per conversation so stale replies are dropped
let pendingReply = null;             // { npc, text } — reply received, not shown yet
let npcThinking  = null;             // { npc, since } — "..." cloud while waiting
let speechBubbles = [];              // see makeBubble()
const npcFacing = {};                // npc id → 'left' | 'right'

function characterByName(name) {
  return characters.find(c => c.name === name);
}

// An NPC is either one of the campers (`character`) or a critter drawn as an
// emoji (`emoji` + `name`, e.g. the frog living in the broken toilet).
function isCritter(npc) {
  return !!(npc && npc !== 'player' && npc.emoji);
}
function npcName(npc) {
  return npc.name || npc.character;   // remote players carry their character's name in `name`
}
// Critter height in map px (`size` is a fraction of the map height)
function critterSize(npc) {
  return (npc.size || 0.07) * scaledMapH;
}

// Camper NPCs step aside when a real person (you, or a friend in a
// multiplayer world) is playing as that character. An NPC that's off being
// someone's sidekick (yours or a friend's), or walking home after, isn't at
// its spot either.
function currentNpcs() {
  if (!mapConfig || !Array.isArray(mapConfig.npcs)) return [];
  return mapConfig.npcs.filter(n => (isCritter(n) ||
    (characterByName(n.character) &&
     (!player.character || n.character !== player.character.name) &&
     !mpCharacterTaken(n.character))) &&
    !npcAway(n.id));
}

// Everyone on this map you can walk up to and talk with: NPCs + your
// sidekick + friends
function talkablesHere() {
  return [...currentNpcs(), ...(sidekick ? [sidekick.npc] : []), ...mpPlayersHere()];
}

// Feet position in map px: where they've walked to, else their spot in the JSON
function npcPos(npc) {
  const m = npcMover(npc);
  if (m) return { x: m.x, y: m.y };
  return { x: npc.px * scaledMapW, y: npc.py * scaledMapH };
}

// Map-space feet / head / mouth for 'player', an npc def, or a remote player.
function speakerFeet(owner) {
  if (owner === 'player') return { x: player.x, y: player.y };
  if (owner.remote) return { x: owner.x, y: owner.y };
  return npcPos(owner);
}
function speakerHead(owner) {
  const f = speakerFeet(owner);
  if (isCritter(owner)) {
    const s = critterSize(owner);
    return { x: f.x, top: f.y - s, mouthY: f.y - s * 0.4 };
  }
  const spriteX = f.x - player.width / 2;
  const spriteY = f.y - player.height;
  return {
    x: spriteX + 15 * SPRITE_SCALE,          // head centre (see drawCharacterSprite)
    top: spriteY,
    mouthY: spriteY + 13 * SPRITE_SCALE
  };
}

function npcAtScreenPoint(sx, sy) {
  for (const npc of talkablesHere()) {
    const h = speakerHead(npc);
    const f = speakerFeet(npc);
    const cy = (h.top + f.y) / 2;
    if (Math.hypot(sx - (h.x - camera.x), sy - (cy - camera.y)) < 80) return npc;
  }
  return null;
}

// --- Starting / ending a conversation ---
function startConversation(npc) {
  if (state !== GameState.PLAYING || !npc) return;
  backpackOpen = false;
  journalOpen = false;
  tapTarget = null;
  player.walking = false;
  player.frame = 0;
  state = GameState.TALKING;
  talkingTo = npc;
  talkToken++;
  talkPhase = 'input';
  pendingReply = null;
  npcThinking = null;
  // Keep what a friend just said to you, so you can answer it
  speechBubbles = npc.remote ? speechBubbles.filter(b => b.owner === npc) : [];
  const p = speakerFeet(npc);
  player.facing = p.x < player.x ? 'left' : 'right';
  if (!npc.remote) npcFacing[npc.id] = p.x < player.x ? 'right' : 'left';
  if (npc.remote && useToast && useToast === mp.talkToast) useToast = null;   // you're answering now
  talkTo.textContent = npc.remote
    ? `💬 Talking with your friend ${npcName(npc)}`
    : `💬 Talking with ${npcName(npc)}`;
  talkInput.value = '';
  talkBar.hidden = false;
  setTalkEnabled(true);
  updateSidekickButton();
}

function endConversation() {
  if (state !== GameState.TALKING) return;
  state = GameState.PLAYING;
  talkingTo = null;
  talkToken++;
  talkPhase = 'input';
  pendingReply = null;
  npcThinking = null;
  talkBar.hidden = true;
  talkSidekick.hidden = true;
  talkInput.blur();
  // Let the last words linger for a moment, then fade away
  const fadeAt = performance.now() + 1500;
  for (const b of speechBubbles) if (!b.fadeStart) b.fadeStart = fadeAt;
}

function setTalkEnabled(on) {
  talkInput.disabled = !on;
  talkSay.disabled = !on;
  if (on) talkInput.focus();
  updateSidekickButton();
}

talkBar.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = talkInput.value.replace(/\s+/g, ' ').trim();
  if (!text || !talkingTo || talkPhase !== 'input') return;
  talkInput.value = '';
  setTalkEnabled(false);

  const npc = talkingTo;
  const token = talkToken;
  say('player', text, npc);
  talkPhase = 'playerSpeaking';
  // Friends nearby see the bubble too (and a friend you're talking to answers)
  mpSay(text, npc);
  if (npc.remote) return;

  const history = conversations[npcName(npc)] || (conversations[npcName(npc)] = []);
  history.push({ speaker: 'player', text });

  // Ask for the reply right away; it's revealed once the player finishes talking
  fetchNpcReply(npc, history.slice()).then(reply => {
    if (token === talkToken) pendingReply = { npc, text: reply };
  });
});
talkBye.addEventListener('click', endConversation);
talkInput.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    e.preventDefault();
    endConversation();
  }
});

// Called every frame: advances the player-talks → NPC-answers sequence.
function updateConversation() {
  const now = performance.now();
  speechBubbles = speechBubbles.filter(b => !b.fadeStart || now - b.fadeStart < 600);
  if (state !== GameState.TALKING || !talkingTo) return;

  if (talkPhase === 'playerSpeaking') {
    const pb = speechBubbles.find(b => b.owner === 'player');
    const playerDone = !pb || now - pb.start > pb.duration + 400;
    if (!playerDone) return;
    if (talkingTo.remote) {
      // A friend answers whenever they like — you can keep talking
      talkPhase = 'input';
      setTalkEnabled(true);
      return;
    }
    if (pendingReply) {
      const { npc, text } = pendingReply;
      pendingReply = null;
      npcThinking = null;
      conversations[npcName(npc)].push({ speaker: 'npc', text });
      say(npc, text, 'player');
      mpSay(text, 'player', npc);
      talkPhase = 'npcSpeaking';
    } else if (!npcThinking) {
      npcThinking = { npc: talkingTo, since: now };
    }
  } else if (talkPhase === 'npcSpeaking') {
    const nb = speechBubbles.find(b => b.owner === talkingTo);
    if (!nb || now - nb.start > nb.duration + 150) {
      talkPhase = 'input';
      setTalkEnabled(true);
    }
  }
}

// --- Getting the NPC's words ---
async function fetchNpcReply(npc, history) {
  // "Where's the sword?" — answered from the game's own item data, never Claude
  const itemAnswer = await itemQuestionReply(history);
  if (itemAnswer) {
    await new Promise(r => setTimeout(r, 400 + Math.random() * 500));
    return itemAnswer;
  }
  const ch = characterByName(npc.character);
  try {
    const res = await fetch('/api/npc-reply', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        npc: {
          name: npcName(npc),
          what: npc.what || '',                 // critters: what kind of creature they are
          desc: ch ? ch.desc : '',
          personality: npc.personality || '',
          sidekick: isSidekick(npc)             // following you around, ready to help fight the Blob
        },
        playerName: player.character ? player.character.name : 'a friend',
        mapName: mapConfig ? mapConfig.name : 'The Camp',
        places: mapConfig ? mapConfig.hotspots.filter(h => !h.targetMap).map(h => h.name) : [],
        backpack: backpack.map(i => i.name),
        history
      })
    });
    if (res.ok) {
      const data = await res.json();
      if (data && data.reply) return data.reply;
    }
  } catch (_) { /* offline / static hosting — fall through */ }
  // No server-side brain available: make something up locally after a little "think"
  await new Promise(r => setTimeout(r, 500 + Math.random() * 700));
  return localNpcReply(npc, history);
}

// Simple built-in reply maker used when Claude isn't reachable
// (e.g. on GitHub Pages, or no API key on the dev server).
function localNpcReply(npc, history) {
  if (npc.localReplies) return localCritterReply(npc, history);
  const said = (history[history.length - 1] || { text: '' }).text.toLowerCase();
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const name = player.character ? player.character.name : 'friend';
  const places = mapConfig ? mapConfig.hotspots.filter(h => !h.targetMap).map(h => h.name) : [];
  const place = places.length ? pick(places) : 'camp';
  const mentioned = places.find(p =>
    p.toLowerCase().split(' ').some(w => w.length > 3 && said.includes(w)));
  const has = re => re.test(said);

  if (has(/\b(hi|hello|hey|howdy|hiya)\b/)) return pick([
    `Hi ${name}! 👋 Want to go explore the ${place} with me?`,
    `Hey ${name}! I was just thinking about the ${place}.`,
    `Hello hello! Isn't today a perfect camp day? ☀️`
  ]);
  if (has(/\b(bye|goodbye|see ya|see you|later)\b/)) return pick([
    `Bye ${name}! Come find me again soon! 👋`,
    `See you later, alligator! 🐊`,
    `Okay, bye! Have fun exploring!`
  ]);
  if (mentioned) return pick([
    `Ooh, the ${mentioned}! That's one of my favorite spots.`,
    `I was at the ${mentioned} earlier. It was SO fun!`,
    `Race you to the ${mentioned}! 🏃`
  ]);
  if (has(/\b(sad|scared|tired|lonely|mad|upset)\b/)) return pick([
    `Aww, want a hug? 🤗 We can go to the ${place} together.`,
    `It's okay. I'm right here with you, ${name}.`,
    `Let's do something cozy. Maybe the ${place}?`
  ]);
  if (has(/\b(love|like|fun|yay|cool|awesome|best)\b/)) return pick([
    `Me too! That's the best! 🎉`,
    `Yay! You always have the best ideas, ${name}.`,
    `Ooh, I like that too! High five! ✋`
  ]);
  if (said.includes('?')) return pick([
    `Hmm... I think yes! But let's ask the Moon to be sure. 🌙`,
    `Great question! What do YOU think?`,
    `I'm not sure... maybe we can find out at the ${place}!`
  ]);
  return pick([
    `Wow, really? Tell me more!`,
    `Ha ha! You're so funny, ${name}! 😄`,
    `That reminds me, have you seen the ${place} today?`,
    `Cool! I love hanging out with you at camp.`
  ]);
}

// Critters can bring their own offline lines in the map JSON:
//   "localReplies": { "hello": [...], "bye": [...], "question": [...], "any": [...] }
// `{name}` is replaced with the player's character name.
function localCritterReply(npc, history) {
  const said = (history[history.length - 1] || { text: '' }).text.toLowerCase();
  const r = npc.localReplies;
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  let pool = r.any || [];
  if (/\b(hi|hello|hey|howdy|hiya)\b/.test(said) && r.hello) pool = r.hello;
  else if (/\b(bye|goodbye|see ya|see you|later)\b/.test(said) && r.bye) pool = r.bye;
  else if (said.includes('?') && r.question) pool = r.question;
  const name = player.character ? player.character.name : 'friend';
  return (pool.length ? pick(pool) : '...').replace(/\{name\}/g, name);
}

// --- Item questions ("where is the sword?") ---
// Plain keyword matching, no Claude: if the player's line looks like a
// question / search and names an item (by a word of its name or its emoji),
// the NPC says where that item is right now, across every map: hotspots,
// kitchen stations you can grab or buy it from, and your own backpack.
const ITEM_QUESTION_RE = /\?|\b(where|wheres|find|found|seen|see|saw|look|looking|lost|locate|get|got|any|is there)\b/;
const ITEM_WORD_SKIP = new Set(['the', 'and', 'toy', 'big', 'hot', 'pink', 'fancy', 'comfy', 'lonely', 'little']);

// Lowercase words, roughly singular ("glasses" → "glas", same as "glass")
function itemWords(text) {
  const out = [];
  for (const w of String(text).toLowerCase().match(/[a-z0-9]+(?:-[a-z0-9]+)*/g) || []) {
    for (const v of w.includes('-') ? [w, w.replace(/-/g, '')] : [w]) {
      let x = v.replace(/ies$/, 'y').replace(/(ch|sh|ss|x)es$/, '$1');
      if (x.length > 3) x = x.replace(/s$/, '');
      if (x.length >= 3 && !/^\d+$/.test(x)) out.push(x);
    }
  }
  return out;
}

// The best-matching item(s) mentioned in `said`, from `known` (name → item)
function itemsMentioned(said, known) {
  const words = new Set(itemWords(said));
  let best = 0, hits = [];
  for (const item of known.values()) {
    const iw = itemWords(item.name).filter(w => !ITEM_WORD_SKIP.has(w));
    const n = iw.filter(w => words.has(w)).length;
    let score = n + (n && n === iw.length ? 0.5 : 0);
    if (item.emoji && said.includes(item.emoji)) score = Math.max(score, 2);
    if (!score) continue;
    if (score > best) { best = score; hits = [item]; }
    else if (score === best) hits.push(item);
  }
  return hits;
}

function theName(name) {
  return /^the\b/i.test(name) ? name : `the ${name}`;
}

async function itemQuestionReply(history) {
  const said = (history[history.length - 1] || { text: '' }).text;
  if (!ITEM_QUESTION_RE.test(said.toLowerCase())) return null;
  let configs;
  try { configs = await crawlMapConfigs(); } catch (_) { return null; }
  if (mapConfig && currentMapPath) configs = { ...configs, [currentMapPath]: mapConfig };

  // Every item the game knows about (so "haven't seen one" works too),
  // and where each one is right now (lowercased name → [where phrase])
  const known = new Map(), spots = new Map();
  const learn = it => { if (it && it.name) known.set(it.name.toLowerCase(), it); };
  const spot = (it, phrase) => {
    learn(it);
    const k = it.name.toLowerCase();
    (spots.get(k) || spots.set(k, []).get(k)).push(phrase);
  };
  learn(SWORD_ITEM);
  for (const [path, cfg] of Object.entries(configs)) {
    const here = path === currentMapPath;
    const where = (h, verb = 'at') => here
      ? `right here, ${verb} ${theName(h.name)}`
      : `${verb} ${theName(h.name)} ${mapWhere(cfg)}`;
    const items = worldItemsFor(path, cfg) || {};
    const foods = (cfg.kitchen && cfg.kitchen.foods) || {};
    if (cfg.boss && cfg.boss.reward) learn(cfg.boss.reward);
    for (const h of cfg.hotspots || []) {
      for (const it of h.items || []) learn(it);
      for (const it of items[h.id] || []) spot(it, where(h));
      const st = h.station, food = st && foods[st.item];
      if (food && st.type === 'source') spot(food, `to grab ${where(h, 'from')}`);
      if (food && st.type === 'shop') {
        spot(food, here ? 'to buy right here, at the dessert case'
                        : `to buy at the dessert case ${mapWhere(cfg)}`);
      }
    }
  }

  const asked = itemsMentioned(said, known).slice(0, 2);
  if (!asked.length) return null;

  // Make sure there's a sword somewhere before saying where it is
  if (asked.some(it => it.id === SWORD_ITEM.id) && !spots.has('sword')) {
    const at = await findOrDropSword();
    if (at) {
      const h = (at.cfg.hotspots || []).find(x => x.id === at.hs);
      spot(SWORD_ITEM, at.path === currentMapPath
        ? `right here, at ${theName(h ? h.name : 'somewhere')}`
        : `at ${theName(h ? h.name : 'somewhere')} ${mapWhere(at.cfg)}`);
    }
  }

  const name = player.character ? player.character.name : 'friend';
  return asked.map(it => {
    const label = `${it.name} ${it.emoji || ''}`.trim();
    const mine = backpack.some(b => b.name.toLowerCase() === it.name.toLowerCase());
    const list = [...new Set(spots.get(it.name.toLowerCase()) || [])];
    const places = list.slice(0, 2).join(', and ') + (list.length > 2 ? ', and a few other places' : '');
    if (mine && list.length) return `You've got ${label} in your backpack, ${name}! There's another one ${places}.`;
    if (mine) return `Silly ${name}, ${label} is in your backpack! 🎒`;
    if (!list.length) return pickOne([
      `Hmm, I haven't seen any ${label} around lately. Maybe somebody took it?`,
      `${label}? I don't think there's any left right now. 🤔`
    ]);
    return pickOne([
      `${label}? There's one ${places}!`,
      `Ooh, ${label}! I think there's one ${places}. 👀`
    ]);
  }).join(' ');
}

// --- Speech bubbles ---
const BUBBLE_FONT   = 'bold 18px "Comic Sans MS", "Chalkboard SE", cursive';
const BUBBLE_LINE_H = 24;
const BUBBLE_PAD_X  = 16;
const BUBBLE_PAD_Y  = 12;
const BUBBLE_MAX_W  = 260;
const BUBBLE_POP_MS = 320;
const WORD_POP_MS   = 170;

// Lay out the words up front (so the bubble has its final size), and give each
// word a time to pop in — roughly at speaking pace.
function makeBubble(owner, text, partner) {
  ctx.save();
  ctx.font = BUBBLE_FONT;
  const spaceW = ctx.measureText(' ').width;
  const lines = [];
  let line = [];
  let lineW = 0;
  let t = BUBBLE_POP_MS * 0.6;
  for (const word of text.split(/\s+/).filter(Boolean)) {
    const w = ctx.measureText(word).width;
    if (line.length && lineW + spaceW + w > BUBBLE_MAX_W) {
      lines.push({ words: line, width: lineW });
      line = [];
      lineW = 0;
    }
    const x = line.length ? lineW + spaceW : 0;
    line.push({ text: word, x, w, appearAt: t });
    lineW = x + w;
    t += 110 + word.length * 22;
  }
  if (line.length) lines.push({ words: line, width: lineW });
  ctx.restore();
  const contentW = Math.max(40, ...lines.map(l => l.width));
  return {
    owner, partner, lines, contentW,
    width: contentW + BUBBLE_PAD_X * 2,
    height: Math.max(1, lines.length) * BUBBLE_LINE_H + BUBBLE_PAD_Y * 2,
    start: performance.now(),
    duration: t,               // when the last word has started popping in
    dimmed: false,
    fadeStart: null
  };
}

function say(owner, text, partner) {
  // A speaker only has one bubble at a time; older lines from others go faint
  speechBubbles = speechBubbles.filter(b => b.owner !== owner);
  for (const b of speechBubbles) b.dimmed = true;
  speechBubbles.push(makeBubble(owner, text, partner));
}

// 0 = smiling, 0–1 = mouth open amount while their words are still appearing
function mouthOpenFor(owner) {
  const b = speechBubbles.find(b => b.owner === owner);
  if (!b) return 0;
  const age = performance.now() - b.start;
  if (age > b.duration + WORD_POP_MS) return 0;
  return 0.25 + 0.75 * Math.abs(Math.sin(age / 85));
}

function easeOutBack(p) {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2);
}
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function speakerColor(owner) {
  if (owner === 'player') return player.character ? player.character.color : '#333';
  if (owner.color) return owner.color;
  const ch = characterByName(owner.character);
  return ch ? ch.color : '#333';
}

// A '#rrggbb' colour mixed `amt` (0–1) of the way to white, so a character's
// colour stays recognisable but reads on dark/green panels.
function lightenColor(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const mix = c => Math.round(c + (255 - c) * amt);
  return `rgb(${mix(n >> 16)}, ${mix((n >> 8) & 255)}, ${mix(n & 255)})`;
}

// Where a bubble rests: above the speaker's head, nudged away from whoever
// they're talking to so the two bubbles don't overlap.
function bubbleLayout(owner, partner, w, h) {
  const head = speakerHead(owner);
  const sx = head.x - camera.x;
  const topY = head.top - camera.y;
  let dir = owner === 'player' ? -1 : 1;
  if (partner) {
    const a = speakerFeet(owner).x, b = speakerFeet(partner).x;
    if (a !== b) dir = a > b ? 1 : -1;
  }
  const x = clamp(sx + dir * (w / 2 - 40) - w / 2, 8, canvas.width - w - 8);
  const y = Math.max(8, topY - 30 - h);
  return {
    x, y,
    tipX: sx,
    tipY: topY - 6,
    mouthX: sx,
    mouthY: head.mouthY - camera.y
  };
}

function bubblePath(x, y, w, h, r, tipX, tipY) {
  const tw = 11;
  const baseX = clamp(tipX, x + r + tw, x + w - r - tw);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(baseX + tw, y + h);
  ctx.lineTo(tipX, tipY);
  ctx.lineTo(baseX - tw, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

function drawBubble(b, now) {
  const age = now - b.start;
  const L = bubbleLayout(b.owner, b.partner, b.width, b.height);

  let alpha = b.dimmed ? 0.55 : 1;
  if (b.fadeStart && now > b.fadeStart) alpha *= Math.max(0, 1 - (now - b.fadeStart) / 600);
  if (alpha <= 0) return;

  // Pop out of the mouth: start tiny at the mouth, spring up to the resting spot
  const p = clamp(age / BUBBLE_POP_MS, 0, 1);
  const scale = Math.max(0.01, easeOutBack(p));
  const rise = 1 - (1 - Math.pow(1 - p, 3));      // 1 → 0
  const ox = (L.mouthX - L.tipX) * rise;
  const oy = (L.mouthY - L.tipY) * rise;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(L.tipX + ox, L.tipY + oy);
  ctx.scale(scale, scale);
  ctx.translate(-L.tipX, -L.tipY);

  bubblePath(L.x, L.y, b.width, b.height, 16, L.tipX, L.tipY);
  ctx.shadowColor = 'rgba(0, 0, 0, 0.25)';
  ctx.shadowBlur = 8;
  ctx.shadowOffsetY = 3;
  ctx.fillStyle = '#FFFFFF';
  ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.lineWidth = 3;
  ctx.strokeStyle = speakerColor(b.owner);
  ctx.stroke();

  // Words pop in one at a time
  ctx.font = BUBBLE_FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#333';
  b.lines.forEach((line, i) => {
    const lineX = L.x + BUBBLE_PAD_X + (b.contentW - line.width) / 2;
    const lineY = L.y + BUBBLE_PAD_Y + i * BUBBLE_LINE_H + BUBBLE_LINE_H / 2;
    for (const word of line.words) {
      const wAge = age - word.appearAt;
      if (wAge < 0) break;
      const wp = clamp(wAge / WORD_POP_MS, 0, 1);
      const ws = 0.3 + 0.7 * easeOutBack(wp);
      const cx = lineX + word.x + word.w / 2;
      const cy = lineY + (1 - wp) * 8;
      ctx.save();
      ctx.globalAlpha = alpha * wp;
      ctx.translate(cx, cy);
      ctx.scale(ws, ws);
      ctx.fillText(word.text, 0, 0);
      ctx.restore();
    }
  });
  ctx.restore();
  ctx.textBaseline = 'alphabetic';
}

// "..." thought cloud while the NPC is coming up with an answer
function drawThinkingBubble(npc, now) {
  const age = now - npcThinking.since;
  const w = 78, h = 44;
  const L = bubbleLayout(npc, 'player', w, h);
  const p = clamp(age / 250, 0, 1);
  ctx.save();
  ctx.globalAlpha = p;
  ctx.fillStyle = '#FFFFFF';
  ctx.strokeStyle = speakerColor(npc);
  ctx.lineWidth = 3;
  // Little trail of thought puffs from the head up to the cloud
  const puffs = [[0.25, 5], [0.6, 8]];
  for (const [f, r] of puffs) {
    const px = L.tipX + (L.x + w / 2 - L.tipX) * f;
    const py = L.tipY + (L.y + h - L.tipY) * f;
    ctx.beginPath();
    ctx.arc(px, py, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  }
  roundRect(L.x, L.y, w, h, 20);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#666';
  for (let i = 0; i < 3; i++) {
    const bounce = Math.max(0, Math.sin(age / 160 - i * 0.7)) * 6;
    ctx.beginPath();
    ctx.arc(L.x + w / 2 + (i - 1) * 16, L.y + h / 2 + 2 - bounce, 5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawSpeechBubbles() {
  const now = performance.now();
  // Draw faded (older) bubbles first so the newest line is on top
  const ordered = [...speechBubbles].sort((a, b) => (a.dimmed === b.dimmed ? 0 : a.dimmed ? -1 : 1));
  for (const b of ordered) drawBubble(b, now);
  if (npcThinking) drawThinkingBubble(npcThinking.npc, now);
}

// ============================================================
// --- NPCs on the move: wandering, and your sidekick ---
// ============================================================
// Camper NPCs stroll around their spot in the map JSON (`px`/`py`), within
// NPC_WANDER_RX / RY of it (`"wander": false` keeps one still). Where they're
// headed comes from the clock (Date.now()) and their id, so every computer in
// a multiplayer world sees them in the same place without sending anything.
// They stop when you're close, so they're easy to talk to.
//
// Ask a camper NPC to "be my sidekick" (button in the talk bar) and they
// follow you around (`sidekick`), through doors to other maps too, and help
// you fight the Blob. When the fight is over (or you say they can go) they
// walk home: across the map if this is their map, else out the nearest door
// that leads home (`npcLeavers`), and then they wander about at their spot again.
const NPC_WANDER_RX = 0.045;       // how far from their spot they stroll (fractions of the map)
const NPC_WANDER_RY = 0.03;
const NPC_WANDER_SEG_MS = 9000;    // one stroll (with a pause) every 9s
const NPC_WANDER_MS_PER_H = 16000; // walking one map-height takes this long
const npcRt = {};                  // npc id → mover on its home map: { map, x, y, facing, walking, frame, frameTimer, seen }
let sidekick = null;               // { npc, home, char, x, y, facing, walking, frame, frameTimer, trail, lastMoveAt }
let npcLeavers = [];               // ex-sidekicks walking out of a map: { npc, char, x, y, tx, ty, ..., goneAt }

function isSidekick(npc) { return !!(sidekick && npc && npc !== 'player' && !npc.remote && npc.id === sidekick.npc.id); }
function canBeSidekick(npc) { return !!(npc && npc !== 'player' && !npc.remote && !isCritter(npc) && characterByName(npc.character)); }
function npcWanders(npc) { return !isCritter(npc) && npc.wander !== false; }

// Not standing at their spot right now: your sidekick, walking home, or a friend's sidekick
function npcAway(id) {
  if (sidekick && sidekick.npc.id === id) return true;
  if (npcLeavers.some(l => l.npc.id === id)) return true;
  return mpSidekickTaken(id);
}

// Whatever is moving this NPC around on the current map (or null: they're at their spot)
function npcMover(npc) {
  if (!npc || npc === 'player' || npc.remote) return null;
  if (sidekick && sidekick.npc.id === npc.id) return sidekick;
  const l = npcLeavers.find(l => l.npc.id === npc.id);
  if (l) return l;
  const rt = npcRt[npc.id];
  return rt && rt.map === currentMapPath ? rt : null;
}

// The NPC's def as the current map knows it (the map JSON is re-fetched on
// every map switch, so the same NPC can be a different object later)
function npcOnThisMap(id) {
  return (mapConfig && Array.isArray(mapConfig.npcs) && mapConfig.npcs.find(n => n.id === id)) || null;
}

// Repeatable "random" 0–1 from an NPC id and a number
function npcHash(id, n) {
  let h = 2166136261;
  for (let i = 0; i < id.length; i++) h = Math.imul(h ^ id.charCodeAt(i), 16777619);
  const x = Math.sin((h % 100000) * 0.0137 + n * 12.9898) * 43758.5453;
  return x - Math.floor(x);
}

// Stroll k's destination: every third one is their own spot, so they don't drift
function wanderPoint(npc, k) {
  if (npcHash(npc.id, k) < 0.33) return { fx: npc.px, fy: npc.py };
  return {
    fx: clamp(npc.px + (npcHash(npc.id, k + 0.31) * 2 - 1) * NPC_WANDER_RX, 0.03, 0.97),
    fy: clamp(npc.py + (npcHash(npc.id, k + 0.67) * 2 - 1) * NPC_WANDER_RY, 0.06, 0.98)
  };
}

// Where the wander schedule says they are at time t (fractions of the map)
function wanderTarget(npc, t) {
  const k = Math.floor(t / NPC_WANDER_SEG_MS);
  const a = wanderPoint(npc, k), b = wanderPoint(npc, k + 1);
  const aspect = mapImage ? mapImage.naturalWidth / mapImage.naturalHeight : 1;
  const walkMs = Math.max(600, Math.hypot((b.fx - a.fx) * aspect, b.fy - a.fy) * NPC_WANDER_MS_PER_H);
  const pause = NPC_WANDER_SEG_MS * (0.25 + 0.35 * npcHash(npc.id, k + 0.5));
  const u = clamp((t - k * NPC_WANDER_SEG_MS - pause) / walkMs, 0, 1);
  const e = u * u * (3 - 2 * u);
  return { fx: lerp(a.fx, b.fx, e), fy: lerp(a.fy, b.fy, e) };
}

// Walk a mover up to `speed` px toward (tx, ty), animating their legs.
// Returns how far they still have to go.
function stepMover(m, tx, ty, speed) {
  const dx = tx - m.x, dy = ty - m.y;
  const d = Math.hypot(dx, dy);
  if (d < 1.5) {
    m.walking = false;
  } else {
    const st = Math.min(d, speed);
    m.x += dx / d * st;
    m.y += dy / d * st;
    m.walking = st > 0.4;
    if (Math.abs(dx) > 0.5) m.facing = dx < 0 ? 'left' : 'right';
  }
  if (m.walking) {
    if (++m.frameTimer > 8) { m.frame = (m.frame + 1) % 4; m.frameTimer = 0; }
  } else {
    m.frame = 0;
    m.frameTimer = 0;
  }
  return Math.max(0, d - speed);
}

function newMover(x, y, facing) {
  return { x, y, facing: facing || 'right', walking: false, frame: 0, frameTimer: 0 };
}

// Called every frame (except in a fight)
function updateNpcs() {
  if (!player.character || !mapImage || !scaledMapW || devMode) return;
  if (state === GameState.FIGHTING || state === GameState.LOADING) return;
  const now = Date.now();
  const pnow = performance.now();
  const k = SPRITE_SCALE / BASE_SPRITE_SCALE;
  const stroll = player.speed * 0.6;
  for (const npc of currentNpcs()) {
    if (!npcWanders(npc)) continue;
    let rt = npcRt[npc.id];
    if (!rt || rt.map !== currentMapPath || pnow - rt.seen > 1000) {
      // Just came into view: they're wherever their stroll has got to by now
      // (an ex-sidekick walking home keeps walking from where they are)
      const w = wanderTarget(npc, now);
      const keep = rt && rt.map === currentMapPath && rt.walkingHome;
      rt = npcRt[npc.id] = Object.assign(keep ? rt : newMover(w.fx * scaledMapW, w.fy * scaledMapH, npcFacing[npc.id]), { map: currentMapPath });
    }
    rt.seen = pnow;
    // Hold still for a chat, or when you're right next to them
    const close = Math.hypot(rt.x - player.x, rt.y - player.y) < Math.max(NPC_TALK_RANGE * k, player.width * 1.4);
    // (an ex-sidekick heading home doesn't wait for you to step away)
    const busy = (talkingTo && talkingTo.id === npc.id) || (close && !rt.walkingHome) || bossEngage || doorOpening;
    if (busy) { stepMover(rt, rt.x, rt.y, 0); continue; }
    const w = wanderTarget(npc, now);
    const left = stepMover(rt, w.fx * scaledMapW, w.fy * scaledMapH, rt.walkingHome ? player.speed * 0.8 : stroll);
    if (left < 2) rt.walkingHome = false;
    if (rt.walking) npcFacing[npc.id] = rt.facing;
  }
  updateSidekick(pnow, k);
  updateLeavers(pnow);
}

// --- Your sidekick ---
const SIDEKICK_TRAIL_GAP = 165;   // map px (× sprite size) behind you along your path while walking
const SIDEKICK_LINES = {
  ask:    ['Will you be my sidekick?', 'Want to be my sidekick?', 'Be my sidekick? Pleeease?'],
  yes:    ['YES! Sidekicks forever! 🤝 Lead the way!', 'Ooh, an adventure! I\'m right behind you! 🤝',
           'Sure! I\'ve got my sword ready, just in case! ⚔️', 'Yay! Where are we going first? 🤝'],
  dismiss: ['Thanks for being my sidekick! You can go home now.', 'That was fun! You can go home now.'],
  bye:    ['Okay! That was so fun! See you later! 👋', 'Aww, okay! Call me if you need help! 👋',
           'Bye! Best adventure ever! 👋'],
  won:    ['WE DID IT! Great teamwork! 🏆 See you around!', 'Woo-hoo! We beat the Blob! 🏆 Bye for now!'],
  lost:   ['Aww, that Blob is tough! We\'ll get it next time! 👋', 'Phew! Let\'s rest up. See you later! 👋'],
  fled:   ['Run, run! Phew... that was close! See you later! 👋'],
  hit:    ['Take that!', 'Ha-HA!', 'Got it!', 'Hi-yah!', 'Yeah!'],
  block:  ['I got you!', 'Watch out!', 'Not today!', 'Shields up!']
};

function sidekickName() { return sidekick ? npcName(sidekick.npc) : ''; }

// `npc` (a camper NPC on this map) joins you
function makeSidekick(npc) {
  if (!canBeSidekick(npc)) return;
  if (sidekick && sidekick.npc.id !== npc.id) releaseSidekick();
  const p = npcPos(npc);
  delete npcRt[npc.id];
  npcLeavers = npcLeavers.filter(l => l.npc.id !== npc.id);
  sidekick = Object.assign(newMover(p.x, p.y, npcFacing[npc.id]), {
    npc, home: currentMapPath, char: characterByName(npc.character),
    trail: [], lastMoveAt: 0
  });
  mpSendPos(true);
}

// Where to stand beside you (not on top of you): left or right, whichever
// side they're already on, unless that's off the map
function sidekickSpot() {
  const gap = player.width * 1.55;
  let side = sidekick.x <= player.x ? -1 : 1;
  const x = player.x + side * gap;
  if (x < 20 || x > scaledMapW - 20) side = -side;
  return { x: clamp(player.x + side * gap, 20, scaledMapW - 20), y: player.y };
}

// The point `dist` px back along the path you walked
function trailPoint(dist) {
  const tr = sidekick.trail;
  let px = player.x, py = player.y, left = dist;
  for (let i = tr.length - 1; i >= 0; i--) {
    const seg = Math.hypot(px - tr[i].x, py - tr[i].y);
    if (seg >= left) {
      const u = left / seg;
      return { x: px + (tr[i].x - px) * u, y: py + (tr[i].y - py) * u };
    }
    left -= seg;
    px = tr[i].x;
    py = tr[i].y;
  }
  return { x: px, y: py };
}

function updateSidekick(now, k) {
  const sk = sidekick;
  if (!sk) return;
  // Someone joined the world as this very character: they're a person now
  if (mpCharacterTaken(sk.char.name)) {
    sidekick = null;
    mpToast(`${sk.char.name} is being played by a friend now!`);
    return;
  }
  // Remember where you've walked, for them to follow
  const last = sk.trail[sk.trail.length - 1];
  if (!last || Math.hypot(player.x - last.x, player.y - last.y) > 6) {
    sk.trail.push({ x: player.x, y: player.y });
    if (sk.trail.length > 160) sk.trail.shift();
  }
  if (player.walking) sk.lastMoveAt = now;
  if (talkingTo && talkingTo.id === sk.npc.id) { stepMover(sk, sk.x, sk.y, 0); return; }
  const target = now - sk.lastMoveAt < 350 ? trailPoint(SIDEKICK_TRAIL_GAP * k) : sidekickSpot();
  const far = Math.hypot(target.x - sk.x, target.y - sk.y);
  stepMover(sk, target.x, target.y, player.speed * (far > 260 * k ? 1.5 : 1.08));
  if (!sk.walking) sk.facing = player.x < sk.x ? 'left' : 'right';   // keep an eye on you
  npcFacing[sk.npc.id] = sk.facing;
}

// Going through a door: they come too, and pop up beside you
function placeSidekickBeside() {
  if (!sidekick) return;
  const behind = player.facing === 'left' ? 1 : -1;
  const gap = player.width * 1.55;
  let x = player.x + behind * gap;
  if (x < 20 || x > scaledMapW - 20) x = player.x - behind * gap;
  sidekick.x = clamp(x, 20, scaledMapW - 20);
  sidekick.y = player.y;
  sidekick.trail = [];
  sidekick.walking = false;
  sidekick.facing = player.facing;
  sidekick.lastMoveAt = 0;
}

// A speech bubble that fades away on its own (not part of a conversation)
function sayAndFade(owner, text, partner, linger) {
  say(owner, text, partner);
  const b = speechBubbles[speechBubbles.length - 1];
  b.fadeStart = b.start + b.duration + (linger || 2500);
  mpSay(text, partner || 'player', owner === 'player' ? null : owner);
}

// They stop being your sidekick (optionally saying `line`) and head home
function releaseSidekick(line) {
  const sk = sidekick;
  if (!sk) return;
  sidekick = null;
  const id = sk.npc.id;
  if (sk.home === currentMapPath) {
    // Their own map: walk back to where they like to hang out
    const npc = npcOnThisMap(id) || sk.npc;
    npcRt[id] = Object.assign(newMover(sk.x, sk.y, sk.facing), {
      map: currentMapPath, seen: performance.now(), walkingHome: true
    });
    if (talkingTo && talkingTo.id === id) talkingTo = npc;
    for (const b of speechBubbles) {
      if (b.owner && b.owner.id === id) b.owner = npc;
      if (b.partner && b.partner.id === id) b.partner = npc;
    }
    if (line) sayAndFade(npc, line, 'player');
  } else {
    // Another map: out the door that leads home
    const door = exitTowards(sk.home);
    const leaver = Object.assign(newMover(sk.x, sk.y, sk.facing), {
      npc: sk.npc, char: sk.char, home: sk.home,
      tx: door ? door.x : sk.x, ty: door ? door.y : sk.y, goneAt: 0,
      seen: performance.now()
    });
    npcLeavers.push(leaver);
    if (line) sayAndFade(sk.npc, line, 'player');
  }
  mpSendPos(true);
}

// Where to walk to leave this map for `homePath`: a door straight there, else
// one back to the main camp (every room is reached from there), else any door
function exitTowards(homePath) {
  const portals = interactiveObjects.filter(o => o.targetMap);
  const pick = portals.find(o => o.targetMap === homePath)
    || portals.find(o => o.targetMap === MP_MAIN_MAP)
    || portals[0];
  if (!pick) return null;
  const d = pick.door;
  if (d) return { x: (d.px + d.pw / 2) * scaledMapW, y: (d.py + d.ph) * scaledMapH };
  return { x: pick.x + pick.width / 2, y: pick.y + pick.height * 0.8 };
}

function updateLeavers(now) {
  const LEAVE_FADE_MS = 500;
  for (const l of npcLeavers) {
    if (l.goneAt) continue;
    if (talkingTo && talkingTo.id === l.npc.id) { stepMover(l, l.x, l.y, 0); continue; }
    if (stepMover(l, l.tx, l.ty, player.speed * 0.85) < 2) l.goneAt = now;
    npcFacing[l.npc.id] = l.facing;
  }
  // Through the door: they're home (and wander there when you visit)
  npcLeavers = npcLeavers.filter(l => !l.goneAt || now - l.goneAt < LEAVE_FADE_MS);
}

function leaverAlpha(l) {
  return l.goneAt ? clamp(1 - (performance.now() - l.goneAt) / 500, 0, 1) : 1;
}

// --- The talk bar's sidekick button ---
const talkSidekick = document.getElementById('talkSidekick');

function updateSidekickButton() {
  const show = !!talkingTo && canBeSidekick(talkingTo) && !npcLeavers.some(l => l.npc.id === talkingTo.id);
  talkSidekick.hidden = !show;
  if (!show) return;
  talkSidekick.textContent = isSidekick(talkingTo) ? '👋 You can go home' : '🤝 Be my sidekick!';
  talkSidekick.classList.toggle('dismiss', isSidekick(talkingTo));
  talkSidekick.disabled = talkPhase !== 'input';
}

talkSidekick.addEventListener('click', () => {
  const npc = talkingTo;
  if (!npc || talkPhase !== 'input' || !canBeSidekick(npc)) return;
  const joining = !isSidekick(npc);
  const ask = pickOne(joining ? SIDEKICK_LINES.ask : SIDEKICK_LINES.dismiss);
  const answer = pickOne(joining ? SIDEKICK_LINES.yes : SIDEKICK_LINES.bye);
  talkInput.value = '';
  setTalkEnabled(false);
  say('player', ask, npc);
  mpSay(ask, npc);
  talkPhase = 'playerSpeaking';
  const history = conversations[npcName(npc)] || (conversations[npcName(npc)] = []);
  history.push({ speaker: 'player', text: ask });
  if (joining) makeSidekick(npc);
  else releaseSidekick();                    // (on their own map, talkingTo is now this map's copy)
  pendingReply = { npc: talkingTo, text: answer };   // shown once you've finished asking
  updateSidekickButton();
});

// --- Friends' sidekicks (multiplayer) ---
// A friend's `pos` carries `sk` when they have a sidekick; we draw that NPC
// following them, and nobody else can take it.
function mpSidekickTaken(id) {
  if (!mp.active) return false;
  for (const rp of mp.players.values()) if (rp.sk && rp.sk.npcId === id) return true;
  return false;
}
function mpSidekicksHere() {
  return mpPlayersHere().filter(rp => rp.sk).map(rp => rp.sk);
}

// --- Drawing people on the map (player + NPCs, sorted so lower = in front) ---
function drawPlayerSprite() {
  const mouth = mouthOpenFor('player');
  const draw = () => drawCharacterSprite(
    player.x - player.width / 2,
    player.y - player.height,
    player.character,
    player.frame,
    player.facing,
    SPRITE_SCALE,
    mouth,
    heldItem ? heldItem.emoji : null
  );
  if (player.rotation !== 0) {
    const cx = player.x;
    const cy = player.y - player.height / 2;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(player.rotation * Math.PI / 180);
    ctx.translate(-cx, -cy);
    draw();
    ctx.restore();
  } else {
    draw();
  }
  // Player shadow
  ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
  ctx.beginPath();
  const k = SPRITE_SCALE / BASE_SPRITE_SCALE;
  ctx.ellipse(player.x, player.y + 2, 42 * k, 15 * k, 0, 0, Math.PI * 2);
  ctx.fill();
}

// Critters are a big emoji that bobs gently, and squishes up and down
// while they're talking (their "mouth" moving).
function drawCritterSprite(npc) {
  const p = npcPos(npc);
  const s = critterSize(npc);
  const now = performance.now();
  const talk = mouthOpenFor(npc);
  const bob = Math.sin(now / 450 + p.x) * s * 0.03;
  const squish = talk ? 1 + 0.12 * talk : 1;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
  ctx.beginPath();
  ctx.ellipse(p.x, p.y, s * 0.4, s * 0.1, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.scale(2 - squish, squish);          // taller + thinner when "speaking"
  ctx.font = `${Math.round(s)}px ${SCENE_EMOJI_FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#000';                  // opaque, or Chrome fades colour emoji
  ctx.fillText(npc.emoji, 0, -s * 0.5 + bob);
  ctx.restore();
  ctx.textBaseline = 'alphabetic';
}

function drawNpcSprite(npc) {
  if (isCritter(npc)) { drawCritterSprite(npc); return; }
  const p = npcPos(npc);
  const m = npcMover(npc);
  ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
  ctx.beginPath();
  const k = SPRITE_SCALE / BASE_SPRITE_SCALE;
  ctx.ellipse(p.x + 9 * k, p.y + 2, 42 * k, 15 * k, 0, 0, Math.PI * 2);
  ctx.fill();
  drawCharacterSprite(
    p.x - player.width / 2,
    p.y - player.height,
    characterByName(npc.character),
    m ? m.frame : 0,
    npcFacing[npc.id] || 'right',
    SPRITE_SCALE,
    mouthOpenFor(npc)
  );
}

// An ex-sidekick walking out the door (fading as they go through)
function drawLeaver(l) {
  ctx.save();
  ctx.globalAlpha = leaverAlpha(l);
  drawNpcSprite(l.npc);
  ctx.restore();
}

// A friend's sidekick, following them around (see mpOnPos)
function drawFriendSidekick(sk) {
  const k = SPRITE_SCALE / BASE_SPRITE_SCALE;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
  ctx.beginPath();
  ctx.ellipse(sk.x + 9 * k, sk.y + 2, 42 * k, 15 * k, 0, 0, Math.PI * 2);
  ctx.fill();
  drawCharacterSprite(sk.x - player.width / 2, sk.y - player.height, sk.char, sk.frame,
    sk.facing, SPRITE_SCALE, mouthOpenFor(sk));
}

// "🤝 Sidekick" over your sidekick's head (and friends' sidekicks)
function drawSidekickTag(owner, label) {
  const head = speakerHead(owner);
  ctx.font = 'bold 12px "Comic Sans MS", cursive';
  ctx.textAlign = 'center';
  const w = ctx.measureText(label).width + 14;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
  roundRect(head.x - w / 2, head.top - 30, w, 20, 6);
  ctx.fill();
  ctx.fillStyle = speakerColor(owner);
  ctx.fillText(label, head.x, head.top - 16);
}

function drawNpcTalkHint(npc) {
  const head = speakerHead(npc);
  const x = head.x;
  const y = head.top - 16;
  ctx.textAlign = 'center';
  ctx.font = 'bold 13px "Comic Sans MS", cursive';
  const label = npcName(npc);
  const lw = ctx.measureText(label).width + 16;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
  roundRect(x - lw / 2, y - 14, lw, 22, 6);
  ctx.fill();
  ctx.fillStyle = speakerColor(npc);
  ctx.fillText(label, x, y + 2);

  const hint = isTouchDevice() ? '💬 [ TAP ME ]' : '💬 [ T ] Talk';
  ctx.font = '11px "Comic Sans MS", cursive';
  const hw = ctx.measureText(hint).width + 12;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
  roundRect(x - hw / 2, y - 38, hw, 18, 4);
  ctx.fill();
  ctx.fillStyle = '#FFF9C4';
  ctx.fillText(hint, x, y - 25);
}

function drawPeople() {
  const people = currentNpcs().map(npc => ({ y: npcPos(npc).y, draw: () => drawNpcSprite(npc) }));
  if (sidekick) people.push({ y: sidekick.y, draw: () => drawNpcSprite(sidekick.npc) });
  for (const l of npcLeavers) people.push({ y: l.y, draw: () => drawLeaver(l) });
  const friendSidekicks = mpSidekicksHere();
  for (const sk of friendSidekicks) people.push({ y: sk.y, draw: () => drawFriendSidekick(sk) });
  const friends = mpPlayersHere();
  for (const rp of friends) people.push({ y: rp.y, draw: () => drawRemotePlayer(rp) });
  people.push({ y: player.y, draw: drawPlayerSprite });
  if (mapBossVisible()) people.push({ y: mapBossPos().y, draw: drawMapBoss });
  people.sort((a, b) => a.y - b.y);
  for (const p of people) p.draw();
  // Hint over whoever you're next to: the Blob first, else a friend / NPC
  const showBossHint = state === GameState.PLAYING && nearBoss && !bossEngage;
  const hinting = state === GameState.PLAYING && !showBossHint ? nearbyNpc : null;
  for (const rp of friends) if (rp !== hinting) drawNameTag(rp);
  if (sidekick && hinting !== sidekick.npc && state !== GameState.TALKING) drawSidekickTag(sidekick.npc, '🤝 Sidekick');
  for (const sk of friendSidekicks) drawSidekickTag(sk, `🤝 ${sk.owner.name}'s sidekick`);
  if (showBossHint) drawMapBossHint();
  else if (hinting) drawNpcTalkHint(hinting);
}

// --- Game Logic ---
function update() {
  if (state !== GameState.PLAYING) return;
  if (devMode) return;  // freeze everything while editing hotspots

  // Hold still while a door swings open, then go through it
  if (doorOpening) {
    if (performance.now() - doorOpening.start >= DOOR_OPEN_MS) {
      const o = doorOpening.obj;
      doorOpening = null;
      switchMap(o.targetMap, o.targetHotspot);
    }
    return;
  }

  // Hold still while the Blob shouts at you, then off to the fight view
  if (bossEngage) {
    if (performance.now() - bossEngage.start >= BOSS_ENGAGE_MS) startFight();
    return;
  }

  // Movement (suppressed while backpack overlay is open — arrow keys drive selection)
  let dx = 0, dy = 0;
  player.walking = false;

  if (!backpackOpen) {
    if (keys['ArrowLeft'] || keys['a']) { dx = -player.speed; player.facing = 'left'; player.walking = true; }
    if (keys['ArrowRight'] || keys['d']) { dx = player.speed; player.facing = 'right'; player.walking = true; }
    if (keys['ArrowUp'] || keys['w']) { dy = -player.speed; player.walking = true; }
    if (keys['ArrowDown'] || keys['s']) { dy = player.speed; player.walking = true; }
  }

  // Keyboard cancels tap-to-move
  if (player.walking) {
    tapTarget = null;
  }

  // Tap-to-move: walk toward tapped map position
  if (!player.walking && tapTarget) {
    const tdx = tapTarget.x - player.x;
    const tdy = tapTarget.y - player.y;
    const dist = Math.hypot(tdx, tdy);
    if (dist < player.speed + 2) {
      tapTarget = null;
    } else {
      dx = (tdx / dist) * player.speed;
      dy = (tdy / dist) * player.speed;
      player.facing = tdx < 0 ? 'left' : 'right';
      player.walking = true;
    }
  }

  // Normalize diagonal movement
  if (dx !== 0 && dy !== 0) {
    dx *= 0.707;
    dy *= 0.707;
  }

  // Apply movement with map bounds (using scaled dimensions)
  if (mapImage) {
    player.x = Math.max(10, Math.min(scaledMapW - 10, player.x + dx));
    player.y = Math.max(10, Math.min(scaledMapH - 10, player.y + dy));
  }

  // Animation frame
  if (player.walking) {
    player.frameTimer++;
    if (player.frameTimer > 8) {
      player.frame = (player.frame + 1) % 4;
      player.frameTimer = 0;
    }
  } else {
    player.frame = 0;
    player.frameTimer = 0;
  }

  // Check for nearby interactive objects
  nearbyObject = null;
  let closestDist = Infinity;
  const px = player.x;
  const py = player.y;

  for (const obj of interactiveObjects) {
    const objCx = obj.x + obj.width / 2;
    const objCy = obj.y + obj.height / 2;
    const dist = Math.hypot(px - objCx, py - objCy);
    const threshold = Math.max(obj.width, obj.height) * 0.7 + 30;

    if (dist < threshold && dist < closestDist) {
      closestDist = dist;
      nearbyObject = obj;
    }
  }

  // Nearby friends: they turn to look at you, and the closest one can be talked to
  nearbyNpc = null;
  let npcBest = NPC_TALK_RANGE * (SPRITE_SCALE / BASE_SPRITE_SCALE);   // bigger people reach further
  for (const npc of talkablesHere()) {
    const p = speakerFeet(npc);
    const d = Math.hypot(px - p.x, py - p.y);
    if (d < 450 && !npc.remote) npcFacing[npc.id] = px < p.x ? 'left' : 'right';
    if (d < npcBest) {
      npcBest = d;
      nearbyNpc = npc;
    }
  }

  // The Blob comes and goes from its cave as it likes (and may ambush you)
  updateMapBoss();

  // Update camera to follow player
  updateCamera();
}

function updateCamera() {
  if (!mapImage) return;

  // Camera targets player center
  let targetX = player.x - canvas.width / 2;
  let targetY = player.y - canvas.height / 2;

  // Clamp camera to scaled map bounds
  targetX = Math.max(0, Math.min(scaledMapW - canvas.width, targetX));
  targetY = Math.max(0, Math.min(scaledMapH - canvas.height, targetY));

  // If the map is smaller than canvas, center it
  if (scaledMapW < canvas.width) targetX = -(canvas.width - scaledMapW) / 2;
  if (scaledMapH < canvas.height) targetY = -(canvas.height - scaledMapH) / 2;

  // Smooth camera follow
  camera.x += (targetX - camera.x) * 0.1;
  camera.y += (targetY - camera.y) * 0.1;
}

// --- Drawing ---
// mouth: 0 = smile, (0, 1] = open mouth (used to animate talking)
// `held`: emoji the character is carrying in both hands (kitchen food)
// `swordArm`: skip the front arm — the fight view draws it holding a sword
function drawCharacterSprite(x, y, char, frame, facing, scale, mouth, held, swordArm) {
  const s = scale || 1;
  const w = 30 * s;
  const h = 48 * s;

  ctx.save();

  if (facing === 'left') {
    ctx.translate(x + w / 2, 0);
    ctx.scale(-1, 1);
    ctx.translate(-(x + w / 2), 0);
  }

  // Legs
  const legOffset = Math.sin(frame * Math.PI / 2) * 4 * s;
  ctx.fillStyle = char.pantsColor;
  ctx.fillRect(x + 7 * s, y + 30 * s + legOffset, 6 * s, 18 * s);
  ctx.fillRect(x + 17 * s, y + 30 * s - legOffset, 6 * s, 18 * s);

  // Shoes
  ctx.fillStyle = '#5D4037';
  ctx.fillRect(x + 5 * s, y + 44 * s + legOffset, 10 * s, 4 * s);
  ctx.fillRect(x + 15 * s, y + 44 * s - legOffset, 10 * s, 4 * s);

  // Body
  ctx.fillStyle = char.shirtColor;
  ctx.fillRect(x + 5 * s, y + 16 * s, 20 * s, 18 * s);

  if (held) {
    // Arms bend in to carry the food in front of the tummy
    const bob = Math.abs(Math.sin(frame * Math.PI / 2)) * 1.2 * s;
    ctx.fillStyle = char.shirtColor;
    ctx.fillRect(x, y + 17 * s, 6 * s, 9 * s);
    ctx.fillRect(x + 24 * s, y + 17 * s, 6 * s, 9 * s);
    ctx.fillRect(x + 3 * s, y + 23 * s + bob, 7 * s, 5 * s);
    ctx.fillRect(x + 20 * s, y + 23 * s + bob, 7 * s, 5 * s);
    ctx.font = `${Math.round(15 * s)}px ${SCENE_EMOJI_FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#000';                 // opaque, or Chrome fades colour emoji
    ctx.fillText(held, x + 15 * s, y + 25 * s + bob);
    ctx.textBaseline = 'alphabetic';
    // hands gripping the sides
    ctx.fillStyle = '#FFCC80';
    ctx.fillRect(x + 6 * s, y + 24 * s + bob, 4 * s, 5 * s);
    ctx.fillRect(x + 20 * s, y + 24 * s + bob, 4 * s, 5 * s);
  } else {
    // Arms
    const armSwing = Math.sin(frame * Math.PI / 2) * 3 * s;
    ctx.fillStyle = char.shirtColor;
    ctx.fillRect(x, y + 17 * s + armSwing, 6 * s, 14 * s);
    if (!swordArm) ctx.fillRect(x + 24 * s, y + 17 * s - armSwing, 6 * s, 14 * s);

    // Hands
    ctx.fillStyle = '#FFCC80';
    ctx.fillRect(x, y + 29 * s + armSwing, 6 * s, 4 * s);
    if (!swordArm) ctx.fillRect(x + 24 * s, y + 29 * s - armSwing, 6 * s, 4 * s);
  }

  // Braid: drawn before the head so the head covers where it starts
  if (char.braid) drawBraid(x, y, s, char.hairColor, frame);

  // Head
  ctx.fillStyle = '#FFCC80';
  ctx.beginPath();
  ctx.arc(x + 15 * s, y + 10 * s, 10 * s, 0, Math.PI * 2);
  ctx.fill();

  // Hair
  ctx.fillStyle = char.hairColor;
  ctx.beginPath();
  ctx.arc(x + 15 * s, y + 7 * s, 10 * s, Math.PI, Math.PI * 2);
  ctx.fill();
  if (char.braid) {
    // Side of the hair sweeping back into the braid
    ctx.beginPath();
    ctx.moveTo(x + 5 * s, y + 7 * s);
    ctx.lineTo(x + 9.5 * s, y + 7 * s);
    ctx.lineTo(x + 8 * s, y + 13 * s);
    ctx.lineTo(x + 5.6 * s, y + 14 * s);
    ctx.closePath();
    ctx.fill();
  }

  // Eyes
  ctx.fillStyle = '#333';
  ctx.fillRect(x + 11 * s, y + 8 * s, 3 * s, 3 * s);
  ctx.fillRect(x + 18 * s, y + 8 * s, 3 * s, 3 * s);

  if (mouth > 0) {
    // Talking: open mouth
    ctx.fillStyle = '#6D2E2E';
    ctx.beginPath();
    ctx.ellipse(x + 15 * s, y + 14.5 * s, 3 * s, (0.6 + mouth * 2) * s, 0, 0, Math.PI * 2);
    ctx.fill();
  } else {
    // Smile
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1.5 * s;
    ctx.beginPath();
    ctx.arc(x + 15 * s, y + 12 * s, 4 * s, 0.1, Math.PI - 0.1);
    ctx.stroke();
  }

  ctx.restore();
}

// A braid down the back of the head (the side away from where they face),
// woven from alternating tilted lobes, with a pink hair tie and a little tuft.
function drawBraid(x, y, s, color, frame) {
  const sway = Math.sin(frame * Math.PI / 2) * 1.2 * s;   // swings a little while walking
  const bx = x + 5 * s;
  ctx.fillStyle = color;
  ctx.strokeStyle = 'rgba(0, 0, 0, 0.35)';
  ctx.lineWidth = 0.8 * s;
  for (let i = 0; i < 5; i++) {
    const t = i / 4;
    const side = i % 2 ? 1 : -1;
    ctx.beginPath();
    ctx.ellipse(bx + sway * t + side * 0.8 * s, y + (13 + i * 3.6) * s,
      (3.2 - t * 0.7) * s, 2.5 * s, side * 0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  }
  const ex = bx + sway, ey = y + 29.5 * s;
  ctx.beginPath();                          // tuft below the tie
