<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Camp - Louisa's Game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #2a1a0a;
    overflow: hidden;
    font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
    user-select: none;
  }
  canvas {
    display: block;
    margin: 0 auto;
  }
  #gameCanvas {
    cursor: default;
    image-rendering: auto;
  }
  /* --- Talk bar (typing what your character says to an NPC) --- */
  #talkBar {
    position: fixed;
    left: 50%;
    bottom: 16px;
    transform: translateX(-50%);
    width: min(640px, calc(100vw - 24px));
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: rgba(40, 24, 8, 0.88);
    border: 3px solid #FFD54F;
    border-radius: 16px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
    font-family: inherit;
  }
  #talkBar[hidden] { display: none; }
  #talkTo {
    flex-basis: 100%;
    color: #FFEB3B;
    font-size: 14px;
    font-weight: bold;
  }
  #talkInput {
    flex: 1 1 200px;
    min-width: 0;
    font: 18px 'Comic Sans MS', 'Chalkboard SE', cursive;
    padding: 8px 12px;
    border: 2px solid #FFF9C4;
    border-radius: 12px;
    outline: none;
    user-select: text;
  }
  #talkInput:focus { border-color: #FFD54F; box-shadow: 0 0 0 3px rgba(255, 213, 79, 0.35); }
  #talkInput:disabled { background: #eee; color: #888; }
  #talkBar button {
    font: bold 16px 'Comic Sans MS', 'Chalkboard SE', cursive;
    padding: 8px 14px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    color: white;
  }
  #talkSay { background: #4CAF50; }
  #talkSay:disabled { background: #9E9E9E; cursor: default; }
  #talkBye { background: #E57373; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<form id="talkBar" hidden autocomplete="off">
  <div id="talkTo"></div>
  <input id="talkInput" maxlength="120" placeholder="Type what you want to say…" enterkeyhint="send">
  <button id="talkSay" type="submit">Say it 💬</button>
  <button id="talkBye" type="button">Bye 👋</button>
</form>

<script>
// ============================================================
// THE CAMP - Louisa's Game
// A 2D exploration game based on Louisa's hand-drawn design
// ============================================================

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- Game State ---
const GameState = {
  LOADING: 'loading',
  CHARACTER_SELECT: 'characterSelect',
  RESUME_PROMPT: 'resumePrompt',
  PLAYING: 'playing',
  INTERACTING: 'interacting',
  ITEM_ACTION: 'itemAction',
  USING_ITEM: 'usingItem',
  CONFIRM_DIALOG: 'confirmDialog',
  TALKING: 'talking',
  FIGHTING: 'fighting'
};

let state = GameState.LOADING;
let mapImage = null;
let mapLoaded = false;

// Map scale: we render the map scaled to fit nicely on screen
// All game coordinates are in "map space" (the scaled coordinates)
// The map will be drawn at a scale so its height fits the canvas
let mapScale = 1;
let scaledMapW = 0;
let scaledMapH = 0;

function recalcMapScale() {
  if (!mapImage) return;
  // Scale map so it's about 1.4x the canvas height (allows some scrolling)
  const targetH = canvas.height * 1.4;
  mapScale = targetH / mapImage.naturalHeight;
  scaledMapW = mapImage.naturalWidth * mapScale;
  scaledMapH = mapImage.naturalHeight * mapScale;
  // Close-up maps (e.g. inside a toilet stall) can draw people bigger
  const mult = (mapConfig && mapConfig.spriteScale) || 1;
  SPRITE_SCALE = BASE_SPRITE_SCALE * mult;
  player.width = 25 * SPRITE_SCALE;
  player.height = 40 * SPRITE_SCALE;
  player.speed = 4 * Math.sqrt(mult);
  recalcInteractiveObjects();
}

// --- Canvas sizing ---
// Use visualViewport when available so iOS Safari's dynamic toolbar
// doesn't cause canvas to extend below the visible area.
function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  recalcMapScale();
}
window.addEventListener('resize', resizeCanvas);
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', resizeCanvas);
}
resizeCanvas();

// --- Map config (loaded from JSON) ---
let mapConfig = null;   // the parsed JSON for the active map

// --- Multi-map state ---
let currentMapPath = 'assets/game_design.json';
let allMapConfigs  = {};   // mapPath → config object (cached after first fetch)
let allMapSaves    = {};   // mapPath → { hotspots: {} } for non-active maps
let loadingMessage = 'Loading...';

// --- Load map config then image ---
// Convention: each map image has a sibling .json file with the same base name.
// To add a new map, drop a new image + json pair in assets/ and call loadMap().
function loadMap(jsonPath) {
  currentMapPath = jsonPath;
  state = GameState.LOADING;

  function applyConfig(config) {
    mapConfig = config;
    allMapConfigs[jsonPath] = config;
    loadingMessage = `Loading ${config.name}...`;
    loadMapImage(config).then(img => {
      mapImage = img;
      mapLoaded = true;
      recalcMapScale();
      state = GameState.CHARACTER_SELECT;
    });
  }

  fetch(jsonPath)
    .then(r => r.json())
    .then(applyConfig);
}

// --- Switch to a different map mid-game ---
// Saves current state, loads the new map, positions player at targetHotspotId.
// If targetHotspotId is null, uses the map's playerStart.
function switchMap(targetPath, targetHotspotId) {
  // Kitchen food can't leave the kitchen
  if (heldItem) {
    kitchenToast(`You leave the ${foodLabel(heldItem.id)} in the kitchen.`);
    heldItem = null;
  }
  // Stash current map's hotspot items
  allMapSaves[currentMapPath] = { hotspots: hotspotItems };
  writeSave();

  currentMapPath = targetPath;
  loadingMessage = 'Loading...';
  state = GameState.LOADING;

  fetch(targetPath)
    .then(r => r.json())
    .then(config => {
      mapConfig = config;
      allMapConfigs[targetPath] = config;
      loadingMessage = `Loading ${config.name}...`;

      // Restore or default hotspot items for the new map
      hotspotItems = restoreOrDefaultHotspots(config, allMapSaves[targetPath] || {});

      loadMapImage(config).then(img => {
        mapImage = img;
        mapLoaded = true;
        recalcMapScale();

        // Place player at the arrival hotspot: its `arrive` point if it has
        // one, else its centre (or the map's playerStart if there's no portal)
        const portal = targetHotspotId
          ? config.hotspots.find(h => h.id === targetHotspotId)
          : null;
        if (portal && portal.arrive) {
          player.x = scaledMapW * portal.arrive.px;
          player.y = scaledMapH * portal.arrive.py;
        } else if (portal) {
          player.x = scaledMapW * (portal.px + portal.pw / 2);
          player.y = scaledMapH * (portal.py + portal.ph / 2);
        } else {
          player.x = scaledMapW * config.playerStart.px;
          player.y = scaledMapH * config.playerStart.py;
        }
        nearbyObject = null;
        nearbyNpc    = null;
        speechBubbles = [];
        tapTarget    = null;
        backpackOpen = false;
        state = GameState.PLAYING;
        writeSave();  // persist new currentMap
      });
    });
}

// ============================================================
// SCENE ROOMS — maps drawn from JSON instead of an image file
// ============================================================
// A map JSON may have a `scene` object instead of an `image`. The scene is
// built into a marker-style SVG (wobbly ink outlines, streaky marker fills,
// emoji stickers), rasterised once, and then used exactly like a map image.
// All prop boxes use the same 0–1 fractions as hotspots.

// Resolves to something drawImage() accepts, with naturalWidth/naturalHeight.
function loadMapImage(config) {
  if (config.scene) return renderSceneImage(config.scene);
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = config.image;
  });
}

function renderSceneImage(scene) {
  const W = scene.width || 2400;
  const H = scene.height || 1700;
  const svg = buildSceneSvg(scene, W, H);
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
    const img = new Image();
    img.onload = () => {
      // Rasterise once so the (filter-heavy) SVG isn't re-rendered every frame
      const c = document.createElement('canvas');
      c.width = W;
      c.height = H;
      c.getContext('2d').drawImage(img, 0, 0, W, H);
      URL.revokeObjectURL(url);
      c.naturalWidth = W;
      c.naturalHeight = H;
      resolve(c);
    };
    img.onerror = (e) => { URL.revokeObjectURL(url); reject(e); };
    img.src = url;
  });
}

const SCENE_INK = '#221c1a';
const SCENE_FONT = "'Marker Felt','Chalkboard SE','Comic Sans MS',cursive";
const SCENE_EMOJI_FONT = "'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";

function svgEsc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function svgAttrs(o) {
  return Object.entries(o)
    .map(([k, v]) => `${k}="${typeof v === 'number' ? Math.round(v * 10) / 10 : svgEsc(v)}"`)
    .join(' ');
}

// A "pen" collects SVG into three layers:
//   fill — marker colour (slightly wobbled one way)
//   ink  — black outlines + handwriting (wobbled a different way, so the
//          colour sits a little off the lines, like real colouring-in)
//   top  — crisp emoji stickers
function scenePen(S) {
  const fill = [], ink = [], top = [];
  const SW = 7 * S;
  function shape(tag, a, color, o = {}) {
    if (color) fill.push(`<${tag} ${svgAttrs(a)} fill="${color}"${o.opacity ? ` opacity="${o.opacity}"` : ''}/>`);
    if (o.ink !== false) {
      ink.push(`<${tag} ${svgAttrs(a)} fill="none" stroke="${o.stroke || SCENE_INK}" ` +
        `stroke-width="${(o.sw || 1) * SW}" stroke-linecap="round" stroke-linejoin="round"/>`);
    }
  }
  const pen = {
    S, fill, ink, top,
    rect(x, y, w, h, color, o = {}) { shape('rect', { x, y, width: w, height: h, rx: o.r || 0 }, color, o); },
    circle(cx, cy, r, color, o) { shape('circle', { cx, cy, r }, color, o); },
    ellipse(cx, cy, rx, ry, color, o) { shape('ellipse', { cx, cy, rx, ry }, color, o); },
    path(d, color, o) { shape('path', { d }, color, o); },
    poly(points, color, o) {
      shape('polygon', { points: points.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' ') }, color, o);
    },
    line(x1, y1, x2, y2, o = {}) {
      (o.layer === 'fill' ? fill : ink).push(`<line ${svgAttrs({ x1, y1, x2, y2 })} stroke="${o.stroke || SCENE_INK}" ` +
        `stroke-width="${(o.sw || 1) * SW}" stroke-linecap="round"${o.opacity ? ` opacity="${o.opacity}"` : ''}` +
        `${o.dash ? ` stroke-dasharray="${o.dash}"` : ''}/>`);
    },
    star(cx, cy, r, color, o) {
      const pts = [];
      for (let i = 0; i < 10; i++) {
        const a = -Math.PI / 2 + i * Math.PI / 5;
        const rr = i % 2 ? r * 0.45 : r;
        pts.push([cx + rr * Math.cos(a), cy + rr * Math.sin(a)]);
      }
      pen.poly(pts, color, o);
    },
    crescent(cx, cy, r, color, o) {
      pen.path(`M ${cx} ${cy - r} A ${r} ${r} 0 1 0 ${cx} ${cy + r} A ${r * 0.7} ${r} 0 1 1 ${cx} ${cy - r} Z`, color, o);
    },
    // layer:'top' keeps text crisp (no wobble) — needed when it contains emoji
    text(x, y, str, o = {}) {
      (o.layer === 'top' ? top : ink).push(`<text ${svgAttrs({ x, y })} font-family="${SCENE_FONT}" font-size="${o.size || 40 * S}" ` +
        `font-weight="${o.weight || 'bold'}" fill="${o.color || SCENE_INK}" text-anchor="${o.anchor || 'middle'}" ` +
        `dominant-baseline="central">${svgEsc(str)}</text>`);
    },
    // under:true puts the emoji in the fill layer so later shapes can hide part of it
    emoji(x, y, ch, size, o = {}) {
      const tf = [];
      if (o.flip) tf.push(`translate(${x * 2} 0) scale(-1 1)`);
      if (o.rotate) tf.push(`rotate(${o.rotate} ${x} ${y})`);
      (o.under ? fill : top).push(`<text ${svgAttrs({ x, y })} font-family="${SCENE_EMOJI_FONT}" font-size="${size}" ` +
        `text-anchor="middle" dominant-baseline="central"${o.opacity ? ` opacity="${o.opacity}"` : ''}` +
        `${tf.length ? ` transform="${tf.join(' ')}"` : ''}>${svgEsc(ch)}</text>`);
    },
    group(transform, fn) {
      for (const L of [fill, ink, top]) L.push(`<g transform="${transform}">`);
      fn();
      for (const L of [fill, ink, top]) L.push('</g>');
    }
  };
  return pen;
}

// --- Room shell: ceiling, back wall, floor ---
function drawSceneCeiling(p, W, h, c) {
  const S = p.S;
  p.rect(0, 0, W, h, c.color || '#7a4a2a', { ink: false });
  // Diagonal roof stripes, like the striped roof in Louisa's drawing
  for (let x = -h; x < W; x += 46 * S) p.line(x, h, x + h * 0.9, 0, { sw: 0.5, stroke: c.stripe || '#4a2a14' });
  p.line(0, h, W, h, { sw: 1.2 });
}

function drawSceneWall(p, y0, W, h, c) {
  const S = p.S;
  const faint = { sw: 0.35, stroke: 'rgba(0,0,0,0.3)' };
  p.rect(0, y0, W, h, c.color || '#e3ecb4', { ink: false });
  const pattern = c.pattern || 'blocks';
  if (pattern === 'blocks') {
    const bh = 64 * S, bw = 150 * S;
    for (let r = 0, y = y0; y < y0 + h; r++, y += bh) {
      if (y > y0) p.line(0, y, W, y, faint);
      for (let x = (r % 2) * bw / 2; x < W; x += bw) p.line(x, y, x, Math.min(y + bh, y0 + h), faint);
    }
  } else if (pattern === 'planks') {
    for (let y = y0 + 70 * S; y < y0 + h; y += 70 * S) p.line(0, y, W, y, faint);
  } else if (pattern === 'canvas') {
    for (let x = 220 * S; x < W; x += 220 * S) {
      p.path(`M ${x} ${y0} Q ${x + 18 * S} ${y0 + h / 2} ${x} ${y0 + h}`, null, faint);
    }
  }
}

function drawSceneFloor(p, y0, W, h, c) {
  const S = p.S;
  p.rect(0, y0, W, h, c.color || '#cbc5ba', { ink: false });
  const pattern = c.pattern || 'concrete';
  const faint = { sw: 0.4, stroke: 'rgba(0,0,0,0.25)' };
  if (pattern === 'concrete') {
    // expansion joints + a few cracks + speckles
    for (let x = 400 * S; x < W; x += 400 * S) p.line(x, y0, x - 30 * S, y0 + h, faint);
    p.line(0, y0 + h * 0.55, W, y0 + h * 0.55, faint);
    const cracks = [[0.22, 0.30], [0.63, 0.82], [0.80, 0.25]];
    for (const [fx, fy] of cracks) {
      const x = fx * W, y = y0 + fy * h;
      p.path(`M ${x} ${y} l ${30 * S} ${12 * S} l ${14 * S} ${26 * S} m ${-14 * S} ${-26 * S} l ${36 * S} ${-6 * S}`, null, { sw: 0.4 });
    }
    let seed = 7;
    const rand = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    for (let i = 0; i < 120; i++) p.circle(rand() * W, y0 + rand() * h, (2 + rand() * 3) * S, 'rgba(0,0,0,0.18)', { ink: false });
  } else if (pattern === 'tiles') {
    const t = 110 * S;
    for (let y = y0 + t; y < y0 + h; y += t) p.line(0, y, W, y, faint);
    for (let x = t; x < W; x += t) p.line(x, y0, x, y0 + h, faint);
  } else if (pattern === 'planks') {
    for (let y = y0 + 60 * S, r = 0; y < y0 + h; y += 60 * S, r++) {
      p.line(0, y, W, y, faint);
      for (let x = (r % 3) * 180 * S; x < W; x += 540 * S) p.line(x, y - 60 * S, x, y, faint);
    }
  }
  // skirting board where wall meets floor
  p.rect(0, y0 - 10 * S, W, 20 * S, c.skirting || '#8b5a2b');
}

// --- Prop library. Each gets (pen, box in px, prop JSON). ---
const SCENE_PROPS = {
  emoji(p, b, o) {
    p.emoji(b.x + b.w / 2, b.y + b.h / 2, o.emoji, b.h, o);
  },

  sign(p, b, o) {
    const S = p.S;
    const lines = String(o.text || '').split('\n');
    const maxLen = Math.max(...lines.map(l => l.length), 1);
    const size = Math.min(b.h / (lines.length * 1.3), b.w / (maxLen * 0.72));
    const draw = () => {
      p.rect(b.x, b.y, b.w, b.h, o.color || '#fff8dc', { r: 8 * S, sw: 0.8 });
      if (o.tape !== false) {
        p.rect(b.x - 8 * S, b.y - 8 * S, 46 * S, 18 * S, 'rgba(230,210,150,0.85)', { ink: false });
        p.rect(b.x + b.w - 38 * S, b.y - 8 * S, 46 * S, 18 * S, 'rgba(230,210,150,0.85)', { ink: false });
      }
      lines.forEach((l, i) => p.text(b.x + b.w / 2, b.y + b.h / 2 + (i - (lines.length - 1) / 2) * size * 1.2, l,
        { size, color: o.textColor }));
    };
    o.rotate ? p.group(`rotate(${o.rotate} ${b.x + b.w / 2} ${b.y + b.h / 2})`, draw) : draw();
  },

  // Screen door with the night outside showing through the mesh
  door(p, b, o) {
    const { x, y, w, h } = b, S = p.S;
    p.rect(x, y, w, h, o.color || '#8b5a2b', { r: 4 * S });
    const m = w * 0.13;
    for (const [py, ph] of [[y + m, h * 0.42 - m], [y + h * 0.5, h * 0.5 - m]]) {
      p.rect(x + m, py, w - 2 * m, ph, o.outside || '#2f4a6d', { sw: 0.6 });
      p.rect(x + m, py, w - 2 * m, ph, 'url(#mesh)', { ink: false });
    }
    p.star(x + w * 0.36, y + h * 0.15, w * 0.08, '#f6a623', { stroke: '#6a3fb5', sw: 0.5 });
    p.star(x + w * 0.66, y + h * 0.30, w * 0.06, '#f6a623', { stroke: '#6a3fb5', sw: 0.5 });
    p.circle(x + w * 0.6, y + h * 0.8, w * 0.03, '#fff59d', { ink: false });   // firefly
    p.circle(x + w * 0.4, y + h * 0.68, w * 0.025, '#fff59d', { ink: false });
    // hinges, handle, long door spring
    for (const hy of [0.12, 0.85]) p.rect(x - 4 * S, y + h * hy, w * 0.1, h * 0.05, '#9e9e9e', { sw: 0.5 });
    p.circle(x + w - m * 0.5, y + h * 0.46, w * 0.05, '#d9d9d9', { sw: 0.6 });
    let d = `M ${x + m * 0.5} ${y + h * 0.46}`;
    const n = 14;
    for (let i = 1; i <= n; i++) d += ` L ${x + m * 0.5 + (w - m * 1.4) * i / n} ${y + h * 0.46 + (i % 2 ? -1 : 1) * 7 * S}`;
    p.path(d, null, { sw: 0.4, stroke: '#555' });
  },

  mat(p, b, o) {
    p.rect(b.x, b.y, b.w, b.h, o.color || '#c0392b', { r: 10 * p.S, sw: 0.7 });
    for (let i = 1; i < 6; i++) p.line(b.x + b.w * i / 6, b.y + 6 * p.S, b.x + b.w * i / 6, b.y + b.h - 6 * p.S,
      { sw: 0.3, stroke: 'rgba(0,0,0,0.35)' });
    if (o.text) p.text(b.x + b.w / 2, b.y + b.h / 2, o.text, { size: b.h * 0.5, color: '#fff3c4' });
  },

  window(p, b, o) {
    const { x, y, w, h } = b, S = p.S;
    p.rect(x - 10 * S, y - 10 * S, w + 20 * S, h + 20 * S, o.color || '#8b5a2b', { r: 6 * S });
    p.rect(x, y, w, h, o.sky || '#253a6b', { sw: 0.6 });
    p.crescent(x + w * 0.72, y + h * 0.3, h * 0.17, '#ffe082', { sw: 0.6 });
    p.star(x + w * 0.25, y + h * 0.28, h * 0.11, '#f6a623', { stroke: '#7e57c2', sw: 0.6 });
    p.star(x + w * 0.42, y + h * 0.72, h * 0.08, '#f6a623', { stroke: '#7e57c2', sw: 0.6 });
    p.line(x + w / 2, y, x + w / 2, y + h, { sw: 0.8 });
    p.line(x, y + h / 2, x + w, y + h / 2, { sw: 0.8 });
    p.rect(x - 18 * S, y + h + 8 * S, w + 36 * S, 16 * S, o.color || '#8b5a2b');
  },

  // Bare bulb hanging from the ceiling, with a warm glow
  bulb(p, b, o) {
    const { x, y, w, h } = b, cx = x + w / 2, S = p.S;
    p.circle(cx, y + h * 0.8, w * 3, 'url(#glow)', { ink: false });
    p.line(cx, y, cx, y + h * 0.55, { sw: 0.5 });
    p.rect(cx - w * 0.18, y + h * 0.5, w * 0.36, h * 0.14, '#9e9e9e', { sw: 0.6 });
    p.circle(cx, y + h * 0.8, w * 0.3, o.color || '#ffe066', { sw: 0.8 });
    for (const a of [-40, 0, 40, 140, 180, 220]) {
      const r = (a * Math.PI) / 180, r1 = w * 0.45, r2 = w * 0.65;
      p.line(cx + Math.cos(r) * r1, y + h * 0.8 + Math.sin(r) * r1, cx + Math.cos(r) * r2, y + h * 0.8 + Math.sin(r) * r2,
        { sw: 0.45, stroke: '#e0a800' });
    }
  },

  cobweb(p, b, o) {
    const S = p.S;
    const draw = () => {
      const { x, y, w, h } = b;
      const grey = { sw: 0.3, stroke: '#666' };
      const spokes = 5, rings = 4;
      const pts = [];
      for (let i = 0; i < spokes; i++) {
        const a = (Math.PI / 2) * i / (spokes - 1);
        p.line(x, y, x + Math.cos(a) * w, y + Math.sin(a) * h, grey);
        pts.push(a);
      }
      for (let k = 1; k <= rings; k++) {
        const f = k / rings;
        let d = '';
        for (let i = 0; i < spokes; i++) {
          const px = x + Math.cos(pts[i]) * w * f, py = y + Math.sin(pts[i]) * h * f;
          if (i === 0) d = `M ${px} ${py}`;
          else {
            const mid = (pts[i] + pts[i - 1]) / 2;
            d += ` Q ${x + Math.cos(mid) * w * f * 0.8} ${y + Math.sin(mid) * h * f * 0.8} ${px} ${py}`;
          }
        }
        p.path(d, null, grey);
      }
      if (o.spider) {
        const sx = x + w * 0.45, sy = y + h * 1.25;
        p.line(sx, y + h * 0.4, sx, sy - h * 0.12, grey);
        p.emoji(sx, sy, '🕷️', h * 0.38);
      }
    };
    o.corner === 'tr' ? p.group(`translate(${2 * b.x} 0) scale(-1 1)`, draw) : draw();
  },

  mirror(p, b, o) {
    const { x, y, w, h } = b, S = p.S;
    p.rect(x, y, w, h, o.frame || '#9e9e9e', { r: 10 * S });
    p.rect(x + 14 * S, y + 14 * S, w - 28 * S, h - 28 * S, o.color || '#cdeefa', { r: 6 * S, sw: 0.6 });
    p.line(x + w * 0.12, y + h * 0.75, x + w * 0.3, y + h * 0.22, { layer: 'fill', stroke: '#fff', sw: 2.2, opacity: 0.85 });
    p.line(x + w * 0.2, y + h * 0.78, x + w * 0.36, y + h * 0.36, { layer: 'fill', stroke: '#fff', sw: 1.2, opacity: 0.85 });
  },

  // A counter of wall-mounted sinks with exposed pipes
  sinks(p, b, o) {
    const { x, y, w, h } = b, S = p.S;
    const n = o.count || 2;
    const topH = h * 0.16;
    for (let i = 0; i < n; i++) {
      const cx = x + w * (i + 0.5) / n;
      const bw = w / n * 0.34;
      p.rect(cx - 8 * S, y + topH, 16 * S, h - topH, '#a6a6a6', { sw: 0.6 });                // drain pipe
      p.path(`M ${cx - bw} ${y + topH} Q ${cx - bw} ${y + topH + h * 0.26} ${cx} ${y + topH + h * 0.26} ` +
        `Q ${cx + bw} ${y + topH + h * 0.26} ${cx + bw} ${y + topH} Z`, '#f4f4f4');           // basin
    }
    p.poly([[x, y + topH], [x + w * 0.06, y + topH], [x, y + topH + h * 0.25]], '#8b5a2b', { sw: 0.7 });
    p.poly([[x + w, y + topH], [x + w * 0.94, y + topH], [x + w, y + topH + h * 0.25]], '#8b5a2b', { sw: 0.7 });
    p.rect(x, y, w, topH, o.color || '#e6dcc6', { r: 6 * S });
    for (let i = 0; i < n; i++) {
      const cx = x + w * (i + 0.5) / n;
      const bw = w / n * 0.34;
      p.ellipse(cx, y + topH * 0.55, bw * 0.85, topH * 0.3, '#9fd3e6', { sw: 0.6 });
      p.rect(cx - 7 * S, y - h * 0.16, 14 * S, h * 0.18, '#bdbdbd', { sw: 0.6 });             // faucet
      p.rect(cx - 7 * S, y - h * 0.18, bw * 0.55, 14 * S, '#bdbdbd', { r: 6 * S, sw: 0.6 });
      p.circle(cx - bw * 0.55, y - h * 0.04, 13 * S, '#e53935', { sw: 0.6 });                // hot
      p.circle(cx + bw * 0.55, y - h * 0.04, 13 * S, '#1e88e5', { sw: 0.6 });                // cold
      if (i === 0) p.path(`M ${cx + bw * 0.5} ${y - h * 0.11} q ${-8 * S} ${14 * S} 0 ${18 * S} q ${8 * S} ${-4 * S} 0 ${-18 * S} Z`,
        '#4fc3f7', { sw: 0.4, stroke: '#1976d2' });                                          // drip
    }
  },

  dryer(p, b, o) {
    const { x, y, w, h } = b, S = p.S;
    p.rect(x, y, w, h * 0.75, o.color || '#e0e0e0', { r: 14 * S });
    p.rect(x + w * 0.35, y + h * 0.75, w * 0.3, h * 0.13, '#bdbdbd', { r: 4 * S, sw: 0.7 });
    p.circle(x + w / 2, y + h * 0.42, w * 0.17, '#e53935', { sw: 0.7 });
    p.text(x + w / 2, y + h * 0.15, 'PUSH', { size: h * 0.13 });
    for (const dx of [-0.2, 0, 0.2]) {
      p.path(`M ${x + w * (0.5 + dx)} ${y + h * 0.92} q ${6 * S} ${10 * S} 0 ${20 * S} q ${-6 * S} ${10 * S} 0 ${20 * S}`,
        null, { sw: 0.35, stroke: '#78909c' });
    }
  },

  // A bank of toilet stalls. doors: [{ label, color, sign, occupied, feet }]
  stalls(p, b, o) {
    const { x, y, w, h } = b, S = p.S;
    const doors = o.doors || [{}, {}, {}];
    const n = doors.length;
    const postW = w * 0.022;
    const slotW = (w - postW * (n + 1)) / n;
    const doorTop = y + h * 0.07, doorBot = y + h * 0.84;
    p.rect(x, y, w, h * 0.04, '#9e9e9e', { sw: 0.7 });                                         // top rail
    doors.forEach((d, i) => {
      const sx = x + postW + i * (slotW + postW);
      p.rect(sx, doorBot, slotW, y + h - doorBot, '#8a857c', { sw: 0.4 });                    // gap under door
      p.rect(sx, doorTop, slotW, doorBot - doorTop, d.color || o.color || '#8dbb2a', { sw: 0.9 });
      // round window with a crescent moon, like the doors in the drawing
      p.circle(sx + slotW / 2, doorTop + h * 0.16, slotW * 0.2, '#3fb6d9', { sw: 0.8 });
      p.crescent(sx + slotW / 2 - slotW * 0.02, doorTop + h * 0.16, slotW * 0.12, '#fff59d', { sw: 0.4 });
      if (d.label) p.text(sx + slotW / 2, doorTop + h * 0.045, d.label, { size: h * 0.05 });
      p.rect(sx + slotW * 0.8, doorTop + h * 0.38, slotW * 0.1, h * 0.05,
        d.occupied ? '#e53935' : '#43a047', { r: 4 * S, sw: 0.5 });                         // lock indicator
      for (const hy of [0.1, 0.85]) p.rect(sx - 3 * S, doorTop + (doorBot - doorTop) * hy, slotW * 0.08, h * 0.03, '#bdbdbd', { sw: 0.4 });
      if (d.sign) {
        SCENE_PROPS.sign(p, { x: sx + slotW * 0.1, y: doorTop + h * 0.5, w: slotW * 0.8, h: h * 0.13 },
          { text: d.sign, rotate: d.signRotate ?? -5, color: '#fffdf5', textColor: '#d32f2f' });
      }
      if (d.feet) {
        const fy = doorBot + (y + h - doorBot) * 0.6;
        p.emoji(sx + slotW * 0.3, fy, '👟', (y + h - doorBot) * 0.6);
        p.emoji(sx + slotW * 0.7, fy, '👟', (y + h - doorBot) * 0.6);
      }
    });
    for (let i = 0; i <= n; i++) p.rect(x + i * (slotW + postW), y, postW, h, o.post || '#b0a99a', { sw: 0.7 });
  },

  shower(p, b, o) {
    const { x, y, w, h } = b, S = p.S;
    const faint = { sw: 0.3, stroke: 'rgba(0,0,0,0.25)' };
    p.rect(x, y, w, h, o.tile || '#cfe8ef', { sw: 0.9 });
    const t = 56 * S;
    for (let ty = y + t; ty < y + h * 0.88; ty += t) p.line(x, ty, x + w, ty, faint);
    for (let tx = x + t; tx < x + w; tx += t) p.line(tx, y, tx, y + h * 0.88, faint);
    p.rect(x, y + h * 0.88, w, h * 0.12, '#b5cfd6', { sw: 0.6 });                              // shower tray
    p.ellipse(x + w * 0.65, y + h * 0.94, w * 0.06, h * 0.022, '#7d8a8e', { sw: 0.5 });
    // pipe + head + water
    const hx = x + w * 0.7;
    p.rect(hx - 7 * S, y, 14 * S, h * 0.15, '#bdbdbd', { sw: 0.5 });
    p.path(`M ${hx - w * 0.1} ${y + h * 0.2} L ${hx - 10 * S} ${y + h * 0.14} L ${hx + 10 * S} ${y + h * 0.14} L ${hx + w * 0.1} ${y + h * 0.2} Z`,
      '#9e9e9e', { sw: 0.6 });
    for (let i = -3; i <= 3; i++) {
      p.line(hx + i * w * 0.028, y + h * 0.23, hx + i * w * 0.05, y + h * 0.84,
        { layer: 'fill', stroke: '#4fc3f7', sw: 0.8, dash: `${30 * S} ${22 * S}` });
    }
    // little shelf of shampoo
    p.rect(x + w * 0.08, y + h * 0.42, w * 0.24, h * 0.025, '#bdbdbd', { sw: 0.5 });
    p.emoji(x + w * 0.14, y + h * 0.385, '🧴', h * 0.065);
    p.emoji(x + w * 0.25, y + h * 0.385, '🧴', h * 0.055, { rotate: 8 });
    // curtain rod + curtain (purple with orange stars, Louisa's favourite colours)
    p.line(x - 10 * S, y + h * 0.06, x + w + 10 * S, y + h * 0.06, { sw: 1.2, stroke: '#757575' });
    const cw = w * (o.curtainOpen ?? 0.45);
    let d = `M ${x} ${y + h * 0.06} L ${x + cw} ${y + h * 0.06} L ${x + cw + w * 0.04} ${y + h * 0.86}`;
    const waves = 4;
    for (let i = 1; i <= waves; i++) {
      const wx = x + cw + w * 0.04 - (cw + w * 0.04) * i / waves;
      d += ` Q ${wx + (cw / waves) * 0.5} ${y + h * (i % 2 ? 0.9 : 0.83)} ${wx} ${y + h * 0.86}`;
    }
    d += ' Z';
    p.path(d, o.curtain || '#7e57c2', { sw: 0.9 });
    for (let i = 1; i < 4; i++) p.line(x + cw * i / 4, y + h * 0.08, x + cw * i / 4 + 6 * S, y + h * 0.84, { sw: 0.35 });
    for (const [fx, fy] of [[0.1, 0.25], [0.3, 0.45], [0.12, 0.66], [0.33, 0.78]]) {
      p.star(x + w * fx, y + h * fy, w * 0.05, '#f6a623', { stroke: '#4a148c', sw: 0.4 });
    }
    for (let i = 0; i <= 6; i++) p.circle(x + cw * i / 6, y + h * 0.06, 9 * S, '#bdbdbd', { sw: 0.4 });
  },

  bench(p, b, o) {
    const { x, y, w, h } = b, S = p.S;
    const wood = o.color || '#a0673a';
    for (const lx of [0.08, 0.86]) p.rect(x + w * lx, y + h * 0.3, w * 0.06, h * 0.7, '#7a4a2a', { sw: 0.7 });
    p.rect(x, y, w, h * 0.32, wood, { r: 6 * S });
    p.line(x + 10 * S, y + h * 0.16, x + w - 10 * S, y + h * 0.16, { sw: 0.35 });
    if (o.towel) {
      const tx = x + w * 0.58, tw = w * 0.2;
      p.path(`M ${tx} ${y - 6 * S} L ${tx + tw} ${y - 6 * S} L ${tx + tw + 6 * S} ${y + h * 0.78} L ${tx - 4 * S} ${y + h * 0.74} Z`,
        o.towel, { sw: 0.7 });
      for (const f of [0.25, 0.5, 0.75]) {
        p.line(tx + tw * f - 2 * S, y + h * 0.05, tx + tw * f, y + h * 0.7, { layer: 'fill', stroke: '#fff', sw: 1.2, opacity: 0.8 });
      }
    }
  },

  // Open cardboard box; `peek` emojis poke out of the top
  box(p, b, o) {
    const { x, y, w, h } = b, S = p.S;
    const top = y + h * 0.3;
    p.poly([[x, top], [x + w * 0.12, top - h * 0.1], [x + w * 0.88, top - h * 0.1], [x + w, top]], '#7a4f27', { sw: 0.6 });
    (o.peek || []).forEach((e, i, arr) => {
      p.emoji(x + w * (i + 0.5) / arr.length, top - h * 0.06, e, h * 0.36, { under: true, rotate: (i % 2 ? 12 : -10) });
    });
    p.poly([[x, top], [x - w * 0.16, top - h * 0.2], [x + w * 0.06, top - h * 0.22], [x + w * 0.12, top - h * 0.1]], '#d9a66b', { sw: 0.6 });
    p.poly([[x + w, top], [x + w * 1.14, top - h * 0.24], [x + w * 0.96, top - h * 0.26], [x + w * 0.88, top - h * 0.1]], '#d9a66b', { sw: 0.6 });
    p.rect(x, top, w, y + h - top, o.color || '#c8955a', { sw: 0.8 });
    p.rect(x + w * 0.42, top, w * 0.16, (y + h - top) * 0.35, 'rgba(230,210,150,0.85)', { ink: false });
    const lines = String(o.label || '').split('\n').filter(Boolean);
    lines.forEach((l, i) => p.text(x + w / 2, top + (y + h - top) * (0.5 + (i - (lines.length - 1) / 2) * 0.28), l,
      { size: (y + h - top) * 0.22 }));
  },

  // Campground trash can; `peek` emoji lifts the lid
  trashCan(p, b, o) {
    const { x, y, w, h } = b, S = p.S;
    const top = y + h * 0.28;
    if (o.peek) p.emoji(x + w * 0.55, top - h * 0.13, o.peek, h * 0.34, { under: true });
    p.path(`M ${x} ${top} L ${x + w} ${top} L ${x + w * 0.92} ${y + h} L ${x + w * 0.08} ${y + h} Z`, o.color || '#5d7f5a', { sw: 0.9 });
    for (const f of [0.25, 0.5, 0.75]) p.line(x + w * f, top + h * 0.08, x + w * (0.5 + (f - 0.5) * 0.9), y + h - h * 0.06, { sw: 0.35 });
    if (o.label) {
      p.rect(x + w * 0.12, top + h * 0.22, w * 0.76, h * 0.17, '#fff8dc', { r: 4 * S, sw: 0.5 });
      p.text(x + w / 2, top + h * 0.305, o.label, { size: h * 0.075 });
    }
    p.group(`rotate(${o.peek ? -40 : 0} ${x} ${top})`, () => {
      p.rect(x - w * 0.06, top - h * 0.07, w * 1.12, h * 0.07, o.color || '#5d7f5a', { r: 6 * S });
      p.rect(x + w * 0.4, top - h * 0.11, w * 0.2, h * 0.04, '#424242', { r: 4 * S, sw: 0.5 });
    });
  },

  mopBucket(p, b, o) {
    const { x, y, w, h } = b, S = p.S;
    p.group(`rotate(-12 ${x + w * 0.5} ${y + h * 0.6})`, () => {
      p.rect(x + w * 0.46, y, w * 0.08, h * 0.62, '#a0673a', { sw: 0.5 });
    });
    for (let i = 0; i < 7; i++) p.line(x + w * 0.3 + i * w * 0.07, y + h * 0.5, x + w * 0.25 + i * w * 0.09, y + h * 0.66, { sw: 0.5, stroke: '#9e9e9e' });
    p.path(`M ${x} ${y + h * 0.55} L ${x + w} ${y + h * 0.55} L ${x + w * 0.9} ${y + h} L ${x + w * 0.1} ${y + h} Z`,
      o.color || '#fdd835', { sw: 0.8 });
    p.ellipse(x + w / 2, y + h * 0.55, w * 0.5, h * 0.04, '#90caf9', { sw: 0.6 });
  },

  drain(p, b) {
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    p.ellipse(cx, cy, b.w / 2, b.h / 2, '#8d8d8d', { sw: 0.6 });
    for (const f of [-0.5, 0, 0.5]) p.line(cx + f * b.w * 0.6, cy - b.h * 0.3, cx + f * b.w * 0.6, cy + b.h * 0.3, { sw: 0.4 });
  },

  puddle(p, b, o) {
    const { x, y, w, h } = b;
    p.path(`M ${x + w * 0.1} ${y + h * 0.5} Q ${x} ${y} ${x + w * 0.4} ${y + h * 0.1} Q ${x + w * 0.7} ${y - h * 0.1} ` +
      `${x + w * 0.9} ${y + h * 0.3} Q ${x + w * 1.05} ${y + h * 0.8} ${x + w * 0.6} ${y + h * 0.9} ` +
      `Q ${x + w * 0.2} ${y + h * 1.05} ${x + w * 0.1} ${y + h * 0.5} Z`,
      o.color || 'rgba(120,200,240,0.6)', { sw: 0.4, stroke: '#4a9fd0' });
  },

  // Wet footprints walking from the box's top-right corner to its bottom-left
  footprints(p, b, o) {
    const S = p.S;
    const steps = o.steps || 6;
    const x1 = b.x + b.w, y1 = b.y, x2 = b.x, y2 = b.y + b.h;
    const ang = Math.atan2(y2 - y1, x2 - x1);
    const deg = (ang * 180) / Math.PI + 90;
    for (let i = 0; i < steps; i++) {
      const f = (i + 0.5) / steps;
      const side = i % 2 ? 1 : -1;
      const fx = x1 + (x2 - x1) * f + Math.cos(ang + Math.PI / 2) * side * 16 * S;
      const fy = y1 + (y2 - y1) * f + Math.sin(ang + Math.PI / 2) * side * 16 * S;
      // local -y is the walking direction after this rotation, so toes go at -y
      p.group(`rotate(${deg} ${fx} ${fy})`, () => {
        const wet = 'rgba(70,130,170,0.35)';
        p.ellipse(fx, fy, 11 * S, 19 * S, wet, { ink: false });
        for (let t = -2; t <= 2; t++) p.circle(fx + t * 5.5 * S, fy - 25 * S + Math.abs(t) * 3 * S, (t === 0 ? 4.5 : 3.5) * S, wet, { ink: false });
      });
    }
  },

  // --- Stall interiors ---

  // A stall partition seen in perspective. The box is the wall's footprint
  // across the scene: its outer edge is the scene edge (runs from `outerTop`
  // to the bottom of the scene) and its inner edge meets the back wall
  // (box top..bottom). Partitions stop short of the floor (`gap`), and
  // `peek` emojis (e.g. a neighbour's sneakers) show in that gap.
  // `door`: { t0, t1, color, latch: 'locked'|'open', hang } — t is 0 at the
  // outer edge, 1 at the inner edge.
  sideWall(p, b, o) {
    const S = p.S;
    const right = o.side === 'right';
    const xo = right ? b.x + b.w : b.x, xi = right ? b.x : b.x + b.w;
    const topO = (o.outerTop ?? -0.06) * b.H, topI = b.y;
    const floorO = b.H, floorI = b.y + b.h;
    const g = o.gap ?? 0.1;
    const lerp = (a, c, t) => a + (c - a) * t;
    const X = t => lerp(xo, xi, t);
    const Top = t => lerp(topO, topI, t);
    const Floor = t => lerp(floorO, floorI, t);
    const Bot = t => Floor(t) - g * (Floor(t) - Top(t));   // bottom edge of the partition

    p.poly([[X(0), Bot(0)], [X(1), Bot(1)], [X(1), Floor(1)], [X(0), Floor(0)]], o.gapColor || '#a59f94', { sw: 0.4 });
    p.poly([[X(0), Top(0)], [X(1), Top(1)], [X(1), Bot(1)], [X(0), Bot(0)]], o.color || '#cfc6b0', { sw: 1 });
    // faint panel seams
    for (const t of [0.35, 0.7]) p.line(X(t), Top(t) + 10 * S, X(t), Bot(t) - 10 * S, { sw: 0.3, stroke: 'rgba(0,0,0,0.2)' });

    const d = o.door;
    if (d) {
      const t0 = d.t0 ?? 0.1, t1 = d.t1 ?? 0.7, tm = (t0 + t1) / 2;
      const m = t => Top(t) + 0.04 * (Bot(t) - Top(t));
      p.poly([[X(t0), m(t0)], [X(t1), m(t1)], [X(t1), Bot(t1)], [X(t0), Bot(t0)]], d.color || '#8dbb2a', { sw: 1 });
      // round window with a moon, squashed by the perspective
      const cx = X(tm), cy = lerp(m(tm), Bot(tm), 0.2);
      const ry = (Bot(tm) - m(tm)) * 0.08, rx = Math.abs(X(t1) - X(t0)) * 0.16;
      p.ellipse(cx, cy, rx, ry, '#3fb6d9', { sw: 0.8 });
      p.group(`translate(${cx} ${cy}) scale(${rx / ry} 1) translate(${-cx} ${-cy})`, () => {
        p.crescent(cx - ry * 0.1, cy, ry * 0.6, '#fff59d', { sw: 0.4 });
      });
      // latch on the free edge
      const tl = t1 - (t1 - t0) * 0.1, ly = lerp(m(tl), Bot(tl), 0.45);
      const lh = (Bot(tl) - m(tl)) * 0.05;
      p.rect(X(tl) - lh * 0.5, ly - lh, lh, lh * 2, d.latch === 'locked' ? '#e53935' : '#43a047', { r: 4 * S, sw: 0.5 });
      // coat hook (with something hanging on it)
      if (d.hang) {
        const th = lerp(t0, t1, 0.4), hy = lerp(m(th), Bot(th), 0.42);
        p.circle(X(th), hy, 9 * S, '#9e9e9e', { sw: 0.5 });
        p.emoji(X(th), hy + (Bot(th) - m(th)) * 0.08, d.hang, (Bot(th) - m(th)) * 0.16, { rotate: right ? 6 : -6 });
      }
    }
    for (const pk of o.peek || []) {
      const t = pk.t ?? 0.5;
      const size = (Floor(t) - Bot(t)) * (pk.size ?? 0.75);
      p.emoji(X(t), Floor(t) - size * 0.45, pk.emoji, size, { flip: pk.flip });
    }
  },

  // Front view of a toilet. lid: 'up' (default) | 'down'
  toilet(p, b, o) {
    const { x, y, w, h } = b, S = p.S;
    const white = o.color || '#f7f7f4';
    const cx = x + w / 2;
    // tank
    p.rect(x + w * 0.16, y + h * 0.05, w * 0.68, h * 0.36, white, { r: 10 * S });
    p.rect(x + w * 0.12, y, w * 0.76, h * 0.07, white, { r: 8 * S });
    p.rect(x + w * 0.2, y + h * 0.1, w * 0.13, h * 0.035, '#bdbdbd', { r: 4 * S, sw: 0.6 });          // flush lever
    p.circle(x + w * 0.21, y + h * 0.118, 8 * S, '#9e9e9e', { sw: 0.5 });
    // bowl + pedestal
    const rimY = y + h * 0.52;
    p.path(`M ${x + w * 0.04} ${rimY} Q ${x + w * 0.06} ${y + h * 0.78} ${x + w * 0.3} ${y + h * 0.84} ` +
      `L ${x + w * 0.26} ${y + h} L ${x + w * 0.74} ${y + h} L ${x + w * 0.7} ${y + h * 0.84} ` +
      `Q ${x + w * 0.94} ${y + h * 0.78} ${x + w * 0.96} ${rimY} Z`, white);
    p.line(x + w * 0.3, y + h * 0.84, x + w * 0.7, y + h * 0.84, { sw: 0.4, stroke: 'rgba(0,0,0,0.35)' });
    const seat = o.seat || '#f7f7f4';
    if (o.lid === 'down') {
      p.ellipse(cx, rimY, w * 0.47, h * 0.085, seat, { sw: 0.9 });
      p.ellipse(cx, rimY - h * 0.012, w * 0.4, h * 0.06, seat, { sw: 0.4 });
    } else {
      // lid up, leaning on the tank
      p.path(`M ${x + w * 0.14} ${rimY - h * 0.04} Q ${x + w * 0.12} ${y + h * 0.12} ${cx} ${y + h * 0.1} ` +
        `Q ${x + w * 0.88} ${y + h * 0.12} ${x + w * 0.86} ${rimY - h * 0.04} Z`, seat, { sw: 0.9 });
      p.ellipse(cx, rimY, w * 0.47, h * 0.085, seat, { sw: 0.9 });
      p.ellipse(cx, rimY + h * 0.004, w * 0.33, h * 0.052, '#8fd0e8', { sw: 0.6 });                // water
      p.path(`M ${cx - w * 0.12} ${rimY} q ${w * 0.06} ${-h * 0.02} ${w * 0.12} 0 q ${w * 0.06} ${h * 0.02} ${w * 0.12} 0`,
        null, { sw: 0.35, stroke: '#ffffff' });
    }
  },

  // Toilet-paper holder on the wall; empty:true shows just the cardboard tube
  tpHolder(p, b, o) {
    const { x, y, w, h } = b, S = p.S;
    p.rect(x, y, w * 0.12, h * 0.55, '#bdbdbd', { r: 4 * S, sw: 0.6 });
    p.rect(x + w * 0.88, y, w * 0.12, h * 0.55, '#bdbdbd', { r: 4 * S, sw: 0.6 });
    const cy = y + h * 0.3, r = h * 0.28;
    if (o.empty) {
      p.rect(x + w * 0.12, cy - r * 0.45, w * 0.76, r * 0.9, '#c8955a', { r: 6 * S, sw: 0.7 });
      return;
    }
    p.path(`M ${x + w * 0.62} ${cy + r} L ${x + w * 0.66} ${y + h} L ${x + w * 0.34} ${y + h * 0.97} L ${x + w * 0.3} ${cy + r} Z`,
      '#ffffff', { sw: 0.6 });
    p.rect(x + w * 0.12, cy - r, w * 0.76, r * 2, '#ffffff', { r: 14 * S, sw: 0.8 });
    for (const f of [0.35, 0.55, 0.75]) p.line(x + w * 0.34, y + h * (0.62 + f * 0.4), x + w * 0.64, y + h * (0.62 + f * 0.4),
      { sw: 0.25, stroke: 'rgba(0,0,0,0.3)', dash: `${4 * S} ${6 * S}` });
  },

  // Marker writing straight on the wall (doodles, graffiti)
  scribble(p, b, o) {
    const lines = String(o.text || '').split('\n');
    const maxLen = Math.max(...lines.map(l => l.length), 1);
    const size = Math.min(b.h / (lines.length * 1.15), b.w / (maxLen * 0.62));
    const draw = () => lines.forEach((l, i) => p.text(b.x + b.w / 2,
      b.y + b.h / 2 + (i - (lines.length - 1) / 2) * size * 1.1, l, { size, color: o.color || '#6a3fb5' }));
    o.rotate ? p.group(`rotate(${o.rotate} ${b.x + b.w / 2} ${b.y + b.h / 2})`, draw) : draw();
  },

  // --- Kitchen ---

  fridge(p, b, o) {
    const { x, y, w, h } = b, S = p.S;
    p.rect(x, y, w, h, o.color || '#f2f0ea', { r: 22 * S });
    p.line(x, y + h * 0.32, x + w, y + h * 0.32, { sw: 0.8 });
    p.rect(x + w * 0.8, y + h * 0.08, w * 0.07, h * 0.16, '#bdbdbd', { r: 6 * S, sw: 0.6 });
    p.rect(x + w * 0.8, y + h * 0.38, w * 0.07, h * 0.28, '#bdbdbd', { r: 6 * S, sw: 0.6 });
    // a kid's drawing taped to the door: sun, house, grass
    const dx = x + w * 0.12, dy = y + h * 0.42, dw = w * 0.56, dh = h * 0.2;
    p.group(`rotate(-4 ${dx + dw / 2} ${dy + dh / 2})`, () => {
      p.rect(dx, dy, dw, dh, '#ffffff', { sw: 0.5 });
      p.circle(dx + dw * 0.78, dy + dh * 0.25, dw * 0.1, '#fdd835', { sw: 0.4 });
      p.rect(dx + dw * 0.18, dy + dh * 0.45, dw * 0.3, dh * 0.35, '#e53935', { sw: 0.4 });
      p.poly([[dx + dw * 0.13, dy + dh * 0.47], [dx + dw * 0.33, dy + dh * 0.22], [dx + dw * 0.53, dy + dh * 0.47]], '#8b5a2b', { sw: 0.4 });
      p.rect(dx, dy + dh * 0.8, dw, dh * 0.2, '#66bb6a', { ink: false });
      p.rect(dx + dw * 0.3, dy - 8 * S, dw * 0.4, 16 * S, 'rgba(230,210,150,0.85)', { ink: false });
    });
    (o.magnets || []).forEach((m, i) => p.emoji(x + w * (0.2 + 0.28 * i), y + h * (0.1 + (i % 2) * 0.08), m, w * 0.17));
  },

  // Long countertop with cabinet doors underneath (blue, like Louisa's kitchen)
  counter(p, b, o) {
    const { x, y, w, h } = b, S = p.S;
    const topH = h * 0.16;
    p.rect(x, y + topH, w, h - topH, o.color || '#29b6f6', { sw: 0.9 });
    const n = o.doors || Math.max(1, Math.round(w / (150 * S)));
    const dw = w / n;
    for (let i = 0; i < n; i++) {
      p.rect(x + i * dw + 10 * S, y + topH + 12 * S, dw - 20 * S, h - topH - 40 * S, 'rgba(255,255,255,0.18)', { r: 6 * S, sw: 0.5 });
      p.circle(x + i * dw + dw / 2, y + topH + 32 * S, 8 * S, '#eceff1', { sw: 0.5 });
    }
    p.rect(x + 8 * S, y + h - 16 * S, w - 16 * S, 16 * S, o.kick || '#0d6fa3', { ink: false });
    p.rect(x - 10 * S, y, w + 20 * S, topH, o.top || '#e6dcc6', { r: 6 * S });
  },

  // Dark cooktop strip sitting on the counter
  cooktop(p, b, o) {
    const { x, y, w, h } = b, S = p.S;
    p.rect(x, y, w, h, '#3a3a3a', { r: 4 * S, sw: 0.7 });
    for (const f of o.burners || [0.25, 0.72]) {
      p.ellipse(x + w * f, y + h * 0.2, w * 0.17, h * 0.35, '#ff7043', { sw: 0.4, opacity: 0.9 });
    }
  },

  pot(p, b, o) {
    const { x, y, w, h } = b, S = p.S;
    const c = o.color || '#90a4ae';
    p.rect(x - w * 0.06, y + h * 0.32, w * 0.14, h * 0.1, c, { r: 5 * S, sw: 0.6 });               // handles
    p.rect(x + w * 0.92, y + h * 0.32, w * 0.14, h * 0.1, c, { r: 5 * S, sw: 0.6 });
    p.rect(x + w * 0.04, y + h * 0.2, w * 0.92, h * 0.8, c, { r: 10 * S, sw: 0.9 });
    p.rect(x, y + h * 0.14, w, h * 0.12, c, { r: 6 * S, sw: 0.8 });                                // rim
    p.ellipse(x + w / 2, y + h * 0.17, w * 0.42, h * 0.05, '#4fc3f7', { sw: 0.4 });                 // water
    p.line(x + w * 0.15, y + h * 0.45, x + w * 0.15, y + h * 0.85, { layer: 'fill', stroke: '#fff', sw: 1.2, opacity: 0.6 });
  },

  pan(p, b, o) {
    const { x, y, w, h } = b, S = p.S;
    p.rect(x + w * 0.66, y + h * 0.15, w * 0.34, h * 0.32, '#6d4c41', { r: 6 * S, sw: 0.7 });       // handle
    p.path(`M ${x} ${y} L ${x + w * 0.7} ${y} L ${x + w * 0.62} ${y + h} L ${x + w * 0.08} ${y + h} Z`, o.color || '#37474f', { sw: 0.9 });
  },

  oven(p, b, o) {
    const { x, y, w, h } = b, S = p.S;
    p.rect(x, y, w, h, o.color || '#f3e3c3', { r: 8 * S, sw: 0.9 });
    p.rect(x, y, w, h * 0.2, '#d7c4a0', { r: 8 * S, sw: 0.6 });
    for (let i = 0; i < 4; i++) p.circle(x + w * (0.2 + i * 0.2), y + h * 0.1, h * 0.055, '#424242', { sw: 0.4 });
    p.rect(x + w * 0.15, y + h * 0.27, w * 0.7, h * 0.06, '#bdbdbd', { r: 6 * S, sw: 0.6 });         // handle
    p.rect(x + w * 0.14, y + h * 0.38, w * 0.72, h * 0.5, '#4e342e', { r: 10 * S, sw: 0.7 });        // window
    p.rect(x + w * 0.14, y + h * 0.38, w * 0.72, h * 0.5, 'url(#ovenGlow)', { r: 10 * S, ink: false });
  },

  hood(p, b, o) {
    const { x, y, w, h } = b, S = p.S;
    p.rect(x + w * 0.35, y - h * 0.6, w * 0.3, h * 0.62, o.color || '#b0bec5', { sw: 0.7 });
    p.poly([[x + w * 0.2, y], [x + w * 0.8, y], [x + w, y + h], [x, y + h]], o.color || '#b0bec5', { sw: 0.9 });
    p.rect(x - 6 * S, y + h - 6 * S, w + 12 * S, 16 * S, '#90a4ae', { r: 4 * S, sw: 0.6 });
    for (const f of [0.3, 0.5, 0.7]) p.line(x + w * f, y + h * 0.3, x + w * f, y + h * 0.75, { sw: 0.35, stroke: 'rgba(0,0,0,0.3)' });
  },

  cuttingBoard(p, b, o) {
    const { x, y, w, h } = b, S = p.S;
    p.rect(x, y, w, h, o.color || '#d7a86e', { r: 10 * S, sw: 0.8 });
    p.circle(x + w * 0.9, y + h * 0.5, h * 0.18, '#e6dcc6', { sw: 0.4 });
    // knife lying on the board
    p.poly([[x + w * 0.5, y - h * 0.15], [x + w * 0.8, y - h * 0.15], [x + w * 0.8, y + h * 0.15], [x + w * 0.55, y + h * 0.1]], '#cfd8dc', { sw: 0.5 });
    p.rect(x + w * 0.8, y - h * 0.2, w * 0.16, h * 0.4, '#5d4037', { r: 4 * S, sw: 0.5 });
  },

  plate(p, b, o) {
    const { x, y, w, h } = b, S = p.S;
    p.rect(x - w * 0.12, y + h * 0.15, w * 1.24, h * 1.0, o.mat || '#ffcc80', { r: 8 * S, sw: 0.5 });
    p.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, '#ffffff', { sw: 0.8 });
    p.ellipse(x + w / 2, y + h / 2, w * 0.34, h * 0.3, '#f3f3f3', { sw: 0.3 });
  },

  // Wooden crate (or style:"basket") heaped with `peek` emojis
  crate(p, b, o) {
    const { x, y, w, h } = b, S = p.S;
    const top = y + h * 0.35;
    (o.peek || []).forEach((e, i, arr) => {
      const fx = arr.length === 1 ? 0.5 : 0.18 + 0.64 * i / (arr.length - 1);
      p.emoji(x + w * fx, top - h * (i % 2 ? 0.02 : 0.1), e, h * 0.42, { under: true, rotate: (i % 2 ? 14 : -10) });
    });
    if (o.style === 'basket') {
      p.path(`M ${x} ${top} L ${x + w} ${top} Q ${x + w * 0.96} ${y + h} ${x + w / 2} ${y + h} Q ${x + w * 0.04} ${y + h} ${x} ${top} Z`,
        o.color || '#b07a43', { sw: 0.8 });
      for (let i = 1; i < 6; i++) p.line(x + w * i / 6, top, x + w * (i / 6 * 0.8 + 0.1), y + h * 0.95, { sw: 0.3, stroke: 'rgba(0,0,0,0.35)' });
      p.line(x, top + (y + h - top) * 0.4, x + w, top + (y + h - top) * 0.4, { sw: 0.3, stroke: 'rgba(0,0,0,0.35)' });
      p.path(`M ${x + w * 0.15} ${top} Q ${x + w / 2} ${y - h * 0.2} ${x + w * 0.85} ${top}`, null, { sw: 0.8, stroke: '#7a4a2a' });
      return;
    }
    p.rect(x, top, w, y + h - top, o.color || '#c8955a', { sw: 0.9 });
    for (const f of [0.33, 0.66]) p.line(x, top + (y + h - top) * f, x + w, top + (y + h - top) * f, { sw: 0.5 });
    p.rect(x, top, w * 0.1, y + h - top, '#a0673a', { sw: 0.5 });
    p.rect(x + w * 0.9, top, w * 0.1, y + h - top, '#a0673a', { sw: 0.5 });
    if (o.label) p.text(x + w / 2, top + (y + h - top) * 0.5, o.label,
      { size: Math.min((y + h - top) * 0.28, w * 0.8 / (o.label.length * 0.62)), color: '#4e342e' });
  },

  jar(p, b, o) {
    const { x, y, w, h } = b, S = p.S;
    for (const [fx, fy] of [[0.3, 0.75], [0.68, 0.72], [0.5, 0.48]]) p.emoji(x + w * fx, y + h * fy, o.emoji, w * 0.42, { under: true });
    p.rect(x, y + h * 0.15, w, h * 0.85, 'rgba(210,235,245,0.45)', { r: 14 * S, sw: 0.8 });
    p.rect(x + w * 0.08, y, w * 0.84, h * 0.17, o.lid || '#e53935', { r: 6 * S, sw: 0.7 });
    p.line(x + w * 0.18, y + h * 0.3, x + w * 0.18, y + h * 0.8, { layer: 'fill', stroke: '#fff', sw: 1.1, opacity: 0.8 });
  },

  bowl(p, b, o) {
    const { x, y, w, h } = b, S = p.S;
    if (o.emoji) p.emoji(x + w / 2, y + h * 0.3, o.emoji, h * 0.62, { under: true });
    p.path(`M ${x} ${y + h * 0.35} L ${x + w} ${y + h * 0.35} Q ${x + w} ${y + h} ${x + w / 2} ${y + h} Q ${x} ${y + h} ${x} ${y + h * 0.35} Z`,
      o.color || '#ef9a9a', { sw: 0.9 });
    p.line(x + w * 0.1, y + h * 0.55, x + w * 0.9, y + h * 0.55, { sw: 0.3, stroke: 'rgba(255,255,255,0.8)' });
  },

  // A labelled food box (e.g. PASTA), with a picture emoji
  packet(p, b, o) {
    const { x, y, w, h } = b, S = p.S;
    p.rect(x, y, w, h, o.color || '#fdd835', { r: 6 * S, sw: 0.8 });
    p.rect(x, y, w, h * 0.12, o.band || '#1e88e5', { r: 6 * S, sw: 0.5 });
    if (o.label) p.text(x + w / 2, y + h * 0.28, o.label, { size: Math.min(h * 0.16, w / (o.label.length * 0.62)), color: '#c62828' });
    if (o.emoji) p.emoji(x + w / 2, y + h * 0.66, o.emoji, w * 0.55);
  },

  shelf(p, b, o) {
    const { x, y, w, h } = b, S = p.S;
    for (const f of [0.12, 0.88]) p.poly([[x + w * f - 8 * S, y + h], [x + w * f + 8 * S, y + h], [x + w * f, y + h + 50 * S]], '#7a4a2a', { sw: 0.5 });
    p.rect(x, y, w, h, o.color || '#a0673a', { r: 3 * S, sw: 0.7 });
  },

  // Recipe chalkboard. columns: [{ title, lines: ["🍞+🧀+🥬 = 🥪", ...] }]
  chalkboard(p, b, o) {
    const { x, y, w, h } = b, S = p.S;
    const pad = w * 0.04;
    p.rect(x - 14 * S, y - 14 * S, w + 28 * S, h + 28 * S, '#8b5a2b', { r: 8 * S });
    p.rect(x, y, w, h, '#2f4a3a', { sw: 0.6 });
    for (const [fx, fy] of [[0.15, 0.8], [0.7, 0.3], [0.45, 0.65]]) {
      p.line(x + w * fx, y + h * fy, x + w * (fx + 0.12), y + h * (fy - 0.05), { layer: 'fill', stroke: '#fff', sw: 3, opacity: 0.07 });
    }
    const chalk = '#f4f1e8';
    if (o.title) p.text(x + w / 2, y + h * 0.1, o.title, { size: h * 0.1, color: '#ffe082' });
    const cols = o.columns || [];
    const top = y + h * (o.title ? 0.22 : 0.08);
    const maxLines = Math.max(...cols.map(c => c.lines.length + (c.title ? 1 : 0)), 1);
    const lineH = (y + h - pad - top) / maxLines;
    cols.forEach((c, ci) => {
      const cx = x + w * (ci + 0.5) / cols.length;
      let ly = top + lineH / 2;
      if (c.title) { p.text(cx, ly, c.title, { size: lineH * 0.6, color: '#90caf9' }); ly += lineH; }
      for (const line of c.lines) { p.text(cx, ly, line, { size: lineH * 0.78, color: chalk, layer: 'top' }); ly += lineH; }
      if (ci > 0) p.line(x + w * ci / cols.length, top, x + w * ci / cols.length, y + h - pad, { sw: 0.3, stroke: 'rgba(255,255,255,0.35)' });
    });
    p.rect(x + w * 0.1, y + h + 10 * S, w * 0.8, 10 * S, '#6d4c41', { ink: false });               // chalk tray
    p.rect(x + w * 0.7, y + h + 2 * S, w * 0.05, 10 * S, '#ffffff', { r: 4 * S, ink: false });
  },

  // Picnic table with a red checked tablecloth and two benches
  picnicTable(p, b, o) {
    const { x, y, w, h } = b, S = p.S;
    const wood = '#8b5a2b';
    p.rect(x - w * 0.05, y + h * 0.66, w * 1.1, h * 0.1, wood, { r: 4 * S, sw: 0.7 });              // back bench
    for (const f of [0.15, 0.85]) {
      p.poly([[x + w * f - w * 0.02, y + h * 0.2], [x + w * f + w * 0.02, y + h * 0.2], [x + w * f + w * 0.07, y + h], [x + w * f + w * 0.03, y + h]], wood, { sw: 0.6 });
      p.poly([[x + w * f - w * 0.02, y + h * 0.2], [x + w * f + w * 0.02, y + h * 0.2], [x + w * f - w * 0.03, y + h], [x + w * f - w * 0.07, y + h]], wood, { sw: 0.6 });
    }
    p.rect(x, y, w, h * 0.12, wood, { r: 4 * S });                                                   // tabletop
    let d = `M ${x - 8 * S} ${y} L ${x + w + 8 * S} ${y} L ${x + w + 8 * S} ${y + h * 0.3}`;
    const n = 10;
    for (let i = 1; i <= n; i++) d += ` L ${x + w + 8 * S - (w + 16 * S) * i / n} ${y + h * (i % 2 ? 0.36 : 0.3)}`;
    p.path(d + ' Z', 'url(#checker)', { sw: 0.8 });                                                  // tablecloth
    p.rect(x - w * 0.08, y + h * 0.84, w * 1.16, h * 0.1, wood, { r: 4 * S, sw: 0.8 });              // front bench
  },

  // Rail of hanging utensils: items: ["🥄", "🍴"]
  rail(p, b, o) {
    const { x, y, w, h } = b, S = p.S;
    p.line(x, y, x + w, y, { sw: 1.2, stroke: '#757575' });
    (o.items || []).forEach((e, i, arr) => {
      const ex = x + w * (i + 0.5) / arr.length;
      p.line(ex, y, ex, y + h * 0.2, { sw: 0.4, stroke: '#757575' });
      p.emoji(ex, y + h * 0.55, e, h * 0.55, { rotate: i % 2 ? 8 : -8 });
    });
  },

  mouseHole(p, b, o) {
    const { x, y, w, h } = b;
    p.path(`M ${x} ${y + h} L ${x} ${y + h * 0.5} Q ${x} ${y} ${x + w / 2} ${y} Q ${x + w} ${y} ${x + w} ${y + h * 0.5} L ${x + w} ${y + h} Z`, '#1b1b1b', { sw: 0.6 });
    if (o.emoji) p.emoji(x + w / 2, y + h * 0.68, o.emoji, h * 0.6);
  }
};

function buildSceneSvg(scene, W, H) {
  const S = W / 2400;
  const p = scenePen(S);
  const ceilH = scene.ceiling ? (scene.ceiling.height ?? 0.05) * H : 0;
  const floorY = (scene.floor && scene.floor.from != null ? scene.floor.from : 0.45) * H;

  drawSceneWall(p, ceilH, W, floorY - ceilH, scene.wall || {});
  drawSceneFloor(p, floorY, W, H - floorY, scene.floor || {});
  if (scene.ceiling) drawSceneCeiling(p, W, ceilH, scene.ceiling);

  for (const prop of scene.props || []) {
    const draw = SCENE_PROPS[prop.kind];
    if (!draw) { console.warn('Unknown scene prop kind:', prop.kind); continue; }
    draw(p, { x: prop.px * W, y: prop.py * H, w: (prop.pw || 0) * W, h: (prop.ph || 0) * H, W, H }, prop);
  }

  const defs = `<defs>
    <filter id="wobFill" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="${0.011 / S}" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="${10 * S}" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="wobInk" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="${0.018 / S}" numOctaves="2" seed="19"/>
      <feDisplacementMap in="SourceGraphic" scale="${6 * S}" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="streaks" width="${18 * S}" height="${18 * S}" patternUnits="userSpaceOnUse" patternTransform="rotate(32)">
      <rect width="${7 * S}" height="${18 * S}" fill="#fff" opacity="0.14"/>
    </pattern>
    <pattern id="mesh" width="${9 * S}" height="${9 * S}" patternUnits="userSpaceOnUse">
      <path d="M0 0H${9 * S}M0 0V${9 * S}" stroke="#000" stroke-opacity="0.35" stroke-width="${1.6 * S}"/>
    </pattern>
    <pattern id="checker" width="${44 * S}" height="${44 * S}" patternUnits="userSpaceOnUse">
      <rect width="${44 * S}" height="${44 * S}" fill="#ffffff"/>
      <rect width="${22 * S}" height="${22 * S}" fill="#e53935"/>
      <rect x="${22 * S}" y="${22 * S}" width="${22 * S}" height="${22 * S}" fill="#e53935"/>
    </pattern>
    <radialGradient id="ovenGlow" cx="0.5" cy="0.8" r="0.7">
      <stop offset="0" stop-color="#ff9800" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ff9800" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fff59d" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fff59d" stop-opacity="0"/>
    </radialGradient>
  </defs>`;

  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${defs}` +
    `<rect width="${W}" height="${H}" fill="#fbfaf4"/>` +
    `<g filter="url(#wobFill)">${p.fill.join('')}</g>` +
    `<rect width="${W}" height="${H}" fill="url(#streaks)"/>` +
    `<g filter="url(#wobInk)">${p.ink.join('')}</g>` +
    `<g>${p.top.join('')}</g>` +
    `<rect x="${4 * S}" y="${4 * S}" width="${W - 8 * S}" height="${H - 8 * S}" fill="none" stroke="${SCENE_INK}" stroke-width="${10 * S}"/>` +
    `</svg>`;
}

  const out = {};

    out[def.id] = Array.isArray(saved)

function getHoveredCharacter(mx, my) {
  const cardW = 120;
  const cardH = 170;
  const gap = 20;
  const totalW = characters.length * (cardW + gap) - gap;
  const startX = canvas.width / 2 - totalW / 2;
  const cardY = canvas.height / 2 - 40;
  for (let i = 0; i < characters.length; i++) {
    const cx = startX + i * (cardW + gap);
    if (mx >= cx && mx <= cx + cardW && my >= cardY && my <= cardY + cardH) {
      return i;
    }
  }
  return -1;

function resumePendingSave() {
  if (!pendingResumeSave) return;

  } else {

    player.y = scaledMapH * start.py;

// --- Developer Mode functions ---

function enterDevMode() {
  devMode = true;
  devSelectedHotspot = null;
  devDrag = null;
}

function exitDevMode() {
  devMode = false;
  devDrag = null;
  canvas.style.cursor = 'default';
  copyHotspotsToClipboard();
}

function copyHotspotsToClipboard() {
  // Build full map JSON — preserves all fields (items, uses, etc.)
  // and rounds fractional bounds to 4 decimal places.
  const fullConfig = {
    ...mapConfig,   // keeps npcs and any other top-level fields
    hotspots: mapConfig.hotspots.map(h => {
      const out = { ...h };
      out.px = parseFloat(h.px.toFixed(4));
      out.py = parseFloat(h.py.toFixed(4));
      out.pw = parseFloat(h.pw.toFixed(4));
      out.ph = parseFloat(h.ph.toFixed(4));
      return out;
    })
  };
  const json = JSON.stringify(fullConfig, null, 2);
  navigator.clipboard.writeText(json).catch(() => console.log(json));
}

// Returns the four corner handles for an interactiveObject in screen space
function devHandles(obj) {
  const sx = obj.x - camera.x;
  const sy = obj.y - camera.y;
  const sw = obj.width;
  const sh = obj.height;
  return [
    { corner: 'TL', x: sx,      y: sy      },
    { corner: 'TR', x: sx + sw, y: sy      },
    { corner: 'BL', x: sx,      y: sy + sh },
    { corner: 'BR', x: sx + sw, y: sy + sh }
  ];
}

function handleDevPointerDown(sx, sy) {
  // Hit-test corner handles first (highest priority)
  for (let i = 0; i < interactiveObjects.length; i++) {
    for (const h of devHandles(interactiveObjects[i])) {
      if (Math.hypot(sx - h.x, sy - h.y) <= DEV_HANDLE_R + 6) {
        devSelectedHotspot = i;
        devDrag = { index: i, corner: h.corner };
        return;
      }
    }
  }
  // Hit-test hotspot interiors for selection
  const mx = sx + camera.x;
  const my = sy + camera.y;
  for (let i = 0; i < interactiveObjects.length; i++) {
    const obj = interactiveObjects[i];
    if (mx >= obj.x && mx <= obj.x + obj.width &&
        my >= obj.y && my <= obj.y + obj.height) {
      devSelectedHotspot = i;
      return;
    }
  }
  devSelectedHotspot = null;
}

function handleDevPointerMove(sx, sy) {
  if (!devDrag) return;
  const mx = sx + camera.x;
  const my = sy + camera.y;
  const obj = interactiveObjects[devDrag.index];
  const def = mapConfig.hotspots[devDrag.index];

  let left   = obj.x;
  let top    = obj.y;
  let right  = obj.x + obj.width;
  let bottom = obj.y + obj.height;

  switch (devDrag.corner) {
    case 'TL': left  = mx; top    = my; break;
    case 'TR': right = mx; top    = my; break;
    case 'BL': left  = mx; bottom = my; break;
    case 'BR': right = mx; bottom = my; break;
  }

  // Enforce minimum 20px size and keep inside map
  if (right  - left < 20) { if (devDrag.corner.endsWith('L')) left  = right  - 20; else right  = left  + 20; }
  if (bottom - top  < 20) { if (devDrag.corner.startsWith('T')) top  = bottom - 20; else bottom = top + 20; }
  left   = Math.max(0, Math.min(left,   scaledMapW - 20));
  top    = Math.max(0, Math.min(top,    scaledMapH - 20));
  right  = Math.max(20, Math.min(right,  scaledMapW));
  bottom = Math.max(20, Math.min(bottom, scaledMapH));

  // Write back to both the runtime object and the source-of-truth def
  obj.x = left;
  obj.y = top;
  obj.width  = right  - left;
  obj.height = bottom - top;
  def.px = left   / scaledMapW;
  def.py = top    / scaledMapH;
  def.pw = obj.width  / scaledMapW;
  def.ph = obj.height / scaledMapH;
}

// Change cursor based on what's under the pointer
function updateDevCursor(sx, sy) {
  const cursorMap = { TL: 'nwse-resize', TR: 'nesw-resize', BL: 'nesw-resize', BR: 'nwse-resize' };
  for (const obj of interactiveObjects) {
    for (const h of devHandles(obj)) {
      if (Math.hypot(sx - h.x, sy - h.y) <= DEV_HANDLE_R + 6) {
        canvas.style.cursor = cursorMap[h.corner];
        return;
      }
    }
    const mx = sx + camera.x, my = sy + camera.y;
    if (mx >= obj.x && mx <= obj.x + obj.width && my >= obj.y && my <= obj.y + obj.height) {
      canvas.style.cursor = 'pointer';
      return;
    }
  }
  canvas.style.cursor = 'default';
}

function drawDevModeOverlay() {
  // Badge — top right
  const badge = '🔧 DEV MODE';
  ctx.font = 'bold 14px monospace';
  const bw = ctx.measureText(badge).width + 24;
  const bh = 30;
  const bx = canvas.width - bw - 10;
  const by = 10;
  ctx.fillStyle = 'rgba(180, 0, 0, 0.85)';
  roundRect(bx, by, bw, bh, 6);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'left';
  ctx.fillText(badge, bx + 12, by + 20);

  // All hotspot bounds + handles (drawn in map space, then offset by camera)
  ctx.save();
  ctx.translate(-camera.x, -camera.y);

  for (let i = 0; i < interactiveObjects.length; i++) {
    const obj = interactiveObjects[i];
    const isSelected = i === devSelectedHotspot;

    // Filled tint
    ctx.fillStyle = isSelected ? 'rgba(255, 235, 59, 0.18)' : 'rgba(255, 255, 255, 0.07)';
    ctx.fillRect(obj.x, obj.y, obj.width, obj.height);

    // Outline
    ctx.strokeStyle = isSelected ? '#FFD600' : 'rgba(255, 200, 0, 0.65)';
    ctx.lineWidth = isSelected ? 2.5 : 1.5;
    ctx.setLineDash(isSelected ? [] : [6, 4]);
    ctx.strokeRect(obj.x, obj.y, obj.width, obj.height);
    ctx.setLineDash([]);

    // Name label
    ctx.font = 'bold 11px monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(obj.x + 1, obj.y + 1, ctx.measureText(obj.id).width + 10, 16);
    ctx.fillStyle = isSelected ? '#FFD600' : '#ffe';
    ctx.fillText(obj.id, obj.x + 5, obj.y + 13);

    // Corner handles
    const corners = devHandles(obj);  // these are already in screen space via camera offset above — recalc in map space
    const mapCorners = [
      { corner: 'TL', x: obj.x,            y: obj.y             },
      { corner: 'TR', x: obj.x + obj.width, y: obj.y             },
      { corner: 'BL', x: obj.x,            y: obj.y + obj.height },
      { corner: 'BR', x: obj.x + obj.width, y: obj.y + obj.height }
    ];
    for (const h of mapCorners) {
      ctx.beginPath();
      ctx.arc(h.x, h.y, DEV_HANDLE_R, 0, Math.PI * 2);
      ctx.fillStyle = isSelected ? '#FFD600' : '#fff';
      ctx.fill();
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
  }

  ctx.restore();

  // Footer hint
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  const hint = 'Drag corners to resize  •  Cmd+D to save & exit';
  ctx.font = '12px monospace';
  ctx.textAlign = 'center';
  const hw = ctx.measureText(hint).width + 20;
  roundRect(canvas.width / 2 - hw / 2, canvas.height - 34, hw, 24, 5);
  ctx.fill();
  ctx.fillStyle = '#FFD600';
  ctx.fillText(hint, canvas.width / 2, canvas.height - 17);
}

// --- Interactive Objects ---
// Hotspot definitions are loaded from the map's JSON file (mapConfig.hotspots).
// Positions are stored as percentages of image dimensions (0-1)
// so they work at any scale. Converted to screen coords at runtime.

// Convert percentage-based definitions to pixel coords based on current map scale
let interactiveObjects = [];
function recalcInteractiveObjects() {
  if (!mapConfig) return;
  interactiveObjects = mapConfig.hotspots.map(def => ({
    ...def,
    x: def.px * scaledMapW,
    y: def.py * scaledMapH,
    width: def.pw * scaledMapW,
    height: def.ph * scaledMapH
  }));
}

let nearbyObject = null;
let currentInteraction = null;
let interactionTimer = 0;
let interactionAnimation = 0;

// --- Touch / tap-to-move ---
let tapTarget = null;     // { x, y } in map space
let tapRipple = null;     // { x, y, age } in screen space for visual feedback

function isTouchDevice() {
  return 'ontouchstart' in window || navigator.maxTouchPoints > 0;
}

function handleCanvasTap(screenX, screenY) {
  // Journal button always takes priority (visible in most states)
  if (journalBtnRect) {
    const b = journalBtnRect;
    if (screenX >= b.x && screenX <= b.x + b.w && screenY >= b.y && screenY <= b.y + b.h) {
      journalOpen = !journalOpen;
      if (journalOpen) { journalScroll = 0; journalScrollTarget = 0; }
      return;
    }
  }
  // Taps inside open journal panel (close button / scroll) don't fall through to game
  if (journalOpen && journalPanelRect) {
    const p = journalPanelRect;
    if (screenX >= p.x && screenX <= p.x + p.w && screenY >= p.y && screenY <= p.y + p.h) {
      // Close button (top-right of panel — 36×36)
      if (screenX >= p.x + p.w - 42 && screenY <= p.y + 46) {
        journalOpen = false;
      }
      return; // swallow tap
    }
    // Tapping outside journal panel on mobile (full-screen) closes it
    if (canvas.width < 600) { journalOpen = false; return; }
  }

  if (state === GameState.USING_ITEM) {
    closeItemUse();
    return;
  }

  if (state === GameState.FIGHTING) {
    if (fight && fight.phase === 'result') endFight();
    return;
  }

  if (state === GameState.CHARACTER_SELECT) {
    const idx = getHoveredCharacter(screenX, screenY);
    if (idx >= 0) selectCharacter(idx);
  } else if (state === GameState.RESUME_PROMPT) {
    const btns = resumePromptButtonRects();
    for (const b of btns) {
      if (screenX >= b.x && screenX <= b.x + b.w && screenY >= b.y && screenY <= b.y + b.h) {
        if (b.id === 'resume') resumePendingSave();
        else if (b.id === 'fresh') startFreshSave();
        return;
      }
    }
  } else if (state === GameState.CONFIRM_DIALOG) {
    const panelW = Math.min(400, canvas.width - 40);
    const panelH = 150;
    const panelY = canvas.height / 2 - panelH / 2;
    const btnW = 80, btnH = 36, btnY = panelY + panelH - 52, btnGap = 20;
    const yesBtnX = canvas.width / 2 - btnW - btnGap / 2;
    const noBtnX = canvas.width / 2 + btnGap / 2;
    if (screenX >= yesBtnX && screenX <= yesBtnX + btnW && screenY >= btnY && screenY <= btnY + btnH) {
      state = GameState.CHARACTER_SELECT;
      player.character = null;
    } else if (screenX >= noBtnX && screenX <= noBtnX + btnW && screenY >= btnY && screenY <= btnY + btnH) {
      state = GameState.PLAYING;
    }
  } else if (state === GameState.INTERACTING) {
    // Item at this hotspot: pick it up, stay in dialog
    for (const r of interactionHereRects) {
      if (screenX >= r.x && screenX <= r.x + r.w && screenY >= r.y && screenY <= r.y + r.h) {
        interactionHintText = pickUpHotspotItem(currentInteraction.id, r.index)
          ? `${r.item.emoji} ${r.item.name} is in your backpack!`
          : 'Your backpack is full!';
        return;
      }
    }
    // Dimmed item tap: show location hint, stay in dialog
    for (const r of interactionDimmedRects) {
      if (screenX >= r.x && screenX <= r.x + r.w && screenY >= r.y && screenY <= r.y + r.h) {
        interactionHintText = `Find the ${r.item.emoji} ${r.item.name} at the ${r.location}!`;
        return;
      }
    }
    // Usable item tap: use it
    for (const r of interactionUseRects) {
      if (screenX >= r.x && screenX <= r.x + r.w && screenY >= r.y && screenY <= r.y + r.h) {
        closeInteraction();
        useItem(r.item);
        return;
      }
    }
    closeInteraction();
  } else if (state === GameState.ITEM_ACTION) {
    for (const r of itemActionButtonRects) {
      if (screenX >= r.x && screenX <= r.x + r.w && screenY >= r.y && screenY <= r.y + r.h) {
        if (!r.disabled) performItemAction(r.id);
        return;
      }
    }
  } else if (state === GameState.PLAYING) {
    // Backpack overlay hit-tests (slots) take precedence when open
    if (backpackOpen) {
      const allRects = [
        ...backpackSlotRects.hotspot.map(r => ({ ...r, row: 'hotspot' })),
        ...backpackSlotRects.backpack.map(r => ({ ...r, row: 'backpack' }))
      ];
      for (const r of allRects) {
        if (screenX >= r.x && screenX <= r.x + r.w && screenY >= r.y && screenY <= r.y + r.h) {
          backpackSelection = { row: r.row, col: r.col };
          // Open action modal when player is inside a hotspot and slot has an item
          if (nearbyObject) {
            const item = r.row === 'backpack'
              ? backpack[r.col]
              : (hotspotItems[nearbyObject.id] || [])[r.col];
            if (item) openItemAction();
          }
          return;
        }
      }
      // Tap outside any slot but still within the overlay band closes the backpack
      const overlayTop = backpackOverlayTop();
      if (screenY >= overlayTop) {
        backpackOpen = false;
        return;
      }
    }

    // Tapping the Blob when it's close picks a fight
    if (nearBoss) {
      const bp = mapBossPos();
      const bh = mapBossHeight();
      if (Math.hypot(screenX - (bp.x - camera.x), screenY - (bp.y - bh / 2 - camera.y)) < bh * 0.7) {
        engageBoss();
        return;
      }
    }

    // Tapping a nearby friend starts a conversation (tapping a far one walks there)
    const tappedNpc = npcAtScreenPoint(screenX, screenY);
    if (tappedNpc && tappedNpc === nearbyNpc) {
      startConversation(tappedNpc);
      return;
    }

    // Tapping the character sprite triggers interaction; tapping elsewhere walks there
    const spriteScreenX = player.x - camera.x;
    const spriteScreenY = player.y - player.height - camera.y;
    const hitDist = Math.hypot(screenX - spriteScreenX, screenY - (spriteScreenY + player.height / 2));
    const onCharacter = hitDist < 108;
    const now = performance.now();
    if (onCharacter && nearbyObject) {
      handleInteract();
      lastCharTapTime = now;
    } else if (onCharacter) {
      if (now - lastCharTapTime < 350) {
        toggleBackpack();
        lastCharTapTime = 0;
      } else {
        lastCharTapTime = now;
      }
    } else {
      const mapX = screenX + camera.x;
      const mapY = screenY + camera.y;
      tapTarget = { x: mapX, y: mapY };
      tapRipple = { x: screenX, y: screenY, age: 0 };
    }
  }
}

// --- Interaction handling ---
function handleInteract() {
  if (state === GameState.PLAYING && nearbyObject) {
    // Portal hotspot: switch maps, no interaction dialog. Portals with a
    // `door` rect swing that door open first (see drawDoorOpening).
    if (nearbyObject.targetMap) {
      if (doorOpening) return;
      if (nearbyObject.door) {
        doorOpening = { obj: nearbyObject, start: performance.now() };
      } else {
        switchMap(nearbyObject.targetMap, nearbyObject.targetHotspot);
      }
      return;
    }
    // Kitchen station: Space picks up / puts down / cooks — no dialog
    if (nearbyObject.station && mapConfig.kitchen) {
      doStation(nearbyObject);
      return;
    }
    // The boss's cave: knock and the Blob comes out to fight
    if (isBossCave(nearbyObject)) {
      if (mapBoss.where === 'home') engageBoss();
      else kitchenToast('The cave is empty... the Blob is out roaming! 👀');
      return;
    }
    state = GameState.INTERACTING;
    currentInteraction = nearbyObject;
    interactionTimer = 0;
    interactionAnimation = 0;
  }
}

function closeInteraction() {
  state = GameState.PLAYING;
  currentInteraction = null;
  interactionHintText = null;
}

// --- Backpack / Inventory ---
function toggleBackpack() {
  backpackOpen = !backpackOpen;
  if (backpackOpen) {
    // Re-anchor selection; prefer hotspot row if items are there
    if (nearbyObject && (hotspotItems[nearbyObject.id] || []).length > 0) {
      backpackSelection = { row: 'hotspot', col: 0 };
    } else {
      backpackSelection = { row: 'backpack', col: 0 };
    }
  }
}

function selectedItem() {
  if (!backpackOpen) return null;
  if (backpackSelection.row === 'backpack') {
    return backpack[backpackSelection.col] || null;
  }
  if (!nearbyObject) return null;
  const items = hotspotItems[nearbyObject.id] || [];
  return items[backpackSelection.col] || null;
}

function backpackRowCount(row) {
  if (row === 'backpack') return BACKPACK_CAPACITY;
  if (!nearbyObject) return 0;
  return HOTSPOT_CAPACITY;
}

function handleBackpackKey(e) {
  if (e.key === 'Escape' || e.key === 'b' || e.key === 'B') {
    backpackOpen = false;
    return;
  }
  if (e.key === 'ArrowLeft') {
    const n = backpackRowCount(backpackSelection.row);
    if (n > 0) backpackSelection.col = (backpackSelection.col - 1 + n) % n;
  } else if (e.key === 'ArrowRight') {
    const n = backpackRowCount(backpackSelection.row);
    if (n > 0) backpackSelection.col = (backpackSelection.col + 1) % n;
  } else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    if (nearbyObject) {
      backpackSelection.row = backpackSelection.row === 'backpack' ? 'hotspot' : 'backpack';
      const n = backpackRowCount(backpackSelection.row);
      if (n > 0) backpackSelection.col = Math.min(backpackSelection.col, n - 1);
      else backpackSelection.col = 0;
    }
  } else if (e.key === 'Enter' || e.key === ' ') {
    openItemAction();
  }
}

function openItemAction() {
  if (!nearbyObject) return;            // outside hotspot = view-only
  const item = selectedItem();
  if (!item) return;
  currentItemAction = {
    source: backpackSelection.row,
    index: backpackSelection.col,
    hotspotId: nearbyObject.id
  };
  backpackActionButton = 0;
  state = GameState.ITEM_ACTION;
}

function closeItemAction() {
  currentItemAction = null;
  state = GameState.PLAYING;
}

// --- Item use helpers ---
function getItemUseAtHotspot(item, hotspot) {
  if (!item || !hotspot) return null;
  if (item.pickedUpFrom === hotspot.id) return null; // can't use where picked up
  const def = mapConfig && mapConfig.hotspots.find(h => h.id === hotspot.id);
  if (!def || !def.uses) return null;
  return def.uses.find(u => u.itemId === item.id) || null;
}

function isUseAlreadyDone(itemId, hotspotId) {
  return completedUses.some(u => u.hotspotId === hotspotId && u.itemId === itemId);
}

function totalUsesCount() {
  // Count across all cached map configs so the journal progress bar is global
  return Object.values(allMapConfigs)
    .flatMap(c => c.hotspots)
    .reduce((sum, h) => sum + (h.uses ? h.uses.length : 0), 0);
}

function itemActionButtons() {
  if (!currentItemAction) return [];
  const a = currentItemAction;
  if (a.source === 'hotspot') {
    const backpackFull = backpack.length >= BACKPACK_CAPACITY;
    return [
      { id: 'pickup', label: 'Pick up', disabled: backpackFull },
      { id: 'cancel', label: 'Cancel',  disabled: false }
    ];
  }
  // Backpack item
  const hotspotFull = !a.hotspotId || (hotspotItems[a.hotspotId] || []).length >= HOTSPOT_CAPACITY;
  return [
    { id: 'drop',   label: 'Drop here', disabled: hotspotFull },
    { id: 'cancel', label: 'Cancel',    disabled: false },
  ];
}

// Move a hotspot item into the backpack. Returns false if the backpack is full.
function pickUpHotspotItem(hotspotId, index) {
  if (backpack.length >= BACKPACK_CAPACITY) return false;
  const items = hotspotItems[hotspotId] || [];
  const [item] = items.splice(index, 1);
  if (item) {
    item.pickedUpFrom = hotspotId; // record origin so it can't be used there
    backpack.push(item);
  }
  writeSave();
  return true;
}

function performItemAction(buttonId) {
  if (!currentItemAction) return;
  const a = currentItemAction;
  if (buttonId === 'cancel') {
    closeItemAction();
    return;
  }
  if (buttonId === 'pickup' && a.source === 'hotspot') {
    if (!pickUpHotspotItem(a.hotspotId, a.index)) return;
    // Snap selection to remaining hotspot items or fall back to backpack
    const remaining = (hotspotItems[a.hotspotId] || []).length;
    if (remaining > 0) {
      backpackSelection = { row: 'hotspot', col: Math.min(a.index, remaining - 1) };
    } else {
      backpackSelection = { row: 'backpack', col: Math.max(0, backpack.length - 1) };
    }
    closeItemAction();
    return;
  }
  if (buttonId === 'drop' && a.source === 'backpack') {
    const items = hotspotItems[a.hotspotId] || [];
    if (items.length >= HOTSPOT_CAPACITY) return;
    const [item] = backpack.splice(a.index, 1);
    if (item) items.push(item);
    hotspotItems[a.hotspotId] = items;
    writeSave();
    // Keep cursor on backpack row at a valid position
    const newCol = Math.min(a.index, Math.max(0, backpack.length - 1));
    backpackSelection = { row: 'backpack', col: newCol };
    closeItemAction();
    return;
  }
}

function useItem(item) {
  const use = getItemUseAtHotspot(item, nearbyObject);
  if (!use) return;
  // Record completion (item stays in backpack)
  completedUses.push({
    hotspotId: nearbyObject.id,
    hotspotName: nearbyObject.name,
    itemId: item.id,
    itemName: item.name,
    itemEmoji: item.emoji || '?',
    text: use.text
  });
  writeSave();
  // Check for all-done celebration
  if (completedUses.length === totalUsesCount()) {
    completionToast = { age: 0 };
  }
  // Transition to use dialog
  currentItemUse = {
    item,
    use,
    hotspot: nearbyObject,
    timer: 0,
    animation: use.animation || nearbyObject.action
  };
  itemUseAnimation = 0;
  backpackOpen = false;
  state = GameState.USING_ITEM;
}

function closeItemUse() {
  currentItemUse = null;
  state = GameState.PLAYING;
}

function handleItemActionKey(e) {
  const btns = itemActionButtons();
  if (e.key === 'Escape') {
    closeItemAction();
    return;
  }
  if (e.key === 'ArrowLeft') {
    backpackActionButton = (backpackActionButton - 1 + btns.length) % btns.length;
  } else if (e.key === 'ArrowRight') {
    backpackActionButton = (backpackActionButton + 1) % btns.length;
  } else if (e.key === 'Enter' || e.key === ' ') {
    const b = btns[backpackActionButton];
    if (b && !b.disabled) performItemAction(b.id);
  }
}

// ============================================================
// --- NPC friends & conversations ---
// ============================================================
// Each map JSON may list `npcs`: [{ id, character, px, py, personality }].
// `character` names an entry in `characters` (the player's own character is
// hidden); px/py are the NPC's FEET position as fractions of the image.
// The player types a line, it pops out of their mouth as a speech bubble,
// then the NPC answers. Replies come from Claude via POST /api/npc-reply
// (server.js); if that's unavailable we fall back to localNpcReply().
const talkBar   = document.getElementById('talkBar');
const talkInput = document.getElementById('talkInput');
const talkSay   = document.getElementById('talkSay');
const talkBye   = document.getElementById('talkBye');
const talkTo    = document.getElementById('talkTo');

const NPC_TALK_RANGE = 170;          // map px between feet to be able to chat
const conversations  = {};           // character name → [{ speaker:'player'|'npc', text }]
let nearbyNpc   = null;              // npc def the player can talk to right now
let talkingTo   = null;              // npc def in the active conversation
let talkPhase   = 'input';           // 'input' | 'playerSpeaking' | 'npcSpeaking'
let talkToken   = 0;                 // bumped per conversation so stale replies are dropped
let pendingReply = null;             // { npc, text } — reply received, not shown yet
let npcThinking  = null;             // { npc, since } — "..." cloud while waiting
let speechBubbles = [];              // see makeBubble()
const npcFacing = {};                // npc id → 'left' | 'right'

function characterByName(name) {
  return characters.find(c => c.name === name);
}

// An NPC is either one of the campers (`character`) or a critter drawn as an
// emoji (`emoji` + `name`, e.g. the frog living in the broken toilet).
function isCritter(npc) {
  return !!(npc && npc !== 'player' && npc.emoji);
}
function npcName(npc) {
  return npc.name || npc.character;
}
// Critter height in map px (`size` is a fraction of the map height)
function critterSize(npc) {
  return (npc.size || 0.07) * scaledMapH;
}

function currentNpcs() {
  if (!mapConfig || !Array.isArray(mapConfig.npcs)) return [];
  return mapConfig.npcs.filter(n => isCritter(n) ||
    (characterByName(n.character) &&
     (!player.character || n.character !== player.character.name)));
}

function npcPos(npc) {
  return { x: npc.px * scaledMapW, y: npc.py * scaledMapH };
}

// Map-space feet / head / mouth for 'player' or an npc def.
function speakerFeet(owner) {
  return owner === 'player' ? { x: player.x, y: player.y } : npcPos(owner);
}
function speakerHead(owner) {
  const f = speakerFeet(owner);
  if (isCritter(owner)) {
    const s = critterSize(owner);
    return { x: f.x, top: f.y - s, mouthY: f.y - s * 0.4 };
  }
  const spriteX = f.x - player.width / 2;
  const spriteY = f.y - player.height;
  return {
    x: spriteX + 15 * SPRITE_SCALE,          // head centre (see drawCharacterSprite)
    top: spriteY,
    mouthY: spriteY + 13 * SPRITE_SCALE
  };
}

function npcAtScreenPoint(sx, sy) {
  for (const npc of currentNpcs()) {
    const h = speakerHead(npc);
    const f = npcPos(npc);
    const cy = (h.top + f.y) / 2;
    if (Math.hypot(sx - (h.x - camera.x), sy - (cy - camera.y)) < 80) return npc;
  }
  return null;
}

// --- Starting / ending a conversation ---
function startConversation(npc) {
  if (state !== GameState.PLAYING || !npc) return;
  backpackOpen = false;
