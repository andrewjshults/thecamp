  ctx.moveTo(ex - 2 * s, ey + 1.5 * s);
  ctx.lineTo(ex + 2 * s, ey + 1.5 * s);
  ctx.lineTo(ex + 0.5 * s, ey + 5.5 * s);
  ctx.lineTo(ex - 0.8 * s, ey + 5 * s);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#F48FB1';                // hair tie
  ctx.fillRect(ex - 2.2 * s, ey, 4.4 * s, 2 * s);
}

function drawLoadingScreen() {
  ctx.fillStyle = '#2a1a0a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#FFD54F';
  ctx.font = '36px "Comic Sans MS", cursive';
  ctx.textAlign = 'center';
  ctx.fillText(loadingMessage, canvas.width / 2, canvas.height / 2);

  // Simple loading spinner
  const t = Date.now() / 200;
  for (let i = 0; i < 8; i++) {
    const angle = (i / 8) * Math.PI * 2 + t;
    const alpha = ((i / 8 + (t % 1)) % 1);
    ctx.fillStyle = `rgba(255, 213, 79, ${alpha})`;
    ctx.beginPath();
    ctx.arc(
      canvas.width / 2 + Math.cos(angle) * 30,
      canvas.height / 2 + 50 + Math.sin(angle) * 30,
      5, 0, Math.PI * 2
    );
    ctx.fill();
  }
}

// Dark green backdrop with the map faded in, plus twinkling stars
function drawMenuBackdrop() {
  ctx.fillStyle = '#1a3a1a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (mapImage) {
    ctx.globalAlpha = 0.15;
    const scale = Math.max(canvas.width / mapImage.naturalWidth, canvas.height / mapImage.naturalHeight);
    ctx.drawImage(mapImage, 0, 0, mapImage.naturalWidth * scale, mapImage.naturalHeight * scale);
    ctx.globalAlpha = 1;
  }
  const t = Date.now() / 1000;
  ctx.fillStyle = '#FFD54F';
  for (let i = 0; i < 15; i++) {
    const sx = (Math.sin(i * 2.5 + t * 0.3) * 0.5 + 0.5) * canvas.width;
    const sy = (Math.cos(i * 1.7 + t * 0.2) * 0.5 + 0.5) * canvas.height * 0.3;
    drawStar(sx, sy, 2 + Math.sin(t + i) * 1.5);
  }
}

// "← Back" (to the single / multi player menu) on the character screen
function charSelectBackRect() {
  return { x: 12, y: 12, w: 96, h: 34 };
}
let charSelectNote = null;   // { text, at } — e.g. "a friend is already playing ..."

function drawCharacterSelect() {
  // Background
  ctx.fillStyle = '#1a3a1a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Draw faded map as background
  if (mapImage) {
    ctx.globalAlpha = 0.15;
    const scale = Math.max(canvas.width / mapImage.naturalWidth, canvas.height / mapImage.naturalHeight);

  ctx.strokeStyle = '#5D4037';

  if (charSelectNote && performance.now() - charSelectNote.at < 3000) {

  // Instructions

  // Stars decoration
  const t = Date.now() / 1000;

  for (let i = 0; i < 15; i++) {
    const sx = (Math.sin(i * 2.5 + t * 0.3) * 0.5 + 0.5) * canvas.width;
    const sy = (Math.cos(i * 1.7 + t * 0.2) * 0.5 + 0.5) * canvas.height * 0.3;
    const size = 2 + Math.sin(t + i) * 1.5;
    drawStar(sx, sy, size);
  }
}

function drawStar(x, y, size) {
  ctx.save();
  ctx.translate(x, y);
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const angle = (i * 4 * Math.PI) / 5 - Math.PI / 2;
    const method = i === 0 ? 'moveTo' : 'lineTo';
    ctx[method](Math.cos(angle) * size, Math.sin(angle) * size);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// ============================================================
// KITCHEN — cooking stations + the ONE food in your hands
// ============================================================
// A map with a `kitchen` ({ foods, recipes }) turns hotspots that have a
// `station` into cooking spots. Space at a station picks up / puts down /
// cooks. The player holds one food at a time (drawn in their hands); it never
// goes in the backpack and is left behind when they walk out of the kitchen.
// Station types:
//   source — { item }                                   grab an ingredient (never runs out)
//   cook   — { verb, doing, makes: { in: out }, seconds, fx }   Chop / Boil / Fry / Bake...
//   plate  — combine foods; when they match a kitchen.recipes[].needs it becomes `makes`
//   serve  — eat a finished dish (a food with "dish": true)
//   trash  — throw away whatever you're holding
//   shop   — { item }: buy a dessert (a food with "dessert": true, `price`,
//            `strength`) with 🪙 coins from the backpack
let heldItem = null;          // { id, name, emoji } — only ever exists inside a kitchen
let dishesMade = [];          // dish ids eaten at least once (saved)
const stationStates = {};     // `${mapPath}#${hotspotId}` → state (kept while the game runs)

// --- Freestyle: making up your own recipes ---
// Bring a food to the plate that isn't in any recipe and you're offered to cook
// freestyle. You name it, it's written on the chalkboard (✏️, still cooking)
// and the plate takes any food. Picking up the plate gives you the dish; eating
// it at the table makes it a real recipe (saved in `customRecipes`, made on the
// plate like any other from then on). Composting it or walking out with it
// rubs it off the board.
const CUSTOM_DISH_EMOJI = '🍽️';
const FREESTYLE_MAX = 6;      // foods on one freestyle plate
let customRecipes = [];       // [{ id, name, needs: [foodId], map }] (saved)
let draftRecipe = null;       // { name, needs, map } — the one you're making up right now

function customRecipesHere() {
  return customRecipes.filter(r => r.map === currentMapPath);
}
function draftHere() {
  return draftRecipe && draftRecipe.map === currentMapPath ? draftRecipe : null;
}
function draftDish() {
  return { id: 'draft_recipe', name: draftRecipe.name, emoji: CUSTOM_DISH_EMOJI, dish: true, custom: true, draft: true };
}
// Built-in recipes plus the ones you've made up in this kitchen
function allRecipes() {
  return [
    ...mapConfig.kitchen.recipes,
    ...customRecipesHere().map(r => ({ makes: r.id, needs: r.needs }))
  ];
}
function cleanRecipeName(s) {
  return String(s || '').replace(/\s+/g, ' ').trim().slice(0, 24);
}
// Forget a recipe you were still making up (new camper, fresh save...)
function resetDraftRecipe() {
  draftRecipe = null;
  if (heldItem && heldItem.draft) heldItem = null;
  for (const S of Object.values(stationStates)) {
    if (S.draft) { S.plate = []; S.draft = false; }
  }
}
// Older saves have no sword yet: they start with a new one
function savedSwordRating(save) {
  const n = save && Number(save.swordRating);
  return Number.isFinite(n) ? clamp(Math.round(n), 0, SWORD_MAX) : SWORD_MAX;
}
function cleanCustomRecipes(arr) {
  return Array.isArray(arr)
    ? arr.filter(r => r && typeof r.id === 'string' && typeof r.name === 'string' && Array.isArray(r.needs) && typeof r.map === 'string')
      .map(r => ({ id: r.id, name: cleanRecipeName(r.name), needs: r.needs.map(String), map: r.map }))
    : [];
}
// The board shows recipes, so the "see all" hotspot may need to appear or go
function kitchenBoardChanged() {
  recalcInteractiveObjects();
}

function kitchenFood(id) {
  const f = mapConfig && mapConfig.kitchen && mapConfig.kitchen.foods[id];
  if (f) return { id, ...f };
  if (id === 'draft_recipe' && draftRecipe) return draftDish();
  const c = customRecipes.find(r => r.id === id);
  if (c) return { id, name: c.name, emoji: CUSTOM_DISH_EMOJI, dish: true, custom: true };
  return { id, name: id, emoji: '❓' };
}
function foodLabel(id) {
  const f = kitchenFood(id);
  return `${f.emoji} ${f.name}`;
}
function kitchenDishes() {
  const foods = (mapConfig && mapConfig.kitchen && mapConfig.kitchen.foods) || {};
  return Object.keys(foods).filter(id => foods[id].dish);
}
function stationState(obj) {
  const key = `${currentMapPath}#${obj.id}`;
  return stationStates[key] || (stationStates[key] = { item: null, plate: [] });
}
function kitchenToast(text) {
  useToast = { text, age: 0, low: true };
}

// --- Desserts → strength ---
// Eating a dessert adds its `strength` to strengthBoost (saved, for good, up to
// STRENGTH_BOOST_MAX). Every Blob fight starts you at STRENGTH_BASE + strengthBoost.
const STRENGTH_BASE = 10;
const STRENGTH_BOOST_MAX = 10;
let strengthBoost = 0;

function coinValue(it) { return it.value || 10; }
function walletTotal() { return backpack.filter(isCoin).reduce((sum, it) => sum + coinValue(it), 0); }

function eatDessert(f, onTheWayOut) {
  const before = strengthBoost;
  strengthBoost = Math.min(STRENGTH_BOOST_MAX, strengthBoost + (f.strength || 1));
  writeSave();
  const got = strengthBoost - before;
  const ate = onTheWayOut ? `You gobble up the ${foodLabel(f.id)} on your way out!` : `Yum! You eat the ${foodLabel(f.id)}.`;
  kitchenToast(got
    ? `${ate} +${got} 💪 You're stronger for good! (Strength ${STRENGTH_BASE + strengthBoost})`
    : `${ate} You can't get any stronger! (Strength ${STRENGTH_BASE + STRENGTH_BOOST_MAX} 💪)`);
}

// Pay `price` with coins from the backpack (smallest first). Returns the coins paid.
function payCoins(price) {
  const coins = backpack.filter(isCoin).sort((a, b) => coinValue(a) - coinValue(b));
  const paid = [];
  let sum = 0;
  for (const c of coins) {
    if (sum >= price) break;
    paid.push(c);
    sum += coinValue(c);
  }
  backpack = backpack.filter(it => !paid.includes(it));
  return paid;
}

// Multiset check: can every food in `have` be found in `needs`?
function bagFits(have, needs) {
  const left = [...needs];
  for (const id of have) {
    const i = left.indexOf(id);
    if (i < 0) return false;
    left.splice(i, 1);
  }
  return true;
}
function plateAccepts(plate, id) {
  return allRecipes().some(r => bagFits([...plate, id], r.needs));
}
function plateRecipe(plate) {
  return allRecipes().find(r => r.needs.length === plate.length && bagFits(plate, r.needs));
}

// Cooking finishes on a timer (checked every frame while drawing)
function tickStations(now) {
  for (const obj of interactiveObjects) {
    if (!obj.station || obj.station.type !== 'cook') continue;
    const S = stationState(obj);
    if (S.cookEnd && now >= S.cookEnd) {
      S.item = S.out;
      S.cooking = S.out = S.cookEnd = null;
      S.doneAt = now;
      kitchenToast(`Ding! The ${foodLabel(S.item)} is ready!`);
    }
  }
}

// Space at a station
function doStation(obj) {
  const st = obj.station, S = stationState(obj), now = performance.now();
  const held = heldItem;
  const handsFull = () => kitchenToast(`Your hands are full! Put down the ${foodLabel(held.id)} first.`);
  switch (st.type) {
    case 'source':
      if (!held) {
        heldItem = kitchenFood(st.item);
        kitchenToast(`You grab the ${foodLabel(st.item)}.`);
      } else if (held.id === st.item) {
        heldItem = null;
        kitchenToast(`You put the ${foodLabel(held.id)} back.`);
      } else handsFull();
      break;

    case 'cook': {
      const verb = (st.verb || 'Cook').toLowerCase();
      if (S.cookEnd) { kitchenToast(`${st.doing || 'Cooking'}... wait for the ding!`); break; }
      if (S.item) {
        if (held) { handsFull(); break; }
        heldItem = kitchenFood(S.item);
        S.item = null;
        kitchenToast(`You take the ${foodLabel(heldItem.id)}.`);
        break;
      }
      const inputs = Object.keys(st.makes).map(id => kitchenFood(id).emoji).join(' or ');
      if (!held) { kitchenToast(`You can ${verb} ${inputs} here.`); break; }
      const out = st.makes[held.id];
      if (!out) { kitchenToast(`You can't ${verb} ${foodLabel(held.id)}! Try ${inputs}.`); break; }
      S.cooking = held.id;
      S.out = out;
      S.cookStart = now;
      S.cookEnd = now + (st.seconds || 3) * 1000;
      heldItem = null;
      kitchenToast(`${st.doing || 'Cooking'} the ${foodLabel(held.id)}...`);
      break;
    }

    case 'plate': {
      if (held) {
        if (held.dessert) { kitchenToast(`The ${foodLabel(held.id)} doesn't need a plate! Take it to the table to eat it.`); break; }
        // Freestyle plate: anything goes
        if (S.draft) {
          if (held.custom) { kitchenToast(`The ${held.emoji} ${held.name} is ready to eat! Take it to the table.`); break; }
          if (S.plate.length >= FREESTYLE_MAX) { kitchenToast(`Your ${draftRecipe.name} is full! Pick it up and take it to the table to eat it.`); break; }
          S.plate.push(held.id);
          heldItem = null;
          kitchenBoardChanged();
          kitchenToast(`You add the ${foodLabel(held.id)} to your ${draftRecipe.name}!`);
          break;
        }
        // Putting your made-up dish back down to add more
        if (held.draft) {
          if (S.plate.length) { kitchenToast(`The plate isn't empty! Take the ${S.plate.map(id => kitchenFood(id).emoji).join(' ')} off first.`); break; }
          S.plate = draftRecipe.needs;
          S.draft = true;
          heldItem = null;
          kitchenToast(`You put your ${draftRecipe.name} back on the plate. Add more food, or take it to the table!`);
          break;
        }
        if (!plateAccepts(S.plate, held.id)) {
          const f = kitchenFood(held.id);
          if (f.custom) { kitchenToast(`The ${foodLabel(f.id)} is ready to eat! Take it to the table.`); break; }
          if (draftRecipe) { kitchenToast(`Finish your ✏️ ${draftRecipe.name} first! Eat it at the table, or put it in the compost.`); break; }
          openFreestyleOffer(obj, f, S.plate);
          break;
        }
        S.plate.push(held.id);
        heldItem = null;
        const r = plateRecipe(S.plate);
        if (r) {
          S.plate = [r.makes];
          S.madeAt = now;
          kitchenToast(`✨ You made ${foodLabel(r.makes)}! Take it to the table to eat it.`);
        } else {
          kitchenToast(`You put the ${foodLabel(held.id)} on the plate.`);
        }
      } else if (S.draft) {
        // A made-up dish comes off the plate all together
        heldItem = draftDish();
        S.plate = [];
        S.draft = false;
        kitchenToast(`You pick up your ${CUSTOM_DISH_EMOJI} ${draftRecipe.name}! Take it to the table to eat it.`);
      } else if (S.plate.length) {
        heldItem = kitchenFood(S.plate.pop());
        kitchenToast(`You pick up the ${foodLabel(heldItem.id)}.`);
      } else {
        kitchenToast('Put food on the plate to make a recipe! Check the recipe board.');
      }
      break;
    }

    case 'serve': {
      if (!held) { kitchenToast('Make some food and bring it here to eat! 🍽️'); break; }
      const f = kitchenFood(held.id);
      if (f.dessert) {
        heldItem = null;
        S.eating = { emoji: f.emoji, start: now };
        eatDessert(f);
        break;
      }
      if (!f.dish) { kitchenToast(`The ${f.name.toLowerCase()} isn't ready to eat yet. Cook it or make a recipe first!`); break; }
      heldItem = null;
      S.eating = { emoji: f.emoji, start: now };
      if (held.draft) {
        // Eating your made-up dish makes it a real recipe, on the board for good
        const r = {
          id: `custom_${Date.now().toString(36)}`,
          name: draftRecipe.name,
          needs: [...draftRecipe.needs],
          map: currentMapPath
        };
        customRecipes.push(r);
        draftRecipe = null;
        writeSave();
        kitchenBoardChanged();
        kitchenToast(`🎉 Yum! ${CUSTOM_DISH_EMOJI} ${r.name} is a real recipe now. It's on the recipe board for good! ⭐`);
        break;
      }
      if (f.custom) { kitchenToast(`Yum yum! You eat your ${foodLabel(f.id)}. 😋`); break; }
      const dishes = kitchenDishes();
      if (!dishesMade.includes(f.id)) {
        dishesMade.push(f.id);
        writeSave();
        const n = dishes.filter(id => dishesMade.includes(id)).length;
        kitchenToast(n === dishes.length
          ? `🎉 Yum! You've cooked EVERY recipe! Master Chef! 👩‍🍳`
          : `Yum! ${f.emoji} New recipe! You've made ${n} of ${dishes.length}.`);
      } else {
        kitchenToast(`Yum yum! You eat the ${foodLabel(f.id)}. 😋`);
      }
      break;
    }

    case 'trash':
      if (held && held.draft) {
        heldItem = null;
        draftRecipe = null;
        kitchenBoardChanged();
        kitchenToast(`Into the compost goes your ${held.name}. You can always make up a new recipe! ♻️`);
      } else if (held) {
        heldItem = null;
        kitchenToast(`Into the compost goes the ${foodLabel(held.id)}! ♻️`);
      } else kitchenToast('Nothing to throw away!');
      break;

    case 'shop': {
      const f = kitchenFood(st.item);
      const price = f.price || 10;
      if (held) {
        if (held.id !== st.item || !held.paid) { handsFull(); break; }
        // Changed your mind: put it back and get the coins back
        if (backpack.length + held.paid.length > BACKPACK_CAPACITY) {
          kitchenToast(`Your backpack is too full for the coins! Eat the ${foodLabel(f.id)} instead.`);
          break;
        }
        backpack.push(...held.paid);
        heldItem = null;
        writeSave();
        kitchenToast(`You put the ${foodLabel(f.id)} back and get your $${price} back.`);
        break;
      }
      if (strengthBoost >= STRENGTH_BOOST_MAX) {
        kitchenToast(`You're already as strong as can be (Strength ${STRENGTH_BASE + STRENGTH_BOOST_MAX} 💪)! Save your coins.`);
        break;
      }
      const have = walletTotal();
      if (have < price) {
        kitchenToast(have
          ? `The ${foodLabel(f.id)} costs $${price}, but you only have $${have}. Beat the Blob to win more 🪙!`
          : `The ${foodLabel(f.id)} costs $${price}. Beat the Blob to win 🪙 $10 coins!`);
        break;
      }
      heldItem = { ...f, paid: payCoins(price) };
      writeSave();
      kitchenToast(`You buy a ${foodLabel(f.id)} for $${price}! Take it to the table to eat it. (+${f.strength || 1} 💪)`);
      break;
    }
  }
}

// --- Kitchen pop-ups (HTML #kitchenModal) ---
const kitchenModalEl = document.getElementById('kitchenModal');
const kmNameInput = document.getElementById('kmNameInput');
const kmNameGo = document.getElementById('kmNameGo');
let kitchenModalOpenedAt = 0;
let freestylePending = null;   // { obj, food } — the plate and the food that didn't fit

function showKitchenModal(screenId) {
  for (const id of ['kmOffer', 'kmName', 'kmList']) document.getElementById(id).hidden = id !== screenId;
  kitchenModalEl.hidden = false;
  if (state !== GameState.KITCHEN_MODAL) {
    state = GameState.KITCHEN_MODAL;
    kitchenModalOpenedAt = performance.now();
    backpackOpen = false;
    journalOpen = false;
    tapTarget = null;
    player.walking = false;
    player.frame = 0;
  }
  // A moment later, so the Space that opened it doesn't also press a button
  const focus = screenId === 'kmName' ? kmNameInput : kitchenModalEl.querySelector(`#${screenId} button`);
  setTimeout(() => { if (!kitchenModalEl.hidden && focus) focus.focus(); }, 80);
}

function closeKitchenModal() {
  if (state !== GameState.KITCHEN_MODAL) return;
  kitchenModalEl.hidden = true;
  freestylePending = null;
  if (kitchenModalEl.contains(document.activeElement)) document.activeElement.blur();
  state = GameState.PLAYING;
}

// A food that isn't in any recipe arrived at the plate
function openFreestyleOffer(obj, food, plate) {
  freestylePending = { obj, food };
  const on = plate.map(id => kitchenFood(id).emoji).join(' ');
  document.getElementById('kmOfferText').textContent =
    plate.length ? `${food.emoji} ${food.name} doesn't go with ${on} in any recipe.`
    : food.dish ? `The ${food.emoji} ${food.name} is ready to eat! Or you can use it to cook something new.`
    : `${food.emoji} ${food.name} isn't in any recipe yet.`;
  showKitchenModal('kmOffer');
}

function showFreestyleName() {
  if (!freestylePending) return;
  const { obj, food } = freestylePending;
  const needs = [...stationState(obj).plate, food.id];
  document.getElementById('kmNameText').textContent =
    `${needs.map(id => kitchenFood(id).emoji).join(' + ')} + anything else you like!`;
  kmNameInput.value = '';
  kmNameGo.disabled = true;
  showKitchenModal('kmName');
}

// Named it: the held food goes on the plate and the recipe is written on the board
function startFreestyle(obj, name) {
  const S = stationState(obj);
  draftRecipe = { name, needs: [...S.plate, heldItem.id], map: currentMapPath };
  S.plate = draftRecipe.needs;   // the same array: adding food to the plate adds to the recipe
  S.draft = true;
  S.madeAt = performance.now();
  heldItem = null;
  kitchenBoardChanged();
  kitchenToast(`✏️ ${name} is on the recipe board! Add any food you like, then take it to the table to eat it.`);
}

// Every recipe in this kitchen, for a full chalkboard's "see all"
function openRecipeList() {
  const body = document.getElementById('kmListBody');
  body.textContent = '';
  const e = id => kitchenFood(id).emoji;
  const section = (title, rows, empty) => {
    const h = document.createElement('h3');
    h.textContent = title;
    body.appendChild(h);
    if (!rows.length && empty) rows = [{ text: empty, cls: 'kmEmpty' }];
    for (const r of rows) {
      const d = document.createElement('div');
      d.className = r.cls || 'kmRecipe';
      d.textContent = r.text;
      body.appendChild(d);
    }
  };
  section('On the plate', mapConfig.kitchen.recipes.map(r =>
    ({ text: `${r.needs.map(e).join(' + ')} → ${foodLabel(r.makes)}` })));
  const mine = customRecipesHere().map(r =>
    ({ text: `${r.needs.map(e).join(' + ')} → ${CUSTOM_DISH_EMOJI} ${r.name}`, cls: 'kmRecipe mine' }));
  const draft = draftHere();
  if (draft) mine.push({ text: `✏️ ${draft.needs.map(e).join(' + ')} → ${draft.name} (still cooking!)`, cls: 'kmRecipe mine' });
  section('⭐ Your recipes', mine, 'None yet! Put any food on the plate to cook freestyle.');
  const cooks = [];
  for (const h of mapConfig.hotspots) {
    const st = h.station;
    if (!st || st.type !== 'cook') continue;
    for (const [from, to] of Object.entries(st.makes)) {
      cooks.push({ text: `${st.verb || 'Cook'} ${e(from)} → ${foodLabel(to)}` });
    }
  }
  section('Cook it', cooks);
  showKitchenModal('kmList');
}

kitchenModalEl.addEventListener('click', (e) => {
  const b = e.target.closest('[data-km]');
  if (!b || performance.now() - kitchenModalOpenedAt < 300) return;
  if (b.dataset.km === 'close') closeKitchenModal();
  else if (b.dataset.km === 'name') showFreestyleName();
});
kitchenModalEl.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { e.preventDefault(); closeKitchenModal(); }
});
kmNameInput.addEventListener('input', () => { kmNameGo.disabled = !cleanRecipeName(kmNameInput.value); });
document.getElementById('kmName').addEventListener('submit', (e) => {
  e.preventDefault();
  const name = cleanRecipeName(kmNameInput.value);
  if (!name || !freestylePending || !heldItem) return;
  startFreestyle(freestylePending.obj, name);
  closeKitchenModal();
});

// --- The recipe chalkboard's writing ---
// The board itself is part of the scene picture; the writing is drawn on top
// every frame so your own recipes can be added. A column with `"custom": true`
// gets your recipes under its hand-written lines. The board has a fixed number
// of rows (`rows`, default: what the hand-written columns need); when a column
// runs out, the oldest lines at the top are rubbed off and its last row becomes
// "see all", with a hotspot that opens every recipe in a pop-up.
const CHALK = '#f4f1e8';

function chalkboardLayout(o, b) {
  const pad = b.w * 0.04;
  const cols = o.columns || [];
  const top = b.y + b.h * (o.title ? 0.22 : 0.08);
  const rows = o.rows || Math.max(...cols.map(c => c.lines.length + (c.title ? 1 : 0)), 1);
  const lineH = (b.y + b.h - pad - top) / rows;
  return { pad, cols, top, rows, lineH };
}

function chalkRecipeLine(r) {
  return `${r.needs.map(id => kitchenFood(id).emoji).join('+')} = ${r.name}`;
}

// What fits on the board right now. Box `b` and everything returned are in scene units.
function chalkboardView(o, b) {
  const L = chalkboardLayout(o, b);
  const cols = L.cols.map(c => {
    let lines = c.lines.map(text => ({ text }));
    if (c.custom && mapConfig && mapConfig.kitchen) {
      for (const r of customRecipesHere()) lines.push({ text: chalkRecipeLine(r) });
      const d = draftHere();
      if (d) lines.push({ text: `✏️ ${chalkRecipeLine(d)}`, draft: true });
    }
    const room = L.rows - (c.title ? 1 : 0);
    let more = 0;
    if (lines.length > room) {
      more = lines.length - (room - 1);
      lines = lines.slice(more);
    }
    return { title: c.title, lines, more, total: lines.length + more };
  });
  return { ...L, cols };
}

function sceneChalkboards() {
  const scene = mapConfig && mapConfig.scene;
  if (!scene) return [];
  const W = scene.width || 2400, H = scene.height || 1700;
  return (scene.props || []).filter(o => o.kind === 'chalkboard').map(o => ({
    o, W, H, b: { x: o.px * W, y: o.py * H, w: o.pw * W, h: o.ph * H }
  }));
}

function drawChalkboards() {
  const boards = sceneChalkboards();
  if (!boards.length) return;
  const now = performance.now();
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const { o, W, b } of boards) {
    const k = scaledMapW / W;
    const V = chalkboardView(o, b);
    const colW = b.w / V.cols.length;
    const write = (text, cx, cy, size, color) => {
      ctx.font = `bold ${size * k}px ${SCENE_FONT}`;
      const maxW = colW * 0.92 * k;
      const w = ctx.measureText(text).width;
      if (w > maxW) ctx.font = `bold ${size * k * maxW / w}px ${SCENE_FONT}`;
      ctx.fillStyle = color;
      ctx.fillText(text, cx * k, cy * k);
    };
    V.cols.forEach((c, ci) => {
      const cx = b.x + colW * (ci + 0.5);
      let ly = V.top + V.lineH / 2;
      if (c.title) { write(c.title, cx, ly, V.lineH * 0.6, '#90caf9'); ly += V.lineH; }
      for (const line of c.lines) {
        // Recipes still being made up wiggle a little, in yellow chalk
        const wob = line.draft ? Math.sin(now / 250) * V.lineH * 0.04 : 0;
        write(line.text, cx, ly + wob, V.lineH * 0.78, line.draft ? '#fff59d' : CHALK);
        ly += V.lineH;
      }
      if (c.more) write(`▼ see all ${c.total} ▼`, cx, ly, V.lineH * 0.62, '#ffe082');
    });
  }
  ctx.restore();
}

// "See all recipes" hotspots for full columns (fractions of the map, like JSON hotspots)
function chalkboardHotspots() {
  const out = [];
  for (const { o, W, H, b } of sceneChalkboards()) {
    const V = chalkboardView(o, b);
    const colW = b.w / V.cols.length;
    V.cols.forEach((c, ci) => {
      if (!c.more) return;
      const rowTop = V.top + V.lineH * (V.rows - 1);
      out.push({
        id: `see_all_recipes_${ci}`, name: 'See All Recipes',
        px: (b.x + colW * ci) / W, py: rowTop / H,
        pw: colW / W, ph: (b.y + b.h + 24 * (W / 2400) - rowTop) / H,
        action: 'explore', description: 'Every recipe, even the ones rubbed off the board',
        items: [], uses: [], seeAllRecipes: true
      });
    });
  }
  return out;
}

// Short action text shown under the station's name ("[ SPACE ] Boil 🍅")
function stationHint(obj) {
  const st = obj.station, S = stationState(obj), held = heldItem;
  const e = id => kitchenFood(id).emoji;
  switch (st.type) {
    case 'source':
      if (!held) return `Take ${e(st.item)}`;
      return held.id === st.item ? `Put back ${held.emoji}` : 'Hands full';
    case 'cook':
      if (S.cookEnd) return `${st.doing || 'Cooking'}...`;
      if (S.item) return held ? 'Hands full' : `Take ${e(S.item)}`;
      if (!held) return `${st.verb || 'Cook'} ${Object.keys(st.makes).map(e).join(' ')}`;
      return st.makes[held.id] ? `${st.verb || 'Cook'} ${held.emoji}` : `Can't ${(st.verb || 'cook').toLowerCase()} ${held.emoji}`;
    case 'plate':
      if (held) {
        if (held.dessert) return `${held.emoji} doesn't need a plate`;
        if (S.draft) return held.custom ? `${held.emoji} doesn't fit` : `Add ${held.emoji} to ${draftRecipe.name}`;
        if (held.draft) return S.plate.length ? 'Plate is full' : `Put back ${held.emoji}`;
        if (plateAccepts(S.plate, held.id)) return `Add ${held.emoji}`;
        return held.custom || draftRecipe ? `${held.emoji} doesn't fit` : `✨ Freestyle with ${held.emoji}`;
      }
      if (S.draft) return `Take ${CUSTOM_DISH_EMOJI} ${draftRecipe.name}`;
      return S.plate.length ? `Take ${e(S.plate[S.plate.length - 1])}` : 'Make a recipe';
    case 'serve': {
      const f = held && kitchenFood(held.id);
      return f && (f.dish || f.dessert) ? `Eat ${held.emoji}` : 'Eat food here';
    }
    case 'trash':
      return held ? `Throw away ${held.emoji}` : 'Compost';
    case 'shop': {
      const f = kitchenFood(st.item);
      if (held) return held.id === st.item && held.paid ? `Put back ${held.emoji} (get $${f.price || 10} back)` : 'Hands full';
      return `Buy ${f.emoji} for $${f.price || 10} (+${f.strength || 1} 💪)`;
    }
  }
  return '';
}

function drawFoodEmoji(emoji, x, y, size, alpha) {
  ctx.save();
  if (alpha != null) ctx.globalAlpha = alpha;
  ctx.font = `${Math.round(size)}px ${SCENE_EMOJI_FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#000';                   // opaque, or Chrome fades colour emoji
  ctx.fillText(emoji, x, y);
  ctx.restore();
}

// Food sitting on stations: cooking (with a timer ring + steam), done (bouncing
// with a sparkle), stacked on the plate, or being eaten at the table.
function drawStations() {
  if (!mapConfig || !mapConfig.kitchen) return;
  const now = performance.now();
  tickStations(now);
  for (const obj of interactiveObjects) {
    const st = obj.station;
    if (!st) continue;
    const S = stationState(obj);
    const x = obj.x + obj.width * (st.slot ? st.slot.px : 0.5);
    const y = obj.y + obj.height * (st.slot ? st.slot.py : 0.5);
    const size = (st.slotSize || 0.06) * scaledMapH;

    if (st.type === 'cook' && S.cookEnd) {
      const p = clamp((now - S.cookStart) / (S.cookEnd - S.cookStart), 0, 1);
      const jiggle = Math.sin(now / 70) * size * 0.04;
      drawFoodEmoji(kitchenFood(S.cooking).emoji, x + jiggle, y, size);
      ctx.lineWidth = 6;
      ctx.strokeStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath();
      ctx.arc(x, y, size * 0.75, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = '#FFD54F';
      ctx.beginPath();
      ctx.arc(x, y, size * 0.75, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * p);
      ctx.stroke();
      if (st.fx) {
        for (let i = 0; i < 3; i++) {
          const ph = (now / 900 + i / 3) % 1;
          drawFoodEmoji(st.fx, x + (i - 1) * size * 0.45, y - size * (0.7 + ph * 0.9), size * 0.45, 1 - ph);
        }
      }
    } else if (st.type === 'cook' && S.item) {
      const since = now - (S.doneAt || 0);
      const hop = since < 1200 ? Math.abs(Math.sin(since / 120)) * size * 0.25 : 0;
      drawFoodEmoji(kitchenFood(S.item).emoji, x, y - hop, size);
      drawFoodEmoji('✨', x + size * 0.55, y - size * 0.5, size * 0.4, 0.5 + 0.5 * Math.sin(now / 200));
      if (since < 1500) {
        ctx.save();
        ctx.globalAlpha = 1 - since / 1500;
        ctx.font = 'bold 24px "Comic Sans MS", cursive';
        ctx.textAlign = 'center';
        ctx.lineWidth = 5;
        ctx.strokeStyle = '#221c1a';
        ctx.fillStyle = '#FFF59D';
        ctx.strokeText('DING!', x, y - size - since / 30);
        ctx.fillText('DING!', x, y - size - since / 30);
        ctx.restore();
      }
    } else if (st.type === 'plate' && S.plate.length) {
      const n = S.plate.length;
      S.plate.forEach((id, i) => {
        drawFoodEmoji(kitchenFood(id).emoji, x + (i - (n - 1) / 2) * size * 0.6, y - i * size * 0.12, size);
      });
      if (S.madeAt && now - S.madeAt < 1500) {
        for (let i = 0; i < 5; i++) {
          const a = i * 1.26 + (now - S.madeAt) / 300;
          const r = size * (0.6 + (now - S.madeAt) / 1500);
          drawFoodEmoji('✨', x + Math.cos(a) * r, y + Math.sin(a) * r * 0.6, size * 0.35, 1 - (now - S.madeAt) / 1500);
        }
      }
    } else if (st.type === 'serve' && S.eating) {
      const t = (now - S.eating.start) / 1600;
      if (t >= 1) { S.eating = null; continue; }
      drawFoodEmoji(S.eating.emoji, x, y, size * (1 - t * 0.9), 1 - t * 0.5);
      drawFoodEmoji('😋', x + size * 0.6, y - size * (0.6 + t * 0.8), size * 0.5, 1 - t);
    }
  }
}

// Top-of-screen badge: which dishes you've made, and what's in your hands
function drawKitchenHud() {
  if (!mapConfig || !mapConfig.kitchen) return;
  const dishes = kitchenDishes();
  const made = dishes.filter(id => dishesMade.includes(id)).length;
  ctx.save();
  ctx.font = 'bold 14px "Comic Sans MS", cursive';
  const mine = customRecipesHere().length;
  const label = `Recipes made ${made}/${dishes.length}${mine ? `  •  ⭐ ${mine} of your own` : ''}`;
  const iconW = 30;
  const w = ctx.measureText(label).width + dishes.length * iconW + 34;
  const x = canvas.width / 2 - w / 2, y = 10;
  ctx.fillStyle = 'rgba(40, 24, 8, 0.8)';
  roundRect(x, y, w, 36, 12);
  ctx.fill();
  ctx.fillStyle = '#FFD54F';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, x + 14, y + 18);
  ctx.restore();
  dishes.forEach((id, i) => {
    drawFoodEmoji(kitchenFood(id).emoji, x + w - 20 - (dishes.length - 1 - i) * iconW - 2, y + 18, 22,
      dishesMade.includes(id) ? 1 : 0.25);
  });
  const pill = (t, py, color) => {
    ctx.save();
    ctx.font = 'bold 13px "Comic Sans MS", cursive';
    const tw = ctx.measureText(t).width + 24;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
    roundRect(canvas.width / 2 - tw / 2, py, tw, 24, 8);
    ctx.fill();
    ctx.fillStyle = color;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(t, canvas.width / 2, py + 12);
    ctx.restore();
  };
  let py = y + 42;
  // Your coins and dessert strength, once the kitchen sells desserts
  if (Object.values(mapConfig.kitchen.foods).some(f => f.dessert)) {
    pill(`🪙 $${walletTotal()}   •   💪 Strength: ${STRENGTH_BASE + strengthBoost}`, py, '#FFE0B2');
    py += 30;
  }
  if (heldItem) pill(`In your hands: ${heldItem.emoji} ${heldItem.name}`, py, '#FFF9C4');
}

// --- Door swinging open before walking through a portal ---
// A portal hotspot's optional `door` is { px, py, pw, ph, color } in map
// fractions: the door drawn on the map, which swings toward the viewer on its
// left hinge to reveal a dark doorway (with `door.inside` emoji in it).
const DOOR_OPEN_MS = 650;
let doorOpening = null;   // { obj, start }

function drawDoorOpening() {
  const d = doorOpening.obj.door;
  const x = d.px * scaledMapW, y = d.py * scaledMapH;
  const w = d.pw * scaledMapW, h = d.ph * scaledMapH;
  const p = Math.min(1, (performance.now() - doorOpening.start) / (DOOR_OPEN_MS * 0.8));
  const ease = 1 - Math.pow(1 - p, 3);
  const ink = '#221c1a';

  // dark doorway
  ctx.fillStyle = '#3b3631';
  ctx.fillRect(x, y, w, h);
  if (d.inside) {
    ctx.font = `${Math.round(w * 0.55)}px ${SCENE_EMOJI_FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.globalAlpha = 0.3 + 0.7 * ease;
    ctx.fillText(d.inside, x + w / 2, y + h * 0.68);
    ctx.globalAlpha = 1;
    ctx.textBaseline = 'alphabetic';
  }
  // the door: free edge swings left and toward us (so it gets a little taller)
  const angle = ease * 1.25;                       // ~72°
  const freeX = x + w * Math.cos(angle) - w * 0.12 * Math.sin(angle);
  const grow = h * 0.07 * Math.sin(angle);
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(freeX, y - grow);
  ctx.lineTo(freeX, y + h + grow);
  ctx.lineTo(x, y + h);
  ctx.closePath();
  ctx.fillStyle = d.color || '#8dbb2a';
  ctx.fill();
  ctx.lineWidth = 4;
  ctx.strokeStyle = ink;
  ctx.lineJoin = 'round';
  ctx.stroke();
  // round window, squashed as the door turns
  const ww = Math.max(2, (freeX - x) * 0.2);
  ctx.beginPath();
  ctx.ellipse(x + (freeX - x) / 2, y + h * 0.18, ww, w * 0.2, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#3fb6d9';
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.stroke();
  // creak!
  ctx.globalAlpha = Math.sin(p * Math.PI);
  ctx.font = 'bold 26px "Comic Sans MS", cursive';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#FFF59D';
  ctx.strokeStyle = ink;
  ctx.lineWidth = 5;
  ctx.strokeText('CREEEAK!', x + w / 2, y - 20);
  ctx.fillText('CREEEAK!', x + w / 2, y - 20);
  ctx.globalAlpha = 1;
}

function drawGame() {
  ctx.fillStyle = '#87CEEB';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (!mapImage) return;

  ctx.save();
  ctx.translate(-camera.x, -camera.y);

  // Draw map at scaled size
  ctx.drawImage(mapImage, 0, 0, scaledMapW, scaledMapH);
  drawChalkboards();
  drawBossCave();
  drawStations();
  drawLyingSwords();
  if (doorOpening) drawDoorOpening();

  // Draw interaction highlights
  for (const obj of interactiveObjects) {
    if (obj === nearbyObject && state !== GameState.TALKING) {
      // Glowing outline for nearby object
      const pulse = Math.sin(Date.now() / 200) * 0.3 + 0.7;
      ctx.strokeStyle = `rgba(255, 235, 59, ${pulse})`;
      ctx.lineWidth = 3;
      ctx.setLineDash([6, 4]);
      roundRectPath(obj.x - 4, obj.y - 4, obj.width + 8, obj.height + 8, 8);
      ctx.stroke();
      ctx.setLineDash([]);

      // Label
      ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
      ctx.font = 'bold 13px "Comic Sans MS", cursive';
      ctx.textAlign = 'center';
      const labelX = obj.x + obj.width / 2;
      // Keep the label (and the hint above it) on screen for tall/top hotspots
      const labelY = Math.max(obj.y - 12, camera.y + 46);
      const labelW = ctx.measureText(obj.name).width + 16;
      roundRect(labelX - labelW / 2, labelY - 14, labelW, 22, 6);
      ctx.fill();

      ctx.fillStyle = '#FFEB3B';
      ctx.fillText(obj.name, labelX, labelY);

      // Interact hint (portals get a special "ENTER" label)
      ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
      const hintY = labelY - 24;
      let hintText;
      if (obj.targetMap) {
        hintText = isTouchDevice() ? '🚪 [ TAP ]' : '🚪 [ ENTER ]';
      } else if (obj.station) {
        hintText = `${isTouchDevice() ? '[ TAP ]' : '[ SPACE ]'} ${stationHint(obj)}`;
      } else if (isBossCave(obj)) {
        hintText = `${isTouchDevice() ? '[ TAP ]' : '[ SPACE ]'} ${mapBoss.where === 'home' ? '⚔️ Knock knock...' : 'Peek inside'}`;
      } else {
        hintText = isTouchDevice() ? '[ TAP ]' : '[ SPACE ]';
      }
      const hintW = ctx.measureText(hintText).width + 12;
      roundRect(labelX - hintW / 2, hintY - 12, hintW, 18, 4);
      ctx.fill();

      ctx.fillStyle = '#FFF9C4';
      ctx.font = '11px "Comic Sans MS", cursive';
      ctx.fillText(hintText, labelX, hintY);
    }
  }

  // Draw player and NPC friends (depth-sorted)
  drawPeople();

  ctx.restore();

  // Speech bubbles (screen space so they can be kept on-screen)
  drawSpeechBubbles();
  drawMapBossShout();
  drawKitchenHud();

  // Tap ripple visual
  if (tapRipple) {
    tapRipple.age++;
    const progress = tapRipple.age / 30;
    if (progress >= 1) {
      tapRipple = null;
    } else {
      const alpha = 1 - progress;
      const radius = 8 + progress * 24;
      ctx.save();
      ctx.globalAlpha = alpha * 0.8;
      ctx.strokeStyle = '#FFD54F';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(tapRipple.x, tapRipple.y, radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = alpha * 0.4;
      ctx.beginPath();
      ctx.arc(tapRipple.x, tapRipple.y, radius * 0.5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }

  // HUD
  drawHUD();

  // Backpack overlay (also visible behind ITEM_ACTION modal)
  if (backpackOpen) drawBackpack();

  // Transient "you used X" toast
  drawUseToast();

  // Adventure Journal sidebar (always on top of game)
  drawJournal();

  // All-done celebration toast
  drawCompletionToast();
}

// --- Adventure Journal ---
function drawJournal() {
  const total = totalUsesCount();
  const done = completedUses.length;
  const isMobile = canvas.width < 600;
  const PANEL_W = isMobile ? canvas.width : 280;
  const BTN_W = 72;
  const BTN_H = 38;
  const BTN_X = canvas.width - BTN_W - 8;
  const BTN_Y = 10;

  // Journal toggle button (always visible)
  journalBtnRect = { x: BTN_X, y: BTN_Y, w: BTN_W, h: BTN_H };
  ctx.fillStyle = journalOpen ? '#5D4037' : 'rgba(0,0,0,0.55)';
  roundRect(BTN_X, BTN_Y, BTN_W, BTN_H, 8);
  ctx.fill();
  ctx.strokeStyle = journalOpen ? '#FFD54F' : '#8D6E63';
  ctx.lineWidth = 2;
  roundRect(BTN_X, BTN_Y, BTN_W, BTN_H, 8);
  ctx.stroke();
  ctx.fillStyle = '#FFECB3';
  ctx.font = 'bold 12px "Comic Sans MS", cursive';
  ctx.textAlign = 'center';
  ctx.fillText('📖', BTN_X + BTN_W / 2, BTN_Y + 14);
  ctx.fillStyle = done === total && total > 0 ? '#FFD54F' : '#FFECB3';
  ctx.font = '11px "Comic Sans MS", cursive';
  ctx.fillText(`${done}/${total}`, BTN_X + BTN_W / 2, BTN_Y + 29);

  if (!journalOpen) return;

  // Smooth scroll
  journalScrollTarget = Math.max(0, journalScrollTarget);
  journalScroll += (journalScrollTarget - journalScroll) * 0.18;

  const PANEL_H = isMobile ? canvas.height : canvas.height;
  const PANEL_X = isMobile ? 0 : canvas.width - PANEL_W;
  const PANEL_Y = 0;

  journalPanelRect = { x: PANEL_X, y: PANEL_Y, w: PANEL_W, h: PANEL_H };

  // Semi-transparent overlay on mobile
  if (isMobile) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // Panel background
  ctx.fillStyle = '#2a1a0a';
  ctx.fillRect(PANEL_X, PANEL_Y, PANEL_W, PANEL_H);
  ctx.strokeStyle = '#8D6E63';
  ctx.lineWidth = 2;
  ctx.strokeRect(PANEL_X, PANEL_Y, PANEL_W, PANEL_H);

  // Clip to panel
  ctx.save();
  ctx.beginPath();
  ctx.rect(PANEL_X, PANEL_Y, PANEL_W, PANEL_H);
  ctx.clip();

  const HEADER_H = 110;
  const PAD = 14;

  // Header background
  ctx.fillStyle = '#3E2723';
  ctx.fillRect(PANEL_X, PANEL_Y, PANEL_W, HEADER_H);
  ctx.strokeStyle = '#5D4037';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(PANEL_X, PANEL_Y + HEADER_H);
  ctx.lineTo(PANEL_X + PANEL_W, PANEL_Y + HEADER_H);
  ctx.stroke();

  // Title
  ctx.fillStyle = '#FFD54F';
  ctx.font = 'bold 18px "Comic Sans MS", cursive';
  ctx.textAlign = 'left';
  ctx.fillText('📖 Adventure Journal', PANEL_X + PAD, PANEL_Y + 30);

  // Close button
  const closeBtnX = PANEL_X + PANEL_W - 36;
  const closeBtnY = PANEL_Y + 8;
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  roundRect(closeBtnX, closeBtnY, 30, 30, 6);
  ctx.fill();
  ctx.fillStyle = '#FFECB3';
  ctx.font = 'bold 16px "Comic Sans MS", cursive';
  ctx.textAlign = 'center';
  ctx.fillText('×', closeBtnX + 15, closeBtnY + 21);

  // Progress bar
  const BAR_X = PANEL_X + PAD;
  const BAR_Y = PANEL_Y + 44;
  const BAR_W = PANEL_W - PAD * 2;
  const BAR_H = 14;
  ctx.fillStyle = '#4E342E';
  roundRect(BAR_X, BAR_Y, BAR_W, BAR_H, 7);
  ctx.fill();
  const fillW = total > 0 ? (done / total) * BAR_W : 0;
  if (fillW > 0) {
    ctx.fillStyle = done === total ? '#FFD54F' : '#FF8F00';
    roundRect(BAR_X, BAR_Y, fillW, BAR_H, 7);
    ctx.fill();
  }

  // Progress text
  ctx.fillStyle = '#FFECB3';
  ctx.font = '13px "Comic Sans MS", cursive';
  ctx.textAlign = 'left';
  const progressText = done === total && total > 0
    ? `🎉 All ${total} adventures complete!`
    : `${done} of ${total} adventures complete`;
  ctx.fillText(progressText, BAR_X, BAR_Y + BAR_H + 16);

  // Keyboard hint (desktop only)
  if (!isMobile) {
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.font = '10px "Comic Sans MS", cursive';
    ctx.textAlign = 'right';
    ctx.fillText('J to close', PANEL_X + PANEL_W - PAD, BAR_Y + BAR_H + 16);
  }

  // Completed entries list
  const ITEM_H = 68;
  const listTop = PANEL_Y + HEADER_H + 6;
  const scrollY = Math.round(journalScroll);

  ctx.save();
  ctx.beginPath();
  ctx.rect(PANEL_X, listTop, PANEL_W, PANEL_H - HEADER_H);
  ctx.clip();

  // Calculate max scroll
  const totalHeight = done * ITEM_H + 8;
  const maxScroll = Math.max(0, totalHeight - (PANEL_H - HEADER_H));
  journalScrollTarget = Math.min(journalScrollTarget, maxScroll);
  journalScroll = Math.min(journalScroll, maxScroll);

  if (done === 0) {
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.font = '13px "Comic Sans MS", cursive';
    ctx.textAlign = 'center';
    ctx.fillText('No adventures yet!', PANEL_X + PANEL_W / 2, listTop + 40);
    ctx.fillText('Pick up items and use them', PANEL_X + PANEL_W / 2, listTop + 60);
    ctx.fillText('at other spots to fill your journal.', PANEL_X + PANEL_W / 2, listTop + 80);
  }

  for (let i = 0; i < done; i++) {
    const entry = completedUses[done - 1 - i]; // newest first
    const ey = listTop + 8 + i * ITEM_H - scrollY;
    if (ey + ITEM_H < listTop || ey > PANEL_Y + PANEL_H) continue;

    // Card background
    ctx.fillStyle = i % 2 === 0 ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.1)';
    ctx.fillRect(PANEL_X + 4, ey, PANEL_W - 8, ITEM_H - 4);

    // Emoji
    ctx.font = '28px serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(entry.itemEmoji, PANEL_X + 30, ey + 36);

    // Item name + hotspot
    ctx.fillStyle = '#FFD54F';
    ctx.font = 'bold 13px "Comic Sans MS", cursive';
    ctx.textAlign = 'left';
    ctx.fillText(entry.itemName, PANEL_X + 52, ey + 18);

    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = '11px "Comic Sans MS", cursive';
    ctx.fillText('at ' + entry.hotspotName, PANEL_X + 52, ey + 33);

    // Use text (truncated to 2 lines)
    ctx.fillStyle = '#FFECB3';
    ctx.font = '11px "Comic Sans MS", cursive';
    wrapTextMaxLines(entry.text, PANEL_X + 52, ey + 49, PANEL_W - 64, 14, 2);

    // Separator
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(PANEL_X + 8, ey + ITEM_H - 4);
    ctx.lineTo(PANEL_X + PANEL_W - 8, ey + ITEM_H - 4);
    ctx.stroke();
  }

  ctx.restore(); // restore list clip
  ctx.restore(); // restore panel clip
}

function wrapTextMaxLines(text, x, y, maxWidth, lineHeight, maxLines) {
  const words = text.split(' ');
  let line = '';
  let lineY = y;
  let lineCount = 0;
  for (const word of words) {
    const testLine = line + word + ' ';
    if (ctx.measureText(testLine).width > maxWidth && line) {
      if (lineCount >= maxLines - 1) {
        // Truncate last line with ellipsis
        let truncated = line.trim();
        while (ctx.measureText(truncated + '…').width > maxWidth && truncated.length > 0) {
          truncated = truncated.slice(0, -1);
        }
        ctx.fillText(truncated + '…', x, lineY);
        return;
      }
      ctx.fillText(line.trim(), x, lineY);
      line = word + ' ';
      lineY += lineHeight;
      lineCount++;
    } else {
      line = testLine;
    }
  }
  if (lineCount < maxLines) ctx.fillText(line.trim(), x, lineY);
}

// --- Item Use Dialog ---

  const panelH = 290;

  ctx.save();
  ctx.translate(canvas.width / 2, canvas.height / 2);
  ctx.scale(scale, scale);
  ctx.translate(-canvas.width / 2, -canvas.height / 2);

  // Panel
  ctx.fillStyle = '#3E2723';
  ctx.strokeStyle = '#FFD54F';
  ctx.lineWidth = 3;
  roundRect(panelX, panelY, panelW, panelH, 16);

  ctx.stroke();

  // Inner border

  ctx.lineWidth = 1;
  roundRect(panelX + 6, panelY + 6, panelW - 12, panelH - 12, 12);

  // Item emoji (big, left side)
  const t = currentItemUse.timer * 0.1;
  ctx.font = '52px serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffffff';
  const emojiX = panelX + 58;
  const emojiY = panelY + 80 + Math.sin(t * 2) * 5;
  ctx.fillText(currentItemUse.item.emoji || '?', emojiX, emojiY);

  // Star burst around emoji (subtle)
  ctx.globalAlpha = 0.25 + Math.sin(t * 3) * 0.15;
  ctx.font = '16px serif';
  for (let i = 0; i < 6; i++) {
    const ang = (i / 6) * Math.PI * 2 + t;
    const starX = emojiX + Math.cos(ang) * 38;
    const starY = emojiY - 14 + Math.sin(ang) * 22;
    ctx.fillText('✨', starX, starY);
  }
  ctx.globalAlpha = 1;

  // Hotspot name
  ctx.fillStyle = '#FFD54F';
  ctx.font = 'bold 15px "Comic Sans MS", cursive';
  ctx.textAlign = 'left';
  ctx.fillText('At ' + currentItemUse.hotspot.name, panelX + 100, panelY + 34);

  // Item name
  ctx.fillStyle = '#FFECB3';
  ctx.font = 'bold 22px "Comic Sans MS", cursive';
  ctx.fillText(currentItemUse.item.name, panelX + 100, panelY + 60);

  // Use text with typewriter effect (left-aligned in right column)
  ctx.fillStyle = '#FFECB3';
  ctx.font = '16px "Comic Sans MS", cursive';
  ctx.textAlign = 'left';
  const text = currentItemUse.use.text;
  const visibleChars = Math.min(text.length, Math.floor(currentItemUse.timer * 1.1));
  const displayText = text.substring(0, visibleChars);
  wrapText(displayText, panelX + 104, panelY + 100, panelW - 124, 22);

  // Action animation at bottom
  drawActionAnimation(currentItemUse.animation, canvas.width / 2, panelY + panelH - 55, currentItemUse.timer);

  // Close hint
  ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
  ctx.font = '12px "Comic Sans MS", cursive';
  ctx.textAlign = 'center';
  ctx.fillText(isTouchDevice() ? 'Tap to close' : 'Press Space or Esc to close', canvas.width / 2, panelY + panelH - 15);

  ctx.restore();

  // Journal still shows on top
  drawJournal();
}

function drawCompletionToast() {
  if (!completionToast) return;
  completionToast.age++;
  const DURATION = 180;
  if (completionToast.age > DURATION) { completionToast = null; return; }
  const alpha = completionToast.age < 30
    ? completionToast.age / 30
    : completionToast.age > DURATION - 30
      ? (DURATION - completionToast.age) / 30
      : 1;
  ctx.save();
  ctx.globalAlpha = alpha;
  const panelW = Math.min(420, canvas.width - 40);
  const panelH = 90;
  const panelX = canvas.width / 2 - panelW / 2;
  const panelY = canvas.height / 2 - 160;
  ctx.fillStyle = '#1B5E20';
  ctx.strokeStyle = '#FFD54F';
  ctx.lineWidth = 3;
  roundRect(panelX, panelY, panelW, panelH, 16);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#FFD54F';
  ctx.font = 'bold 22px "Comic Sans MS", cursive';
  ctx.textAlign = 'center';
  ctx.fillText('🎉 ALL ADVENTURES COMPLETE! 🎉', canvas.width / 2, panelY + 38);
  ctx.fillStyle = '#FFECB3';
  ctx.font = '15px "Comic Sans MS", cursive';
  ctx.fillText('Amazing job, explorer! 🌟', canvas.width / 2, panelY + 64);
  ctx.restore();
}

function drawInteraction() {
  drawGame();

  interactionAnimation = Math.min(1, interactionAnimation + 0.05);
  interactionTimer++;

  // --- Usable items (in backpack, valid use, not done) ---
  const usableItems = backpack.filter(item => {
    if (!item) return false;
    return getItemUseAtHotspot(item, currentInteraction) && !isUseAlreadyDone(item.id, currentInteraction.id);
  });

  // --- Dimmed items (use defined here, NOT in backpack, not done) ---
  const backpackItemIds = new Set(backpack.filter(Boolean).map(i => i.id));
  const dimmedItems = [];
  const hotspotDef = mapConfig && mapConfig.hotspots.find(h => h.id === currentInteraction.id);
  for (const useEntry of (hotspotDef && hotspotDef.uses || [])) {
    if (isUseAlreadyDone(useEntry.itemId, currentInteraction.id)) continue;
    if (backpackItemIds.has(useEntry.itemId)) continue;
    let itemInfo = null, location = null;
    for (const hId of Object.keys(hotspotItems)) {
      const found = (hotspotItems[hId] || []).find(it => it.id === useEntry.itemId);
      if (found) {
        const hDef = mapConfig.hotspots.find(h => h.id === hId);
        itemInfo = found; location = hDef ? hDef.name : hId; break;
      }
    }
    if (!itemInfo && mapConfig) {
      for (const h of mapConfig.hotspots) {
        const found = (h.items || []).find(it => it.id === useEntry.itemId);
        if (found) { itemInfo = found; location = h.name; break; }
      }
    }
    if (itemInfo) dimmedItems.push({ ...itemInfo, location });
  }

  // --- Items sitting at this hotspot (can be picked up) ---
  const hereItems = hotspotItems[currentInteraction.id] || [];

  const hasAnyItems = hereItems.length > 0 || usableItems.length > 0 || dimmedItems.length > 0;

  // Overlay
  ctx.fillStyle = `rgba(0, 0, 0, ${0.5 * interactionAnimation})`;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // --- Compute panel height from content ---
  const panelW = Math.min(500, canvas.width - 40);
  const CONTENT_END = 140; // px from panelY where the text section ends
  const CLOSE_H    = 22;
  const BTN_SIZE   = 38;
  const LABEL_H    = 16;
  const GAP_H      = 8;

  let stripH = 0;
  if (hasAnyItems) {
    stripH += 14; // separator
    if (hereItems.length > 0) stripH += LABEL_H + BTN_SIZE;
    if (hereItems.length > 0 && (usableItems.length > 0 || dimmedItems.length > 0)) stripH += GAP_H;
    if (usableItems.length > 0) stripH += LABEL_H + BTN_SIZE;
    if (usableItems.length > 0 && dimmedItems.length > 0) stripH += GAP_H;
    if (dimmedItems.length > 0) stripH += LABEL_H + BTN_SIZE;
    if (hereItems.length > 0 || dimmedItems.length > 0) stripH += LABEL_H; // hint line
  }
  const panelH = CONTENT_END + stripH + CLOSE_H;

  const panelX = canvas.width / 2 - panelW / 2;
  const panelY = Math.max(10, Math.min(canvas.height - panelH - 10, canvas.height / 2 - panelH / 2));
  const scale  = interactionAnimation;

  ctx.save();
  ctx.translate(canvas.width / 2, canvas.height / 2);
  ctx.scale(scale, scale);
  ctx.translate(-canvas.width / 2, -canvas.height / 2);

  // Panel background
  ctx.fillStyle  = '#3E2723';
  ctx.strokeStyle = '#8D6E63';
  ctx.lineWidth   = 3;
  roundRect(panelX, panelY, panelW, panelH, 16);
  ctx.fill(); ctx.stroke();

  // Inner border
  ctx.strokeStyle = '#5D4037';
  ctx.lineWidth   = 1;
  roundRect(panelX + 6, panelY + 6, panelW - 12, panelH - 12, 12);
  ctx.stroke();

  // Object name
  ctx.fillStyle = '#FFD54F';
  ctx.font      = 'bold 24px "Comic Sans MS", cursive';
  ctx.textAlign = 'center';
  ctx.fillText(currentInteraction.name, canvas.width / 2, panelY + 45);

  // Interaction text (typewriter + word-wrap)
  const text = currentInteraction.interactionText;
  ctx.fillStyle = '#FFECB3';
  ctx.font      = '18px "Comic Sans MS", cursive';
  ctx.textAlign = 'center';
  const visibleChars = Math.min(text.length, Math.floor(interactionTimer * 0.8));
  wrapText(text.substring(0, visibleChars), canvas.width / 2, panelY + 85, panelW - 40, 24);

  // --- Items strip (running-Y layout) ---
  interactionUseRects  = [];
  interactionDimmedRects = [];
  interactionHereRects = [];
  let curY = panelY + CONTENT_END;

  if (hasAnyItems) {
    // Separator
    ctx.strokeStyle = 'rgba(141, 110, 99, 0.6)';
    ctx.lineWidth   = 1;
    ctx.beginPath();
    ctx.moveTo(panelX + 20, curY);
    ctx.lineTo(panelX + panelW - 20, curY);
    ctx.stroke();
    curY += 14;

    // Row helper: draws a row of emoji buttons, returns array of rects
    function drawItemRow(items, dimmed) {
      const slice   = items.slice(0, 9);
      const totalW  = slice.length * (BTN_SIZE + 6) - 6;
      const startX  = panelX + panelW / 2 - totalW / 2;
      const rowRects = [];
      slice.forEach((item, i) => {
        const bx = startX + i * (BTN_SIZE + 6);
        ctx.globalAlpha = dimmed ? 0.38 : 1.0;
        ctx.fillStyle   = dimmed ? 'rgba(120,120,120,0.12)' : 'rgba(255,213,79,0.15)';
        ctx.strokeStyle = dimmed ? '#8D6E63' : '#FFD54F';
        ctx.lineWidth   = 1.5;
        if (dimmed) ctx.setLineDash([3, 3]);
        roundRect(bx, curY, BTN_SIZE, BTN_SIZE, 8);
        ctx.fill(); ctx.stroke();
        ctx.setLineDash([]);
        ctx.font      = `${Math.floor(BTN_SIZE * 0.58)}px serif`;
        ctx.textAlign = 'center';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(item.emoji || '?', bx + BTN_SIZE / 2, curY + BTN_SIZE * 0.73);
        ctx.globalAlpha = 1.0;
        rowRects.push({ x: bx, y: curY, w: BTN_SIZE, h: BTN_SIZE, item });
      });
      return rowRects;
    }

    // 🧺 Items at this hotspot row
    if (hereItems.length > 0) {
      ctx.fillStyle = '#FFD54F';
      ctx.font      = 'bold 12px "Comic Sans MS", cursive';
      ctx.textAlign = 'left';
      ctx.fillText(`🧺 Here (${isTouchDevice() ? 'tap' : 'click'} to pick up):`, panelX + 20, curY + 12);
      curY += LABEL_H;
      const rects = drawItemRow(hereItems, false);
      rects.forEach((r, index) => interactionHereRects.push({ ...r, index }));
      curY += BTN_SIZE;
      if (usableItems.length > 0 || dimmedItems.length > 0) curY += GAP_H;
    }

    // ✨ Usable items row
    if (usableItems.length > 0) {
      ctx.fillStyle = '#FFD54F';
      ctx.font      = 'bold 12px "Comic Sans MS", cursive';
      ctx.textAlign = 'left';
      ctx.fillText('✨ In your backpack:', panelX + 20, curY + 12);
      curY += LABEL_H;
      const rects = drawItemRow(usableItems, false);
      rects.forEach(r => interactionUseRects.push(r));
      curY += BTN_SIZE;
      if (dimmedItems.length > 0) curY += GAP_H;
    }

    // 🔍 Dimmed items row
    if (dimmedItems.length > 0) {
      ctx.fillStyle = 'rgba(255,236,179,0.6)';
      ctx.font      = 'bold 12px "Comic Sans MS", cursive';
      ctx.textAlign = 'left';
      ctx.fillText('🔍 Find to use here:', panelX + 20, curY + 12);
      curY += LABEL_H;
      const rects = drawItemRow(dimmedItems, true);
      rects.forEach(r => interactionDimmedRects.push({ ...r, location: r.item.location }));
      curY += BTN_SIZE;
    }

    // Hint line (pick-up feedback, or where to find a faded item)
    if (hereItems.length > 0 || dimmedItems.length > 0) {
      curY += 6;
      let hintMsg = interactionHintText;
      if (!hintMsg && dimmedItems.length > 0) {
        hintMsg = isTouchDevice() ? 'Tap a faded item to see where to find it'
                                  : 'Hover a faded item to see where to find it';
      }
      if (hintMsg) {
        ctx.fillStyle = interactionHintText ? '#FFD54F' : 'rgba(255,236,179,0.45)';
        ctx.font      = `${interactionHintText ? 'bold ' : ''}11px "Comic Sans MS", cursive`;
        ctx.textAlign = 'center';
        ctx.fillText(hintMsg, canvas.width / 2, curY + 10, panelW - 30);
      }
    }
  }

  // Close hint
  ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
  ctx.font      = '13px "Comic Sans MS", cursive';
  ctx.textAlign = 'center';
  ctx.fillText(isTouchDevice() ? 'Tap outside to close' : 'Press Space or Esc to close',
    canvas.width / 2, panelY + panelH - 10);

  ctx.restore();
}

function drawActionAnimation(action, x, y, timer) {
  const t = timer * 0.1;
  ctx.font = '28px serif';
  ctx.textAlign = 'center';

  switch (action) {
    case 'sleep': {
      for (let i = 0; i < 3; i++) {
        const zx = x - 30 + i * 30;
        const zy = y - Math.sin(t + i) * 8;
        const size = 16 + i * 6;
        ctx.globalAlpha = 0.5 + Math.sin(t + i) * 0.3;
        ctx.font = `${size}px "Comic Sans MS", cursive`;
        ctx.fillStyle = '#90CAF9';
        ctx.fillText('z', zx, zy);
      }
      ctx.globalAlpha = 1;
      break;
    }
    case 'fly': {
      const fx = Math.sin(t * 2) * 40;
      const fy = Math.cos(t * 3) * 10;
      ctx.fillText('✈️', x + fx, y + fy);
      // Trail
      for (let i = 1; i <= 3; i++) {
        ctx.globalAlpha = 0.3 / i;
        ctx.fillText('·', x + fx - i * 12, y + fy + i * 2);
      }
      ctx.globalAlpha = 1;
      break;
    }
    case 'cook': {
      const flames = ['🔥', '🍳', '🔥'];
      flames.forEach((f, i) => {
        const fofs = Math.sin(t * 3 + i * 2) * 5;
        ctx.fillText(f, x - 30 + i * 30, y + fofs);
      });
      break;
    }
    case 'stargaze': {
      for (let i = 0; i < 5; i++) {
        const sx = x - 60 + i * 30;
        const sy = y + Math.sin(t * 2 + i) * 6;
        ctx.globalAlpha = 0.5 + Math.sin(t + i * 1.5) * 0.5;
        ctx.fillStyle = '#FFD54F';
        ctx.font = `${14 + Math.sin(t + i) * 4}px serif`;
        ctx.fillText('⭐', sx, sy);
      }
      ctx.globalAlpha = 1;
      break;
    }
    case 'play': {
      const bx = x + Math.sin(t * 4) * 30;
      const by = y - Math.abs(Math.sin(t * 3)) * 20;
      ctx.fillText('⚾', bx, by);
      break;
    }
    case 'wash': {
      const drops = ['💧', '💧', '💧'];
      drops.forEach((d, i) => {
        const dy = Math.sin(t * 2 + i * 2) * 8;
        ctx.globalAlpha = 0.5 + Math.sin(t + i) * 0.5;
        ctx.fillText(d, x - 25 + i * 25, y + dy);
      });
      ctx.globalAlpha = 1;
      break;
    }
    case 'eat': {
      ctx.fillText('🍱', x, y + Math.sin(t) * 3);
      break;
    }
    case 'bathroom': {
      // flush! a spinning swirl with water drops orbiting it
      ctx.save();
      ctx.translate(x, y - 10);
      ctx.rotate(-t * 1.5);
      ctx.fillText('🌀', 0, 10);
      ctx.restore();
      for (let i = 0; i < 3; i++) {
        const a = t * 2 + i * (Math.PI * 2 / 3);
        ctx.globalAlpha = 0.6 + Math.sin(t + i) * 0.4;
        ctx.fillText('💧', x + Math.cos(a) * 38, y - 10 + Math.sin(a) * 14 + 10);
      }
      ctx.globalAlpha = 1;
      break;
    }
    default: {
      const bounce = Math.sin(t * 2) * 5;
      ctx.fillText('✨', x, y + bounce);
    }
  }
}

// Split `text` into lines no wider than maxWidth (in the current ctx.font)
function wrapLines(text, maxWidth) {
  const lines = [];
  let line = '';
  for (const word of String(text).split(' ')) {
    const test = line ? line + ' ' + word : word;
    if (line && ctx.measureText(test).width > maxWidth) {
      lines.push(line);
      line = word;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  return lines;
}

function wrapText(text, x, y, maxWidth, lineHeight) {
  const words = text.split(' ');
  let line = '';
  let lineY = y;

  for (const word of words) {
    const testLine = line + word + ' ';
    const metrics = ctx.measureText(testLine);
    if (metrics.width > maxWidth && line) {
      ctx.fillText(line.trim(), x, lineY);
      line = word + ' ';
      lineY += lineHeight;
    } else {
      line = testLine;
    }
  }
  ctx.fillText(line.trim(), x, lineY);
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

function roundRectPath(x, y, w, h, r) {
  roundRect(x, y, w, h, r);
}

// --- Resume / Start Fresh prompt ---
function resumePromptButtonRects() {
  const panelW = Math.min(420, canvas.width - 40);
  const panelH = 170;
  const panelY = canvas.height / 2 - panelH / 2;
  const btnW = 130, btnH = 40, btnY = panelY + panelH - 56, btnGap = 18;
  const resumeX = canvas.width / 2 - btnW - btnGap / 2;
  const freshX = canvas.width / 2 + btnGap / 2;
  return [
    { id: 'resume', x: resumeX, y: btnY, w: btnW, h: btnH },
    { id: 'fresh',  x: freshX,  y: btnY, w: btnW, h: btnH }
  ];
}

function drawResumePrompt() {
  // Faded map background, like character select
  ctx.fillStyle = '#1a3a1a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (mapImage) {
    ctx.globalAlpha = 0.15;
    const scale = Math.max(canvas.width / mapImage.naturalWidth, canvas.height / mapImage.naturalHeight);
    ctx.drawImage(mapImage, 0, 0, mapImage.naturalWidth * scale, mapImage.naturalHeight * scale);
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const panelW = Math.min(420, canvas.width - 40);
  const panelH = 170;
  const panelX = canvas.width / 2 - panelW / 2;
  const panelY = canvas.height / 2 - panelH / 2;

  ctx.fillStyle = '#3E2723';
  ctx.strokeStyle = '#8D6E63';
  ctx.lineWidth = 3;
  roundRect(panelX, panelY, panelW, panelH, 16);
  ctx.fill();
  ctx.stroke();

  ctx.strokeStyle = '#5D4037';
  ctx.lineWidth = 1;
  roundRect(panelX + 6, panelY + 6, panelW - 12, panelH - 12, 12);
  ctx.stroke();

  ctx.fillStyle = '#FFD54F';
  ctx.font = 'bold 22px "Comic Sans MS", cursive';
  ctx.textAlign = 'center';
  ctx.fillText('Welcome back, ' + (player.character ? player.character.name : '') + '!', canvas.width / 2, panelY + 50);

  ctx.fillStyle = '#FFECB3';
  ctx.font = '15px "Comic Sans MS", cursive';
  ctx.fillText('Resume your adventure or start fresh?', canvas.width / 2, panelY + 80);

  const btns = resumePromptButtonRects();
  const labels = { resume: 'Resume (R)', fresh: 'Start Fresh (F)' };
  const colors = { resume: '#4CAF50', fresh: '#F44336' };
  ctx.font = 'bold 15px "Comic Sans MS", cursive';
  for (const b of btns) {
    ctx.fillStyle = colors[b.id];
    roundRect(b.x, b.y, b.w, b.h, 8);
    ctx.fill();
    ctx.fillStyle = 'white';
    ctx.textAlign = 'center';
    ctx.fillText(labels[b.id], b.x + b.w / 2, b.y + 26);
  }
}

// --- Backpack overlay ---
function backpackMetrics() {
  const slotSize = Math.max(36, Math.min(64, Math.floor((canvas.width - 40) / 11)));
  const gap = Math.max(4, Math.floor(slotSize * 0.15));
  const padding = 12;
  const backpackRowW = BACKPACK_CAPACITY * slotSize + (BACKPACK_CAPACITY - 1) * gap;
  const hotspotRowW = HOTSPOT_CAPACITY * slotSize + (HOTSPOT_CAPACITY - 1) * gap;
  const hasHotspotRow = !!nearbyObject;
  const rowSpacing = 14;
  const labelH = 22;
  const titleH = 24;
  const overlayBottomMargin = 12;

  const backpackRowY = canvas.height - overlayBottomMargin - slotSize;
  const hotspotRowY = hasHotspotRow
    ? backpackRowY - slotSize - rowSpacing - labelH
    : backpackRowY;
  const overlayTop = (hasHotspotRow ? hotspotRowY - labelH : backpackRowY) - titleH - padding;

  const backpackRowX = canvas.width / 2 - backpackRowW / 2;
  const hotspotRowX = canvas.width / 2 - hotspotRowW / 2;

  return { slotSize, gap, padding, backpackRowW, hotspotRowW, hasHotspotRow, rowSpacing, labelH, titleH, overlayBottomMargin, backpackRowY, hotspotRowY, overlayTop, backpackRowX, hotspotRowX };
}

function backpackOverlayTop() {
  return backpackMetrics().overlayTop;
}

function drawBackpackSlot(x, y, size, item, isSelected, isAvailable) {
  const r = Math.max(6, size * 0.16);
  // Solid dark base for both states so the emoji always has consistent contrast
  ctx.fillStyle = 'rgba(62, 39, 35, 0.92)';
  roundRect(x, y, size, size, r);
  ctx.fill();

  ctx.strokeStyle = isSelected ? '#FFD600' : (isAvailable ? '#8D6E63' : '#5D4037');
  ctx.lineWidth = isSelected ? 3 : 1.5;
  roundRect(x, y, size, size, r);
  ctx.stroke();

  if (item) {
    ctx.fillStyle = '#ffffff';
    ctx.font = `${Math.floor(size * 0.6)}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(item.emoji || '?', x + size / 2, y + size / 2 + 2);
    ctx.textBaseline = 'alphabetic';
  }
}

function drawBackpack() {
  const m = backpackMetrics();
  backpackSlotRects = { backpack: [], hotspot: [] };

  // Panel background
  const panelX = 8;
  const panelY = m.overlayTop;
  const panelW = canvas.width - 16;
  const panelH = canvas.height - panelY - 4;
  ctx.fillStyle = 'rgba(20, 12, 6, 0.78)';
  ctx.strokeStyle = '#5D4037';
  ctx.lineWidth = 2;
  roundRect(panelX, panelY, panelW, panelH, 12);
  ctx.fill();
  ctx.stroke();

  // Title
  ctx.fillStyle = '#FFD54F';
  ctx.font = 'bold 15px "Comic Sans MS", cursive';
  ctx.textAlign = 'left';
  ctx.fillText(`🎒 Backpack (${backpack.length}/${BACKPACK_CAPACITY})`, panelX + 14, panelY + 18);

  ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
  ctx.font = '11px "Comic Sans MS", cursive';
  ctx.textAlign = 'right';
  const hint = nearbyObject
    ? '← → select  •  ↑ ↓ switch row  •  Enter act  •  B/Esc close'
    : '← → select  •  B/Esc close  •  (move to a spot to pick up)';
  ctx.fillText(hint, panelX + panelW - 14, panelY + 18);

  // Hotspot row (if applicable)
  if (m.hasHotspotRow) {
    const items = hotspotItems[nearbyObject.id] || [];
    ctx.fillStyle = '#FFECB3';
    ctx.font = 'bold 12px "Comic Sans MS", cursive';
    ctx.textAlign = 'center';
    ctx.fillText('At ' + nearbyObject.name, canvas.width / 2, m.hotspotRowY - 6);

    for (let i = 0; i < HOTSPOT_CAPACITY; i++) {
      const x = m.hotspotRowX + i * (m.slotSize + m.gap);
      const y = m.hotspotRowY;
      const isSelected = backpackOpen && backpackSelection.row === 'hotspot' && backpackSelection.col === i;
      drawBackpackSlot(x, y, m.slotSize, items[i] || null, isSelected, true);
      backpackSlotRects.hotspot.push({ x, y, w: m.slotSize, h: m.slotSize, col: i });
    }
  }

  // Backpack row
  for (let i = 0; i < BACKPACK_CAPACITY; i++) {
    const x = m.backpackRowX + i * (m.slotSize + m.gap);
    const y = m.backpackRowY;
    const isSelected = backpackOpen && backpackSelection.row === 'backpack' && backpackSelection.col === i;
    drawBackpackSlot(x, y, m.slotSize, backpack[i] || null, isSelected, true);
    backpackSlotRects.backpack.push({ x, y, w: m.slotSize, h: m.slotSize, col: i });
  }

  // Selected item name tooltip — below the slot for the hotspot row (the
  // "At <name>" header sits above and shouldn't be overlapped); above the
  // backpack row since it's anchored at the very bottom of the canvas.
  const item = selectedItem();
  if (item) {
    const isBackpackRow = backpackSelection.row === 'backpack';
    const rects = isBackpackRow ? backpackSlotRects.backpack : backpackSlotRects.hotspot;
    const r = rects[backpackSelection.col];
    if (r) {
      ctx.font = 'bold 13px "Comic Sans MS", cursive';
      ctx.textAlign = 'center';
      const label = item.name;
      const labelW = ctx.measureText(label).width + 14;
      const labelX = Math.max(8, Math.min(canvas.width - labelW - 8, r.x + r.w / 2 - labelW / 2));
      const labelY = isBackpackRow ? r.y - 22 : r.y + r.h + 4;
      ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
      roundRect(labelX, labelY, labelW, 20, 5);
      ctx.fill();
      ctx.fillStyle = '#FFEB3B';
      ctx.fillText(label, labelX + labelW / 2, labelY + 14);
    }
  }
}

// --- Use toast (transient floating message) ---
function drawUseToast() {
  if (!useToast) return;
  useToast.age++;
  // Kitchen messages sit low (out of the way of the stations) and stay longer
  const life = useToast.low ? 170 : 90;
  if (useToast.age > life) { useToast = null; return; }
  const alpha = useToast.age < life - 30 ? 1 : 1 - (useToast.age - (life - 30)) / 30;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = 'bold 18px "Comic Sans MS", cursive';
  ctx.textAlign = 'center';
  const w = ctx.measureText(useToast.text).width + 28;
  const y = useToast.low ? canvas.height - 60 : canvas.height * 0.35;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
  roundRect(canvas.width / 2 - w / 2, y - 24, w, 36, 10);
  ctx.fill();
  ctx.fillStyle = '#FFEB3B';
  ctx.fillText(useToast.text, canvas.width / 2, y);
  ctx.restore();
}

// --- Item action modal ---
function drawItemActionDialog() {
  drawGame();
  if (backpackOpen) drawBackpack();

  ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const a = currentItemAction;
  const item = a && (a.source === 'backpack'
    ? backpack[a.index]
    : (hotspotItems[a.hotspotId] || [])[a.index]);
  if (!item) { closeItemAction(); return; }

  const panelW = Math.min(440, canvas.width - 40);
  const panelH = 200;
  const panelX = canvas.width / 2 - panelW / 2;
  const panelY = canvas.height / 2 - panelH / 2;

  ctx.fillStyle = '#3E2723';
  ctx.strokeStyle = '#8D6E63';
  ctx.lineWidth = 3;
  roundRect(panelX, panelY, panelW, panelH, 16);
  ctx.fill();
  ctx.stroke();

  ctx.strokeStyle = '#5D4037';
  ctx.lineWidth = 1;
  roundRect(panelX + 6, panelY + 6, panelW - 12, panelH - 12, 12);
  ctx.stroke();

  // Emoji + name
  ctx.font = '36px serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffffff';
  ctx.fillText(item.emoji || '?', canvas.width / 2 - 80, panelY + 60);

  ctx.fillStyle = '#FFD54F';
  ctx.font = 'bold 22px "Comic Sans MS", cursive';
  ctx.fillText(item.name, canvas.width / 2 + 30, panelY + 50);

  ctx.fillStyle = '#FFECB3';
  ctx.font = '13px "Comic Sans MS", cursive';
  const src = a.source === 'backpack' ? 'In your backpack' : 'At ' + (nearbyObject ? nearbyObject.name : 'this spot');
  ctx.fillText(src, canvas.width / 2 + 30, panelY + 75);

  // Buttons
  const btns = itemActionButtons();
  const btnW = Math.min(120, Math.floor((panelW - 60) / btns.length));
  const btnH = 40;
  const btnGap = 12;
  const totalW = btnW * btns.length + btnGap * (btns.length - 1);
  const startX = canvas.width / 2 - totalW / 2;
  const btnY = panelY + panelH - 60;
  itemActionButtonRects = [];

  const colorMap = { pickup: '#4CAF50', pickup_use: '#FF9800', drop: '#4CAF50', use: '#FF9800', cancel: '#757575' };

  ctx.font = 'bold 14px "Comic Sans MS", cursive';
  for (let i = 0; i < btns.length; i++) {
    const b = btns[i];
    const x = startX + i * (btnW + btnGap);
    const isFocused = i === backpackActionButton;
    const baseColor = colorMap[b.id] || '#5D4037';
    ctx.fillStyle = b.disabled ? '#555' : baseColor;
    roundRect(x, btnY, btnW, btnH, 8);
    ctx.fill();
    if (isFocused) {
      ctx.strokeStyle = '#FFD600';
      ctx.lineWidth = 3;
      roundRect(x, btnY, btnW, btnH, 8);
      ctx.stroke();
    }
    ctx.fillStyle = b.disabled ? '#999' : 'white';

// ============================================================
// START MENU + MULTIPLAYER (shared worlds over PubNub)
// ============================================================
// Single player works exactly as before. In multi player, everyone in a
// world subscribes to one PubNub channel, `louisas-game.world.<6-digit code>`,
// and sends small JSON messages to it (see "Multiplayer" in CLAUDE.md):
//
//   pos   — where I am (map + 0–1 fractions), facing, walking, held food.
//           Sent ~8×/s while moving, every 2.5s while standing still.
//   hello — "I just arrived": others answer with `pos`, and one of them
//           answers with `snap` (where every item in the world is).
//   snap  — { to, at, items: { mapPath: { hotspotId: [item] } } }
//   take / drop — item moves. Nobody applies these when they click: every
//           computer applies them in the order PubNub delivers them (the
//           channel's timetoken order), so all computers agree on who got
//           an item first. The clicker learns the result when its own
//           message comes back.
//   say   — a speech bubble line (player → friend / NPC, or an NPC's reply).
//   bye   — I left (also inferred after 9s of silence).
//
// There's no server: whoever is in the world holds its state. Each computer
// also keeps a copy in localStorage so a world can be re-opened later.
const PUBNUB_PUBLISH_KEY   = 'pub-c-02631177-4938-4aab-916c-c66de3caad38';
const PUBNUB_SUBSCRIBE_KEY = 'sub-c-ba97efde-d572-48e8-82d6-a06e2b5b0738';
const MP_CHANNEL_PREFIX = 'louisas-game.world.';
const MP_MAIN_MAP       = 'assets/game_design.json';
const MP_POS_EVERY_MS   = 120;    // position updates while moving
const MP_HEARTBEAT_MS   = 2500;   // "still here" while standing still
const MP_TIMEOUT_MS     = 9000;   // forget a friend we haven't heard from
const MP_JOIN_WAIT_MS   = 3500;   // wait this long for someone to answer `hello`

function mpRandomId() {
  const a = new Uint32Array(2);
  crypto.getRandomValues(a);
  return 'p-' + a[0].toString(36) + a[1].toString(36);
}

const mp = {
  active: false,           // in a multiplayer world (or joining one)
  code: null,              // '123456'
  channel: null,
  pubnub: null,
  myId: mpRandomId(),      // one per open tab
  session: 0,              // bumped on leave, so stale async work bails out
  connectWaiter: null,
  connected: false,
  wasDisconnected: false,
  synced: false,           // we know where every item in the world is
  lastOpTT: 0n,            // timetoken of the last take/drop applied
  buffer: [],              // take/drops that arrived before we were synced
  items: {},               // mapPath → hotspotId → item[]   (the shared world)
  mapConfigs: {},          // mapPath → config (every map, for default items)
  players: new Map(),      // playerId → remote player (see mpOnPos)
  pendingTakes: new Set(), // `${map}|${hotspot}|${itemId}` waiting for the echo
  pendingDrops: new Map(), // `${map}|${hotspot}` → count waiting for the echo
  lastTaker: {},           // `${map}|${hotspot}|${itemId}` → playerId
  present: false,          // others can see us (we've sent a `pos`)
  lastPosAt: 0,
  lastPosKey: '',
  joinTimer: null,
  joinExtended: false,
  snapReplies: new Map(),  // joinerId → timer (cancelled if someone else answers)
  onSynced: null,
  cacheTimer: null
};

// --- Menu (HTML overlay) ---
const menuEl = document.getElementById('menu');
const MENU_SCREENS = ['menuMode', 'menuMulti', 'menuJoin', 'menuBusy', 'menuEmpty'];
let menuScreen = null;

function showMenu(id) {
  menuEl.hidden = false;
  menuScreen = id;
  for (const sId of MENU_SCREENS) document.getElementById(sId).hidden = sId !== id;
  const first = document.getElementById(id).querySelector('input, button');
  if (first) first.focus({ preventScroll: true });
}
function hideMenu() {
  if (menuEl.contains(document.activeElement)) document.activeElement.blur();
  menuEl.hidden = true;
  menuScreen = null;
}
function setMenuError(id, text) {
  document.getElementById(id).textContent = text || '';
}
function showBusy(text) {
  document.getElementById('busyText').textContent = text;
  showMenu('menuBusy');
}

function menuAction(act) {
  setMenuError('modeError');
  setMenuError('multiError');
  switch (act) {
    case 'single':
      mpLeave();
      hideMenu();
      state = GameState.CHARACTER_SELECT;
      break;
    case 'multi':
      if (!window.PubNub) {
        showMenu('menuMode');
        setMenuError('modeError', "Multi player needs the internet — couldn't load PubNub.");
        return;
      }
      mpLeave();
      showMenu('menuMulti');
      break;
    case 'mode':
      showMenu('menuMode');
      break;
    case 'create':
      mpCreateWorld();
      break;
    case 'join': {
      mpLeave();
      setMenuError('joinError');
      showMenu('menuJoin');
      document.getElementById('joinCode').select();
      break;
    }
    case 'cancel':
      mpLeave();
      showMenu('menuMulti');
      break;
    case 'joinAnyway':
      mp.onSynced = null;
      mpUseCachedWorld();
      mpEnterWorld();
      break;
  }
}

menuEl.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-act]');
  if (btn) menuAction(btn.dataset.act);
});
menuEl.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  const back = { menuMulti: 'mode', menuJoin: 'multi', menuBusy: 'cancel', menuEmpty: 'join' }[menuScreen];
  if (back) { e.preventDefault(); menuAction(back); }
});
const joinCodeInput = document.getElementById('joinCode');
joinCodeInput.addEventListener('input', () => {
  joinCodeInput.value = joinCodeInput.value.replace(/\D/g, '').slice(0, 6);
  setMenuError('joinError');
});
document.getElementById('menuJoin').addEventListener('submit', (e) => {
  e.preventDefault();
  const code = joinCodeInput.value.replace(/\D/g, '');
  if (code.length !== 6) {
    setMenuError('joinError', 'World codes have 6 numbers.');
    joinCodeInput.focus();
    return;
  }
  mpJoinWorld(code);
});

// Esc on the character screen / "← Back": back to single vs multi player
function backToModeSelect() {
  mpLeave();
  player.character = null;
  if (currentMapPath !== MP_MAIN_MAP) {
    loadMap(MP_MAIN_MAP);      // ends on the mode menu
  } else {
    state = GameState.MODE_SELECT;
    showMenu('menuMode');
  }
}

// "Switch camper?" → Yes. In a world you stay connected, but friends stop seeing you.
function goToCharacterSelect() {
  if (mp.active) mpSendBye();
  sidekick = null;
  npcLeavers = [];
  state = GameState.CHARACTER_SELECT;
  player.character = null;
}

// --- Creating / joining / leaving a world ---
async function mpCreateWorld() {
  const n = crypto.getRandomValues(new Uint32Array(1))[0];
  const code = String(100000 + (n % 900000));
  showBusy('Making a new world…');
  try {
    await mpOpen(code);
  } catch (err) {
    mpFail(err, 'menuMulti', 'multiError');
    return;
  }
  mp.synced = true;   // brand-new world: every item starts where the map JSON puts it
  mpEnterWorld();
}

async function mpJoinWorld(code) {
  showBusy(`Looking for world ${code}…`);
  try {
    await mpOpen(code);
  } catch (err) {
    mpFail(err, 'menuJoin', 'joinError');
    return;
  }
  mp.onSynced = mpEnterWorld;
  mpSend({ t: 'hello' });
  mpArmJoinTimer(MP_JOIN_WAIT_MS);
