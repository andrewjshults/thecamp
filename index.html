}

function drawHUD() {
  // Character name badge
  ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
  roundRect(10, 10, 160, 36, 8);
  ctx.fill();

  ctx.fillStyle = player.character.color;
  ctx.font = 'bold 16px "Comic Sans MS", cursive';
  ctx.textAlign = 'left';
  ctx.fillText('♦ ' + player.character.name, 20, 34);

  if (mp.active) drawMpHudBadge();

  // Mini instructions
  ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
  const instrText = isTouchDevice()
    ? 'Tap to move  •  Tap zone to interact'
    : '↑←↓→ Move  •  Space Interact  •  T Talk  •  Esc Menu';
  ctx.font = '12px "Comic Sans MS", cursive';
  ctx.textAlign = 'center';
  const instrW = ctx.measureText(instrText).width + 20;
  roundRect(canvas.width / 2 - instrW / 2, canvas.height - 36, instrW, 26, 6);
  ctx.fill();

  ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
  ctx.fillText(instrText, canvas.width / 2, canvas.height - 18);
}

function drawInteraction() {
  drawGame();

  interactionAnimation = Math.min(1, interactionAnimation + 0.05);
  interactionTimer++;

  // --- Usable items (in backpack, valid use, not done) ---
  const usableItems = backpack.filter(item => {
    if (!item) return false;
    return getItemUseAtHotspot(item, currentInteraction) && !isUseAlreadyDone(item.id, currentInteraction.id);
  });

  // --- Dimmed items (use defined here, NOT in backpack, not done) ---
  const backpackItemIds = new Set(backpack.filter(Boolean).map(i => i.id));
  const dimmedItems = [];
  const hotspotDef = mapConfig && mapConfig.hotspots.find(h => h.id === currentInteraction.id);
  for (const useEntry of (hotspotDef && hotspotDef.uses || [])) {
    if (isUseAlreadyDone(useEntry.itemId, currentInteraction.id)) continue;
    if (backpackItemIds.has(useEntry.itemId)) continue;
    let itemInfo = null, location = null;
    for (const hId of Object.keys(hotspotItems)) {
      const found = (hotspotItems[hId] || []).find(it => it.id === useEntry.itemId);
      if (found) {
        const hDef = mapConfig.hotspots.find(h => h.id === hId);
        itemInfo = found; location = hDef ? hDef.name : hId; break;
      }
    }
    if (!itemInfo && mapConfig) {
      for (const h of mapConfig.hotspots) {
        const found = (h.items || []).find(it => it.id === useEntry.itemId);
        if (found) { itemInfo = found; location = h.name; break; }
      }
    }
    if (itemInfo) dimmedItems.push({ ...itemInfo, location });
  }

  // --- Items sitting at this hotspot (can be picked up) ---
  const hereItems = hotspotItems[currentInteraction.id] || [];

  const hasAnyItems = hereItems.length > 0 || usableItems.length > 0 || dimmedItems.length > 0;

  // Overlay
  ctx.fillStyle = `rgba(0, 0, 0, ${0.5 * interactionAnimation})`;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // --- Compute panel height from content ---
  const panelW = Math.min(500, canvas.width - 40);
  const CONTENT_END = 140; // px from panelY where the text section ends
  const CLOSE_H    = 22;
  const BTN_SIZE   = 38;
  const LABEL_H    = 16;
  const GAP_H      = 8;

  let stripH = 0;
  if (hasAnyItems) {
    stripH += 14; // separator
    if (hereItems.length > 0) stripH += LABEL_H + BTN_SIZE;
    if (hereItems.length > 0 && (usableItems.length > 0 || dimmedItems.length > 0)) stripH += GAP_H;
    if (usableItems.length > 0) stripH += LABEL_H + BTN_SIZE;
    if (usableItems.length > 0 && dimmedItems.length > 0) stripH += GAP_H;
    if (dimmedItems.length > 0) stripH += LABEL_H + BTN_SIZE;
    if (hereItems.length > 0 || dimmedItems.length > 0) stripH += LABEL_H; // hint line
  }
  const panelH = CONTENT_END + stripH + CLOSE_H;

  const panelX = canvas.width / 2 - panelW / 2;
  const panelY = Math.max(10, Math.min(canvas.height - panelH - 10, canvas.height / 2 - panelH / 2));
  const scale  = interactionAnimation;

  ctx.save();
  ctx.translate(canvas.width / 2, canvas.height / 2);
  ctx.scale(scale, scale);
  ctx.translate(-canvas.width / 2, -canvas.height / 2);

  // Panel background
  ctx.fillStyle  = '#3E2723';
  ctx.strokeStyle = '#8D6E63';
  ctx.lineWidth   = 3;
  roundRect(panelX, panelY, panelW, panelH, 16);
  ctx.fill(); ctx.stroke();

  // Inner border
  ctx.strokeStyle = '#5D4037';
  ctx.lineWidth   = 1;
  roundRect(panelX + 6, panelY + 6, panelW - 12, panelH - 12, 12);
  ctx.stroke();

  // Object name
  ctx.fillStyle = '#FFD54F';
  ctx.font      = 'bold 24px "Comic Sans MS", cursive';
  ctx.textAlign = 'center';
  ctx.fillText(currentInteraction.name, canvas.width / 2, panelY + 45);

  // Interaction text (typewriter + word-wrap)
  const text = currentInteraction.interactionText;
  ctx.fillStyle = '#FFECB3';
  ctx.font      = '18px "Comic Sans MS", cursive';
  ctx.textAlign = 'center';
  const visibleChars = Math.min(text.length, Math.floor(interactionTimer * 0.8));
  wrapText(text.substring(0, visibleChars), canvas.width / 2, panelY + 85, panelW - 40, 24);

  // --- Items strip (running-Y layout) ---
  interactionUseRects  = [];
  interactionDimmedRects = [];
  interactionHereRects = [];
  let curY = panelY + CONTENT_END;

  if (hasAnyItems) {
    // Separator
    ctx.strokeStyle = 'rgba(141, 110, 99, 0.6)';
    ctx.lineWidth   = 1;
    ctx.beginPath();
    ctx.moveTo(panelX + 20, curY);
    ctx.lineTo(panelX + panelW - 20, curY);
    ctx.stroke();
    curY += 14;

    // Row helper: draws a row of emoji buttons, returns array of rects
    function drawItemRow(items, dimmed) {
      const slice   = items.slice(0, 9);
      const totalW  = slice.length * (BTN_SIZE + 6) - 6;
      const startX  = panelX + panelW / 2 - totalW / 2;
      const rowRects = [];
      slice.forEach((item, i) => {
        const bx = startX + i * (BTN_SIZE + 6);
        ctx.globalAlpha = dimmed ? 0.38 : 1.0;
        ctx.fillStyle   = dimmed ? 'rgba(120,120,120,0.12)' : 'rgba(255,213,79,0.15)';
        ctx.strokeStyle = dimmed ? '#8D6E63' : '#FFD54F';
        ctx.lineWidth   = 1.5;
        if (dimmed) ctx.setLineDash([3, 3]);
        roundRect(bx, curY, BTN_SIZE, BTN_SIZE, 8);
        ctx.fill(); ctx.stroke();
        ctx.setLineDash([]);
        ctx.font      = `${Math.floor(BTN_SIZE * 0.58)}px serif`;
        ctx.textAlign = 'center';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(item.emoji || '?', bx + BTN_SIZE / 2, curY + BTN_SIZE * 0.73);
        ctx.globalAlpha = 1.0;
        rowRects.push({ x: bx, y: curY, w: BTN_SIZE, h: BTN_SIZE, item });
      });
      return rowRects;
    }

    // 🧺 Items at this hotspot row
    if (hereItems.length > 0) {
      ctx.fillStyle = '#FFD54F';
      ctx.font      = 'bold 12px "Comic Sans MS", cursive';
      ctx.textAlign = 'left';
      ctx.fillText(`🧺 Here (${isTouchDevice() ? 'tap' : 'click'} to pick up):`, panelX + 20, curY + 12);
      curY += LABEL_H;
      const rects = drawItemRow(hereItems, false);
      rects.forEach((r, index) => interactionHereRects.push({ ...r, index }));
      curY += BTN_SIZE;
      if (usableItems.length > 0 || dimmedItems.length > 0) curY += GAP_H;
    }

    // ✨ Usable items row
    if (usableItems.length > 0) {
      ctx.fillStyle = '#FFD54F';
      ctx.font      = 'bold 12px "Comic Sans MS", cursive';
      ctx.textAlign = 'left';
      ctx.fillText('✨ In your backpack:', panelX + 20, curY + 12);
      curY += LABEL_H;
      const rects = drawItemRow(usableItems, false);
      rects.forEach(r => interactionUseRects.push(r));
      curY += BTN_SIZE;
      if (dimmedItems.length > 0) curY += GAP_H;
    }

    // 🔍 Dimmed items row
    if (dimmedItems.length > 0) {
      ctx.fillStyle = 'rgba(255,236,179,0.6)';
      ctx.font      = 'bold 12px "Comic Sans MS", cursive';
      ctx.textAlign = 'left';
      ctx.fillText('🔍 Find to use here:', panelX + 20, curY + 12);
      curY += LABEL_H;
      const rects = drawItemRow(dimmedItems, true);
      rects.forEach(r => interactionDimmedRects.push({ ...r, location: r.item.location }));
      curY += BTN_SIZE;
    }

    // Hint line (pick-up feedback, or where to find a faded item)
    if (hereItems.length > 0 || dimmedItems.length > 0) {
      curY += 6;
      let hintMsg = interactionHintText;
      if (!hintMsg && dimmedItems.length > 0) {
        hintMsg = isTouchDevice() ? 'Tap a faded item to see where to find it'
                                  : 'Hover a faded item to see where to find it';
      }
      if (hintMsg) {
        ctx.fillStyle = interactionHintText ? '#FFD54F' : 'rgba(255,236,179,0.45)';
        ctx.font      = `${interactionHintText ? 'bold ' : ''}11px "Comic Sans MS", cursive`;
        ctx.textAlign = 'center';
        ctx.fillText(hintMsg, canvas.width / 2, curY + 10, panelW - 30);
      }
    }
  }

  // Close hint
  ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
  ctx.font      = '13px "Comic Sans MS", cursive';
  ctx.textAlign = 'center';
  ctx.fillText(isTouchDevice() ? 'Tap outside to close' : 'Press Space or Esc to close',
    canvas.width / 2, panelY + panelH - 10);

  ctx.restore();
}

function drawActionAnimation(action, x, y, timer) {
  const t = timer * 0.1;
  ctx.font = '28px serif';
  ctx.textAlign = 'center';

  switch (action) {
    case 'sleep': {
      for (let i = 0; i < 3; i++) {
        const zx = x - 30 + i * 30;
        const zy = y - Math.sin(t + i) * 8;
        const size = 16 + i * 6;
        ctx.globalAlpha = 0.5 + Math.sin(t + i) * 0.3;
        ctx.font = `${size}px "Comic Sans MS", cursive`;
        ctx.fillStyle = '#90CAF9';
        ctx.fillText('z', zx, zy);
      }
      ctx.globalAlpha = 1;
      break;
    }
    case 'fly': {
      const fx = Math.sin(t * 2) * 40;
      const fy = Math.cos(t * 3) * 10;
      ctx.fillText('✈️', x + fx, y + fy);
      // Trail
      for (let i = 1; i <= 3; i++) {
        ctx.globalAlpha = 0.3 / i;
        ctx.fillText('·', x + fx - i * 12, y + fy + i * 2);
      }
      ctx.globalAlpha = 1;
      break;
    }
    case 'cook': {
      const flames = ['🔥', '🍳', '🔥'];
      flames.forEach((f, i) => {
        const fofs = Math.sin(t * 3 + i * 2) * 5;
        ctx.fillText(f, x - 30 + i * 30, y + fofs);
      });
      break;
    }
    case 'stargaze': {
      for (let i = 0; i < 5; i++) {
        const sx = x - 60 + i * 30;
        const sy = y + Math.sin(t * 2 + i) * 6;
        ctx.globalAlpha = 0.5 + Math.sin(t + i * 1.5) * 0.5;
        ctx.fillStyle = '#FFD54F';
        ctx.font = `${14 + Math.sin(t + i) * 4}px serif`;
        ctx.fillText('⭐', sx, sy);
      }
      ctx.globalAlpha = 1;
      break;
    }
    case 'play': {
      const bx = x + Math.sin(t * 4) * 30;
      const by = y - Math.abs(Math.sin(t * 3)) * 20;
      ctx.fillText('⚾', bx, by);
      break;
    }
    case 'wash': {
      const drops = ['💧', '💧', '💧'];
      drops.forEach((d, i) => {
        const dy = Math.sin(t * 2 + i * 2) * 8;
        ctx.globalAlpha = 0.5 + Math.sin(t + i) * 0.5;
        ctx.fillText(d, x - 25 + i * 25, y + dy);
      });
      ctx.globalAlpha = 1;
      break;
    }
    case 'eat': {
      ctx.fillText('🍱', x, y + Math.sin(t) * 3);
      break;
    }
    case 'bathroom': {
      // flush! a spinning swirl with water drops orbiting it
      ctx.save();
      ctx.translate(x, y - 10);
      ctx.rotate(-t * 1.5);
      ctx.fillText('🌀', 0, 10);
      ctx.restore();
      for (let i = 0; i < 3; i++) {
        const a = t * 2 + i * (Math.PI * 2 / 3);
        ctx.globalAlpha = 0.6 + Math.sin(t + i) * 0.4;
        ctx.fillText('💧', x + Math.cos(a) * 38, y - 10 + Math.sin(a) * 14 + 10);
      }
      ctx.globalAlpha = 1;
      break;
    }
    default: {
      const bounce = Math.sin(t * 2) * 5;
      ctx.fillText('✨', x, y + bounce);
    }
  }
}

function wrapText(text, x, y, maxWidth, lineHeight) {
  const words = text.split(' ');
  let line = '';
  let lineY = y;

  for (const word of words) {
    const testLine = line + word + ' ';
    const metrics = ctx.measureText(testLine);
    if (metrics.width > maxWidth && line) {
      ctx.fillText(line.trim(), x, lineY);
      line = word + ' ';
      lineY += lineHeight;
    } else {
      line = testLine;
    }
  }
  ctx.fillText(line.trim(), x, lineY);
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

function roundRectPath(x, y, w, h, r) {
  roundRect(x, y, w, h, r);
}

// --- Resume / Start Fresh prompt ---
function resumePromptButtonRects() {
  const panelW = Math.min(420, canvas.width - 40);
  const panelH = 170;
  const panelY = canvas.height / 2 - panelH / 2;
  const btnW = 130, btnH = 40, btnY = panelY + panelH - 56, btnGap = 18;
  const resumeX = canvas.width / 2 - btnW - btnGap / 2;
  const freshX = canvas.width / 2 + btnGap / 2;
  return [
    { id: 'resume', x: resumeX, y: btnY, w: btnW, h: btnH },
    { id: 'fresh',  x: freshX,  y: btnY, w: btnW, h: btnH }
  ];
}

function drawResumePrompt() {
  // Faded map background, like character select
  ctx.fillStyle = '#1a3a1a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (mapImage) {
    ctx.globalAlpha = 0.15;
    const scale = Math.max(canvas.width / mapImage.naturalWidth, canvas.height / mapImage.naturalHeight);
    ctx.drawImage(mapImage, 0, 0, mapImage.naturalWidth * scale, mapImage.naturalHeight * scale);
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const panelW = Math.min(420, canvas.width - 40);
  const panelH = 170;
  const panelX = canvas.width / 2 - panelW / 2;
  const panelY = canvas.height / 2 - panelH / 2;

  ctx.fillStyle = '#3E2723';
  ctx.strokeStyle = '#8D6E63';
  ctx.lineWidth = 3;
  roundRect(panelX, panelY, panelW, panelH, 16);
  ctx.fill();
  ctx.stroke();

  ctx.strokeStyle = '#5D4037';
  ctx.lineWidth = 1;
  roundRect(panelX + 6, panelY + 6, panelW - 12, panelH - 12, 12);
  ctx.stroke();

  ctx.fillStyle = '#FFD54F';
  ctx.font = 'bold 22px "Comic Sans MS", cursive';
  ctx.textAlign = 'center';
  ctx.fillText('Welcome back, ' + (player.character ? player.character.name : '') + '!', canvas.width / 2, panelY + 50);

  ctx.fillStyle = '#FFECB3';
  ctx.font = '15px "Comic Sans MS", cursive';
  ctx.fillText('Resume your adventure or start fresh?', canvas.width / 2, panelY + 80);

  const btns = resumePromptButtonRects();
  const labels = { resume: 'Resume (R)', fresh: 'Start Fresh (F)' };
  const colors = { resume: '#4CAF50', fresh: '#F44336' };
  ctx.font = 'bold 15px "Comic Sans MS", cursive';
  for (const b of btns) {
    ctx.fillStyle = colors[b.id];
    roundRect(b.x, b.y, b.w, b.h, 8);
    ctx.fill();
    ctx.fillStyle = 'white';
    ctx.textAlign = 'center';
    ctx.fillText(labels[b.id], b.x + b.w / 2, b.y + 26);
  }
}

// --- Backpack overlay ---
function backpackMetrics() {
  const slotSize = Math.max(36, Math.min(64, Math.floor((canvas.width - 40) / 11)));
  const gap = Math.max(4, Math.floor(slotSize * 0.15));
  const padding = 12;
  const backpackRowW = BACKPACK_CAPACITY * slotSize + (BACKPACK_CAPACITY - 1) * gap;
  const hotspotRowW = HOTSPOT_CAPACITY * slotSize + (HOTSPOT_CAPACITY - 1) * gap;
  const hasHotspotRow = !!nearbyObject;
  const rowSpacing = 14;
  const labelH = 22;
  const titleH = 24;
  const overlayBottomMargin = 12;

  const backpackRowY = canvas.height - overlayBottomMargin - slotSize;
  const hotspotRowY = hasHotspotRow
    ? backpackRowY - slotSize - rowSpacing - labelH
    : backpackRowY;
  const overlayTop = (hasHotspotRow ? hotspotRowY - labelH : backpackRowY) - titleH - padding;

  const backpackRowX = canvas.width / 2 - backpackRowW / 2;
  const hotspotRowX = canvas.width / 2 - hotspotRowW / 2;

  return { slotSize, gap, padding, backpackRowW, hotspotRowW, hasHotspotRow, rowSpacing, labelH, titleH, overlayBottomMargin, backpackRowY, hotspotRowY, overlayTop, backpackRowX, hotspotRowX };
}

function backpackOverlayTop() {
  return backpackMetrics().overlayTop;
}

function drawBackpackSlot(x, y, size, item, isSelected, isAvailable) {
  const r = Math.max(6, size * 0.16);
  // Solid dark base for both states so the emoji always has consistent contrast
  ctx.fillStyle = 'rgba(62, 39, 35, 0.92)';
  roundRect(x, y, size, size, r);
  ctx.fill();

  ctx.strokeStyle = isSelected ? '#FFD600' : (isAvailable ? '#8D6E63' : '#5D4037');
  ctx.lineWidth = isSelected ? 3 : 1.5;
  roundRect(x, y, size, size, r);
  ctx.stroke();

  if (item) {
    ctx.fillStyle = '#ffffff';
    ctx.font = `${Math.floor(size * 0.6)}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(item.emoji || '?', x + size / 2, y + size / 2 + 2);
    ctx.textBaseline = 'alphabetic';
  }
}

function drawBackpack() {
  const m = backpackMetrics();
  backpackSlotRects = { backpack: [], hotspot: [] };

  // Panel background
  const panelX = 8;
  const panelY = m.overlayTop;
  const panelW = canvas.width - 16;
  const panelH = canvas.height - panelY - 4;
  ctx.fillStyle = 'rgba(20, 12, 6, 0.78)';
  ctx.strokeStyle = '#5D4037';
  ctx.lineWidth = 2;
  roundRect(panelX, panelY, panelW, panelH, 12);
  ctx.fill();
  ctx.stroke();

  // Title
  ctx.fillStyle = '#FFD54F';
  ctx.font = 'bold 15px "Comic Sans MS", cursive';
  ctx.textAlign = 'left';
  ctx.fillText(`🎒 Backpack (${backpack.length}/${BACKPACK_CAPACITY})`, panelX + 14, panelY + 18);

  ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
  ctx.font = '11px "Comic Sans MS", cursive';
  ctx.textAlign = 'right';
  const hint = nearbyObject
    ? '← → select  •  ↑ ↓ switch row  •  Enter act  •  B/Esc close'
    : '← → select  •  B/Esc close  •  (move to a spot to pick up)';
  ctx.fillText(hint, panelX + panelW - 14, panelY + 18);

  // Hotspot row (if applicable)
  if (m.hasHotspotRow) {
    const items = hotspotItems[nearbyObject.id] || [];
    ctx.fillStyle = '#FFECB3';
    ctx.font = 'bold 12px "Comic Sans MS", cursive';
    ctx.textAlign = 'center';
    ctx.fillText('At ' + nearbyObject.name, canvas.width / 2, m.hotspotRowY - 6);

    for (let i = 0; i < HOTSPOT_CAPACITY; i++) {
      const x = m.hotspotRowX + i * (m.slotSize + m.gap);
      const y = m.hotspotRowY;
      const isSelected = backpackOpen && backpackSelection.row === 'hotspot' && backpackSelection.col === i;
      drawBackpackSlot(x, y, m.slotSize, items[i] || null, isSelected, true);
      backpackSlotRects.hotspot.push({ x, y, w: m.slotSize, h: m.slotSize, col: i });
    }
  }

  // Backpack row
  for (let i = 0; i < BACKPACK_CAPACITY; i++) {
    const x = m.backpackRowX + i * (m.slotSize + m.gap);
    const y = m.backpackRowY;
    const isSelected = backpackOpen && backpackSelection.row === 'backpack' && backpackSelection.col === i;
    drawBackpackSlot(x, y, m.slotSize, backpack[i] || null, isSelected, true);
    backpackSlotRects.backpack.push({ x, y, w: m.slotSize, h: m.slotSize, col: i });
  }

  // Selected item name tooltip — below the slot for the hotspot row (the
  // "At <name>" header sits above and shouldn't be overlapped); above the
  // backpack row since it's anchored at the very bottom of the canvas.
  const item = selectedItem();
  if (item) {
    const isBackpackRow = backpackSelection.row === 'backpack';
    const rects = isBackpackRow ? backpackSlotRects.backpack : backpackSlotRects.hotspot;
    const r = rects[backpackSelection.col];
    if (r) {
      ctx.font = 'bold 13px "Comic Sans MS", cursive';
      ctx.textAlign = 'center';
      const label = item.name;
      const labelW = ctx.measureText(label).width + 14;
      const labelX = Math.max(8, Math.min(canvas.width - labelW - 8, r.x + r.w / 2 - labelW / 2));
      const labelY = isBackpackRow ? r.y - 22 : r.y + r.h + 4;
      ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
      roundRect(labelX, labelY, labelW, 20, 5);
      ctx.fill();
      ctx.fillStyle = '#FFEB3B';
      ctx.fillText(label, labelX + labelW / 2, labelY + 14);
    }
  }
}

// --- Use toast (transient floating message) ---
function drawUseToast() {
  if (!useToast) return;
  useToast.age++;
  // Kitchen messages sit low (out of the way of the stations) and stay longer
  const life = useToast.low ? 170 : 90;
  if (useToast.age > life) { useToast = null; return; }
  const alpha = useToast.age < life - 30 ? 1 : 1 - (useToast.age - (life - 30)) / 30;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = 'bold 18px "Comic Sans MS", cursive';
  ctx.textAlign = 'center';
  const w = ctx.measureText(useToast.text).width + 28;
  const y = useToast.low ? canvas.height - 60 : canvas.height * 0.35;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
  roundRect(canvas.width / 2 - w / 2, y - 24, w, 36, 10);
  ctx.fill();
  ctx.fillStyle = '#FFEB3B';
  ctx.fillText(useToast.text, canvas.width / 2, y);
  ctx.restore();
}

// ============================================================
// START MENU + MULTIPLAYER (shared worlds over PubNub)
// ============================================================
// Single player works exactly as before. In multi player, everyone in a
// world subscribes to one PubNub channel, `louisas-game.world.<6-digit code>`,
// and sends small JSON messages to it (see "Multiplayer" in CLAUDE.md):
//
//   pos   — where I am (map + 0–1 fractions), facing, walking, held food.
//           Sent ~8×/s while moving, every 2.5s while standing still.
//   hello — "I just arrived": others answer with `pos`, and one of them
//           answers with `snap` (where every item in the world is).
//   snap  — { to, at, items: { mapPath: { hotspotId: [item] } } }
//   take / drop — item moves. Nobody applies these when they click: every
//           computer applies them in the order PubNub delivers them (the
//           channel's timetoken order), so all computers agree on who got
//           an item first. The clicker learns the result when its own
//           message comes back.
//   say   — a speech bubble line (player → friend / NPC, or an NPC's reply).
//   bye   — I left (also inferred after 9s of silence).
//
// There's no server: whoever is in the world holds its state. Each computer
// also keeps a copy in localStorage so a world can be re-opened later.
const PUBNUB_PUBLISH_KEY   = 'pub-c-02631177-4938-4aab-916c-c66de3caad38';
const PUBNUB_SUBSCRIBE_KEY = 'sub-c-ba97efde-d572-48e8-82d6-a06e2b5b0738';
const MP_CHANNEL_PREFIX = 'louisas-game.world.';
const MP_MAIN_MAP       = 'assets/game_design.json';
const MP_POS_EVERY_MS   = 120;    // position updates while moving
const MP_HEARTBEAT_MS   = 2500;   // "still here" while standing still
const MP_TIMEOUT_MS     = 9000;   // forget a friend we haven't heard from
const MP_JOIN_WAIT_MS   = 3500;   // wait this long for someone to answer `hello`

function mpRandomId() {
  const a = new Uint32Array(2);
  crypto.getRandomValues(a);
  return 'p-' + a[0].toString(36) + a[1].toString(36);
}

const mp = {
  active: false,           // in a multiplayer world (or joining one)
  code: null,              // '123456'
  channel: null,
  pubnub: null,
  myId: mpRandomId(),      // one per open tab
  session: 0,              // bumped on leave, so stale async work bails out
  connectWaiter: null,
  connected: false,
  wasDisconnected: false,
  synced: false,           // we know where every item in the world is
  lastOpTT: 0n,            // timetoken of the last take/drop applied
  buffer: [],              // take/drops that arrived before we were synced
  items: {},               // mapPath → hotspotId → item[]   (the shared world)
  mapConfigs: {},          // mapPath → config (every map, for default items)
  players: new Map(),      // playerId → remote player (see mpOnPos)
  pendingTakes: new Set(), // `${map}|${hotspot}|${itemId}` waiting for the echo
  pendingDrops: new Map(), // `${map}|${hotspot}` → count waiting for the echo
  lastTaker: {},           // `${map}|${hotspot}|${itemId}` → playerId
  present: false,          // others can see us (we've sent a `pos`)
  lastPosAt: 0,
  lastPosKey: '',
  joinTimer: null,
  joinExtended: false,
  snapReplies: new Map(),  // joinerId → timer (cancelled if someone else answers)
  onSynced: null,
  cacheTimer: null
};

// --- Menu (HTML overlay) ---
const menuEl = document.getElementById('menu');
const MENU_SCREENS = ['menuMode', 'menuMulti', 'menuJoin', 'menuBusy', 'menuEmpty'];
let menuScreen = null;

function showMenu(id) {
  menuEl.hidden = false;
  menuScreen = id;
  for (const sId of MENU_SCREENS) document.getElementById(sId).hidden = sId !== id;
  const first = document.getElementById(id).querySelector('input, button');
  if (first) first.focus({ preventScroll: true });
}
function hideMenu() {
  if (menuEl.contains(document.activeElement)) document.activeElement.blur();
  menuEl.hidden = true;
  menuScreen = null;
}
function setMenuError(id, text) {
  document.getElementById(id).textContent = text || '';
}
function showBusy(text) {
  document.getElementById('busyText').textContent = text;
  showMenu('menuBusy');
}

function menuAction(act) {
  setMenuError('modeError');
  setMenuError('multiError');
  switch (act) {
    case 'single':
      mpLeave();
      hideMenu();
      state = GameState.CHARACTER_SELECT;
      break;
    case 'multi':
      if (!window.PubNub) {
        showMenu('menuMode');
        setMenuError('modeError', "Multi player needs the internet — couldn't load PubNub.");
        return;
      }
      mpLeave();
      showMenu('menuMulti');
      break;
    case 'mode':
      showMenu('menuMode');
      break;
    case 'create':
      mpCreateWorld();
      break;
    case 'join': {
      mpLeave();
      setMenuError('joinError');
      showMenu('menuJoin');
      document.getElementById('joinCode').select();
      break;
    }
    case 'cancel':
      mpLeave();
      showMenu('menuMulti');
      break;
    case 'joinAnyway':
      mp.onSynced = null;
      mpUseCachedWorld();
      mpEnterWorld();
      break;
  }
}

menuEl.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-act]');
  if (btn) menuAction(btn.dataset.act);
});
menuEl.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  const back = { menuMulti: 'mode', menuJoin: 'multi', menuBusy: 'cancel', menuEmpty: 'join' }[menuScreen];
  if (back) { e.preventDefault(); menuAction(back); }
});
const joinCodeInput = document.getElementById('joinCode');
joinCodeInput.addEventListener('input', () => {
  joinCodeInput.value = joinCodeInput.value.replace(/\D/g, '').slice(0, 6);
  setMenuError('joinError');
});
document.getElementById('menuJoin').addEventListener('submit', (e) => {
  e.preventDefault();
  const code = joinCodeInput.value.replace(/\D/g, '');
  if (code.length !== 6) {
    setMenuError('joinError', 'World codes have 6 numbers.');
    joinCodeInput.focus();
    return;
  }
  mpJoinWorld(code);
});

// Esc on the character screen / "← Back": back to single vs multi player
function backToModeSelect() {
  mpLeave();
  player.character = null;
  if (currentMapPath !== MP_MAIN_MAP) {
    loadMap(MP_MAIN_MAP);      // ends on the mode menu
  } else {
    state = GameState.MODE_SELECT;
    showMenu('menuMode');
  }
}

// "Switch camper?" → Yes. In a world you stay connected, but friends stop seeing you.
function goToCharacterSelect() {
  if (mp.active) mpSendBye();
  state = GameState.CHARACTER_SELECT;
  player.character = null;
}

// --- Creating / joining / leaving a world ---
async function mpCreateWorld() {
  const n = crypto.getRandomValues(new Uint32Array(1))[0];
  const code = String(100000 + (n % 900000));
  showBusy('Making a new world…');
  try {
    await mpOpen(code);
  } catch (err) {
    mpFail(err, 'menuMulti', 'multiError');
    return;
  }
  mp.synced = true;   // brand-new world: every item starts where the map JSON puts it
  mpEnterWorld();
}

async function mpJoinWorld(code) {
  showBusy(`Looking for world ${code}…`);
  try {
    await mpOpen(code);
  } catch (err) {
    mpFail(err, 'menuJoin', 'joinError');
    return;
  }
  mp.onSynced = mpEnterWorld;
  mpSend({ t: 'hello' });
  mpArmJoinTimer(MP_JOIN_WAIT_MS);
}

function mpArmJoinTimer(ms) {
  clearTimeout(mp.joinTimer);
  mp.joinTimer = setTimeout(() => {
    if (!mp.active || mp.synced) return;
    // Friends are there but nobody has sent the world yet — give them a moment
    if (mp.players.size && !mp.joinExtended) {
      mp.joinExtended = true;
      mpArmJoinTimer(MP_JOIN_WAIT_MS);
      return;
    }
    document.getElementById('emptyText').textContent = `Nobody is playing in world ${mp.code} right now.`;
    showMenu('menuEmpty');
  }, ms);
}

function mpFail(err, screen, errorId) {
  if (err && err.message === 'cancelled') return;
  console.warn('Multiplayer connection failed', err);
  mpLeave();
  showMenu(screen);
  setMenuError(errorId, "Couldn't connect. Check the internet and try again!");
}

// Connect to a world's channel. Resolves once PubNub says we're subscribed.
async function mpOpen(code) {
  mpLeave();
  const session = mp.session;
  mp.active = true;
  mp.code = code;
  mp.channel = MP_CHANNEL_PREFIX + code;
  mp.items = await mpLoadAllMaps();
  if (session !== mp.session) throw new Error('cancelled');

  const pn = new PubNub({
    publishKey: PUBNUB_PUBLISH_KEY,
    subscribeKey: PUBNUB_SUBSCRIBE_KEY,
    userId: mp.myId
  });
  mp.pubnub = pn;
  await new Promise((resolve, reject) => {
    const timer = setTimeout(() => { mp.connectWaiter = null; reject(new Error('timeout')); }, 12000);
    mp.connectWaiter = {
      resolve: () => { clearTimeout(timer); resolve(); },
      reject: (e) => { clearTimeout(timer); reject(e); }
    };
    pn.addListener({
      message: (ev) => { if (mp.pubnub === pn) mpOnMessage(ev); },
      status: (st) => { if (mp.pubnub === pn) mpOnStatus(st); }
    });
    pn.subscribe({ channels: [mp.channel] });
  });
  if (session !== mp.session) throw new Error('cancelled');
}

function mpLeave() {
  if (mp.connectWaiter) {
    const w = mp.connectWaiter;
    mp.connectWaiter = null;
    w.reject(new Error('cancelled'));
  }
  clearTimeout(mp.joinTimer);
  clearTimeout(mp.cacheTimer);
  for (const t of mp.snapReplies.values()) clearTimeout(t);
  if (mp.cacheTimer) mpCacheWorld();
  const pn = mp.pubnub;
  if (pn) {
    const done = () => { try { pn.unsubscribeAll(); pn.destroy(); } catch (_) { /* already gone */ } };
    if (mp.present) {
      pn.publish({ channel: mp.channel, message: { t: 'bye', from: mp.myId }, storeInHistory: false })
        .catch(() => {}).finally(done);
    } else {
      done();
    }
  }
  if (talkingTo && talkingTo.remote) endConversation();
  speechBubbles = speechBubbles.filter(b => !(b.owner && b.owner.remote) && !(b.partner && b.partner.remote));
  Object.assign(mp, {
    active: false, code: null, channel: null, pubnub: null,
    connected: false, wasDisconnected: false, synced: false,
    lastOpTT: 0n, buffer: [], items: {}, lastTaker: {},
    present: false, lastPosAt: 0, lastPosKey: '',
    joinTimer: null, joinExtended: false, onSynced: null, cacheTimer: null
  });
  mp.players.clear();
  mp.pendingTakes.clear();
  mp.pendingDrops.clear();
  mp.snapReplies.clear();
  mp.session++;
}

// Connected and synced: on to picking a camper
function mpEnterWorld() {
  hideMenu();
  if (mapConfig) hotspotItems = mpItemsFor(currentMapPath, mapConfig);
  charSelectNote = null;
  state = GameState.CHARACTER_SELECT;
}

// Called by selectCharacter() in a world. Your backpack + journal are saved
// per world and camper, so coming back to the same world picks up where you were.
function mpStartPlaying() {
  const save = mpLoadSave();
  const items = arr => Array.isArray(arr) ? arr.map(mpCleanItem).filter(Boolean) : [];
  backpack      = save ? items(save.backpack).slice(0, BACKPACK_CAPACITY) : [];
  completedUses = save && Array.isArray(save.completedUses) ? save.completedUses.map(u => ({ ...u })) : [];
  dishesMade    = save && Array.isArray(save.dishesMade) ? [...save.dishesMade] : [];
  allMapSaves = {};
  hotspotItems = mpItemsFor(currentMapPath, mapConfig);
  // Arrive beside (not on top of) any friends standing at the start
  const friends = mpPlayersHere();
  const startX = player.x;
  let best = startX, bestGap = -1;
  for (const dx of [0, -110, 110, -220, 220, -330, 330]) {
    const x = clamp(startX + dx, 10, scaledMapW - 10);
    const gap = Math.min(Infinity, ...friends.map(rp => Math.hypot(rp.x - x, rp.y - player.y)));
    if (gap >= 100) { best = x; break; }          // nearest spot with room to stand
    if (gap > bestGap) { best = x; bestGap = gap; }
  }
  player.x = best;
  state = GameState.PLAYING;
  const others = mp.players.size;
  useToast = {
    text: others ? `Welcome to world ${mp.code}! 👋` : `World ${mp.code} — give your friends this code!`,
    age: 0
  };
  writeSave();
  if (save && save.currentMap && save.currentMap !== currentMapPath && mp.items[save.currentMap]) {
    switchMap(save.currentMap, null);
  }
}

// Every map's default items, found by following portals from the main map
async function mpLoadAllMaps() {
  const queue = [MP_MAIN_MAP];
  const seen = new Set(queue);
  const out = {};
  while (queue.length) {
    const path = queue.shift();
    let cfg = mp.mapConfigs[path];
    if (!cfg) {
      try {
        cfg = await (await fetch(path)).json();
        mp.mapConfigs[path] = cfg;
      } catch (_) { continue; }
    }
    out[path] = restoreOrDefaultHotspots(cfg, {});
    for (const h of cfg.hotspots || []) {
      if (h.targetMap && !seen.has(h.targetMap)) {
        seen.add(h.targetMap);
        queue.push(h.targetMap);
      }
    }
  }
  return out;
}

// The shared item lists for one map (filling in any hotspot we don't know yet)
function mpItemsFor(path, config) {
  const m = mp.items[path] || (mp.items[path] = {});
  for (const def of config.hotspots) {
    if (!Array.isArray(m[def.id])) m[def.id] = (def.items || []).map(it => ({ ...it }));
  }
  return m;
}

// --- Saves ---
function mpSaveKey() {
  return `louisas-game:mp:${mp.code}:${player.character.name}`;
}
function mpLoadSave() {
  try {
    const raw = localStorage.getItem(mpSaveKey());
    return raw ? JSON.parse(raw) : null;
  } catch (_) { return null; }
}
function mpWriteSave() {
  try {
    localStorage.setItem(mpSaveKey(), JSON.stringify({
      version: SAVE_VERSION, currentMap: currentMapPath, backpack, completedUses, dishesMade
    }));
  } catch (e) { console.warn('Failed to write save', e); }
}
function mpWorldKey() {
  return `louisas-game:world:${mp.code}`;
}
function mpCacheWorld() {
  mp.cacheTimer = null;
  if (!mp.code) return;
  try { localStorage.setItem(mpWorldKey(), JSON.stringify({ items: mp.items, savedAt: Date.now() })); } catch (_) { /* full */ }
}
function mpCacheWorldSoon() {
  if (!mp.cacheTimer) mp.cacheTimer = setTimeout(mpCacheWorld, 1000);
}
// Nobody answered: use our own last copy of this world (or a fresh one)
function mpUseCachedWorld() {
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(mpWorldKey()) || 'null'); } catch (_) { /* ignore */ }
  mpApplySnapshot({ at: '0', items: (cached && cached.items) || mp.items });
}

// --- Sending ---
function mpPublish(message, byPost) {
  if (!mp.pubnub) return Promise.reject(new Error('not connected'));
  return mp.pubnub.publish({
    channel: mp.channel,
    message: { ...message, from: mp.myId },
    storeInHistory: false,
    sendByPost: !!byPost
  });
}
function mpSend(message, byPost) {
  mpPublish(message, byPost).catch(err => console.warn('PubNub publish failed', err));
}

// Is our camper out in the world (visible to friends)?
function mpInWorld() {
  return !!player.character && [
    GameState.PLAYING, GameState.TALKING, GameState.INTERACTING, GameState.ITEM_ACTION,
    GameState.USING_ITEM, GameState.CONFIRM_DIALOG
  ].includes(state);
}

function mpSendPos(force) {
  if (!mp.active || !mp.connected || !mpInWorld() || !scaledMapW) return;
  const now = performance.now();
  const msg = {
    t: 'pos',
    char: player.character.name,
    map: currentMapPath,
    x: +(player.x / scaledMapW).toFixed(4),
    y: +(player.y / scaledMapH).toFixed(4),
    f: player.facing,
    w: player.walking ? 1 : 0,
    r: player.rotation,
    h: heldItem ? heldItem.emoji : null
  };
  const key = [msg.char, msg.map, msg.x, msg.y, msg.f, msg.w, msg.r, msg.h].join('|');
  const due = force ||
    (key !== mp.lastPosKey && now - mp.lastPosAt >= MP_POS_EVERY_MS) ||
    now - mp.lastPosAt >= MP_HEARTBEAT_MS;
  if (!due) return;
  mp.lastPosKey = key;
  mp.lastPosAt = now;
  mp.present = true;
  mpSend(msg);
}

function mpSendBye() {
  if (mp.present) mpSend({ t: 'bye' });
  mp.present = false;
  mp.lastPosKey = '';
}

function mpSendSnapshot(to) {
  mpSend({ t: 'snap', to, at: String(mp.lastOpTT), items: mp.items }, true);
}

// A line of speech, so friends on this map see the bubble.
// `to` is 'player' (me), an NPC def or a remote player; `npcSpeaker` set
// when it's an NPC's reply to me.
function mpSay(text, to, npcSpeaker) {
  if (!mp.active || !mp.present) return;
  const msg = { t: 'say', map: currentMapPath, text };
  if (npcSpeaker) {
    msg.npc = npcSpeaker.id;
    msg.to = mp.myId;
  } else {
    msg.to = to === 'player' ? mp.myId : (to && to.id) || null;
  }
  mpSend(msg);
}

// --- Receiving ---
function mpOnStatus(st) {
  const c = st && st.category;
  if (c === 'PNConnectedCategory' || c === 'PNReconnectedCategory' || c === 'PNSubscriptionChangedCategory') {
    mp.connected = true;
    if (mp.connectWaiter) {
      const w = mp.connectWaiter;
      mp.connectWaiter = null;
      w.resolve();
    } else if (mp.wasDisconnected) {
      mpResync();   // we may have missed item moves while offline
    }
    mp.wasDisconnected = false;
  } else if (['PNNetworkDownCategory', 'PNNetworkIssuesCategory', 'PNTimeoutCategory',
              'PNDisconnectedUnexpectedlyCategory', 'PNConnectionErrorCategory',
              'PNAccessDeniedCategory'].includes(c)) {
    if (mp.connectWaiter) {
      const w = mp.connectWaiter;
      mp.connectWaiter = null;
      w.reject(new Error(c));
      return;
    }
    mp.connected = false;
    mp.wasDisconnected = true;
  }
}

// After a dropped connection: ask for the world again (keep ours if nobody answers)
function mpResync() {
  if (!mp.synced) return;
  mp.synced = false;
  mp.buffer = [];
  mpSend({ t: 'hello' });
  clearTimeout(mp.joinTimer);
  mp.joinTimer = setTimeout(() => {
    if (mp.active && !mp.synced) mpApplySnapshot({ at: String(mp.lastOpTT), items: mp.items });
  }, MP_JOIN_WAIT_MS);
}

function mpOnMessage(ev) {
  const m = ev && ev.message;
  if (!m || typeof m !== 'object' || typeof m.t !== 'string') return;
  const from = String(ev.publisher || m.from || '');
  if (!from) return;
  let tt;
  try { tt = BigInt(ev.timetoken); } catch (_) { return; }
  const known = mp.players.get(from);
  if (known) known.lastSeen = performance.now();

  switch (m.t) {
    case 'take':
    case 'drop':
      if (mp.synced) mpApplyOp(m, from, tt);
      else mp.buffer.push({ m, from, tt });
      break;
    case 'snap':
      if (m.to === mp.myId) {
        if (!mp.synced) mpApplySnapshot(m);
      } else if (mp.snapReplies.has(m.to)) {
        // someone else already answered that newcomer
        clearTimeout(mp.snapReplies.get(m.to));
        mp.snapReplies.delete(m.to);
      }
      break;
    case 'hello':
      if (from === mp.myId) break;
      if (mp.present) setTimeout(() => mpSendPos(true), Math.random() * 300);
      if (mp.synced && !mp.snapReplies.has(from)) {
        mp.snapReplies.set(from, setTimeout(() => {
          mp.snapReplies.delete(from);
          mpSendSnapshot(from);
        }, 50 + Math.random() * 450));
      }
      break;
    case 'pos':
      if (from !== mp.myId) mpOnPos(m, from);
      break;
    case 'say':
      if (from !== mp.myId) mpOnSay(m, from);
      break;
    case 'bye':
      if (from !== mp.myId) mpRemovePlayer(from, 'left');
      break;
  }
}

function mpCleanItem(it) {
  if (!it || typeof it.id !== 'string' || !it.id) return null;
  const o = {
    id: it.id.slice(0, 60),
    name: String(it.name || it.id).slice(0, 60),
    emoji: String(it.emoji || '❓').slice(0, 12)
  };
  if (typeof it.pickedUpFrom === 'string') o.pickedUpFrom = it.pickedUpFrom.slice(0, 60);
  return o;
}

function mpApplySnapshot(m) {
  if (!m.items || typeof m.items !== 'object') return;
  let at = 0n;
  try { at = BigInt(m.at || 0); } catch (_) { /* treat as 0 */ }
  const items = {};
  for (const [path, hotspots] of Object.entries(m.items)) {
    if (!hotspots || typeof hotspots !== 'object') continue;
    const out = {};
    for (const [hsId, list] of Object.entries(hotspots)) {
      if (Array.isArray(list)) out[hsId] = list.map(mpCleanItem).filter(Boolean).slice(0, HOTSPOT_CAPACITY);
    }
    items[path] = out;
  }
  // Maps the sender didn't know about keep their defaults
  for (const [path, defaults] of Object.entries(mp.items)) {
    if (!items[path]) items[path] = defaults;
  }
  mp.items = items;
  mp.lastOpTT = at;
  mp.synced = true;
  clearTimeout(mp.joinTimer);
  // Item moves that happened after the snapshot was taken
  const later = mp.buffer;
  mp.buffer = [];
  for (const b of later) if (b.tt > at) mpApplyOp(b.m, b.from, b.tt);
  if (mapConfig && mp.items[currentMapPath]) hotspotItems = mpItemsFor(currentMapPath, mapConfig);
  mpCacheWorldSoon();
  if (mp.onSynced) {
    const f = mp.onSynced;
    mp.onSynced = null;
    f();
  }
}

// Apply one take/drop. Every computer runs this in the same order.
function mpApplyOp(m, from, tt) {
  if (tt > mp.lastOpTT) mp.lastOpTT = tt;
  const mapItems = mp.items[m.map];
  if (!mapItems || typeof m.hs !== 'string' || !Array.isArray(mapItems[m.hs])) return;
  const list = mapItems[m.hs];
  if (m.t === 'take') {
    const idx = list.findIndex(it => it.id === m.item);
    const item = idx >= 0 ? list.splice(idx, 1)[0] : null;
    if (item) mp.lastTaker[`${m.map}|${m.hs}|${m.item}`] = from;
    if (from === mp.myId) mpOwnTakeResult(m, item);
  } else {
    const item = mpCleanItem(m.item);
    if (!item) return;
    const ok = list.length < HOTSPOT_CAPACITY;
    if (ok) list.push(item);
    if (from === mp.myId) mpOwnDropResult(m, item, ok);
  }
  mpCacheWorldSoon();
}

function mpHotspotName(map, hsId) {
  const cfg = mp.mapConfigs[map] || (map === currentMapPath ? mapConfig : null);
  const def = cfg && cfg.hotspots.find(h => h.id === hsId);
  return def ? def.name : 'there';
}

function mpOwnTakeResult(m, item) {
  mp.pendingTakes.delete(`${m.map}|${m.hs}|${m.item}`);
  if (item) {
    if (backpack.length < BACKPACK_CAPACITY) {
      item.pickedUpFrom = m.hs;   // record origin so it can't be used there
      backpack.push(item);
      writeSave();
    } else {
      mpRequestDrop(m.hs, item, m.map);   // no room after all: put it back
    }
    return;
  }
  const taker = mp.players.get(mp.lastTaker[`${m.map}|${m.hs}|${m.item}`]);
  mpToast(taker ? `Too slow! ${taker.name} grabbed it first! 😄` : 'Oops — that one is already gone!');
}

function mpOwnDropResult(m, item, ok) {
  const k = `${m.map}|${m.hs}`;
  const n = (mp.pendingDrops.get(k) || 1) - 1;
  if (n > 0) mp.pendingDrops.set(k, n); else mp.pendingDrops.delete(k);
  if (ok) return;
  // Someone filled the spot first: it comes back to the backpack
  if (backpack.length < BACKPACK_CAPACITY) backpack.push(item);
  writeSave();
  mpToast(`No room at the ${mpHotspotName(m.map, m.hs)} any more — it's back in your backpack.`);
}

function mpToast(text) {
  if (state === GameState.INTERACTING) interactionHintText = text;
  else useToast = { text, age: 0 };
}

// Ask the world for an item. Returns false only if the backpack is full.
function mpRequestTake(hotspotId, index) {
  const item = (hotspotItems[hotspotId] || [])[index];
  if (!item) return true;
  if (backpack.length + mp.pendingTakes.size >= BACKPACK_CAPACITY) return false;
  const key = `${currentMapPath}|${hotspotId}|${item.id}`;
  if (mp.pendingTakes.has(key)) return true;
  mp.pendingTakes.add(key);
  mpPublish({ t: 'take', map: currentMapPath, hs: hotspotId, item: item.id }).catch(() => {
    mp.pendingTakes.delete(key);
    mpToast("Couldn't reach your friends — try again!");
  });
  return true;
}

// The item has already left the backpack; it comes back if the drop fails.
function mpRequestDrop(hotspotId, item, map = currentMapPath) {
  const k = `${map}|${hotspotId}`;
  mp.pendingDrops.set(k, (mp.pendingDrops.get(k) || 0) + 1);
  mpPublish({ t: 'drop', map, hs: hotspotId, item: mpCleanItem(item) }).catch(() => {
    const n = (mp.pendingDrops.get(k) || 1) - 1;
    if (n > 0) mp.pendingDrops.set(k, n); else mp.pendingDrops.delete(k);
    if (backpack.length < BACKPACK_CAPACITY) backpack.push(item);
    writeSave();
    mpToast("Couldn't reach your friends — try again!");
  });
}

function mpPendingDropsAt(hotspotId) {
  return mp.active ? (mp.pendingDrops.get(`${currentMapPath}|${hotspotId}`) || 0) : 0;
}

// --- Remote players ---
// { id, remote: true, char, name, color, map, tx/ty (latest 0–1 position),
//   fx/fy (smoothed), x/y (map px), facing, walking, rotation, held, frame }
function mpOnPos(m, from) {
  const ch = characterByName(m.char);
  if (!ch || typeof m.map !== 'string') return;
  const x = clamp(Number(m.x) || 0, 0, 1);
  const y = clamp(Number(m.y) || 0, 0, 1);
  let rp = mp.players.get(from);
  const isNew = !rp;
  if (isNew) {
    rp = { id: from, remote: true, frame: 0, frameTimer: 0 };
    mp.players.set(from, rp);
  }
  if (isNew || rp.map !== m.map) { rp.fx = x; rp.fy = y; }   // pop in, don't slide across the map
  Object.assign(rp, {
    char: ch, name: ch.name, color: ch.color, map: m.map, tx: x, ty: y,
    facing: m.f === 'left' ? 'left' : 'right',
    walking: !!m.w,
    rotation: [0, 90, 180, 270].includes(m.r) ? m.r : 0,
    held: typeof m.h === 'string' ? m.h.slice(0, 12) : null,
    lastSeen: performance.now()
  });
  rp.x = rp.fx * scaledMapW;
  rp.y = rp.fy * scaledMapH;
  if (isNew && mpInWorld()) mpToast(`👋 ${ch.name} joined the world!`);
}

function mpRemovePlayer(id, why) {
  const rp = mp.players.get(id);
  if (!rp) return;
  mp.players.delete(id);
  speechBubbles = speechBubbles.filter(b => b.owner !== rp && b.partner !== rp);
  if (talkingTo === rp) endConversation();
  if (nearbyNpc === rp) nearbyNpc = null;
  if (mpInWorld()) mpToast(why === 'left' ? `${rp.name} went home. 🏠` : `${rp.name} lost connection.`);
}

function mpPlayersHere() {
  if (!mp.active) return [];
  const out = [];
  for (const rp of mp.players.values()) if (rp.map === currentMapPath && rp.char) out.push(rp);
  return out;
}

function mpCharacterTaken(name) {
  if (!mp.active) return false;
  for (const rp of mp.players.values()) if (rp.name === name) return true;
  return false;
}

function mpOnSay(m, from) {
  if (typeof m.text !== 'string' || m.map !== currentMapPath || !mpInWorld()) return;
  const text = m.text.replace(/\s+/g, ' ').trim().slice(0, 160);
  const speaker = mp.players.get(from);
  if (!text || !speaker) return;
  let owner, partner;
  if (m.npc) {
    // An NPC answering a friend
    owner = currentNpcs().find(n => n.id === m.npc);
    if (!owner || owner === talkingTo) return;   // we're chatting with them ourselves
    partner = speaker;
  } else {
    owner = speaker;
    partner = m.to === mp.myId ? 'player'
      : (mp.players.get(m.to) || currentNpcs().find(n => n.id === m.to) || null);
  }
  say(owner, text, partner);
  const b = speechBubbles[speechBubbles.length - 1];
  b.fadeStart = b.start + b.duration + 6000;   // friends' lines linger, then fade
  if (partner === 'player' && talkingTo !== owner && state === GameState.PLAYING) {
    mpToast(`💬 ${owner.name} is talking to you! ${isTouchDevice() ? 'Tap them' : 'Press T'} to answer.`);
    mp.talkToast = useToast;
  }
}

// Called every frame
function mpTick() {
  if (!mp.active) return;
  mpSendPos(false);
  for (const rp of mp.players.values()) {
    rp.fx += (rp.tx - rp.fx) * 0.2;
    rp.fy += (rp.ty - rp.fy) * 0.2;
    rp.x = rp.fx * scaledMapW;
    rp.y = rp.fy * scaledMapH;
    const moving = rp.walking || Math.hypot(rp.tx - rp.fx, rp.ty - rp.fy) > 0.002;
    if (moving) {
      if (++rp.frameTimer > 8) { rp.frame = (rp.frame + 1) % 4; rp.frameTimer = 0; }
    } else {
      rp.frame = 0;
      rp.frameTimer = 0;
    }
  }
  // The friend you're chatting with walked off or went into another room
  if (state === GameState.TALKING && talkingTo && talkingTo.remote) {
    const rp = talkingTo;
    const k = SPRITE_SCALE / BASE_SPRITE_SCALE;
    if (rp.map !== currentMapPath || Math.hypot(rp.x - player.x, rp.y - player.y) > NPC_TALK_RANGE * k * 2.5) {
      endConversation();
      mpToast(`${rp.name} walked away.`);
    }
  }
}

// Runs even when the tab is in the background (rAF pauses there)
setInterval(() => {
  if (!mp.active) return;
  mpSendPos(false);
  const now = performance.now();
  for (const [id, rp] of mp.players) if (now - rp.lastSeen > MP_TIMEOUT_MS) mpRemovePlayer(id, 'lost');
  if (mp.pubnub && !mp.connected && !mp.connectWaiter && typeof mp.pubnub.reconnect === 'function') {
    try { mp.pubnub.reconnect(); } catch (_) { /* try again next time */ }
  }
}, 1000);

// Closing the tab: a "keepalive" request still gets the goodbye out
window.addEventListener('pagehide', () => {
  if (!mp.active || !mp.present) return;
  const msg = encodeURIComponent(JSON.stringify({ t: 'bye', from: mp.myId }));
  const url = `https://ps.pndsn.com/publish/${PUBNUB_PUBLISH_KEY}/${PUBNUB_SUBSCRIBE_KEY}/0/` +
    `${encodeURIComponent(mp.channel)}/0/${msg}?uuid=${encodeURIComponent(mp.myId)}&store=0`;
  try { fetch(url, { keepalive: true, mode: 'no-cors' }); } catch (_) { /* best effort */ }
});

// --- Drawing friends ---
function drawRemotePlayer(rp) {
  const k = SPRITE_SCALE / BASE_SPRITE_SCALE;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
  ctx.beginPath();
  ctx.ellipse(rp.x, rp.y + 2, 42 * k, 15 * k, 0, 0, Math.PI * 2);
  ctx.fill();
  const draw = () => drawCharacterSprite(
    rp.x - player.width / 2, rp.y - player.height, rp.char, rp.frame, rp.facing,
    SPRITE_SCALE, mouthOpenFor(rp), rp.held
  );
  if (rp.rotation) {
    const cx = rp.x, cy = rp.y - player.height / 2;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rp.rotation * Math.PI / 180);
    ctx.translate(-cx, -cy);
    draw();
    ctx.restore();
  } else {
    draw();
  }
}

// Small name label over a friend's head
function drawNameTag(rp) {
  const head = speakerHead(rp);
  ctx.font = 'bold 12px "Comic Sans MS", cursive';
  ctx.textAlign = 'center';
  const label = `⭐ ${rp.name}`;
  const w = ctx.measureText(label).width + 14;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
  roundRect(head.x - w / 2, head.top - 30, w, 20, 6);
  ctx.fill();
  ctx.fillStyle = rp.color;
  ctx.fillText(label, head.x, head.top - 16);
}

// HUD badge under the camper name: world code + how many campers are here
function drawMpHudBadge() {
  const n = 1 + mp.players.size;
  let text = `🌍 World ${mp.code}  ·  👥 ${n} camper${n === 1 ? '' : 's'}`;
  if (!mp.connected) text += '  ·  ⚠️ reconnecting…';
  ctx.font = 'bold 14px "Comic Sans MS", cursive';
  const w = ctx.measureText(text).width + 20;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
  roundRect(10, 52, w, 30, 8);
  ctx.fill();
  ctx.fillStyle = '#FFE082';
  ctx.textAlign = 'left';
  ctx.fillText(text, 20, 72);
}

// Character screen in a world: the code to share, and who's here
function drawWorldCodeBanner() {
  const code = `${mp.code.slice(0, 3)} ${mp.code.slice(3)}`;
  const n = mp.players.size;
  const sub = n
    ? `${n} friend${n === 1 ? ' is' : 's are'} here!  Tell others the code to join.`
    : 'Give your friends this code so they can join you!';
  const w = Math.min(canvas.width - 24, 440), h = 62;
  const x = canvas.width / 2 - w / 2, y = 136;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
  ctx.strokeStyle = '#FFD54F';
  ctx.lineWidth = 2;
  roundRect(x, y, w, h, 12);
  ctx.fill();
  ctx.stroke();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#FFD54F';
  ctx.font = 'bold 24px "Comic Sans MS", cursive';
  ctx.fillText(`🌍 World code: ${code}`, canvas.width / 2, y + 28);
  ctx.fillStyle = '#FFE0B2';
  ctx.font = '13px "Comic Sans MS", cursive';
  ctx.fillText(sub, canvas.width / 2, y + 50);
}

// --- Main Game Loop ---
function gameLoop() {
  update();
  mpTick();
  updateConversation();

  switch (state) {
    case GameState.LOADING:
      drawLoadingScreen();
      break;
    case GameState.MODE_SELECT:
      drawMenuBackdrop();
      break;
    case GameState.CHARACTER_SELECT:
      drawCharacterSelect();
      break;
    case GameState.RESUME_PROMPT:
      drawResumePrompt();
      break;
    case GameState.PLAYING:
    case GameState.TALKING:
      drawGame();
      break;
    case GameState.INTERACTING:
      drawInteraction();
      drawJournal();
      drawCompletionToast();
      break;
    case GameState.ITEM_ACTION:
      drawItemActionDialog();
      drawJournal();
      drawCompletionToast();
      break;
    case GameState.USING_ITEM:
      drawItemUseDialog();
      break;
    case GameState.CONFIRM_DIALOG:
      drawConfirmDialog();
      break;
  }

  if (devMode) drawDevModeOverlay();

  requestAnimationFrame(gameLoop);
}

// Start!
gameLoop();
</script>
</body>
