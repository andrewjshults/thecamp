<script>
// ============================================================
// THE CAMP - Louisa's Game
// A 2D exploration game based on Louisa's hand-drawn design
// ============================================================

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- Game State ---
const GameState = {
  LOADING: 'loading',
  CHARACTER_SELECT: 'characterSelect',
  RESUME_PROMPT: 'resumePrompt',
  PLAYING: 'playing',
  INTERACTING: 'interacting',
  ITEM_ACTION: 'itemAction',
  USING_ITEM: 'usingItem',
  CONFIRM_DIALOG: 'confirmDialog'
};

let state = GameState.LOADING;
let mapImage = null;
let mapLoaded = false;

// Map scale: we render the map scaled to fit nicely on screen
// All game coordinates are in "map space" (the scaled coordinates)
// The map will be drawn at a scale so its height fits the canvas
let mapScale = 1;
let scaledMapW = 0;
let scaledMapH = 0;

function recalcMapScale() {
  if (!mapImage) return;
  // Scale map so it's about 1.4x the canvas height (allows some scrolling)
  const targetH = canvas.height * 1.4;
  mapScale = targetH / mapImage.naturalHeight;
  scaledMapW = mapImage.naturalWidth * mapScale;
  scaledMapH = mapImage.naturalHeight * mapScale;
  recalcInteractiveObjects();
}

// --- Canvas sizing ---
// Use visualViewport when available so iOS Safari's dynamic toolbar
// doesn't cause canvas to extend below the visible area.
function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  recalcMapScale();
}
window.addEventListener('resize', resizeCanvas);
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', resizeCanvas);
}
resizeCanvas();

// --- Map config (loaded from JSON) ---
let mapConfig = null;   // the parsed JSON for the active map

// --- Load map config then image ---
// Convention: each map image has a sibling .json file with the same base name.
// To add a new map, drop a new image + json pair in assets/ and call loadMap().
function loadMap(jsonPath) {
  state = GameState.LOADING;

  function applyConfig(config) {
    mapConfig = config;
    mapImage = new Image();
    mapImage.onload = () => {
      mapLoaded = true;
      recalcMapScale();
      state = GameState.CHARACTER_SELECT;
    };
    mapImage.src = config.image;
  }

  if (window.location.protocol === 'file:') {
    // fetch() is blocked for file:// URLs by the browser's CORS policy.
    // Read the identical copy embedded in <script id="map-config"> instead.
    const el = document.getElementById('map-config');
    if (el) applyConfig(JSON.parse(el.textContent));
    return;
  }

  fetch(jsonPath)
    .then(r => r.json())
    .then(applyConfig);
}

loadMap('assets/game_design.json');

    pantsColor: '#4CAF50',
    desc: 'Curious about everything'
  }
];

let selectedCharIndex = 0;
let hoveredCharIndex = -1;

// --- Player ---
const player = {

  height: 144,

// --- Camera ---
const camera = {

// --- Developer Mode ---
let devMode = false;
let devSelectedHotspot = null;  // index into interactiveObjects
let devDrag = null;             // { index, corner:'TL'|'TR'|'BL'|'BR' }
const DEV_HANDLE_R = 14;        // corner handle radius in screen px

// --- Inventory ---
const BACKPACK_CAPACITY = 10;
const HOTSPOT_CAPACITY = 3;
const SAVE_VERSION = 1;
let backpack = [];                                  // up to BACKPACK_CAPACITY items

let backpackActionButton = 0;                       // index of focused button in action modal

let journalScrollTarget = 0;      // smooth-scroll target
let journalPanelRect = null;      // { x, y, w, h } — set each frame for hit-testing
let journalBtnRect = null;        // { x, y, w, h } — toggle tab button
let journalTouchStartY = null;    // for touch-drag scrolling inside journal
let journalTouchStartScroll = 0;

function saveKey(name) {
  return `louisas-game:save:${name}`;
}
function loadSave(name) {
  try {
    const raw = localStorage.getItem(saveKey(name));
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}
function writeSave() {
  if (!player.character) return;
  const payload = {
    version: SAVE_VERSION,
    backpack,
    hotspots: hotspotItems,
    completedUses
  };
  try {
    localStorage.setItem(saveKey(player.character.name), JSON.stringify(payload));
  } catch (e) {
    console.warn('Failed to write save', e);
  }
}
function defaultHotspotItems() {
  const out = {};
  if (!mapConfig) return out;
  for (const def of mapConfig.hotspots) {
    out[def.id] = (def.items || []).map(it => ({ ...it }));
  }
  return out;
}
function initFreshSave() {
  backpack = [];
  hotspotItems = defaultHotspotItems();
  completedUses = [];
  writeSave();
}
function applySave(save) {
  backpack = Array.isArray(save.backpack) ? save.backpack.map(it => ({ ...it })) : [];
  const defaults = defaultHotspotItems();
  hotspotItems = {};
  for (const def of mapConfig.hotspots) {
    if (save.hotspots && Array.isArray(save.hotspots[def.id])) {
      hotspotItems[def.id] = save.hotspots[def.id].map(it => ({ ...it }));
    } else {
      hotspotItems[def.id] = defaults[def.id];
    }
  }
  completedUses = Array.isArray(save.completedUses) ? save.completedUses.map(u => ({ ...u })) : [];
}

// --- Input ---
const keys = {};
window.addEventListener('keydown', (e) => {
  keys[e.key] = true;
  if (e.key === ' ') {
    e.preventDefault();
  }
  // Cmd+D (Mac) or Ctrl+D (Win/Linux) toggles developer mode from any state
  if ((e.metaKey || e.ctrlKey) && e.key === 'd') {
    e.preventDefault();
    devMode ? exitDevMode() : enterDevMode();
    return;
  }
  if (state === GameState.CHARACTER_SELECT) {
    if (e.key === 'ArrowLeft') {
      selectedCharIndex = (selectedCharIndex - 1 + characters.length) % characters.length;
    }
    if (e.key === 'ArrowRight') {
      selectedCharIndex = (selectedCharIndex + 1) % characters.length;
    }
    if (e.key === 'Enter' || e.key === ' ') {
      selectCharacter(selectedCharIndex);
    }
  } else if (state === GameState.RESUME_PROMPT) {
    if (e.key === 'Enter' || e.key === 'r' || e.key === 'R') {
      resumePendingSave();
    } else if (e.key === 'f' || e.key === 'F') {
      startFreshSave();
    } else if (e.key === 'Escape') {
      pendingResumeSave = null;
      player.character = null;
      state = GameState.CHARACTER_SELECT;
    }
  } else if (state === GameState.CONFIRM_DIALOG) {
    if (e.key === 'y' || e.key === 'Y' || e.key === 'Enter') {
      state = GameState.CHARACTER_SELECT;
      player.character = null;
    } else if (e.key === 'n' || e.key === 'N' || e.key === 'Escape') {
      state = GameState.PLAYING;
    }
  } else if (state === GameState.INTERACTING) {
    if (e.key === 'Escape' || e.key === ' ') {
      closeInteraction();
    }
  } else if (state === GameState.ITEM_ACTION) {
    handleItemActionKey(e);
  } else if (state === GameState.USING_ITEM) {
    if (e.key === 'Escape' || e.key === ' ') {
      closeItemUse();
    }
  } else if (state === GameState.PLAYING) {
    if (e.key === 'j' || e.key === 'J') {
      journalOpen = !journalOpen;
      if (journalOpen) { journalScroll = 0; journalScrollTarget = 0; }
      return;
    }
    if (e.key === 'Escape' && journalOpen) {
      journalOpen = false;
      return;
    }
    if (e.key === 'b' || e.key === 'B') {
      toggleBackpack();
      return;
    }
    if (backpackOpen) {
      handleBackpackKey(e);
      return;
    }
    if (e.key === ' ') {
      handleInteract();
    }
    if (e.key === 'Escape') {
      state = GameState.CONFIRM_DIALOG;
    }
  }
});
window.addEventListener('keyup', (e) => {
  keys[e.key] = false;
});

// --- Mouse / Touch input ---
canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left;
  const sy = e.clientY - rect.top;
  if (devMode) {
    handleDevPointerMove(sx, sy);
    updateDevCursor(sx, sy);
    return;
  }
  if (state === GameState.CHARACTER_SELECT) {
    hoveredCharIndex = getHoveredCharacter(sx, sy);
  }
  // Hover over dimmed item buttons in the interaction dialog (desktop only)
  if (state === GameState.INTERACTING) {
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const mx = sx * scaleX;
    const my = sy * scaleY;
    let found = null;
    for (const r of interactionDimmedRects) {
      if (mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h) {
        found = r;
        break;
      }
    }
    interactionHintText = found
      ? `Find the ${found.item.emoji} ${found.item.name} at the ${found.location}!`
      : null;
  }
});
canvas.addEventListener('mousedown', (e) => {
  if (!devMode) return;
  const rect = canvas.getBoundingClientRect();
  handleDevPointerDown(e.clientX - rect.left, e.clientY - rect.top);
});
canvas.addEventListener('mouseup', () => { devDrag = null; });
canvas.addEventListener('click', (e) => {
  if (devMode) return;  // dev mode uses mousedown instead
  const rect = canvas.getBoundingClientRect();
  handleCanvasTap(e.clientX - rect.left, e.clientY - rect.top);
});
canvas.addEventListener('dblclick', (e) => {
  if (devMode) return;
  if (state !== GameState.PLAYING || backpackOpen) return;
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left;
  const sy = e.clientY - rect.top;
  const spriteScreenX = player.x - camera.x;
  const spriteScreenY = player.y - player.height - camera.y;
  const hitDist = Math.hypot(sx - spriteScreenX, sy - (spriteScreenY + player.height / 2));
  if (hitDist < 108) toggleBackpack();
});
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const touch = e.touches[0];
  const sx = touch.clientX - rect.left;
  const sy = touch.clientY - rect.top;
  if (devMode) {
    handleDevPointerDown(sx, sy);
  } else {
    // Track journal touch-scroll start
    if (journalOpen && journalPanelRect) {
      const p = journalPanelRect;
      if (sx >= p.x && sx <= p.x + p.w && sy >= p.y && sy <= p.y + p.h) {
        journalTouchStartY = sy;
        journalTouchStartScroll = journalScrollTarget;
        return; // don't fall through to tap
      }
    }
    handleCanvasTap(sx, sy);
  }
}, { passive: false });
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const touch = e.touches[0];
  if (devMode && devDrag) {
    handleDevPointerMove(touch.clientX - rect.left, touch.clientY - rect.top);
  } else if (journalTouchStartY !== null) {
    const sy = touch.clientY - rect.top;
    const delta = journalTouchStartY - sy;
    journalScrollTarget = journalTouchStartScroll + delta;
  }
}, { passive: false });
canvas.addEventListener('touchend', (e) => {
  devDrag = null;
  journalTouchStartY = null;
});

// --- Journal scroll events ---
canvas.addEventListener('wheel', (e) => {
  if (!journalOpen || !journalPanelRect) return;
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left;
  const sy = e.clientY - rect.top;
  const p = journalPanelRect;
  if (sx >= p.x && sx <= p.x + p.w && sy >= p.y && sy <= p.y + p.h) {
    e.preventDefault();
    journalScrollTarget += e.deltaY * 0.8;
  }
}, { passive: false });

function getHoveredCharacter(mx, my) {
  const cardW = 120;
  const cardH = 170;
  const gap = 20;
  const totalW = characters.length * (cardW + gap) - gap;
  const startX = canvas.width / 2 - totalW / 2;
  const cardY = canvas.height / 2 - 40;
  for (let i = 0; i < characters.length; i++) {
    const cx = startX + i * (cardW + gap);
    if (mx >= cx && mx <= cx + cardW && my >= cardY && my <= cardY + cardH) {
      return i;
    }
  }
  return -1;
}

let pendingResumeSave = null;

function selectCharacter(index) {
  player.character = characters[index];
  // Starting position comes from the map's JSON config
  const start = mapConfig.playerStart;
  player.x = scaledMapW * start.px;
  player.y = scaledMapH * start.py;
  backpackOpen = false;
  backpackSelection = { row: 'backpack', col: 0 };

  const existing = loadSave(player.character.name);
  if (existing) {
    pendingResumeSave = existing;
    state = GameState.RESUME_PROMPT;
  } else {
    initFreshSave();
    state = GameState.PLAYING;
  }
}

function resumePendingSave() {
  if (pendingResumeSave) applySave(pendingResumeSave);
  pendingResumeSave = null;
  state = GameState.PLAYING;
}

function startFreshSave() {
  initFreshSave();
  pendingResumeSave = null;
  state = GameState.PLAYING;
}

// --- Developer Mode functions ---

function enterDevMode() {
  devMode = true;
  devSelectedHotspot = null;
  devDrag = null;
}

function exitDevMode() {
  devMode = false;
  devDrag = null;
  canvas.style.cursor = 'default';
  copyHotspotsToClipboard();
}

function copyHotspotsToClipboard() {
  const updated = mapConfig.hotspots.map(h => ({
    id: h.id,
    name: h.name,
    px: parseFloat(h.px.toFixed(4)),
    py: parseFloat(h.py.toFixed(4)),
    pw: parseFloat(h.pw.toFixed(4)),
    ph: parseFloat(h.ph.toFixed(4)),
    action: h.action,
    description: h.description,
    interactionText: h.interactionText
  }));
  const json = JSON.stringify(updated, null, 2);
  const text =
    'Update the hotspot bounds in two places:\n\n' +
    '1. Replace the "hotspots" array in assets/game_design.json with:\n\n' +
    json + '\n\n' +
    '2. Also replace the "hotspots" array inside the ' +
    '<script type="application/json" id="map-config"> block in index.html ' +
    'with the same array (this copy is used when the file is opened directly ' +
    'without a server).\n';
  navigator.clipboard.writeText(text).catch(() => console.log(text));
}

// Returns the four corner handles for an interactiveObject in screen space
function devHandles(obj) {
  const sx = obj.x - camera.x;
  const sy = obj.y - camera.y;
  const sw = obj.width;
  const sh = obj.height;
  return [
    { corner: 'TL', x: sx,      y: sy      },
    { corner: 'TR', x: sx + sw, y: sy      },
    { corner: 'BL', x: sx,      y: sy + sh },
    { corner: 'BR', x: sx + sw, y: sy + sh }
  ];
}

function handleDevPointerDown(sx, sy) {
  // Hit-test corner handles first (highest priority)
  for (let i = 0; i < interactiveObjects.length; i++) {
    for (const h of devHandles(interactiveObjects[i])) {
      if (Math.hypot(sx - h.x, sy - h.y) <= DEV_HANDLE_R + 6) {
        devSelectedHotspot = i;
        devDrag = { index: i, corner: h.corner };
        return;
      }
    }
  }
  // Hit-test hotspot interiors for selection
  const mx = sx + camera.x;
  const my = sy + camera.y;
  for (let i = 0; i < interactiveObjects.length; i++) {
    const obj = interactiveObjects[i];
    if (mx >= obj.x && mx <= obj.x + obj.width &&
        my >= obj.y && my <= obj.y + obj.height) {
      devSelectedHotspot = i;
      return;
    }
  }
  devSelectedHotspot = null;
}

function handleDevPointerMove(sx, sy) {
  if (!devDrag) return;
  const mx = sx + camera.x;
  const my = sy + camera.y;
  const obj = interactiveObjects[devDrag.index];
  const def = mapConfig.hotspots[devDrag.index];

  let left   = obj.x;
  let top    = obj.y;
  let right  = obj.x + obj.width;
  let bottom = obj.y + obj.height;

  switch (devDrag.corner) {
    case 'TL': left  = mx; top    = my; break;
    case 'TR': right = mx; top    = my; break;
    case 'BL': left  = mx; bottom = my; break;
    case 'BR': right = mx; bottom = my; break;
  }

  // Enforce minimum 20px size and keep inside map
  if (right  - left < 20) { if (devDrag.corner.endsWith('L')) left  = right  - 20; else right  = left  + 20; }
  if (bottom - top  < 20) { if (devDrag.corner.startsWith('T')) top  = bottom - 20; else bottom = top + 20; }
  left   = Math.max(0, Math.min(left,   scaledMapW - 20));
  top    = Math.max(0, Math.min(top,    scaledMapH - 20));
  right  = Math.max(20, Math.min(right,  scaledMapW));
  bottom = Math.max(20, Math.min(bottom, scaledMapH));

  // Write back to both the runtime object and the source-of-truth def
  obj.x = left;
  obj.y = top;
  obj.width  = right  - left;
  obj.height = bottom - top;
  def.px = left   / scaledMapW;
  def.py = top    / scaledMapH;
  def.pw = obj.width  / scaledMapW;
  def.ph = obj.height / scaledMapH;
}

// Change cursor based on what's under the pointer
function updateDevCursor(sx, sy) {
  const cursorMap = { TL: 'nwse-resize', TR: 'nesw-resize', BL: 'nesw-resize', BR: 'nwse-resize' };
  for (const obj of interactiveObjects) {
    for (const h of devHandles(obj)) {
      if (Math.hypot(sx - h.x, sy - h.y) <= DEV_HANDLE_R + 6) {
        canvas.style.cursor = cursorMap[h.corner];
        return;
      }
    }
    const mx = sx + camera.x, my = sy + camera.y;
    if (mx >= obj.x && mx <= obj.x + obj.width && my >= obj.y && my <= obj.y + obj.height) {
      canvas.style.cursor = 'pointer';
      return;
    }
  }
  canvas.style.cursor = 'default';
}

function drawDevModeOverlay() {
  // Badge — top right
  const badge = '🔧 DEV MODE';
  ctx.font = 'bold 14px monospace';
  const bw = ctx.measureText(badge).width + 24;
  const bh = 30;
  const bx = canvas.width - bw - 10;
  const by = 10;
  ctx.fillStyle = 'rgba(180, 0, 0, 0.85)';
  roundRect(bx, by, bw, bh, 6);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'left';
  ctx.fillText(badge, bx + 12, by + 20);

  // All hotspot bounds + handles (drawn in map space, then offset by camera)
  ctx.save();
  ctx.translate(-camera.x, -camera.y);

  for (let i = 0; i < interactiveObjects.length; i++) {
    const obj = interactiveObjects[i];
    const isSelected = i === devSelectedHotspot;

    // Filled tint
    ctx.fillStyle = isSelected ? 'rgba(255, 235, 59, 0.18)' : 'rgba(255, 255, 255, 0.07)';
    ctx.fillRect(obj.x, obj.y, obj.width, obj.height);

    // Outline
    ctx.strokeStyle = isSelected ? '#FFD600' : 'rgba(255, 200, 0, 0.65)';
    ctx.lineWidth = isSelected ? 2.5 : 1.5;
    ctx.setLineDash(isSelected ? [] : [6, 4]);
    ctx.strokeRect(obj.x, obj.y, obj.width, obj.height);
    ctx.setLineDash([]);

    // Name label
    ctx.font = 'bold 11px monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(obj.x + 1, obj.y + 1, ctx.measureText(obj.id).width + 10, 16);
    ctx.fillStyle = isSelected ? '#FFD600' : '#ffe';
    ctx.fillText(obj.id, obj.x + 5, obj.y + 13);

    // Corner handles
    const corners = devHandles(obj);  // these are already in screen space via camera offset above — recalc in map space
    const mapCorners = [
      { corner: 'TL', x: obj.x,            y: obj.y             },
      { corner: 'TR', x: obj.x + obj.width, y: obj.y             },
      { corner: 'BL', x: obj.x,            y: obj.y + obj.height },
      { corner: 'BR', x: obj.x + obj.width, y: obj.y + obj.height }
    ];
    for (const h of mapCorners) {
      ctx.beginPath();
      ctx.arc(h.x, h.y, DEV_HANDLE_R, 0, Math.PI * 2);
      ctx.fillStyle = isSelected ? '#FFD600' : '#fff';
      ctx.fill();
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
  }

  ctx.restore();

  // Footer hint
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  const hint = 'Drag corners to resize  •  Cmd+D to save & exit';
  ctx.font = '12px monospace';
  ctx.textAlign = 'center';
  const hw = ctx.measureText(hint).width + 20;
  roundRect(canvas.width / 2 - hw / 2, canvas.height - 34, hw, 24, 5);
  ctx.fill();
  ctx.fillStyle = '#FFD600';
  ctx.fillText(hint, canvas.width / 2, canvas.height - 17);
}

// --- Interactive Objects ---
// Hotspot definitions are loaded from the map's JSON file (mapConfig.hotspots).
// Positions are stored as percentages of image dimensions (0-1)
// so they work at any scale. Converted to screen coords at runtime.

// Convert percentage-based definitions to pixel coords based on current map scale
let interactiveObjects = [];
function recalcInteractiveObjects() {
  if (!mapConfig) return;
  interactiveObjects = mapConfig.hotspots.map(def => ({
    ...def,
    x: def.px * scaledMapW,
    y: def.py * scaledMapH,
    width: def.pw * scaledMapW,
    height: def.ph * scaledMapH
  }));
}

let nearbyObject = null;
let currentInteraction = null;
let interactionTimer = 0;
let interactionAnimation = 0;

// --- Touch / tap-to-move ---
let tapTarget = null;     // { x, y } in map space
let tapRipple = null;     // { x, y, age } in screen space for visual feedback

function isTouchDevice() {
  return 'ontouchstart' in window || navigator.maxTouchPoints > 0;
}

function handleCanvasTap(screenX, screenY) {
  // Journal button always takes priority (visible in most states)
  if (journalBtnRect) {
    const b = journalBtnRect;
    if (screenX >= b.x && screenX <= b.x + b.w && screenY >= b.y && screenY <= b.y + b.h) {
      journalOpen = !journalOpen;
      if (journalOpen) { journalScroll = 0; journalScrollTarget = 0; }
      return;
    }
  }
  // Taps inside open journal panel (close button / scroll) don't fall through to game
  if (journalOpen && journalPanelRect) {
    const p = journalPanelRect;
    if (screenX >= p.x && screenX <= p.x + p.w && screenY >= p.y && screenY <= p.y + p.h) {
      // Close button (top-right of panel — 36×36)
      if (screenX >= p.x + p.w - 42 && screenY <= p.y + 46) {
        journalOpen = false;
      }
      return; // swallow tap
    }
    // Tapping outside journal panel on mobile (full-screen) closes it
    if (canvas.width < 600) { journalOpen = false; return; }
  }

  if (state === GameState.USING_ITEM) {
    closeItemUse();
    return;
  }

  if (state === GameState.CHARACTER_SELECT) {
    const idx = getHoveredCharacter(screenX, screenY);
    if (idx >= 0) selectCharacter(idx);
  } else if (state === GameState.RESUME_PROMPT) {
    const btns = resumePromptButtonRects();
    for (const b of btns) {
      if (screenX >= b.x && screenX <= b.x + b.w && screenY >= b.y && screenY <= b.y + b.h) {
        if (b.id === 'resume') resumePendingSave();
        else if (b.id === 'fresh') startFreshSave();
        return;
      }
    }
  } else if (state === GameState.CONFIRM_DIALOG) {
    const panelW = Math.min(400, canvas.width - 40);
    const panelH = 150;
    const panelY = canvas.height / 2 - panelH / 2;
    const btnW = 80, btnH = 36, btnY = panelY + panelH - 52, btnGap = 20;
    const yesBtnX = canvas.width / 2 - btnW - btnGap / 2;
    const noBtnX = canvas.width / 2 + btnGap / 2;
    if (screenX >= yesBtnX && screenX <= yesBtnX + btnW && screenY >= btnY && screenY <= btnY + btnH) {
      state = GameState.CHARACTER_SELECT;
      player.character = null;
    } else if (screenX >= noBtnX && screenX <= noBtnX + btnW && screenY >= btnY && screenY <= btnY + btnH) {
      state = GameState.PLAYING;
    }
  } else if (state === GameState.INTERACTING) {
    // Dimmed item tap: show location hint, stay in dialog
    for (const r of interactionDimmedRects) {
      if (screenX >= r.x && screenX <= r.x + r.w && screenY >= r.y && screenY <= r.y + r.h) {
        interactionHintText = `Find the ${r.item.emoji} ${r.item.name} at the ${r.location}!`;
        return;
      }
    }
    // Usable item tap: use it
    for (const r of interactionUseRects) {
      if (screenX >= r.x && screenX <= r.x + r.w && screenY >= r.y && screenY <= r.y + r.h) {
        closeInteraction();
        useItem(r.item);
        return;
      }
    }
    closeInteraction();
  } else if (state === GameState.ITEM_ACTION) {
    for (const r of itemActionButtonRects) {
      if (screenX >= r.x && screenX <= r.x + r.w && screenY >= r.y && screenY <= r.y + r.h) {
        if (!r.disabled) performItemAction(r.id);
        return;
      }
    }
  } else if (state === GameState.PLAYING) {
    // Backpack overlay hit-tests (slots) take precedence when open
    if (backpackOpen) {
      const allRects = [
        ...backpackSlotRects.hotspot.map(r => ({ ...r, row: 'hotspot' })),
        ...backpackSlotRects.backpack.map(r => ({ ...r, row: 'backpack' }))
      ];
      for (const r of allRects) {
        if (screenX >= r.x && screenX <= r.x + r.w && screenY >= r.y && screenY <= r.y + r.h) {
          backpackSelection = { row: r.row, col: r.col };
          // Open action modal when player is inside a hotspot and slot has an item
          if (nearbyObject) {
            const item = r.row === 'backpack'
              ? backpack[r.col]
              : (hotspotItems[nearbyObject.id] || [])[r.col];
            if (item) openItemAction();
          }
          return;
        }
      }
      // Tap outside any slot but still within the overlay band closes the backpack
      const overlayTop = backpackOverlayTop();
      if (screenY >= overlayTop) {
        backpackOpen = false;
        return;
      }
    }

    // Tapping the character sprite triggers interaction; tapping elsewhere walks there
    const spriteScreenX = player.x - camera.x;
    const spriteScreenY = player.y - player.height - camera.y;
    const hitDist = Math.hypot(screenX - spriteScreenX, screenY - (spriteScreenY + player.height / 2));
    const onCharacter = hitDist < 108;
    const now = performance.now();
    if (onCharacter && nearbyObject) {
      handleInteract();
      lastCharTapTime = now;
    } else if (onCharacter) {
      if (now - lastCharTapTime < 350) {
        toggleBackpack();
        lastCharTapTime = 0;
      } else {
        lastCharTapTime = now;
      }
    } else {
      const mapX = screenX + camera.x;
      const mapY = screenY + camera.y;
      tapTarget = { x: mapX, y: mapY };
      tapRipple = { x: screenX, y: screenY, age: 0 };
    }
  }
}

// --- Interaction handling ---
function handleInteract() {
  if (state === GameState.PLAYING && nearbyObject) {
    state = GameState.INTERACTING;
    currentInteraction = nearbyObject;
    interactionTimer = 0;
    interactionAnimation = 0;
  }
}

function closeInteraction() {
  state = GameState.PLAYING;
  currentInteraction = null;
  interactionHintText = null;
}

// --- Backpack / Inventory ---
function toggleBackpack() {
  backpackOpen = !backpackOpen;
  if (backpackOpen) {
    // Re-anchor selection; prefer hotspot row if items are there
    if (nearbyObject && (hotspotItems[nearbyObject.id] || []).length > 0) {
      backpackSelection = { row: 'hotspot', col: 0 };
    } else {
      backpackSelection = { row: 'backpack', col: 0 };
    }
  }
}

function selectedItem() {
  if (!backpackOpen) return null;
  if (backpackSelection.row === 'backpack') {
    return backpack[backpackSelection.col] || null;
  }
  if (!nearbyObject) return null;
  const items = hotspotItems[nearbyObject.id] || [];
  return items[backpackSelection.col] || null;
}

function backpackRowCount(row) {
  if (row === 'backpack') return BACKPACK_CAPACITY;
  if (!nearbyObject) return 0;
  return HOTSPOT_CAPACITY;
}

function handleBackpackKey(e) {
  if (e.key === 'Escape' || e.key === 'b' || e.key === 'B') {
    backpackOpen = false;
    return;
  }
  if (e.key === 'ArrowLeft') {
    const n = backpackRowCount(backpackSelection.row);
    if (n > 0) backpackSelection.col = (backpackSelection.col - 1 + n) % n;
  } else if (e.key === 'ArrowRight') {
    const n = backpackRowCount(backpackSelection.row);
    if (n > 0) backpackSelection.col = (backpackSelection.col + 1) % n;
  } else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    if (nearbyObject) {
      backpackSelection.row = backpackSelection.row === 'backpack' ? 'hotspot' : 'backpack';
      const n = backpackRowCount(backpackSelection.row);
      if (n > 0) backpackSelection.col = Math.min(backpackSelection.col, n - 1);
      else backpackSelection.col = 0;
    }
  } else if (e.key === 'Enter' || e.key === ' ') {
    openItemAction();
  }
}

function openItemAction() {
  if (!nearbyObject) return;            // outside hotspot = view-only
  const item = selectedItem();
  if (!item) return;
  currentItemAction = {
    source: backpackSelection.row,
    index: backpackSelection.col,
    hotspotId: nearbyObject.id
  };
  backpackActionButton = 0;
  state = GameState.ITEM_ACTION;
}

function closeItemAction() {
  currentItemAction = null;
  state = GameState.PLAYING;
}

// --- Item use helpers ---
function getItemUseAtHotspot(item, hotspot) {
  if (!item || !hotspot) return null;
  if (item.pickedUpFrom === hotspot.id) return null; // can't use where picked up
  const def = mapConfig && mapConfig.hotspots.find(h => h.id === hotspot.id);
  if (!def || !def.uses) return null;
  return def.uses.find(u => u.itemId === item.id) || null;
}

function isUseAlreadyDone(itemId, hotspotId) {
  return completedUses.some(u => u.hotspotId === hotspotId && u.itemId === itemId);
}

function totalUsesCount() {
  if (!mapConfig) return 0;
  return mapConfig.hotspots.reduce((sum, h) => sum + (h.uses ? h.uses.length : 0), 0);
}

function itemActionButtons() {
  if (!currentItemAction) return [];
  const a = currentItemAction;
  if (a.source === 'hotspot') {
    const backpackFull = backpack.length >= BACKPACK_CAPACITY;
    return [
      { id: 'pickup', label: 'Pick up', disabled: backpackFull },
      { id: 'cancel', label: 'Cancel',  disabled: false }
    ];
  }
  // Backpack item
  const hotspotFull = !a.hotspotId || (hotspotItems[a.hotspotId] || []).length >= HOTSPOT_CAPACITY;
  return [
    { id: 'drop',   label: 'Drop here', disabled: hotspotFull },
    { id: 'cancel', label: 'Cancel',    disabled: false },
  ];
}

function performItemAction(buttonId) {
  if (!currentItemAction) return;
  const a = currentItemAction;
  if (buttonId === 'cancel') {
    closeItemAction();
    return;
  }
  if (buttonId === 'pickup' && a.source === 'hotspot') {
    if (backpack.length >= BACKPACK_CAPACITY) return;
    const items = hotspotItems[a.hotspotId] || [];
    const [item] = items.splice(a.index, 1);
    if (item) {
      item.pickedUpFrom = a.hotspotId; // record origin so it can't be used there
      backpack.push(item);
    }
    writeSave();
    // Snap selection to remaining hotspot items or fall back to backpack
    const remaining = (hotspotItems[a.hotspotId] || []).length;
    if (remaining > 0) {
      backpackSelection = { row: 'hotspot', col: Math.min(a.index, remaining - 1) };
    } else {
      backpackSelection = { row: 'backpack', col: Math.max(0, backpack.length - 1) };
    }
    closeItemAction();
    return;
  }
  if (buttonId === 'drop' && a.source === 'backpack') {
    const items = hotspotItems[a.hotspotId] || [];
    if (items.length >= HOTSPOT_CAPACITY) return;
    const [item] = backpack.splice(a.index, 1);
    if (item) items.push(item);
    hotspotItems[a.hotspotId] = items;
    writeSave();
    // Keep cursor on backpack row at a valid position
    const newCol = Math.min(a.index, Math.max(0, backpack.length - 1));
    backpackSelection = { row: 'backpack', col: newCol };
    closeItemAction();
    return;
  }
}

function useItem(item) {
  const use = getItemUseAtHotspot(item, nearbyObject);
  if (!use) return;
  // Record completion (item stays in backpack)
  completedUses.push({
    hotspotId: nearbyObject.id,
    hotspotName: nearbyObject.name,
    itemId: item.id,
    itemName: item.name,
    itemEmoji: item.emoji || '?',
    text: use.text
  });
  writeSave();
  // Check for all-done celebration
  if (completedUses.length === totalUsesCount()) {
    completionToast = { age: 0 };
  }
  // Transition to use dialog
  currentItemUse = {
    item,
    use,
    hotspot: nearbyObject,
    timer: 0,
    animation: use.animation || nearbyObject.action
  };
  itemUseAnimation = 0;
  backpackOpen = false;
  state = GameState.USING_ITEM;
}

function closeItemUse() {
  currentItemUse = null;
  state = GameState.PLAYING;
}

function handleItemActionKey(e) {
  const btns = itemActionButtons();
  if (e.key === 'Escape') {
    closeItemAction();
    return;
  }
  if (e.key === 'ArrowLeft') {
    backpackActionButton = (backpackActionButton - 1 + btns.length) % btns.length;
  } else if (e.key === 'ArrowRight') {
    backpackActionButton = (backpackActionButton + 1) % btns.length;
  } else if (e.key === 'Enter' || e.key === ' ') {
    const b = btns[backpackActionButton];
    if (b && !b.disabled) performItemAction(b.id);
  }
}

// --- Game Logic ---
function update() {
  if (state !== GameState.PLAYING) return;
  if (devMode) return;  // freeze everything while editing hotspots

  // Movement (suppressed while backpack overlay is open — arrow keys drive selection)
  let dx = 0, dy = 0;
  player.walking = false;

  if (!backpackOpen) {
    if (keys['ArrowLeft'] || keys['a']) { dx = -player.speed; player.facing = 'left'; player.walking = true; }
    if (keys['ArrowRight'] || keys['d']) { dx = player.speed; player.facing = 'right'; player.walking = true; }
    if (keys['ArrowUp'] || keys['w']) { dy = -player.speed; player.walking = true; }
    if (keys['ArrowDown'] || keys['s']) { dy = player.speed; player.walking = true; }
  }

  // Keyboard cancels tap-to-move
  if (player.walking) {
    tapTarget = null;
  }

  // Tap-to-move: walk toward tapped map position
  if (!player.walking && tapTarget) {
    const tdx = tapTarget.x - player.x;
    const tdy = tapTarget.y - player.y;
    const dist = Math.hypot(tdx, tdy);
    if (dist < player.speed + 2) {
      tapTarget = null;
    } else {
      dx = (tdx / dist) * player.speed;
      dy = (tdy / dist) * player.speed;
      player.facing = tdx < 0 ? 'left' : 'right';
      player.walking = true;
    }
  }

  // Normalize diagonal movement
  if (dx !== 0 && dy !== 0) {
    dx *= 0.707;
    dy *= 0.707;
  }

  // Apply movement with map bounds (using scaled dimensions)
  if (mapImage) {
    player.x = Math.max(10, Math.min(scaledMapW - 10, player.x + dx));
    player.y = Math.max(10, Math.min(scaledMapH - 10, player.y + dy));
  }

  // Animation frame
  if (player.walking) {
    player.frameTimer++;
    if (player.frameTimer > 8) {
      player.frame = (player.frame + 1) % 4;
      player.frameTimer = 0;
    }
  } else {
    player.frame = 0;
    player.frameTimer = 0;
  }

  // Check for nearby interactive objects
  nearbyObject = null;
  let closestDist = Infinity;
  const px = player.x;
  const py = player.y;

  for (const obj of interactiveObjects) {
    const objCx = obj.x + obj.width / 2;
    const objCy = obj.y + obj.height / 2;
    const dist = Math.hypot(px - objCx, py - objCy);
    const threshold = Math.max(obj.width, obj.height) * 0.7 + 30;

    if (dist < threshold && dist < closestDist) {
      closestDist = dist;
      nearbyObject = obj;
    }
  }

  // Update camera to follow player
  updateCamera();
}

function updateCamera() {
  if (!mapImage) return;

  // Camera targets player center
  let targetX = player.x - canvas.width / 2;
  let targetY = player.y - canvas.height / 2;

  // Clamp camera to scaled map bounds
  targetX = Math.max(0, Math.min(scaledMapW - canvas.width, targetX));
  targetY = Math.max(0, Math.min(scaledMapH - canvas.height, targetY));

  // If the map is smaller than canvas, center it
  if (scaledMapW < canvas.width) targetX = -(canvas.width - scaledMapW) / 2;
  if (scaledMapH < canvas.height) targetY = -(canvas.height - scaledMapH) / 2;

  // Smooth camera follow
  camera.x += (targetX - camera.x) * 0.1;
  camera.y += (targetY - camera.y) * 0.1;
}

// --- Drawing ---
function drawCharacterSprite(x, y, char, frame, facing, scale) {
  const s = scale || 1;
  const w = 30 * s;
  const h = 48 * s;

  ctx.save();

  if (facing === 'left') {
    ctx.translate(x + w / 2, 0);
    ctx.scale(-1, 1);
    ctx.translate(-(x + w / 2), 0);
  }

  // Legs
  const legOffset = Math.sin(frame * Math.PI / 2) * 4 * s;
  ctx.fillStyle = char.pantsColor;
  ctx.fillRect(x + 7 * s, y + 30 * s + legOffset, 6 * s, 18 * s);
  ctx.fillRect(x + 17 * s, y + 30 * s - legOffset, 6 * s, 18 * s);

  // Shoes
  ctx.fillStyle = '#5D4037';
  ctx.fillRect(x + 5 * s, y + 44 * s + legOffset, 10 * s, 4 * s);
  ctx.fillRect(x + 15 * s, y + 44 * s - legOffset, 10 * s, 4 * s);

  // Body
  ctx.fillStyle = char.shirtColor;
  ctx.fillRect(x + 5 * s, y + 16 * s, 20 * s, 18 * s);

  // Arms
  const armSwing = Math.sin(frame * Math.PI / 2) * 3 * s;
  ctx.fillStyle = char.shirtColor;
  ctx.fillRect(x, y + 17 * s + armSwing, 6 * s, 14 * s);
  ctx.fillRect(x + 24 * s, y + 17 * s - armSwing, 6 * s, 14 * s);

  // Hands
  ctx.fillStyle = '#FFCC80';
  ctx.fillRect(x, y + 29 * s + armSwing, 6 * s, 4 * s);
  ctx.fillRect(x + 24 * s, y + 29 * s - armSwing, 6 * s, 4 * s);

  // Head
  ctx.fillStyle = '#FFCC80';
  ctx.beginPath();
  ctx.arc(x + 15 * s, y + 10 * s, 10 * s, 0, Math.PI * 2);
  ctx.fill();

  // Hair
  ctx.fillStyle = char.hairColor;
  ctx.beginPath();
  ctx.arc(x + 15 * s, y + 7 * s, 10 * s, Math.PI, Math.PI * 2);
  ctx.fill();

  // Eyes
  ctx.fillStyle = '#333';
  ctx.fillRect(x + 11 * s, y + 8 * s, 3 * s, 3 * s);
  ctx.fillRect(x + 18 * s, y + 8 * s, 3 * s, 3 * s);

  // Smile
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1.5 * s;
  ctx.beginPath();
  ctx.arc(x + 15 * s, y + 12 * s, 4 * s, 0.1, Math.PI - 0.1);
  ctx.stroke();

  ctx.restore();
}

function drawLoadingScreen() {
  ctx.fillStyle = '#2a1a0a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#FFD54F';
  ctx.font = '36px "Comic Sans MS", cursive';
  ctx.textAlign = 'center';
  ctx.fillText('Loading The Camp...', canvas.width / 2, canvas.height / 2);

  // Simple loading spinner
  const t = Date.now() / 200;
  for (let i = 0; i < 8; i++) {
    const angle = (i / 8) * Math.PI * 2 + t;
    const alpha = ((i / 8 + (t % 1)) % 1);
    ctx.fillStyle = `rgba(255, 213, 79, ${alpha})`;
    ctx.beginPath();
    ctx.arc(
      canvas.width / 2 + Math.cos(angle) * 30,
      canvas.height / 2 + 50 + Math.sin(angle) * 30,
      5, 0, Math.PI * 2
    );
    ctx.fill();
  }
}

function drawCharacterSelect() {
  // Background
  ctx.fillStyle = '#1a3a1a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Draw faded map as background
  if (mapImage) {
    ctx.globalAlpha = 0.15;
    const scale = Math.max(canvas.width / mapImage.naturalWidth, canvas.height / mapImage.naturalHeight);
    ctx.drawImage(mapImage, 0, 0, mapImage.naturalWidth * scale, mapImage.naturalHeight * scale);
    ctx.globalAlpha = 1;
  }

  // Title
  ctx.fillStyle = '#FF9800';
  ctx.font = 'bold 48px "Comic Sans MS", cursive';
  ctx.textAlign = 'center';
  ctx.strokeStyle = '#5D4037';
  ctx.lineWidth = 4;
  ctx.strokeText('The Camp', canvas.width / 2, 80);
  ctx.fillText('The Camp', canvas.width / 2, 80);

  ctx.fillStyle = '#FFE0B2';
  ctx.font = '20px "Comic Sans MS", cursive';
  ctx.fillText('Choose your camper!', canvas.width / 2, 120);

  // Character cards
  const cardW = 120;
  const cardH = 170;
  const gap = 20;
  const totalW = characters.length * (cardW + gap) - gap;
  const startX = canvas.width / 2 - totalW / 2;
  const cardY = canvas.height / 2 - 40;

  for (let i = 0; i < characters.length; i++) {
    const cx = startX + i * (cardW + gap);
    const isSelected = i === selectedCharIndex;
    const isHovered = i === hoveredCharIndex;

    // Card background
    ctx.fillStyle = isSelected ? 'rgba(255, 152, 0, 0.3)' : 'rgba(0, 0, 0, 0.3)';
    if (isHovered && !isSelected) ctx.fillStyle = 'rgba(255, 152, 0, 0.15)';
    ctx.strokeStyle = isSelected ? '#FF9800' : (isHovered ? '#FFB74D' : '#5D4037');
    ctx.lineWidth = isSelected ? 3 : 2;

    roundRect(cx, cardY, cardW, cardH, 10);
    ctx.fill();
    ctx.stroke();

    // Draw character
    drawCharacterSprite(cx + 35, cardY + 15, characters[i], 0, 'right', 1);

    // Name
    ctx.fillStyle = '#FFE0B2';
    ctx.font = '14px "Comic Sans MS", cursive';
    ctx.textAlign = 'center';
    ctx.fillText(characters[i].name, cx + cardW / 2, cardY + 85);

    // Description (word-wrapped within card)
    ctx.fillStyle = '#BCAAA4';
    ctx.font = '11px "Comic Sans MS", cursive';
    wrapText(characters[i].desc, cx + cardW / 2, cardY + 105, cardW - 12, 14);
  }

  // Instructions
  ctx.fillStyle = '#BCAAA4';
  ctx.font = '16px "Comic Sans MS", cursive';
  ctx.textAlign = 'center';
  ctx.fillText(isTouchDevice() ? 'Tap a camper to pick!' : '← → to browse  •  Enter or Click to pick', canvas.width / 2, canvas.height - 60);

  // Stars decoration
  const t = Date.now() / 1000;
  ctx.fillStyle = '#FFD54F';
  for (let i = 0; i < 15; i++) {
    const sx = (Math.sin(i * 2.5 + t * 0.3) * 0.5 + 0.5) * canvas.width;
    const sy = (Math.cos(i * 1.7 + t * 0.2) * 0.5 + 0.5) * canvas.height * 0.3;
    const size = 2 + Math.sin(t + i) * 1.5;
    drawStar(sx, sy, size);
  }
}

function drawStar(x, y, size) {
  ctx.save();
  ctx.translate(x, y);
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const angle = (i * 4 * Math.PI) / 5 - Math.PI / 2;
    const method = i === 0 ? 'moveTo' : 'lineTo';
    ctx[method](Math.cos(angle) * size, Math.sin(angle) * size);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawGame() {
  ctx.fillStyle = '#87CEEB';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (!mapImage) return;

  ctx.save();
  ctx.translate(-camera.x, -camera.y);

  // Draw map at scaled size
  ctx.drawImage(mapImage, 0, 0, scaledMapW, scaledMapH);

  // Draw interaction highlights
  for (const obj of interactiveObjects) {
    if (obj === nearbyObject) {
      // Glowing outline for nearby object
      const pulse = Math.sin(Date.now() / 200) * 0.3 + 0.7;
      ctx.strokeStyle = `rgba(255, 235, 59, ${pulse})`;
      ctx.lineWidth = 3;
      ctx.setLineDash([6, 4]);
      roundRectPath(obj.x - 4, obj.y - 4, obj.width + 8, obj.height + 8, 8);
      ctx.stroke();
      ctx.setLineDash([]);

      // Label
      ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
      ctx.font = 'bold 13px "Comic Sans MS", cursive';
      ctx.textAlign = 'center';
      const labelX = obj.x + obj.width / 2;
      const labelY = obj.y - 12;
      const labelW = ctx.measureText(obj.name).width + 16;
      roundRect(labelX - labelW / 2, labelY - 14, labelW, 22, 6);
      ctx.fill();

      ctx.fillStyle = '#FFEB3B';
      ctx.fillText(obj.name, labelX, labelY);

      // Interact hint
      ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
      const hintY = labelY - 24;
      const hintText = isTouchDevice() ? '[ TAP ]' : '[ SPACE ]';
      const hintW = ctx.measureText(hintText).width + 12;
      roundRect(labelX - hintW / 2, hintY - 12, hintW, 18, 4);
      ctx.fill();

      ctx.fillStyle = '#FFF9C4';
      ctx.font = '11px "Comic Sans MS", cursive';
      ctx.fillText(hintText, labelX, hintY);
    }
  }

  // Draw player
  drawCharacterSprite(
    player.x - player.width / 2,
    player.y - player.height,
    player.character,
    player.frame,
    player.facing,
    3.6
  );

  // Player shadow
  ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
  ctx.beginPath();
  ctx.ellipse(player.x, player.y + 2, 42, 15, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();

  // Tap ripple visual
  if (tapRipple) {
    tapRipple.age++;
    const progress = tapRipple.age / 30;
    if (progress >= 1) {
      tapRipple = null;
    } else {
      const alpha = 1 - progress;
      const radius = 8 + progress * 24;
      ctx.save();
      ctx.globalAlpha = alpha * 0.8;
      ctx.strokeStyle = '#FFD54F';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(tapRipple.x, tapRipple.y, radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = alpha * 0.4;
      ctx.beginPath();
      ctx.arc(tapRipple.x, tapRipple.y, radius * 0.5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }

  // HUD
  drawHUD();

  // Backpack overlay (also visible behind ITEM_ACTION modal)
  if (backpackOpen) drawBackpack();

  // Transient "you used X" toast
  drawUseToast();

  // Adventure Journal sidebar (always on top of game)
  drawJournal();

  // All-done celebration toast
  drawCompletionToast();
}

// --- Adventure Journal ---
function drawJournal() {
  const total = totalUsesCount();
  const done = completedUses.length;
  const isMobile = canvas.width < 600;
  const PANEL_W = isMobile ? canvas.width : 280;
  const BTN_W = 72;
  const BTN_H = 38;
  const BTN_X = canvas.width - BTN_W - 8;
  const BTN_Y = 10;

  // Journal toggle button (always visible)
  journalBtnRect = { x: BTN_X, y: BTN_Y, w: BTN_W, h: BTN_H };
  ctx.fillStyle = journalOpen ? '#5D4037' : 'rgba(0,0,0,0.55)';
  roundRect(BTN_X, BTN_Y, BTN_W, BTN_H, 8);
  ctx.fill();
  ctx.strokeStyle = journalOpen ? '#FFD54F' : '#8D6E63';
  ctx.lineWidth = 2;
  roundRect(BTN_X, BTN_Y, BTN_W, BTN_H, 8);
  ctx.stroke();
  ctx.fillStyle = '#FFECB3';
  ctx.font = 'bold 12px "Comic Sans MS", cursive';
  ctx.textAlign = 'center';
  ctx.fillText('📖', BTN_X + BTN_W / 2, BTN_Y + 14);
  ctx.fillStyle = done === total && total > 0 ? '#FFD54F' : '#FFECB3';
  ctx.font = '11px "Comic Sans MS", cursive';
  ctx.fillText(`${done}/${total}`, BTN_X + BTN_W / 2, BTN_Y + 29);

  if (!journalOpen) return;

  // Smooth scroll
  journalScrollTarget = Math.max(0, journalScrollTarget);
  journalScroll += (journalScrollTarget - journalScroll) * 0.18;

  const PANEL_H = isMobile ? canvas.height : canvas.height;
  const PANEL_X = isMobile ? 0 : canvas.width - PANEL_W;
  const PANEL_Y = 0;

  journalPanelRect = { x: PANEL_X, y: PANEL_Y, w: PANEL_W, h: PANEL_H };

  // Semi-transparent overlay on mobile
  if (isMobile) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // Panel background
  ctx.fillStyle = '#2a1a0a';
  ctx.fillRect(PANEL_X, PANEL_Y, PANEL_W, PANEL_H);
  ctx.strokeStyle = '#8D6E63';
  ctx.lineWidth = 2;
  ctx.strokeRect(PANEL_X, PANEL_Y, PANEL_W, PANEL_H);

  // Clip to panel
  ctx.save();
  ctx.beginPath();
  ctx.rect(PANEL_X, PANEL_Y, PANEL_W, PANEL_H);
  ctx.clip();

  const HEADER_H = 110;
  const PAD = 14;

  // Header background
  ctx.fillStyle = '#3E2723';
  ctx.fillRect(PANEL_X, PANEL_Y, PANEL_W, HEADER_H);
  ctx.strokeStyle = '#5D4037';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(PANEL_X, PANEL_Y + HEADER_H);
  ctx.lineTo(PANEL_X + PANEL_W, PANEL_Y + HEADER_H);
  ctx.stroke();

  // Title
  ctx.fillStyle = '#FFD54F';
  ctx.font = 'bold 18px "Comic Sans MS", cursive';
  ctx.textAlign = 'left';
  ctx.fillText('📖 Adventure Journal', PANEL_X + PAD, PANEL_Y + 30);

  // Close button
  const closeBtnX = PANEL_X + PANEL_W - 36;
  const closeBtnY = PANEL_Y + 8;
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  roundRect(closeBtnX, closeBtnY, 30, 30, 6);
  ctx.fill();
  ctx.fillStyle = '#FFECB3';
  ctx.font = 'bold 16px "Comic Sans MS", cursive';
  ctx.textAlign = 'center';
  ctx.fillText('×', closeBtnX + 15, closeBtnY + 21);

  // Progress bar
  const BAR_X = PANEL_X + PAD;
  const BAR_Y = PANEL_Y + 44;
  const BAR_W = PANEL_W - PAD * 2;
  const BAR_H = 14;
  ctx.fillStyle = '#4E342E';
  roundRect(BAR_X, BAR_Y, BAR_W, BAR_H, 7);
  ctx.fill();
  const fillW = total > 0 ? (done / total) * BAR_W : 0;
  if (fillW > 0) {
    ctx.fillStyle = done === total ? '#FFD54F' : '#FF8F00';
    roundRect(BAR_X, BAR_Y, fillW, BAR_H, 7);
    ctx.fill();
  }

  // Progress text
  ctx.fillStyle = '#FFECB3';
  ctx.font = '13px "Comic Sans MS", cursive';
  ctx.textAlign = 'left';
  const progressText = done === total && total > 0
    ? `🎉 All ${total} adventures complete!`
    : `${done} of ${total} adventures complete`;
  ctx.fillText(progressText, BAR_X, BAR_Y + BAR_H + 16);

  // Keyboard hint (desktop only)
  if (!isMobile) {
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.font = '10px "Comic Sans MS", cursive';
    ctx.textAlign = 'right';
    ctx.fillText('J to close', PANEL_X + PANEL_W - PAD, BAR_Y + BAR_H + 16);
  }

  // Completed entries list
  const ITEM_H = 68;
  const listTop = PANEL_Y + HEADER_H + 6;
  const scrollY = Math.round(journalScroll);

  ctx.save();
  ctx.beginPath();
  ctx.rect(PANEL_X, listTop, PANEL_W, PANEL_H - HEADER_H);
  ctx.clip();

  // Calculate max scroll
  const totalHeight = done * ITEM_H + 8;
  const maxScroll = Math.max(0, totalHeight - (PANEL_H - HEADER_H));
  journalScrollTarget = Math.min(journalScrollTarget, maxScroll);
  journalScroll = Math.min(journalScroll, maxScroll);

  if (done === 0) {
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.font = '13px "Comic Sans MS", cursive';
    ctx.textAlign = 'center';
    ctx.fillText('No adventures yet!', PANEL_X + PANEL_W / 2, listTop + 40);
    ctx.fillText('Pick up items and use them', PANEL_X + PANEL_W / 2, listTop + 60);
    ctx.fillText('at other spots to fill your journal.', PANEL_X + PANEL_W / 2, listTop + 80);
  }

  for (let i = 0; i < done; i++) {
    const entry = completedUses[done - 1 - i]; // newest first
    const ey = listTop + 8 + i * ITEM_H - scrollY;
    if (ey + ITEM_H < listTop || ey > PANEL_Y + PANEL_H) continue;

    // Card background
    ctx.fillStyle = i % 2 === 0 ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.1)';
    ctx.fillRect(PANEL_X + 4, ey, PANEL_W - 8, ITEM_H - 4);

    // Emoji
    ctx.font = '28px serif';
    ctx.textAlign = 'center';
    ctx.fillText(entry.itemEmoji, PANEL_X + 30, ey + 36);

    // Item name + hotspot
    ctx.fillStyle = '#FFD54F';
    ctx.font = 'bold 13px "Comic Sans MS", cursive';
    ctx.textAlign = 'left';
    ctx.fillText(entry.itemName, PANEL_X + 52, ey + 18);

    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = '11px "Comic Sans MS", cursive';
    ctx.fillText('at ' + entry.hotspotName, PANEL_X + 52, ey + 33);

    // Use text (truncated to 2 lines)
    ctx.fillStyle = '#FFECB3';
    ctx.font = '11px "Comic Sans MS", cursive';
    wrapTextMaxLines(entry.text, PANEL_X + 52, ey + 49, PANEL_W - 64, 14, 2);

    // Separator
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(PANEL_X + 8, ey + ITEM_H - 4);
    ctx.lineTo(PANEL_X + PANEL_W - 8, ey + ITEM_H - 4);
    ctx.stroke();
  }

  ctx.restore(); // restore list clip
  ctx.restore(); // restore panel clip
}

function wrapTextMaxLines(text, x, y, maxWidth, lineHeight, maxLines) {
  const words = text.split(' ');
  let line = '';
  let lineY = y;
  let lineCount = 0;
  for (const word of words) {
    const testLine = line + word + ' ';
    if (ctx.measureText(testLine).width > maxWidth && line) {
      if (lineCount >= maxLines - 1) {
        // Truncate last line with ellipsis
        let truncated = line.trim();
        while (ctx.measureText(truncated + '…').width > maxWidth && truncated.length > 0) {
          truncated = truncated.slice(0, -1);
        }
        ctx.fillText(truncated + '…', x, lineY);
        return;
      }
      ctx.fillText(line.trim(), x, lineY);
      line = word + ' ';
      lineY += lineHeight;
      lineCount++;
    } else {
      line = testLine;
    }
  }
  if (lineCount < maxLines) ctx.fillText(line.trim(), x, lineY);
}

function drawCompletionToast() {
  if (!completionToast) return;
  completionToast.age++;
  const DURATION = 180;
  if (completionToast.age > DURATION) { completionToast = null; return; }
  const alpha = completionToast.age < 30
    ? completionToast.age / 30
    : completionToast.age > DURATION - 30
      ? (DURATION - completionToast.age) / 30
      : 1;
  ctx.save();
  ctx.globalAlpha = alpha;
  const panelW = Math.min(420, canvas.width - 40);
  const panelH = 90;
  const panelX = canvas.width / 2 - panelW / 2;
  const panelY = canvas.height / 2 - 160;

  ctx.lineWidth = 3;
  roundRect(panelX, panelY, panelW, panelH, 16);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#FFD54F';
  ctx.font = 'bold 22px "Comic Sans MS", cursive';
  ctx.textAlign = 'center';

  ctx.fillStyle = '#FFECB3';

}

function drawInteraction() {
  drawGame();

  interactionAnimation = Math.min(1, interactionAnimation + 0.05);
  interactionTimer++;

  // --- Usable items (in backpack, valid use, not done) ---
  const usableItems = backpack.filter(item => {
    if (!item) return false;
    return getItemUseAtHotspot(item, currentInteraction) && !isUseAlreadyDone(item.id, currentInteraction.id);
  });

  // --- Dimmed items (use defined here, NOT in backpack, not done) ---
  const backpackItemIds = new Set(backpack.filter(Boolean).map(i => i.id));
  const dimmedItems = [];
  const hotspotDef = mapConfig && mapConfig.hotspots.find(h => h.id === currentInteraction.id);
  for (const useEntry of (hotspotDef && hotspotDef.uses || [])) {
    if (isUseAlreadyDone(useEntry.itemId, currentInteraction.id)) continue;
    if (backpackItemIds.has(useEntry.itemId)) continue;
    let itemInfo = null, location = null;
    for (const hId of Object.keys(hotspotItems)) {
      const found = (hotspotItems[hId] || []).find(it => it.id === useEntry.itemId);
      if (found) {
        const hDef = mapConfig.hotspots.find(h => h.id === hId);
        itemInfo = found; location = hDef ? hDef.name : hId; break;
      }
    }
    if (!itemInfo && mapConfig) {
      for (const h of mapConfig.hotspots) {
        const found = (h.items || []).find(it => it.id === useEntry.itemId);
        if (found) { itemInfo = found; location = h.name; break; }
      }
    }
    if (itemInfo) dimmedItems.push({ ...itemInfo, location });
  }

  const hasAnyItems = usableItems.length > 0 || dimmedItems.length > 0;

  // Overlay
  ctx.fillStyle = `rgba(0, 0, 0, ${0.5 * interactionAnimation})`;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // --- Compute panel height from content ---
  const panelW = Math.min(500, canvas.width - 40);
  const CONTENT_END = 140; // px from panelY where the text section ends
  const CLOSE_H    = 22;
  const BTN_SIZE   = 38;
  const LABEL_H    = 16;
  const GAP_H      = 8;

  let stripH = 0;
  if (hasAnyItems) {
    stripH += 14; // separator
    if (usableItems.length > 0) stripH += LABEL_H + BTN_SIZE;
    if (usableItems.length > 0 && dimmedItems.length > 0) stripH += GAP_H;
    if (dimmedItems.length > 0) stripH += LABEL_H + BTN_SIZE + LABEL_H; // label + buttons + hint
  }
  const panelH = CONTENT_END + stripH + CLOSE_H;

  const panelX = canvas.width / 2 - panelW / 2;
  const panelY = Math.max(10, Math.min(canvas.height - panelH - 10, canvas.height / 2 - panelH / 2));
  const scale  = interactionAnimation;

  ctx.save();
  ctx.translate(canvas.width / 2, canvas.height / 2);
  ctx.scale(scale, scale);
  ctx.translate(-canvas.width / 2, -canvas.height / 2);

  // Panel background
  ctx.fillStyle  = '#3E2723';
  ctx.strokeStyle = '#8D6E63';
  ctx.lineWidth   = 3;
  roundRect(panelX, panelY, panelW, panelH, 16);
  ctx.fill(); ctx.stroke();

  // Inner border
  ctx.strokeStyle = '#5D4037';
  ctx.lineWidth   = 1;
  roundRect(panelX + 6, panelY + 6, panelW - 12, panelH - 12, 12);
  ctx.stroke();

  // Object name
  ctx.fillStyle = '#FFD54F';
  ctx.font      = 'bold 24px "Comic Sans MS", cursive';
  ctx.textAlign = 'center';
  ctx.fillText(currentInteraction.name, canvas.width / 2, panelY + 45);

  // Interaction text (typewriter + word-wrap)
  const text = currentInteraction.interactionText;
  ctx.fillStyle = '#FFECB3';
  ctx.font      = '18px "Comic Sans MS", cursive';
  ctx.textAlign = 'center';
  const visibleChars = Math.min(text.length, Math.floor(interactionTimer * 0.8));
  wrapText(text.substring(0, visibleChars), canvas.width / 2, panelY + 85, panelW - 40, 24);

  // --- Items strip (running-Y layout) ---
  interactionUseRects  = [];
  interactionDimmedRects = [];
  let curY = panelY + CONTENT_END;

  if (hasAnyItems) {
    // Separator
    ctx.strokeStyle = 'rgba(141, 110, 99, 0.6)';
    ctx.lineWidth   = 1;
    ctx.beginPath();
    ctx.moveTo(panelX + 20, curY);
    ctx.lineTo(panelX + panelW - 20, curY);
    ctx.stroke();
    curY += 14;

    // Row helper: draws a row of emoji buttons, returns array of rects
    function drawItemRow(items, dimmed) {
      const slice   = items.slice(0, 9);
      const totalW  = slice.length * (BTN_SIZE + 6) - 6;
      const startX  = panelX + panelW / 2 - totalW / 2;
      const rowRects = [];
      slice.forEach((item, i) => {
        const bx = startX + i * (BTN_SIZE + 6);
        ctx.globalAlpha = dimmed ? 0.38 : 1.0;
        ctx.fillStyle   = dimmed ? 'rgba(120,120,120,0.12)' : 'rgba(255,213,79,0.15)';
        ctx.strokeStyle = dimmed ? '#8D6E63' : '#FFD54F';
        ctx.lineWidth   = 1.5;
        if (dimmed) ctx.setLineDash([3, 3]);
        roundRect(bx, curY, BTN_SIZE, BTN_SIZE, 8);
        ctx.fill(); ctx.stroke();
        ctx.setLineDash([]);
        ctx.font      = `${Math.floor(BTN_SIZE * 0.58)}px serif`;
        ctx.textAlign = 'center';
        ctx.fillText(item.emoji || '?', bx + BTN_SIZE / 2, curY + BTN_SIZE * 0.73);
        ctx.globalAlpha = 1.0;
        rowRects.push({ x: bx, y: curY, w: BTN_SIZE, h: BTN_SIZE, item });
      });
      return rowRects;
    }

    // ✨ Usable items row
    if (usableItems.length > 0) {
      ctx.fillStyle = '#FFD54F';
      ctx.font      = 'bold 12px "Comic Sans MS", cursive';
      ctx.textAlign = 'left';
      ctx.fillText('✨ In your backpack:', panelX + 20, curY + 12);
      curY += LABEL_H;
      const rects = drawItemRow(usableItems, false);
      rects.forEach(r => interactionUseRects.push(r));
      curY += BTN_SIZE;
      if (dimmedItems.length > 0) curY += GAP_H;
    }

    // 🔍 Dimmed items row
    if (dimmedItems.length > 0) {
      ctx.fillStyle = 'rgba(255,236,179,0.6)';
      ctx.font      = 'bold 12px "Comic Sans MS", cursive';
      ctx.textAlign = 'left';
      ctx.fillText('🔍 Find to use here:', panelX + 20, curY + 12);
      curY += LABEL_H;
      const rects = drawItemRow(dimmedItems, true);
      rects.forEach(r => interactionDimmedRects.push({ ...r, location: r.item.location }));
      curY += BTN_SIZE + 6;

      // Hint line
      const hintMsg = interactionHintText
        || (isTouchDevice() ? 'Tap a faded item to see where to find it'
                            : 'Hover a faded item to see where to find it');
      ctx.fillStyle = interactionHintText ? '#FFD54F' : 'rgba(255,236,179,0.45)';
      ctx.font      = `${interactionHintText ? 'bold ' : ''}11px "Comic Sans MS", cursive`;
      ctx.textAlign = 'center';
      ctx.fillText(hintMsg, canvas.width / 2, curY + 10, panelW - 30);
    }
  }

  // Close hint
  ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
  ctx.font      = '13px "Comic Sans MS", cursive';
  ctx.textAlign = 'center';
  ctx.fillText(isTouchDevice() ? 'Tap outside to close' : 'Press Space or Esc to close',
    canvas.width / 2, panelY + panelH - 10);

  ctx.restore();
}

function drawActionAnimation(action, x, y, timer) {
  const t = timer * 0.1;
  ctx.font = '28px serif';
  ctx.textAlign = 'center';

  switch (action) {
    case 'sleep': {
      for (let i = 0; i < 3; i++) {
        const zx = x - 30 + i * 30;
        const zy = y - Math.sin(t + i) * 8;
        const size = 16 + i * 6;
        ctx.globalAlpha = 0.5 + Math.sin(t + i) * 0.3;
        ctx.font = `${size}px "Comic Sans MS", cursive`;
        ctx.fillStyle = '#90CAF9';
        ctx.fillText('z', zx, zy);
      }
      ctx.globalAlpha = 1;
      break;
    }
    case 'fly': {
      const fx = Math.sin(t * 2) * 40;
      const fy = Math.cos(t * 3) * 10;
      ctx.fillText('✈️', x + fx, y + fy);
      // Trail
      for (let i = 1; i <= 3; i++) {
        ctx.globalAlpha = 0.3 / i;
        ctx.fillText('·', x + fx - i * 12, y + fy + i * 2);
      }
      ctx.globalAlpha = 1;
      break;
    }
    case 'cook': {
      const flames = ['🔥', '🍳', '🔥'];
      flames.forEach((f, i) => {
        const fofs = Math.sin(t * 3 + i * 2) * 5;
        ctx.fillText(f, x - 30 + i * 30, y + fofs);
      });
      break;
    }
    case 'stargaze': {
      for (let i = 0; i < 5; i++) {
        const sx = x - 60 + i * 30;
        const sy = y + Math.sin(t * 2 + i) * 6;
        ctx.globalAlpha = 0.5 + Math.sin(t + i * 1.5) * 0.5;
        ctx.fillStyle = '#FFD54F';
        ctx.font = `${14 + Math.sin(t + i) * 4}px serif`;
        ctx.fillText('⭐', sx, sy);
      }
      ctx.globalAlpha = 1;
      break;
    }
    case 'play': {
      const bx = x + Math.sin(t * 4) * 30;
      const by = y - Math.abs(Math.sin(t * 3)) * 20;
      ctx.fillText('⚾', bx, by);
      break;
    }
    case 'wash': {
      const drops = ['💧', '💧', '💧'];
      drops.forEach((d, i) => {
        const dy = Math.sin(t * 2 + i * 2) * 8;
        ctx.globalAlpha = 0.5 + Math.sin(t + i) * 0.5;
        ctx.fillText(d, x - 25 + i * 25, y + dy);
      });
      ctx.globalAlpha = 1;
      break;
    }
    case 'eat': {
      ctx.fillText('🍱', x, y + Math.sin(t) * 3);
      break;
    }
    default: {
      const bounce = Math.sin(t * 2) * 5;
      ctx.fillText('✨', x, y + bounce);
    }
  }
}

function wrapText(text, x, y, maxWidth, lineHeight) {
  const words = text.split(' ');
  let line = '';
  let lineY = y;

  for (const word of words) {
    const testLine = line + word + ' ';
    const metrics = ctx.measureText(testLine);
    if (metrics.width > maxWidth && line) {
      ctx.fillText(line.trim(), x, lineY);
      line = word + ' ';
      lineY += lineHeight;
    } else {
      line = testLine;
    }
  }
  ctx.fillText(line.trim(), x, lineY);
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

function roundRectPath(x, y, w, h, r) {
  roundRect(x, y, w, h, r);
}

// --- Resume / Start Fresh prompt ---
function resumePromptButtonRects() {
  const panelW = Math.min(420, canvas.width - 40);
  const panelH = 170;
  const panelY = canvas.height / 2 - panelH / 2;
  const btnW = 130, btnH = 40, btnY = panelY + panelH - 56, btnGap = 18;
  const resumeX = canvas.width / 2 - btnW - btnGap / 2;
  const freshX = canvas.width / 2 + btnGap / 2;
  return [
    { id: 'resume', x: resumeX, y: btnY, w: btnW, h: btnH },
    { id: 'fresh',  x: freshX,  y: btnY, w: btnW, h: btnH }
  ];
}

function drawResumePrompt() {
  // Faded map background, like character select
  ctx.fillStyle = '#1a3a1a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (mapImage) {
    ctx.globalAlpha = 0.15;
    const scale = Math.max(canvas.width / mapImage.naturalWidth, canvas.height / mapImage.naturalHeight);
    ctx.drawImage(mapImage, 0, 0, mapImage.naturalWidth * scale, mapImage.naturalHeight * scale);
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const panelW = Math.min(420, canvas.width - 40);
  const panelH = 170;
  const panelX = canvas.width / 2 - panelW / 2;
  const panelY = canvas.height / 2 - panelH / 2;

  ctx.fillStyle = '#3E2723';
  ctx.strokeStyle = '#8D6E63';
  ctx.lineWidth = 3;
  roundRect(panelX, panelY, panelW, panelH, 16);
  ctx.fill();
  ctx.stroke();

  ctx.strokeStyle = '#5D4037';
  ctx.lineWidth = 1;
  roundRect(panelX + 6, panelY + 6, panelW - 12, panelH - 12, 12);
  ctx.stroke();

  ctx.fillStyle = '#FFD54F';
  ctx.font = 'bold 22px "Comic Sans MS", cursive';
  ctx.textAlign = 'center';
  ctx.fillText('Welcome back, ' + (player.character ? player.character.name : '') + '!', canvas.width / 2, panelY + 50);

  ctx.fillStyle = '#FFECB3';
  ctx.font = '15px "Comic Sans MS", cursive';
  ctx.fillText('Resume your adventure or start fresh?', canvas.width / 2, panelY + 80);

  const btns = resumePromptButtonRects();
  const labels = { resume: 'Resume (R)', fresh: 'Start Fresh (F)' };
  const colors = { resume: '#4CAF50', fresh: '#F44336' };
  ctx.font = 'bold 15px "Comic Sans MS", cursive';
  for (const b of btns) {
    ctx.fillStyle = colors[b.id];
    roundRect(b.x, b.y, b.w, b.h, 8);
    ctx.fill();
    ctx.fillStyle = 'white';
    ctx.textAlign = 'center';
    ctx.fillText(labels[b.id], b.x + b.w / 2, b.y + 26);
  }
}

// --- Backpack overlay ---
function backpackMetrics() {
  const slotSize = Math.max(36, Math.min(64, Math.floor((canvas.width - 40) / 11)));
  const gap = Math.max(4, Math.floor(slotSize * 0.15));
  const padding = 12;
  const backpackRowW = BACKPACK_CAPACITY * slotSize + (BACKPACK_CAPACITY - 1) * gap;
  const hotspotRowW = HOTSPOT_CAPACITY * slotSize + (HOTSPOT_CAPACITY - 1) * gap;
  const hasHotspotRow = !!nearbyObject;
  const rowSpacing = 14;
  const labelH = 22;
  const titleH = 24;
  const overlayBottomMargin = 12;

  const backpackRowY = canvas.height - overlayBottomMargin - slotSize;
  const hotspotRowY = hasHotspotRow
    ? backpackRowY - slotSize - rowSpacing - labelH
    : backpackRowY;
  const overlayTop = (hasHotspotRow ? hotspotRowY - labelH : backpackRowY) - titleH - padding;

  const backpackRowX = canvas.width / 2 - backpackRowW / 2;
  const hotspotRowX = canvas.width / 2 - hotspotRowW / 2;

  return { slotSize, gap, padding, backpackRowW, hotspotRowW, hasHotspotRow, rowSpacing, labelH, titleH, overlayBottomMargin, backpackRowY, hotspotRowY, overlayTop, backpackRowX, hotspotRowX };
}

function backpackOverlayTop() {
  return backpackMetrics().overlayTop;
}

function drawBackpackSlot(x, y, size, item, isSelected, isAvailable) {
  const r = Math.max(6, size * 0.16);
  // Solid dark base for both states so the emoji always has consistent contrast
  ctx.fillStyle = 'rgba(62, 39, 35, 0.92)';
  roundRect(x, y, size, size, r);
  ctx.fill();
  // Selected: yellow highlight tint on top of the dark base, then a thicker yellow border
  if (isSelected) {
    ctx.fillStyle = 'rgba(255, 213, 79, 0.22)';
    roundRect(x, y, size, size, r);
    ctx.fill();
  }
  ctx.strokeStyle = isSelected ? '#FFD600' : (isAvailable ? '#8D6E63' : '#5D4037');
  ctx.lineWidth = isSelected ? 3 : 1.5;
  roundRect(x, y, size, size, r);
  ctx.stroke();

  if (item) {
    ctx.font = `${Math.floor(size * 0.6)}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(item.emoji || '?', x + size / 2, y + size / 2 + 2);
    ctx.textBaseline = 'alphabetic';
  }
}

function drawBackpack() {
  const m = backpackMetrics();
  backpackSlotRects = { backpack: [], hotspot: [] };

  // Panel background
  const panelX = 8;
  const panelY = m.overlayTop;
  const panelW = canvas.width - 16;
  const panelH = canvas.height - panelY - 4;
  ctx.fillStyle = 'rgba(20, 12, 6, 0.78)';
  ctx.strokeStyle = '#5D4037';
  ctx.lineWidth = 2;
  roundRect(panelX, panelY, panelW, panelH, 12);
  ctx.fill();
  ctx.stroke();

  // Title
  ctx.fillStyle = '#FFD54F';
  ctx.font = 'bold 15px "Comic Sans MS", cursive';
  ctx.textAlign = 'left';
  ctx.fillText(`🎒 Backpack (${backpack.length}/${BACKPACK_CAPACITY})`, panelX + 14, panelY + 18);

  ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
  ctx.font = '11px "Comic Sans MS", cursive';
  ctx.textAlign = 'right';
  const hint = nearbyObject
    ? '← → select  •  ↑ ↓ switch row  •  Enter act  •  B/Esc close'
    : '← → select  •  B/Esc close  •  (move to a spot to pick up)';
  ctx.fillText(hint, panelX + panelW - 14, panelY + 18);

  // Hotspot row (if applicable)
  if (m.hasHotspotRow) {
    const items = hotspotItems[nearbyObject.id] || [];
    ctx.fillStyle = '#FFECB3';
    ctx.font = 'bold 12px "Comic Sans MS", cursive';
    ctx.textAlign = 'center';
    ctx.fillText('At ' + nearbyObject.name, canvas.width / 2, m.hotspotRowY - 6);

    for (let i = 0; i < HOTSPOT_CAPACITY; i++) {
      const x = m.hotspotRowX + i * (m.slotSize + m.gap);
      const y = m.hotspotRowY;
      const isSelected = backpackOpen && backpackSelection.row === 'hotspot' && backpackSelection.col === i;
      drawBackpackSlot(x, y, m.slotSize, items[i] || null, isSelected, true);
      backpackSlotRects.hotspot.push({ x, y, w: m.slotSize, h: m.slotSize, col: i });
    }
  }

  // Backpack row
  for (let i = 0; i < BACKPACK_CAPACITY; i++) {
    const x = m.backpackRowX + i * (m.slotSize + m.gap);
    const y = m.backpackRowY;
    const isSelected = backpackOpen && backpackSelection.row === 'backpack' && backpackSelection.col === i;
    drawBackpackSlot(x, y, m.slotSize, backpack[i] || null, isSelected, true);
    backpackSlotRects.backpack.push({ x, y, w: m.slotSize, h: m.slotSize, col: i });
  }

  // Selected item name tooltip — below the slot for the hotspot row (the
  // "At <name>" header sits above and shouldn't be overlapped); above the
  // backpack row since it's anchored at the very bottom of the canvas.
  const item = selectedItem();
  if (item) {
    const isBackpackRow = backpackSelection.row === 'backpack';
    const rects = isBackpackRow ? backpackSlotRects.backpack : backpackSlotRects.hotspot;
    const r = rects[backpackSelection.col];
    if (r) {
      ctx.font = 'bold 13px "Comic Sans MS", cursive';
      ctx.textAlign = 'center';
      const label = item.name;
      const labelW = ctx.measureText(label).width + 14;
      const labelX = Math.max(8, Math.min(canvas.width - labelW - 8, r.x + r.w / 2 - labelW / 2));
      const labelY = isBackpackRow ? r.y - 22 : r.y + r.h + 4;
      ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
      roundRect(labelX, labelY, labelW, 20, 5);
      ctx.fill();
      ctx.fillStyle = '#FFEB3B';
      ctx.fillText(label, labelX + labelW / 2, labelY + 14);
    }
  }
}

// --- Use toast (transient floating message) ---
function drawUseToast() {
  if (!useToast) return;
  useToast.age++;
  if (useToast.age > 90) { useToast = null; return; }
  const alpha = useToast.age < 60 ? 1 : 1 - (useToast.age - 60) / 30;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = 'bold 18px "Comic Sans MS", cursive';
  ctx.textAlign = 'center';
  const w = ctx.measureText(useToast.text).width + 28;
  const y = canvas.height * 0.35;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
  roundRect(canvas.width / 2 - w / 2, y - 24, w, 36, 10);
  ctx.fill();
  ctx.fillStyle = '#FFEB3B';
  ctx.fillText(useToast.text, canvas.width / 2, y);
  ctx.restore();
}

// --- Item action modal ---
function drawItemActionDialog() {
  drawGame();
  if (backpackOpen) drawBackpack();

  ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const a = currentItemAction;
  const item = a && (a.source === 'backpack'
    ? backpack[a.index]
    : (hotspotItems[a.hotspotId] || [])[a.index]);
  if (!item) { closeItemAction(); return; }

  const panelW = Math.min(440, canvas.width - 40);
  const panelH = 200;
  const panelX = canvas.width / 2 - panelW / 2;
  const panelY = canvas.height / 2 - panelH / 2;

  ctx.fillStyle = '#3E2723';
  ctx.strokeStyle = '#8D6E63';
  ctx.lineWidth = 3;
  roundRect(panelX, panelY, panelW, panelH, 16);
  ctx.fill();
  ctx.stroke();

  ctx.strokeStyle = '#5D4037';
  ctx.lineWidth = 1;
  roundRect(panelX + 6, panelY + 6, panelW - 12, panelH - 12, 12);
  ctx.stroke();

  // Emoji + name
  ctx.font = '36px serif';
  ctx.textAlign = 'center';
  ctx.fillText(item.emoji || '?', canvas.width / 2 - 80, panelY + 60);

  ctx.fillStyle = '#FFD54F';
  ctx.font = 'bold 22px "Comic Sans MS", cursive';
  ctx.fillText(item.name, canvas.width / 2 + 30, panelY + 50);

  ctx.fillStyle = '#FFECB3';
  ctx.font = '13px "Comic Sans MS", cursive';
  const src = a.source === 'backpack' ? 'In your backpack' : 'At ' + (nearbyObject ? nearbyObject.name : 'this spot');
  ctx.fillText(src, canvas.width / 2 + 30, panelY + 75);

  // Buttons
  const btns = itemActionButtons();
  const btnW = Math.min(120, Math.floor((panelW - 60) / btns.length));
  const btnH = 40;
  const btnGap = 12;
  const totalW = btnW * btns.length + btnGap * (btns.length - 1);
  const startX = canvas.width / 2 - totalW / 2;
  const btnY = panelY + panelH - 60;
  itemActionButtonRects = [];

  const colorMap = { pickup: '#4CAF50', pickup_use: '#FF9800', drop: '#4CAF50', use: '#FF9800', cancel: '#757575' };

  ctx.font = 'bold 14px "Comic Sans MS", cursive';
  for (let i = 0; i < btns.length; i++) {
    const b = btns[i];
    const x = startX + i * (btnW + btnGap);
    const isFocused = i === backpackActionButton;
    const baseColor = colorMap[b.id] || '#5D4037';
    ctx.fillStyle = b.disabled ? '#555' : baseColor;
    roundRect(x, btnY, btnW, btnH, 8);
    ctx.fill();
    if (isFocused) {
      ctx.strokeStyle = '#FFD600';
      ctx.lineWidth = 3;
      roundRect(x, btnY, btnW, btnH, 8);
      ctx.stroke();
    }
    ctx.fillStyle = b.disabled ? '#999' : 'white';
    ctx.textAlign = 'center';
    ctx.fillText(b.label, x + btnW / 2, btnY + 26);
    itemActionButtonRects.push({ x, y: btnY, w: btnW, h: btnH, id: b.id, disabled: b.disabled });
  }

  ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
  ctx.font = '12px "Comic Sans MS", cursive';
  ctx.fillText(isTouchDevice() ? 'Tap a button' : '← → choose  •  Enter confirm  •  Esc cancel', canvas.width / 2, panelY + panelH - 12);
}

function drawConfirmDialog() {
  // Draw game in background
  drawGame();

  // Overlay
  ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Dialog panel
  const panelW = Math.min(400, canvas.width - 40);
  const panelH = 150;
  const panelX = canvas.width / 2 - panelW / 2;
  const panelY = canvas.height / 2 - panelH / 2;

  ctx.fillStyle = '#3E2723';
  ctx.strokeStyle = '#8D6E63';
  ctx.lineWidth = 3;
  roundRect(panelX, panelY, panelW, panelH, 16);
  ctx.fill();
  ctx.stroke();

  // Inner border
  ctx.strokeStyle = '#5D4037';
  ctx.lineWidth = 1;
  roundRect(panelX + 6, panelY + 6, panelW - 12, panelH - 12, 12);
  ctx.stroke();

  // Question text
  ctx.fillStyle = '#FFD54F';
  ctx.font = 'bold 20px "Comic Sans MS", cursive';
  ctx.textAlign = 'center';
  ctx.fillText('Switch camper?', canvas.width / 2, panelY + 42);

  ctx.fillStyle = '#FFECB3';
  ctx.font = '16px "Comic Sans MS", cursive';
  ctx.fillText('Go back to character selection?', canvas.width / 2, panelY + 72);

  // Buttons
  const btnW = 80;
  const btnH = 36;
  const btnY = panelY + panelH - 52;
  const btnGap = 20;

  // Yes button
  const yesBtnX = canvas.width / 2 - btnW - btnGap / 2;
  ctx.fillStyle = '#4CAF50';
  roundRect(yesBtnX, btnY, btnW, btnH, 8);
  ctx.fill();
  ctx.fillStyle = 'white';
  ctx.font = 'bold 16px "Comic Sans MS", cursive';
  ctx.fillText('Yes (Y)', yesBtnX + btnW / 2, btnY + 24);

  // No button
  const noBtnX = canvas.width / 2 + btnGap / 2;
  ctx.fillStyle = '#F44336';
  roundRect(noBtnX, btnY, btnW, btnH, 8);
  ctx.fill();
  ctx.fillStyle = 'white';
  ctx.fillText('No (N)', noBtnX + btnW / 2, btnY + 24);
}

// --- Main Game Loop ---
function gameLoop() {
  update();

  switch (state) {
    case GameState.LOADING:
      drawLoadingScreen();
      break;
    case GameState.CHARACTER_SELECT:
      drawCharacterSelect();
      break;
    case GameState.RESUME_PROMPT:
      drawResumePrompt();
      break;
    case GameState.PLAYING:
      drawGame();
      break;
    case GameState.INTERACTING:
      drawInteraction();
      drawJournal();
      drawCompletionToast();
      break;
    case GameState.ITEM_ACTION:
      drawItemActionDialog();
      drawJournal();
      drawCompletionToast();
      break;
    case GameState.USING_ITEM:
      drawItemUseDialog();
      break;
    case GameState.CONFIRM_DIALOG:
      drawConfirmDialog();
      break;
  }

  if (devMode) drawDevModeOverlay();

  requestAnimationFrame(gameLoop);
}

// Start!
gameLoop();
</script>

</html>
