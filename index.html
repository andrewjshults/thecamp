          if (nearbyObject) {
            const item = r.row === 'backpack'
              ? backpack[r.col]
              : (hotspotItems[nearbyObject.id] || [])[r.col];
            if (item) openItemAction();
          }
          return;
        }
      }
      // Tap outside any slot but still within the overlay band closes the backpack
      const overlayTop = backpackOverlayTop();
      if (screenY >= overlayTop) {
        backpackOpen = false;
        return;
      }
    }

    // Tapping a nearby friend starts a conversation (tapping a far one walks there)
    const tappedNpc = npcAtScreenPoint(screenX, screenY);
    if (tappedNpc && tappedNpc === nearbyNpc) {
      startConversation(tappedNpc);
      return;
    }

    // Tapping the character sprite triggers interaction; tapping elsewhere walks there
    const spriteScreenX = player.x - camera.x;
    const spriteScreenY = player.y - player.height - camera.y;
    const hitDist = Math.hypot(screenX - spriteScreenX, screenY - (spriteScreenY + player.height / 2));
    const onCharacter = hitDist < 108;
    const now = performance.now();
    if (onCharacter && nearbyObject) {
      handleInteract();
      lastCharTapTime = now;
    } else if (onCharacter) {
      if (now - lastCharTapTime < 350) {
        toggleBackpack();
        lastCharTapTime = 0;
      } else {
        lastCharTapTime = now;
      }
    } else {
      const mapX = screenX + camera.x;
      const mapY = screenY + camera.y;
      tapTarget = { x: mapX, y: mapY };
      tapRipple = { x: screenX, y: screenY, age: 0 };
    }
  }
}

// --- Interaction handling ---
function handleInteract() {
  if (state === GameState.PLAYING && nearbyObject) {
    // Portal hotspot: switch maps, no interaction dialog. Portals with a
    // `door` rect swing that door open first (see drawDoorOpening).
    if (nearbyObject.targetMap) {
      if (doorOpening) return;
      if (nearbyObject.door) {
        doorOpening = { obj: nearbyObject, start: performance.now() };
      } else {
        switchMap(nearbyObject.targetMap, nearbyObject.targetHotspot);
      }
      return;
    }
    // Kitchen station: Space picks up / puts down / cooks — no dialog
    if (nearbyObject.station && mapConfig.kitchen) {
      doStation(nearbyObject);
      return;
    }
    state = GameState.INTERACTING;
    currentInteraction = nearbyObject;
    interactionTimer = 0;
    interactionAnimation = 0;
  }
}

function closeInteraction() {
  state = GameState.PLAYING;
  currentInteraction = null;
  interactionHintText = null;
}

// --- Backpack / Inventory ---
function toggleBackpack() {
  backpackOpen = !backpackOpen;
  if (backpackOpen) {
    // Re-anchor selection; prefer hotspot row if items are there
    if (nearbyObject && (hotspotItems[nearbyObject.id] || []).length > 0) {
      backpackSelection = { row: 'hotspot', col: 0 };
    } else {
      backpackSelection = { row: 'backpack', col: 0 };
    }
  }
}

function selectedItem() {
  if (!backpackOpen) return null;
  if (backpackSelection.row === 'backpack') {
    return backpack[backpackSelection.col] || null;
  }
  if (!nearbyObject) return null;
  const items = hotspotItems[nearbyObject.id] || [];
  return items[backpackSelection.col] || null;
}

function backpackRowCount(row) {
  if (row === 'backpack') return BACKPACK_CAPACITY;
  if (!nearbyObject) return 0;
  return HOTSPOT_CAPACITY;
}

function handleBackpackKey(e) {
  if (e.key === 'Escape' || e.key === 'b' || e.key === 'B') {
    backpackOpen = false;
    return;
  }
  if (e.key === 'ArrowLeft') {
    const n = backpackRowCount(backpackSelection.row);
    if (n > 0) backpackSelection.col = (backpackSelection.col - 1 + n) % n;
  } else if (e.key === 'ArrowRight') {
    const n = backpackRowCount(backpackSelection.row);
    if (n > 0) backpackSelection.col = (backpackSelection.col + 1) % n;
  } else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    if (nearbyObject) {
      backpackSelection.row = backpackSelection.row === 'backpack' ? 'hotspot' : 'backpack';
      const n = backpackRowCount(backpackSelection.row);
      if (n > 0) backpackSelection.col = Math.min(backpackSelection.col, n - 1);
      else backpackSelection.col = 0;
    }
  } else if (e.key === 'Enter' || e.key === ' ') {
    openItemAction();
  }
}

function openItemAction() {
  if (!nearbyObject) return;            // outside hotspot = view-only
  const item = selectedItem();
  if (!item) return;
  currentItemAction = {
    source: backpackSelection.row,
    index: backpackSelection.col,
    hotspotId: nearbyObject.id
  };
  backpackActionButton = 0;
  state = GameState.ITEM_ACTION;
}

function closeItemAction() {
  currentItemAction = null;
  state = GameState.PLAYING;
}

// --- Item use helpers ---
function getItemUseAtHotspot(item, hotspot) {
  if (!item || !hotspot) return null;
  if (item.pickedUpFrom === hotspot.id) return null; // can't use where picked up
  const def = mapConfig && mapConfig.hotspots.find(h => h.id === hotspot.id);
  if (!def || !def.uses) return null;
  return def.uses.find(u => u.itemId === item.id) || null;
}

function isUseAlreadyDone(itemId, hotspotId) {
  return completedUses.some(u => u.hotspotId === hotspotId && u.itemId === itemId);
}

function totalUsesCount() {
  // Count across all cached map configs so the journal progress bar is global
  return Object.values(allMapConfigs)
    .flatMap(c => c.hotspots)
    .reduce((sum, h) => sum + (h.uses ? h.uses.length : 0), 0);
}

function itemActionButtons() {
  if (!currentItemAction) return [];
  const a = currentItemAction;
  if (a.source === 'hotspot') {
    const backpackFull = backpack.length >= BACKPACK_CAPACITY;
    return [
      { id: 'pickup', label: 'Pick up', disabled: backpackFull },
      { id: 'cancel', label: 'Cancel',  disabled: false }
    ];
  }
  // Backpack item
  const hotspotFull = !a.hotspotId ||
    (hotspotItems[a.hotspotId] || []).length + mpPendingDropsAt(a.hotspotId) >= HOTSPOT_CAPACITY;
  return [
    { id: 'drop',   label: 'Drop here', disabled: hotspotFull },
    { id: 'cancel', label: 'Cancel',    disabled: false },
  ];
}

// Move a hotspot item into the backpack. Returns false if the backpack is full.
function pickUpHotspotItem(hotspotId, index) {
  if (mp.active) return mpRequestTake(hotspotId, index);
  if (backpack.length >= BACKPACK_CAPACITY) return false;
  const items = hotspotItems[hotspotId] || [];
  const [item] = items.splice(index, 1);
  if (item) {
    item.pickedUpFrom = hotspotId; // record origin so it can't be used there
    backpack.push(item);
  }
  writeSave();
  return true;
}

function performItemAction(buttonId) {
  if (!currentItemAction) return;
  const a = currentItemAction;
  if (buttonId === 'cancel') {
    closeItemAction();
    return;
  }
  if (buttonId === 'pickup' && a.source === 'hotspot') {
    if (!pickUpHotspotItem(a.hotspotId, a.index)) return;
    // Snap selection to remaining hotspot items or fall back to backpack
    const remaining = (hotspotItems[a.hotspotId] || []).length;
    if (remaining > 0) {
      backpackSelection = { row: 'hotspot', col: Math.min(a.index, remaining - 1) };
    } else {
      backpackSelection = { row: 'backpack', col: Math.max(0, backpack.length - 1) };
    }
    closeItemAction();
    return;
  }
  if (buttonId === 'drop' && a.source === 'backpack') {
    const items = hotspotItems[a.hotspotId] || [];
    if (items.length + mpPendingDropsAt(a.hotspotId) >= HOTSPOT_CAPACITY) return;
    const [item] = backpack.splice(a.index, 1);
    if (mp.active) {
      // The world decides: it lands once the drop comes back from PubNub
      if (item) mpRequestDrop(a.hotspotId, item);
    } else {
      if (item) items.push(item);
      hotspotItems[a.hotspotId] = items;
    }
    writeSave();
    // Keep cursor on backpack row at a valid position
    const newCol = Math.min(a.index, Math.max(0, backpack.length - 1));
    backpackSelection = { row: 'backpack', col: newCol };
    closeItemAction();
    return;
  }
}

function useItem(item) {
  const use = getItemUseAtHotspot(item, nearbyObject);
  if (!use) return;
  // Record completion (item stays in backpack)
  completedUses.push({
    hotspotId: nearbyObject.id,
    hotspotName: nearbyObject.name,
    itemId: item.id,
    itemName: item.name,
    itemEmoji: item.emoji || '?',
    text: use.text
  });
  writeSave();
  // Check for all-done celebration
  if (completedUses.length === totalUsesCount()) {
    completionToast = { age: 0 };
  }
  // Transition to use dialog
  currentItemUse = {
    item,
    use,
    hotspot: nearbyObject,
    timer: 0,
    animation: use.animation || nearbyObject.action
  };
  itemUseAnimation = 0;
  backpackOpen = false;
  state = GameState.USING_ITEM;
}

function closeItemUse() {
  currentItemUse = null;
  state = GameState.PLAYING;
}

function handleItemActionKey(e) {
  const btns = itemActionButtons();
  if (e.key === 'Escape') {
    closeItemAction();
    return;
  }
  if (e.key === 'ArrowLeft') {
    backpackActionButton = (backpackActionButton - 1 + btns.length) % btns.length;
  } else if (e.key === 'ArrowRight') {
    backpackActionButton = (backpackActionButton + 1) % btns.length;
  } else if (e.key === 'Enter' || e.key === ' ') {
    const b = btns[backpackActionButton];
    if (b && !b.disabled) performItemAction(b.id);
  }
}

// ============================================================
// --- NPC friends & conversations ---
// ============================================================
// Each map JSON may list `npcs`: [{ id, character, px, py, personality }].
// `character` names an entry in `characters` (the player's own character is
// hidden); px/py are the NPC's FEET position as fractions of the image.
// The player types a line, it pops out of their mouth as a speech bubble,
// then the NPC answers. Replies come from Claude via POST /api/npc-reply
// (server.js); if that's unavailable we fall back to localNpcReply().
const talkBar   = document.getElementById('talkBar');
const talkInput = document.getElementById('talkInput');
const talkSay   = document.getElementById('talkSay');
const talkBye   = document.getElementById('talkBye');
const talkTo    = document.getElementById('talkTo');

const NPC_TALK_RANGE = 170;          // map px between feet to be able to chat
const conversations  = {};           // character name → [{ speaker:'player'|'npc', text }]
let nearbyNpc   = null;              // npc def the player can talk to right now
let talkingTo   = null;              // npc def in the active conversation
let talkPhase   = 'input';           // 'input' | 'playerSpeaking' | 'npcSpeaking'
let talkToken   = 0;                 // bumped per conversation so stale replies are dropped
let pendingReply = null;             // { npc, text } — reply received, not shown yet
let npcThinking  = null;             // { npc, since } — "..." cloud while waiting
let speechBubbles = [];              // see makeBubble()
const npcFacing = {};                // npc id → 'left' | 'right'

function characterByName(name) {
  return characters.find(c => c.name === name);
}

// An NPC is either one of the campers (`character`) or a critter drawn as an
// emoji (`emoji` + `name`, e.g. the frog living in the broken toilet).
function isCritter(npc) {
  return !!(npc && npc !== 'player' && npc.emoji);
}
function npcName(npc) {
  return npc.name || npc.character;   // remote players carry their character's name in `name`
}
// Critter height in map px (`size` is a fraction of the map height)
function critterSize(npc) {
  return (npc.size || 0.07) * scaledMapH;
}

// Camper NPCs step aside when a real person (you, or a friend in a
// multiplayer world) is playing as that character.
function currentNpcs() {
  if (!mapConfig || !Array.isArray(mapConfig.npcs)) return [];
  return mapConfig.npcs.filter(n => isCritter(n) ||
    (characterByName(n.character) &&
     (!player.character || n.character !== player.character.name) &&
     !mpCharacterTaken(n.character)));
}

// Everyone on this map you can walk up to and talk with: NPCs + friends
function talkablesHere() {
  return [...currentNpcs(), ...mpPlayersHere()];
}

function npcPos(npc) {
  return { x: npc.px * scaledMapW, y: npc.py * scaledMapH };
}

// Map-space feet / head / mouth for 'player', an npc def, or a remote player.
function speakerFeet(owner) {
  if (owner === 'player') return { x: player.x, y: player.y };
  if (owner.remote) return { x: owner.x, y: owner.y };
  return npcPos(owner);
}
function speakerHead(owner) {
  const f = speakerFeet(owner);
  if (isCritter(owner)) {
    const s = critterSize(owner);
    return { x: f.x, top: f.y - s, mouthY: f.y - s * 0.4 };
  }
  const spriteX = f.x - player.width / 2;
  const spriteY = f.y - player.height;
  return {
    x: spriteX + 15 * SPRITE_SCALE,          // head centre (see drawCharacterSprite)
    top: spriteY,
    mouthY: spriteY + 13 * SPRITE_SCALE
  };
}

function npcAtScreenPoint(sx, sy) {
  for (const npc of talkablesHere()) {
    const h = speakerHead(npc);
    const f = speakerFeet(npc);
    const cy = (h.top + f.y) / 2;
    if (Math.hypot(sx - (h.x - camera.x), sy - (cy - camera.y)) < 80) return npc;
  }
  return null;
}

// --- Starting / ending a conversation ---
function startConversation(npc) {
  if (state !== GameState.PLAYING || !npc) return;
  backpackOpen = false;
  journalOpen = false;
  tapTarget = null;
  player.walking = false;
  player.frame = 0;
  state = GameState.TALKING;
  talkingTo = npc;
  talkToken++;
  talkPhase = 'input';
  pendingReply = null;
  npcThinking = null;
  // Keep what a friend just said to you, so you can answer it
  speechBubbles = npc.remote ? speechBubbles.filter(b => b.owner === npc) : [];
  const p = speakerFeet(npc);
  player.facing = p.x < player.x ? 'left' : 'right';
  if (!npc.remote) npcFacing[npc.id] = p.x < player.x ? 'right' : 'left';
  if (npc.remote && useToast && useToast === mp.talkToast) useToast = null;   // you're answering now
  talkTo.textContent = npc.remote
    ? `💬 Talking with your friend ${npcName(npc)}`
    : `💬 Talking with ${npcName(npc)}`;
  talkInput.value = '';
  talkBar.hidden = false;
  setTalkEnabled(true);
}

function endConversation() {
  if (state !== GameState.TALKING) return;
  state = GameState.PLAYING;
  talkingTo = null;
  talkToken++;
  talkPhase = 'input';
  pendingReply = null;
  npcThinking = null;
  talkBar.hidden = true;
  talkInput.blur();
  // Let the last words linger for a moment, then fade away
  const fadeAt = performance.now() + 1500;
  for (const b of speechBubbles) if (!b.fadeStart) b.fadeStart = fadeAt;
}

function setTalkEnabled(on) {
  talkInput.disabled = !on;
  talkSay.disabled = !on;
  if (on) talkInput.focus();
}

talkBar.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = talkInput.value.replace(/\s+/g, ' ').trim();
  if (!text || !talkingTo || talkPhase !== 'input') return;
  talkInput.value = '';
  setTalkEnabled(false);

  const npc = talkingTo;
  const token = talkToken;
  say('player', text, npc);
  talkPhase = 'playerSpeaking';
  // Friends nearby see the bubble too (and a friend you're talking to answers)
  mpSay(text, npc);
  if (npc.remote) return;

  const history = conversations[npcName(npc)] || (conversations[npcName(npc)] = []);
  history.push({ speaker: 'player', text });

  // Ask for the reply right away; it's revealed once the player finishes talking
  fetchNpcReply(npc, history.slice()).then(reply => {
    if (token === talkToken) pendingReply = { npc, text: reply };
  });
});
talkBye.addEventListener('click', endConversation);
talkInput.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    e.preventDefault();
    endConversation();
  }
});

// Called every frame: advances the player-talks → NPC-answers sequence.
function updateConversation() {
  const now = performance.now();
  speechBubbles = speechBubbles.filter(b => !b.fadeStart || now - b.fadeStart < 600);
  if (state !== GameState.TALKING || !talkingTo) return;

  if (talkPhase === 'playerSpeaking') {
    const pb = speechBubbles.find(b => b.owner === 'player');
    const playerDone = !pb || now - pb.start > pb.duration + 400;
    if (!playerDone) return;
    if (talkingTo.remote) {
      // A friend answers whenever they like — you can keep talking
      talkPhase = 'input';
      setTalkEnabled(true);
      return;
    }
    if (pendingReply) {
      const { npc, text } = pendingReply;
      pendingReply = null;
      npcThinking = null;
      conversations[npcName(npc)].push({ speaker: 'npc', text });
      say(npc, text, 'player');
      mpSay(text, 'player', npc);
      talkPhase = 'npcSpeaking';
    } else if (!npcThinking) {
      npcThinking = { npc: talkingTo, since: now };
    }
  } else if (talkPhase === 'npcSpeaking') {
    const nb = speechBubbles.find(b => b.owner === talkingTo);
    if (!nb || now - nb.start > nb.duration + 150) {
      talkPhase = 'input';
      setTalkEnabled(true);
    }
  }
}

// --- Getting the NPC's words ---
async function fetchNpcReply(npc, history) {
  const ch = characterByName(npc.character);
  try {
    const res = await fetch('/api/npc-reply', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        npc: {
          name: npcName(npc),
          what: npc.what || '',                 // critters: what kind of creature they are
          desc: ch ? ch.desc : '',
          personality: npc.personality || ''
        },
        playerName: player.character ? player.character.name : 'a friend',
        mapName: mapConfig ? mapConfig.name : 'The Camp',
        places: mapConfig ? mapConfig.hotspots.filter(h => !h.targetMap).map(h => h.name) : [],
        backpack: backpack.map(i => i.name),
        history
      })
    });
    if (res.ok) {
      const data = await res.json();
      if (data && data.reply) return data.reply;
    }
  } catch (_) { /* offline / static hosting — fall through */ }
  // No server-side brain available: make something up locally after a little "think"
  await new Promise(r => setTimeout(r, 500 + Math.random() * 700));
  return localNpcReply(npc, history);
}

// Simple built-in reply maker used when Claude isn't reachable
// (e.g. on GitHub Pages, or no API key on the dev server).
function localNpcReply(npc, history) {
  if (npc.localReplies) return localCritterReply(npc, history);
  const said = (history[history.length - 1] || { text: '' }).text.toLowerCase();
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const name = player.character ? player.character.name : 'friend';
  const places = mapConfig ? mapConfig.hotspots.filter(h => !h.targetMap).map(h => h.name) : [];
  const place = places.length ? pick(places) : 'camp';
  const mentioned = places.find(p =>
    p.toLowerCase().split(' ').some(w => w.length > 3 && said.includes(w)));
  const has = re => re.test(said);

  if (has(/\b(hi|hello|hey|howdy|hiya)\b/)) return pick([
    `Hi ${name}! 👋 Want to go explore the ${place} with me?`,
    `Hey ${name}! I was just thinking about the ${place}.`,
    `Hello hello! Isn't today a perfect camp day? ☀️`
  ]);
  if (has(/\b(bye|goodbye|see ya|see you|later)\b/)) return pick([
    `Bye ${name}! Come find me again soon! 👋`,
    `See you later, alligator! 🐊`,
    `Okay, bye! Have fun exploring!`
  ]);
  if (mentioned) return pick([
    `Ooh, the ${mentioned}! That's one of my favorite spots.`,
    `I was at the ${mentioned} earlier. It was SO fun!`,
    `Race you to the ${mentioned}! 🏃`
  ]);
  if (has(/\b(sad|scared|tired|lonely|mad|upset)\b/)) return pick([
    `Aww, want a hug? 🤗 We can go to the ${place} together.`,
    `It's okay. I'm right here with you, ${name}.`,
    `Let's do something cozy. Maybe the ${place}?`
  ]);
  if (has(/\b(love|like|fun|yay|cool|awesome|best)\b/)) return pick([
    `Me too! That's the best! 🎉`,
    `Yay! You always have the best ideas, ${name}.`,
    `Ooh, I like that too! High five! ✋`
  ]);
  if (said.includes('?')) return pick([
    `Hmm... I think yes! But let's ask the Moon to be sure. 🌙`,
    `Great question! What do YOU think?`,
    `I'm not sure... maybe we can find out at the ${place}!`
  ]);
  return pick([
    `Wow, really? Tell me more!`,
    `Ha ha! You're so funny, ${name}! 😄`,
    `That reminds me, have you seen the ${place} today?`,
    `Cool! I love hanging out with you at camp.`
  ]);
}

// Critters can bring their own offline lines in the map JSON:
//   "localReplies": { "hello": [...], "bye": [...], "question": [...], "any": [...] }
// `{name}` is replaced with the player's character name.
function localCritterReply(npc, history) {
  const said = (history[history.length - 1] || { text: '' }).text.toLowerCase();
  const r = npc.localReplies;
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  let pool = r.any || [];
  if (/\b(hi|hello|hey|howdy|hiya)\b/.test(said) && r.hello) pool = r.hello;
  else if (/\b(bye|goodbye|see ya|see you|later)\b/.test(said) && r.bye) pool = r.bye;
  else if (said.includes('?') && r.question) pool = r.question;
  const name = player.character ? player.character.name : 'friend';
  return (pool.length ? pick(pool) : '...').replace(/\{name\}/g, name);
}

// --- Speech bubbles ---
const BUBBLE_FONT   = 'bold 18px "Comic Sans MS", "Chalkboard SE", cursive';
const BUBBLE_LINE_H = 24;
const BUBBLE_PAD_X  = 16;
const BUBBLE_PAD_Y  = 12;
const BUBBLE_MAX_W  = 260;
const BUBBLE_POP_MS = 320;
const WORD_POP_MS   = 170;

// Lay out the words up front (so the bubble has its final size), and give each
// word a time to pop in — roughly at speaking pace.
function makeBubble(owner, text, partner) {
  ctx.save();
  ctx.font = BUBBLE_FONT;
  const spaceW = ctx.measureText(' ').width;
  const lines = [];
  let line = [];
  let lineW = 0;
  let t = BUBBLE_POP_MS * 0.6;
  for (const word of text.split(/\s+/).filter(Boolean)) {
    const w = ctx.measureText(word).width;
    if (line.length && lineW + spaceW + w > BUBBLE_MAX_W) {
      lines.push({ words: line, width: lineW });
      line = [];
      lineW = 0;
    }
    const x = line.length ? lineW + spaceW : 0;
    line.push({ text: word, x, w, appearAt: t });
    lineW = x + w;
    t += 110 + word.length * 22;
  }
  if (line.length) lines.push({ words: line, width: lineW });
  ctx.restore();
  const contentW = Math.max(40, ...lines.map(l => l.width));
  return {
    owner, partner, lines, contentW,
    width: contentW + BUBBLE_PAD_X * 2,
    height: Math.max(1, lines.length) * BUBBLE_LINE_H + BUBBLE_PAD_Y * 2,
    start: performance.now(),
    duration: t,               // when the last word has started popping in
    dimmed: false,
    fadeStart: null
  };
}

function say(owner, text, partner) {
  // A speaker only has one bubble at a time; older lines from others go faint
  speechBubbles = speechBubbles.filter(b => b.owner !== owner);
  for (const b of speechBubbles) b.dimmed = true;
  speechBubbles.push(makeBubble(owner, text, partner));
}

// 0 = smiling, 0–1 = mouth open amount while their words are still appearing
function mouthOpenFor(owner) {
  const b = speechBubbles.find(b => b.owner === owner);
  if (!b) return 0;
  const age = performance.now() - b.start;
  if (age > b.duration + WORD_POP_MS) return 0;
  return 0.25 + 0.75 * Math.abs(Math.sin(age / 85));
}

function easeOutBack(p) {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2);
}
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function speakerColor(owner) {
  if (owner === 'player') return player.character ? player.character.color : '#333';
  if (owner.color) return owner.color;
  const ch = characterByName(owner.character);
  return ch ? ch.color : '#333';
}

// Where a bubble rests: above the speaker's head, nudged away from whoever
// they're talking to so the two bubbles don't overlap.
function bubbleLayout(owner, partner, w, h) {
  const head = speakerHead(owner);
  const sx = head.x - camera.x;
  const topY = head.top - camera.y;
  let dir = owner === 'player' ? -1 : 1;
  if (partner) {
    const a = speakerFeet(owner).x, b = speakerFeet(partner).x;
    if (a !== b) dir = a > b ? 1 : -1;
  }
  const x = clamp(sx + dir * (w / 2 - 40) - w / 2, 8, canvas.width - w - 8);
  const y = Math.max(8, topY - 30 - h);
  return {
    x, y,
    tipX: sx,
    tipY: topY - 6,
    mouthX: sx,
    mouthY: head.mouthY - camera.y
  };
}

function bubblePath(x, y, w, h, r, tipX, tipY) {
  const tw = 11;
  const baseX = clamp(tipX, x + r + tw, x + w - r - tw);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(baseX + tw, y + h);
  ctx.lineTo(tipX, tipY);
  ctx.lineTo(baseX - tw, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

function drawBubble(b, now) {
  const age = now - b.start;
  const L = bubbleLayout(b.owner, b.partner, b.width, b.height);

  let alpha = b.dimmed ? 0.55 : 1;
  if (b.fadeStart && now > b.fadeStart) alpha *= Math.max(0, 1 - (now - b.fadeStart) / 600);
  if (alpha <= 0) return;

  // Pop out of the mouth: start tiny at the mouth, spring up to the resting spot
  const p = clamp(age / BUBBLE_POP_MS, 0, 1);
  const scale = Math.max(0.01, easeOutBack(p));
  const rise = 1 - (1 - Math.pow(1 - p, 3));      // 1 → 0
  const ox = (L.mouthX - L.tipX) * rise;
  const oy = (L.mouthY - L.tipY) * rise;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(L.tipX + ox, L.tipY + oy);
  ctx.scale(scale, scale);
  ctx.translate(-L.tipX, -L.tipY);

  bubblePath(L.x, L.y, b.width, b.height, 16, L.tipX, L.tipY);
  ctx.shadowColor = 'rgba(0, 0, 0, 0.25)';
  ctx.shadowBlur = 8;
  ctx.shadowOffsetY = 3;
  ctx.fillStyle = '#FFFFFF';
  ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.lineWidth = 3;
  ctx.strokeStyle = speakerColor(b.owner);
  ctx.stroke();

  // Words pop in one at a time
  ctx.font = BUBBLE_FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#333';
  b.lines.forEach((line, i) => {
    const lineX = L.x + BUBBLE_PAD_X + (b.contentW - line.width) / 2;
    const lineY = L.y + BUBBLE_PAD_Y + i * BUBBLE_LINE_H + BUBBLE_LINE_H / 2;
    for (const word of line.words) {
      const wAge = age - word.appearAt;
      if (wAge < 0) break;
      const wp = clamp(wAge / WORD_POP_MS, 0, 1);
      const ws = 0.3 + 0.7 * easeOutBack(wp);
      const cx = lineX + word.x + word.w / 2;
      const cy = lineY + (1 - wp) * 8;
      ctx.save();
      ctx.globalAlpha = alpha * wp;
      ctx.translate(cx, cy);
      ctx.scale(ws, ws);
      ctx.fillText(word.text, 0, 0);
      ctx.restore();
    }
  });
  ctx.restore();
  ctx.textBaseline = 'alphabetic';
}

// "..." thought cloud while the NPC is coming up with an answer
function drawThinkingBubble(npc, now) {
  const age = now - npcThinking.since;
  const w = 78, h = 44;
  const L = bubbleLayout(npc, 'player', w, h);
  const p = clamp(age / 250, 0, 1);
  ctx.save();
  ctx.globalAlpha = p;
  ctx.fillStyle = '#FFFFFF';
  ctx.strokeStyle = speakerColor(npc);
  ctx.lineWidth = 3;
  // Little trail of thought puffs from the head up to the cloud
  const puffs = [[0.25, 5], [0.6, 8]];
  for (const [f, r] of puffs) {
    const px = L.tipX + (L.x + w / 2 - L.tipX) * f;
    const py = L.tipY + (L.y + h - L.tipY) * f;
    ctx.beginPath();
    ctx.arc(px, py, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  }
  roundRect(L.x, L.y, w, h, 20);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#666';
  for (let i = 0; i < 3; i++) {
    const bounce = Math.max(0, Math.sin(age / 160 - i * 0.7)) * 6;
    ctx.beginPath();
    ctx.arc(L.x + w / 2 + (i - 1) * 16, L.y + h / 2 + 2 - bounce, 5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawSpeechBubbles() {
  const now = performance.now();
  // Draw faded (older) bubbles first so the newest line is on top
  const ordered = [...speechBubbles].sort((a, b) => (a.dimmed === b.dimmed ? 0 : a.dimmed ? -1 : 1));
  for (const b of ordered) drawBubble(b, now);
  if (npcThinking) drawThinkingBubble(npcThinking.npc, now);
}

// --- Drawing people on the map (player + NPCs, sorted so lower = in front) ---
function drawPlayerSprite() {
  const mouth = mouthOpenFor('player');
  const draw = () => drawCharacterSprite(
    player.x - player.width / 2,
    player.y - player.height,
    player.character,
    player.frame,
    player.facing,
    SPRITE_SCALE,
    mouth,
    heldItem ? heldItem.emoji : null
  );
  if (player.rotation !== 0) {
    const cx = player.x;
    const cy = player.y - player.height / 2;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(player.rotation * Math.PI / 180);
    ctx.translate(-cx, -cy);
    draw();
    ctx.restore();
  } else {
    draw();
  }
  // Player shadow
  ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
  ctx.beginPath();
  const k = SPRITE_SCALE / BASE_SPRITE_SCALE;
  ctx.ellipse(player.x, player.y + 2, 42 * k, 15 * k, 0, 0, Math.PI * 2);
  ctx.fill();
}

// Critters are a big emoji that bobs gently, and squishes up and down
// while they're talking (their "mouth" moving).
function drawCritterSprite(npc) {
  const p = npcPos(npc);
  const s = critterSize(npc);
  const now = performance.now();
  const talk = mouthOpenFor(npc);
  const bob = Math.sin(now / 450 + p.x) * s * 0.03;
  const squish = talk ? 1 + 0.12 * talk : 1;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
  ctx.beginPath();
  ctx.ellipse(p.x, p.y, s * 0.4, s * 0.1, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.scale(2 - squish, squish);          // taller + thinner when "speaking"
  ctx.font = `${Math.round(s)}px ${SCENE_EMOJI_FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#000';                  // opaque, or Chrome fades colour emoji
  ctx.fillText(npc.emoji, 0, -s * 0.5 + bob);
  ctx.restore();
  ctx.textBaseline = 'alphabetic';
}

function drawNpcSprite(npc) {
  if (isCritter(npc)) { drawCritterSprite(npc); return; }
  const p = npcPos(npc);
  ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
  ctx.beginPath();
  const k = SPRITE_SCALE / BASE_SPRITE_SCALE;
  ctx.ellipse(p.x + 9 * k, p.y + 2, 42 * k, 15 * k, 0, 0, Math.PI * 2);
  ctx.fill();
  drawCharacterSprite(
    p.x - player.width / 2,
    p.y - player.height,
    characterByName(npc.character),
    0,
    npcFacing[npc.id] || 'right',
    SPRITE_SCALE,
    mouthOpenFor(npc)
  );
}

function drawNpcTalkHint(npc) {
  const head = speakerHead(npc);
  const x = head.x;
  const y = head.top - 16;
  ctx.textAlign = 'center';
  ctx.font = 'bold 13px "Comic Sans MS", cursive';
  const label = npcName(npc);
  const lw = ctx.measureText(label).width + 16;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
  roundRect(x - lw / 2, y - 14, lw, 22, 6);
  ctx.fill();
  ctx.fillStyle = speakerColor(npc);
  ctx.fillText(label, x, y + 2);

  const hint = isTouchDevice() ? '💬 [ TAP ME ]' : '💬 [ T ] Talk';
  ctx.font = '11px "Comic Sans MS", cursive';
  const hw = ctx.measureText(hint).width + 12;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
  roundRect(x - hw / 2, y - 38, hw, 18, 4);
  ctx.fill();
  ctx.fillStyle = '#FFF9C4';
  ctx.fillText(hint, x, y - 25);
}

function drawPeople() {
  const people = currentNpcs().map(npc => ({ y: npcPos(npc).y, draw: () => drawNpcSprite(npc) }));
  const friends = mpPlayersHere();
  for (const rp of friends) people.push({ y: rp.y, draw: () => drawRemotePlayer(rp) });
  people.push({ y: player.y, draw: drawPlayerSprite });
  people.sort((a, b) => a.y - b.y);
  for (const p of people) p.draw();
  const hinting = state === GameState.PLAYING ? nearbyNpc : null;
  for (const rp of friends) if (rp !== hinting) drawNameTag(rp);
  if (hinting) drawNpcTalkHint(hinting);
}

// --- Game Logic ---
function update() {
  if (state !== GameState.PLAYING) return;
  if (devMode) return;  // freeze everything while editing hotspots

  // Hold still while a door swings open, then go through it
  if (doorOpening) {
    if (performance.now() - doorOpening.start >= DOOR_OPEN_MS) {
      const o = doorOpening.obj;
      doorOpening = null;
      switchMap(o.targetMap, o.targetHotspot);
    }
    return;
  }

  // Movement (suppressed while backpack overlay is open — arrow keys drive selection)
  let dx = 0, dy = 0;
  player.walking = false;

  if (!backpackOpen) {
    if (keys['ArrowLeft'] || keys['a']) { dx = -player.speed; player.facing = 'left'; player.walking = true; }
    if (keys['ArrowRight'] || keys['d']) { dx = player.speed; player.facing = 'right'; player.walking = true; }
    if (keys['ArrowUp'] || keys['w']) { dy = -player.speed; player.walking = true; }
    if (keys['ArrowDown'] || keys['s']) { dy = player.speed; player.walking = true; }
  }

  // Keyboard cancels tap-to-move
  if (player.walking) {
    tapTarget = null;
  }

  // Tap-to-move: walk toward tapped map position
  if (!player.walking && tapTarget) {
    const tdx = tapTarget.x - player.x;
    const tdy = tapTarget.y - player.y;
    const dist = Math.hypot(tdx, tdy);
    if (dist < player.speed + 2) {
      tapTarget = null;
    } else {
      dx = (tdx / dist) * player.speed;
      dy = (tdy / dist) * player.speed;
      player.facing = tdx < 0 ? 'left' : 'right';
      player.walking = true;
    }
  }

  // Normalize diagonal movement
  if (dx !== 0 && dy !== 0) {
    dx *= 0.707;
    dy *= 0.707;
  }

  // Apply movement with map bounds (using scaled dimensions)
  if (mapImage) {
    player.x = Math.max(10, Math.min(scaledMapW - 10, player.x + dx));
    player.y = Math.max(10, Math.min(scaledMapH - 10, player.y + dy));
  }

  // Animation frame
  if (player.walking) {
    player.frameTimer++;
    if (player.frameTimer > 8) {
      player.frame = (player.frame + 1) % 4;
      player.frameTimer = 0;
    }
  } else {
    player.frame = 0;
    player.frameTimer = 0;
  }

  // Check for nearby interactive objects
  nearbyObject = null;
  let closestDist = Infinity;
  const px = player.x;
  const py = player.y;

  for (const obj of interactiveObjects) {
    const objCx = obj.x + obj.width / 2;
    const objCy = obj.y + obj.height / 2;
    const dist = Math.hypot(px - objCx, py - objCy);
    const threshold = Math.max(obj.width, obj.height) * 0.7 + 30;

    if (dist < threshold && dist < closestDist) {
      closestDist = dist;
      nearbyObject = obj;
    }
  }

  // Nearby friends: they turn to look at you, and the closest one can be talked to
  nearbyNpc = null;
  let npcBest = NPC_TALK_RANGE * (SPRITE_SCALE / BASE_SPRITE_SCALE);   // bigger people reach further
  for (const npc of talkablesHere()) {
    const p = speakerFeet(npc);
    const d = Math.hypot(px - p.x, py - p.y);
    if (d < 450 && !npc.remote) npcFacing[npc.id] = px < p.x ? 'left' : 'right';
    if (d < npcBest) {
      npcBest = d;
      nearbyNpc = npc;
    }
  }

  // Update camera to follow player
  updateCamera();
}

function updateCamera() {
  if (!mapImage) return;

  // Camera targets player center
  let targetX = player.x - canvas.width / 2;
  let targetY = player.y - canvas.height / 2;

  // Clamp camera to scaled map bounds
  targetX = Math.max(0, Math.min(scaledMapW - canvas.width, targetX));
  targetY = Math.max(0, Math.min(scaledMapH - canvas.height, targetY));

  // If the map is smaller than canvas, center it
  if (scaledMapW < canvas.width) targetX = -(canvas.width - scaledMapW) / 2;
  if (scaledMapH < canvas.height) targetY = -(canvas.height - scaledMapH) / 2;

  // Smooth camera follow
  camera.x += (targetX - camera.x) * 0.1;
  camera.y += (targetY - camera.y) * 0.1;
}

// --- Drawing ---
// mouth: 0 = smile, (0, 1] = open mouth (used to animate talking)
// `held`: emoji the character is carrying in both hands (kitchen food)
function drawCharacterSprite(x, y, char, frame, facing, scale, mouth, held) {
  const s = scale || 1;
  const w = 30 * s;
  const h = 48 * s;

  ctx.save();

  if (facing === 'left') {
    ctx.translate(x + w / 2, 0);
    ctx.scale(-1, 1);
    ctx.translate(-(x + w / 2), 0);
  }

  // Legs
  const legOffset = Math.sin(frame * Math.PI / 2) * 4 * s;
  ctx.fillStyle = char.pantsColor;
  ctx.fillRect(x + 7 * s, y + 30 * s + legOffset, 6 * s, 18 * s);
  ctx.fillRect(x + 17 * s, y + 30 * s - legOffset, 6 * s, 18 * s);

  // Shoes
  ctx.fillStyle = '#5D4037';
  ctx.fillRect(x + 5 * s, y + 44 * s + legOffset, 10 * s, 4 * s);
  ctx.fillRect(x + 15 * s, y + 44 * s - legOffset, 10 * s, 4 * s);

  // Body
  ctx.fillStyle = char.shirtColor;
  ctx.fillRect(x + 5 * s, y + 16 * s, 20 * s, 18 * s);

  if (held) {
    // Arms bend in to carry the food in front of the tummy
    const bob = Math.abs(Math.sin(frame * Math.PI / 2)) * 1.2 * s;
    ctx.fillStyle = char.shirtColor;
    ctx.fillRect(x, y + 17 * s, 6 * s, 9 * s);
    ctx.fillRect(x + 24 * s, y + 17 * s, 6 * s, 9 * s);
    ctx.fillRect(x + 3 * s, y + 23 * s + bob, 7 * s, 5 * s);
    ctx.fillRect(x + 20 * s, y + 23 * s + bob, 7 * s, 5 * s);
    ctx.font = `${Math.round(15 * s)}px ${SCENE_EMOJI_FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#000';                 // opaque, or Chrome fades colour emoji
    ctx.fillText(held, x + 15 * s, y + 25 * s + bob);
    ctx.textBaseline = 'alphabetic';
    // hands gripping the sides
    ctx.fillStyle = '#FFCC80';
    ctx.fillRect(x + 6 * s, y + 24 * s + bob, 4 * s, 5 * s);
    ctx.fillRect(x + 20 * s, y + 24 * s + bob, 4 * s, 5 * s);
  } else {
    // Arms
    const armSwing = Math.sin(frame * Math.PI / 2) * 3 * s;
    ctx.fillStyle = char.shirtColor;
    ctx.fillRect(x, y + 17 * s + armSwing, 6 * s, 14 * s);
    ctx.fillRect(x + 24 * s, y + 17 * s - armSwing, 6 * s, 14 * s);

    // Hands
    ctx.fillStyle = '#FFCC80';
    ctx.fillRect(x, y + 29 * s + armSwing, 6 * s, 4 * s);
    ctx.fillRect(x + 24 * s, y + 29 * s - armSwing, 6 * s, 4 * s);
  }

  // Head
  ctx.fillStyle = '#FFCC80';
  ctx.beginPath();
  ctx.arc(x + 15 * s, y + 10 * s, 10 * s, 0, Math.PI * 2);
  ctx.fill();

  // Hair
  ctx.fillStyle = char.hairColor;
  ctx.beginPath();
  ctx.arc(x + 15 * s, y + 7 * s, 10 * s, Math.PI, Math.PI * 2);
  ctx.fill();

  // Eyes
  ctx.fillStyle = '#333';
  ctx.fillRect(x + 11 * s, y + 8 * s, 3 * s, 3 * s);
  ctx.fillRect(x + 18 * s, y + 8 * s, 3 * s, 3 * s);

  if (mouth > 0) {
    // Talking: open mouth
    ctx.fillStyle = '#6D2E2E';
    ctx.beginPath();
    ctx.ellipse(x + 15 * s, y + 14.5 * s, 3 * s, (0.6 + mouth * 2) * s, 0, 0, Math.PI * 2);
    ctx.fill();
  } else {
    // Smile
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1.5 * s;
    ctx.beginPath();
    ctx.arc(x + 15 * s, y + 12 * s, 4 * s, 0.1, Math.PI - 0.1);
    ctx.stroke();
  }

  ctx.restore();
}

function drawLoadingScreen() {
  ctx.fillStyle = '#2a1a0a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#FFD54F';
  ctx.font = '36px "Comic Sans MS", cursive';
  ctx.textAlign = 'center';
  ctx.fillText(loadingMessage, canvas.width / 2, canvas.height / 2);

  // Simple loading spinner
  const t = Date.now() / 200;
  for (let i = 0; i < 8; i++) {
    const angle = (i / 8) * Math.PI * 2 + t;
    const alpha = ((i / 8 + (t % 1)) % 1);
    ctx.fillStyle = `rgba(255, 213, 79, ${alpha})`;
    ctx.beginPath();
    ctx.arc(
      canvas.width / 2 + Math.cos(angle) * 30,
      canvas.height / 2 + 50 + Math.sin(angle) * 30,
      5, 0, Math.PI * 2
    );
    ctx.fill();
  }
}

// Dark green backdrop with the map faded in, plus twinkling stars
function drawMenuBackdrop() {
  ctx.fillStyle = '#1a3a1a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (mapImage) {
    ctx.globalAlpha = 0.15;
    const scale = Math.max(canvas.width / mapImage.naturalWidth, canvas.height / mapImage.naturalHeight);
    ctx.drawImage(mapImage, 0, 0, mapImage.naturalWidth * scale, mapImage.naturalHeight * scale);
    ctx.globalAlpha = 1;
  }
  const t = Date.now() / 1000;
  ctx.fillStyle = '#FFD54F';
  for (let i = 0; i < 15; i++) {
    const sx = (Math.sin(i * 2.5 + t * 0.3) * 0.5 + 0.5) * canvas.width;
    const sy = (Math.cos(i * 1.7 + t * 0.2) * 0.5 + 0.5) * canvas.height * 0.3;
    drawStar(sx, sy, 2 + Math.sin(t + i) * 1.5);
  }
}

// "← Back" (to the single / multi player menu) on the character screen
function charSelectBackRect() {
  return { x: 12, y: 12, w: 96, h: 34 };
}
let charSelectNote = null;   // { text, at } — e.g. "a friend is already playing ..."

function drawCharacterSelect() {
  // Background
  ctx.fillStyle = '#1a3a1a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Draw faded map as background
  if (mapImage) {
    ctx.globalAlpha = 0.15;
    const scale = Math.max(canvas.width / mapImage.naturalWidth, canvas.height / mapImage.naturalHeight);
    ctx.drawImage(mapImage, 0, 0, mapImage.naturalWidth * scale, mapImage.naturalHeight * scale);
    ctx.globalAlpha = 1;
  }

  // Back button
  const bb = charSelectBackRect();
  ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
  roundRect(bb.x, bb.y, bb.w, bb.h, 10);
  ctx.fill();
  ctx.fillStyle = '#FFE0B2';
  ctx.font = 'bold 15px "Comic Sans MS", cursive';
  ctx.textAlign = 'center';
  ctx.fillText('← Back', bb.x + bb.w / 2, bb.y + 23);

  if (mp.active) drawWorldCodeBanner();

  // Title
  ctx.fillStyle = '#FF9800';
  ctx.font = 'bold 48px "Comic Sans MS", cursive';
  ctx.textAlign = 'center';
  ctx.strokeStyle = '#5D4037';
  ctx.lineWidth = 4;
  ctx.strokeText('The Camp', canvas.width / 2, 80);
  ctx.fillText('The Camp', canvas.width / 2, 80);

  ctx.fillStyle = '#FFE0B2';
  ctx.font = '20px "Comic Sans MS", cursive';
  ctx.fillText('Choose your camper!', canvas.width / 2, 120);

  // Character cards
  const cardW = 120;
  const cardH = 170;
  const gap = 20;
  const totalW = characters.length * (cardW + gap) - gap;
  const startX = canvas.width / 2 - totalW / 2;
  const cardY = canvas.height / 2 - 40;

  for (let i = 0; i < characters.length; i++) {
    const cx = startX + i * (cardW + gap);
    const isSelected = i === selectedCharIndex;
    const isHovered = i === hoveredCharIndex;
    const taken = mp.active && mpCharacterTaken(characters[i].name);
    if (taken) ctx.globalAlpha = 0.45;

    // Card background
    ctx.fillStyle = isSelected ? 'rgba(255, 152, 0, 0.3)' : 'rgba(0, 0, 0, 0.3)';
    if (isHovered && !isSelected) ctx.fillStyle = 'rgba(255, 152, 0, 0.15)';
    ctx.strokeStyle = isSelected ? '#FF9800' : (isHovered ? '#FFB74D' : '#5D4037');
    ctx.lineWidth = isSelected ? 3 : 2;

    roundRect(cx, cardY, cardW, cardH, 10);
    ctx.fill();
    ctx.stroke();

    // Draw character
    drawCharacterSprite(cx + 35, cardY + 15, characters[i], 0, 'right', 1);

    // Name
    ctx.fillStyle = '#FFE0B2';
    ctx.font = '14px "Comic Sans MS", cursive';
    ctx.textAlign = 'center';
    ctx.fillText(characters[i].name, cx + cardW / 2, cardY + 85);

    // Description (word-wrapped within card)
    ctx.fillStyle = '#BCAAA4';
    ctx.font = '11px "Comic Sans MS", cursive';
    wrapText(characters[i].desc, cx + cardW / 2, cardY + 105, cardW - 12, 14);
    ctx.globalAlpha = 1;
    if (taken) {
      ctx.save();
      ctx.translate(cx + cardW / 2, cardY + cardH / 2 + 10);
      ctx.rotate(-0.2);
      ctx.fillStyle = '#E53935';
      roundRect(-52, -15, 104, 30, 8);
      ctx.fill();
      ctx.fillStyle = 'white';
      ctx.font = 'bold 14px "Comic Sans MS", cursive';
      ctx.fillText('A friend!', 0, 5);
      ctx.restore();
    }
  }

  if (charSelectNote && performance.now() - charSelectNote.at < 3000) {
    ctx.font = 'bold 16px "Comic Sans MS", cursive';
    const nw = ctx.measureText(charSelectNote.text).width + 28;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    roundRect(canvas.width / 2 - nw / 2, cardY + cardH + 18, nw, 34, 10);
    ctx.fill();
    ctx.fillStyle = '#FFEB3B';
    ctx.textAlign = 'center';
    ctx.fillText(charSelectNote.text, canvas.width / 2, cardY + cardH + 41);
  }

  // Instructions
  ctx.fillStyle = '#BCAAA4';
  ctx.font = '16px "Comic Sans MS", cursive';
  ctx.textAlign = 'center';
  ctx.fillText(isTouchDevice() ? 'Tap a camper to pick!' : '← → to browse  •  Enter or Click to pick', canvas.width / 2, canvas.height - 60);

  // Stars decoration
  const t = Date.now() / 1000;
  ctx.fillStyle = '#FFD54F';
  for (let i = 0; i < 15; i++) {
    const sx = (Math.sin(i * 2.5 + t * 0.3) * 0.5 + 0.5) * canvas.width;
    const sy = (Math.cos(i * 1.7 + t * 0.2) * 0.5 + 0.5) * canvas.height * 0.3;
    const size = 2 + Math.sin(t + i) * 1.5;
    drawStar(sx, sy, size);
  }
}

function drawStar(x, y, size) {
  ctx.save();
  ctx.translate(x, y);
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const angle = (i * 4 * Math.PI) / 5 - Math.PI / 2;
    const method = i === 0 ? 'moveTo' : 'lineTo';
    ctx[method](Math.cos(angle) * size, Math.sin(angle) * size);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// ============================================================
// KITCHEN — cooking stations + the ONE food in your hands
// ============================================================
// A map with a `kitchen` ({ foods, recipes }) turns hotspots that have a
// `station` into cooking spots. Space at a station picks up / puts down /
// cooks. The player holds one food at a time (drawn in their hands); it never
// goes in the backpack and is left behind when they walk out of the kitchen.
// Station types:
//   source — { item }                                   grab an ingredient (never runs out)
//   cook   — { verb, doing, makes: { in: out }, seconds, fx }   Chop / Boil / Fry / Bake...
//   plate  — combine foods; when they match a kitchen.recipes[].needs it becomes `makes`
//   serve  — eat a finished dish (a food with "dish": true)
//   trash  — throw away whatever you're holding
let heldItem = null;          // { id, name, emoji } — only ever exists inside a kitchen
let dishesMade = [];          // dish ids eaten at least once (saved)
const stationStates = {};     // `${mapPath}#${hotspotId}` → state (kept while the game runs)

function kitchenFood(id) {
  const f = mapConfig && mapConfig.kitchen && mapConfig.kitchen.foods[id];
  return f ? { id, ...f } : { id, name: id, emoji: '❓' };
}
function foodLabel(id) {
  const f = kitchenFood(id);
  return `${f.emoji} ${f.name}`;
}
function kitchenDishes() {
  const foods = (mapConfig && mapConfig.kitchen && mapConfig.kitchen.foods) || {};
  return Object.keys(foods).filter(id => foods[id].dish);
}
function stationState(obj) {
  const key = `${currentMapPath}#${obj.id}`;
  return stationStates[key] || (stationStates[key] = { item: null, plate: [] });
}
function kitchenToast(text) {
  useToast = { text, age: 0, low: true };
}

// Multiset check: can every food in `have` be found in `needs`?
function bagFits(have, needs) {
  const left = [...needs];
  for (const id of have) {
    const i = left.indexOf(id);
    if (i < 0) return false;
    left.splice(i, 1);
  }
  return true;
}
function plateAccepts(plate, id) {
  return mapConfig.kitchen.recipes.some(r => bagFits([...plate, id], r.needs));
}
function plateRecipe(plate) {
  return mapConfig.kitchen.recipes.find(r => r.needs.length === plate.length && bagFits(plate, r.needs));
}

// Cooking finishes on a timer (checked every frame while drawing)
function tickStations(now) {
  for (const obj of interactiveObjects) {
    if (!obj.station || obj.station.type !== 'cook') continue;
    const S = stationState(obj);
    if (S.cookEnd && now >= S.cookEnd) {
      S.item = S.out;
      S.cooking = S.out = S.cookEnd = null;
      S.doneAt = now;
      kitchenToast(`Ding! The ${foodLabel(S.item)} is ready!`);
    }
  }
}

// Space at a station
function doStation(obj) {
  const st = obj.station, S = stationState(obj), now = performance.now();
  const held = heldItem;
  const handsFull = () => kitchenToast(`Your hands are full! Put down the ${foodLabel(held.id)} first.`);
  switch (st.type) {
    case 'source':
      if (!held) {
        heldItem = kitchenFood(st.item);
        kitchenToast(`You grab the ${foodLabel(st.item)}.`);
      } else if (held.id === st.item) {
        heldItem = null;
        kitchenToast(`You put the ${foodLabel(held.id)} back.`);
      } else handsFull();
      break;

    case 'cook': {
      const verb = (st.verb || 'Cook').toLowerCase();
      if (S.cookEnd) { kitchenToast(`${st.doing || 'Cooking'}... wait for the ding!`); break; }
      if (S.item) {
        if (held) { handsFull(); break; }
        heldItem = kitchenFood(S.item);
        S.item = null;
        kitchenToast(`You take the ${foodLabel(heldItem.id)}.`);
        break;
      }
      const inputs = Object.keys(st.makes).map(id => kitchenFood(id).emoji).join(' or ');
      if (!held) { kitchenToast(`You can ${verb} ${inputs} here.`); break; }
      const out = st.makes[held.id];
      if (!out) { kitchenToast(`You can't ${verb} ${foodLabel(held.id)}! Try ${inputs}.`); break; }
      S.cooking = held.id;
      S.out = out;
      S.cookStart = now;
      S.cookEnd = now + (st.seconds || 3) * 1000;
      heldItem = null;
      kitchenToast(`${st.doing || 'Cooking'} the ${foodLabel(held.id)}...`);
      break;
    }

    case 'plate': {
      if (held) {
        if (!plateAccepts(S.plate, held.id)) {
          const f = kitchenFood(held.id);
          if (!S.plate.length && f.dish) kitchenToast(`The ${foodLabel(f.id)} is ready to eat! Take it to the table.`);
          else if (S.plate.length) kitchenToast(`${f.emoji} doesn't go with ${S.plate.map(id => kitchenFood(id).emoji).join(' ')}! Check the recipe board.`);
          else kitchenToast(`${foodLabel(f.id)} isn't in a recipe yet. Try cooking it first!`);
          break;
        }
        S.plate.push(held.id);
        heldItem = null;
        const r = plateRecipe(S.plate);
        if (r) {
          S.plate = [r.makes];
          S.madeAt = now;
          kitchenToast(`✨ You made ${foodLabel(r.makes)}! Take it to the table to eat it.`);
        } else {
          kitchenToast(`You put the ${foodLabel(held.id)} on the plate.`);
        }
      } else if (S.plate.length) {
        heldItem = kitchenFood(S.plate.pop());
        kitchenToast(`You pick up the ${foodLabel(heldItem.id)}.`);
      } else {
        kitchenToast('Put food on the plate to make a recipe! Check the recipe board.');
      }
      break;
    }

    case 'serve': {
      if (!held) { kitchenToast('Make some food and bring it here to eat! 🍽️'); break; }
      const f = kitchenFood(held.id);
      if (!f.dish) { kitchenToast(`Raw ${f.name.toLowerCase()}? Yuck! Cook it or make a recipe first.`); break; }
      heldItem = null;
      S.eating = { emoji: f.emoji, start: now };
      const dishes = kitchenDishes();
      if (!dishesMade.includes(f.id)) {
        dishesMade.push(f.id);
        writeSave();
        const n = dishes.filter(id => dishesMade.includes(id)).length;
        kitchenToast(n === dishes.length
          ? `🎉 Yum! You've cooked EVERY recipe! Master Chef! 👩‍🍳`
          : `Yum! ${f.emoji} New recipe! You've made ${n} of ${dishes.length}.`);
      } else {
        kitchenToast(`Yum yum! You eat the ${foodLabel(f.id)}. 😋`);
      }
      break;
    }

    case 'trash':
      if (held) {
        heldItem = null;
        kitchenToast(`Into the compost goes the ${foodLabel(held.id)}! ♻️`);
      } else kitchenToast('Nothing to throw away!');
      break;
  }
}

// Short action text shown under the station's name ("[ SPACE ] Boil 🍅")
function stationHint(obj) {
  const st = obj.station, S = stationState(obj), held = heldItem;
  const e = id => kitchenFood(id).emoji;
  switch (st.type) {
    case 'source':
      if (!held) return `Take ${e(st.item)}`;
      return held.id === st.item ? `Put back ${held.emoji}` : 'Hands full';
    case 'cook':
      if (S.cookEnd) return `${st.doing || 'Cooking'}...`;
      if (S.item) return held ? 'Hands full' : `Take ${e(S.item)}`;
      if (!held) return `${st.verb || 'Cook'} ${Object.keys(st.makes).map(e).join(' ')}`;
      return st.makes[held.id] ? `${st.verb || 'Cook'} ${held.emoji}` : `Can't ${(st.verb || 'cook').toLowerCase()} ${held.emoji}`;
    case 'plate':
      if (held) return plateAccepts(S.plate, held.id) ? `Add ${held.emoji}` : `${held.emoji} doesn't fit`;
      return S.plate.length ? `Take ${e(S.plate[S.plate.length - 1])}` : 'Make a recipe';
    case 'serve':
      return held && kitchenFood(held.id).dish ? `Eat ${held.emoji}` : 'Eat food here';
    case 'trash':
      return held ? `Throw away ${held.emoji}` : 'Compost';
  }
  return '';
}

function drawFoodEmoji(emoji, x, y, size, alpha) {
  ctx.save();
  if (alpha != null) ctx.globalAlpha = alpha;
  ctx.font = `${Math.round(size)}px ${SCENE_EMOJI_FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#000';                   // opaque, or Chrome fades colour emoji
  ctx.fillText(emoji, x, y);
  ctx.restore();
}

// Food sitting on stations: cooking (with a timer ring + steam), done (bouncing
// with a sparkle), stacked on the plate, or being eaten at the table.
function drawStations() {
  if (!mapConfig || !mapConfig.kitchen) return;
  const now = performance.now();
  tickStations(now);
  for (const obj of interactiveObjects) {
    const st = obj.station;
    if (!st) continue;
    const S = stationState(obj);
    const x = obj.x + obj.width * (st.slot ? st.slot.px : 0.5);
    const y = obj.y + obj.height * (st.slot ? st.slot.py : 0.5);
    const size = (st.slotSize || 0.06) * scaledMapH;

    if (st.type === 'cook' && S.cookEnd) {
      const p = clamp((now - S.cookStart) / (S.cookEnd - S.cookStart), 0, 1);
      const jiggle = Math.sin(now / 70) * size * 0.04;
      drawFoodEmoji(kitchenFood(S.cooking).emoji, x + jiggle, y, size);
      ctx.lineWidth = 6;
      ctx.strokeStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath();
      ctx.arc(x, y, size * 0.75, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = '#FFD54F';
      ctx.beginPath();
      ctx.arc(x, y, size * 0.75, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * p);
      ctx.stroke();
      if (st.fx) {
        for (let i = 0; i < 3; i++) {
          const ph = (now / 900 + i / 3) % 1;
          drawFoodEmoji(st.fx, x + (i - 1) * size * 0.45, y - size * (0.7 + ph * 0.9), size * 0.45, 1 - ph);
        }
      }
    } else if (st.type === 'cook' && S.item) {
      const since = now - (S.doneAt || 0);
      const hop = since < 1200 ? Math.abs(Math.sin(since / 120)) * size * 0.25 : 0;
      drawFoodEmoji(kitchenFood(S.item).emoji, x, y - hop, size);
      drawFoodEmoji('✨', x + size * 0.55, y - size * 0.5, size * 0.4, 0.5 + 0.5 * Math.sin(now / 200));
      if (since < 1500) {
        ctx.save();
        ctx.globalAlpha = 1 - since / 1500;
        ctx.font = 'bold 24px "Comic Sans MS", cursive';
        ctx.textAlign = 'center';
        ctx.lineWidth = 5;
        ctx.strokeStyle = '#221c1a';
        ctx.fillStyle = '#FFF59D';
        ctx.strokeText('DING!', x, y - size - since / 30);
        ctx.fillText('DING!', x, y - size - since / 30);
        ctx.restore();
      }
    } else if (st.type === 'plate' && S.plate.length) {
      const n = S.plate.length;
      S.plate.forEach((id, i) => {
        drawFoodEmoji(kitchenFood(id).emoji, x + (i - (n - 1) / 2) * size * 0.6, y - i * size * 0.12, size);
      });
      if (S.madeAt && now - S.madeAt < 1500) {
        for (let i = 0; i < 5; i++) {
          const a = i * 1.26 + (now - S.madeAt) / 300;
          const r = size * (0.6 + (now - S.madeAt) / 1500);
          drawFoodEmoji('✨', x + Math.cos(a) * r, y + Math.sin(a) * r * 0.6, size * 0.35, 1 - (now - S.madeAt) / 1500);
        }
      }
    } else if (st.type === 'serve' && S.eating) {
      const t = (now - S.eating.start) / 1600;
      if (t >= 1) { S.eating = null; continue; }
      drawFoodEmoji(S.eating.emoji, x, y, size * (1 - t * 0.9), 1 - t * 0.5);
      drawFoodEmoji('😋', x + size * 0.6, y - size * (0.6 + t * 0.8), size * 0.5, 1 - t);
    }
  }
}

// Top-of-screen badge: which dishes you've made, and what's in your hands
function drawKitchenHud() {
  if (!mapConfig || !mapConfig.kitchen) return;
  const dishes = kitchenDishes();
  const made = dishes.filter(id => dishesMade.includes(id)).length;
  ctx.save();
  ctx.font = 'bold 14px "Comic Sans MS", cursive';
  const label = `Recipes made ${made}/${dishes.length}`;
  const iconW = 30;
  const w = ctx.measureText(label).width + dishes.length * iconW + 34;
  const x = canvas.width / 2 - w / 2, y = 10;
  ctx.fillStyle = 'rgba(40, 24, 8, 0.8)';
  roundRect(x, y, w, 36, 12);
  ctx.fill();
  ctx.fillStyle = '#FFD54F';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, x + 14, y + 18);
  ctx.restore();
  dishes.forEach((id, i) => {
    drawFoodEmoji(kitchenFood(id).emoji, x + w - 20 - (dishes.length - 1 - i) * iconW - 2, y + 18, 22,
      dishesMade.includes(id) ? 1 : 0.25);
  });
  if (heldItem) {
    ctx.save();
    ctx.font = 'bold 13px "Comic Sans MS", cursive';
    const t = `In your hands: ${heldItem.emoji} ${heldItem.name}`;
    const tw = ctx.measureText(t).width + 24;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
    roundRect(canvas.width / 2 - tw / 2, y + 42, tw, 24, 8);
    ctx.fill();
    ctx.fillStyle = '#FFF9C4';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(t, canvas.width / 2, y + 54);
    ctx.restore();
  }
}

// --- Door swinging open before walking through a portal ---
// A portal hotspot's optional `door` is { px, py, pw, ph, color } in map
// fractions: the door drawn on the map, which swings toward the viewer on its
// left hinge to reveal a dark doorway (with `door.inside` emoji in it).
const DOOR_OPEN_MS = 650;
let doorOpening = null;   // { obj, start }

function drawDoorOpening() {
  const d = doorOpening.obj.door;
  const x = d.px * scaledMapW, y = d.py * scaledMapH;
  const w = d.pw * scaledMapW, h = d.ph * scaledMapH;
  const p = Math.min(1, (performance.now() - doorOpening.start) / (DOOR_OPEN_MS * 0.8));
  const ease = 1 - Math.pow(1 - p, 3);
  const ink = '#221c1a';

  // dark doorway
  ctx.fillStyle = '#3b3631';
  ctx.fillRect(x, y, w, h);
  if (d.inside) {
    ctx.font = `${Math.round(w * 0.55)}px ${SCENE_EMOJI_FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.globalAlpha = 0.3 + 0.7 * ease;
    ctx.fillText(d.inside, x + w / 2, y + h * 0.68);
    ctx.globalAlpha = 1;
    ctx.textBaseline = 'alphabetic';
  }
  // the door: free edge swings left and toward us (so it gets a little taller)
  const angle = ease * 1.25;                       // ~72°
  const freeX = x + w * Math.cos(angle) - w * 0.12 * Math.sin(angle);
  const grow = h * 0.07 * Math.sin(angle);
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(freeX, y - grow);
  ctx.lineTo(freeX, y + h + grow);
  ctx.lineTo(x, y + h);
  ctx.closePath();
  ctx.fillStyle = d.color || '#8dbb2a';
  ctx.fill();
  ctx.lineWidth = 4;
  ctx.strokeStyle = ink;
  ctx.lineJoin = 'round';
  ctx.stroke();
  // round window, squashed as the door turns
  const ww = Math.max(2, (freeX - x) * 0.2);
  ctx.beginPath();
  ctx.ellipse(x + (freeX - x) / 2, y + h * 0.18, ww, w * 0.2, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#3fb6d9';
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.stroke();
  // creak!
  ctx.globalAlpha = Math.sin(p * Math.PI);
  ctx.font = 'bold 26px "Comic Sans MS", cursive';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#FFF59D';
  ctx.strokeStyle = ink;
  ctx.lineWidth = 5;
  ctx.strokeText('CREEEAK!', x + w / 2, y - 20);
  ctx.fillText('CREEEAK!', x + w / 2, y - 20);
  ctx.globalAlpha = 1;
}

function drawGame() {
  ctx.fillStyle = '#87CEEB';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (!mapImage) return;

  ctx.save();
  ctx.translate(-camera.x, -camera.y);

  // Draw map at scaled size
  ctx.drawImage(mapImage, 0, 0, scaledMapW, scaledMapH);
  drawStations();
  if (doorOpening) drawDoorOpening();

  // Draw interaction highlights
  for (const obj of interactiveObjects) {
    if (obj === nearbyObject && state !== GameState.TALKING) {
      // Glowing outline for nearby object
      const pulse = Math.sin(Date.now() / 200) * 0.3 + 0.7;
      ctx.strokeStyle = `rgba(255, 235, 59, ${pulse})`;
      ctx.lineWidth = 3;
      ctx.setLineDash([6, 4]);
      roundRectPath(obj.x - 4, obj.y - 4, obj.width + 8, obj.height + 8, 8);
      ctx.stroke();
      ctx.setLineDash([]);

      // Label
      ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
      ctx.font = 'bold 13px "Comic Sans MS", cursive';
      ctx.textAlign = 'center';
      const labelX = obj.x + obj.width / 2;
      // Keep the label (and the hint above it) on screen for tall/top hotspots
      const labelY = Math.max(obj.y - 12, camera.y + 46);
      const labelW = ctx.measureText(obj.name).width + 16;
      roundRect(labelX - labelW / 2, labelY - 14, labelW, 22, 6);
      ctx.fill();

      ctx.fillStyle = '#FFEB3B';
      ctx.fillText(obj.name, labelX, labelY);

      // Interact hint (portals get a special "ENTER" label)
      ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
      const hintY = labelY - 24;
      let hintText;
      if (obj.targetMap) {
        hintText = isTouchDevice() ? '🚪 [ TAP ]' : '🚪 [ ENTER ]';
      } else if (obj.station) {
        hintText = `${isTouchDevice() ? '[ TAP ]' : '[ SPACE ]'} ${stationHint(obj)}`;
      } else {
        hintText = isTouchDevice() ? '[ TAP ]' : '[ SPACE ]';
      }
      const hintW = ctx.measureText(hintText).width + 12;
      roundRect(labelX - hintW / 2, hintY - 12, hintW, 18, 4);
      ctx.fill();

      ctx.fillStyle = '#FFF9C4';
      ctx.font = '11px "Comic Sans MS", cursive';
      ctx.fillText(hintText, labelX, hintY);
    }
  }

  // Draw player and NPC friends (depth-sorted)
  drawPeople();

  ctx.restore();

  // Speech bubbles (screen space so they can be kept on-screen)
  drawSpeechBubbles();
  drawKitchenHud();

  // Tap ripple visual
  if (tapRipple) {
    tapRipple.age++;
    const progress = tapRipple.age / 30;
    if (progress >= 1) {
      tapRipple = null;
    } else {
      const alpha = 1 - progress;
      const radius = 8 + progress * 24;
      ctx.save();
      ctx.globalAlpha = alpha * 0.8;
      ctx.strokeStyle = '#FFD54F';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(tapRipple.x, tapRipple.y, radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = alpha * 0.4;
      ctx.beginPath();
      ctx.arc(tapRipple.x, tapRipple.y, radius * 0.5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }

  // HUD
  drawHUD();

  // Backpack overlay (also visible behind ITEM_ACTION modal)
  if (backpackOpen) drawBackpack();

  // Transient "you used X" toast
  drawUseToast();

  // Adventure Journal sidebar (always on top of game)
  drawJournal();

  // All-done celebration toast
  drawCompletionToast();
}

// --- Adventure Journal ---
function drawJournal() {
  const total = totalUsesCount();
  const done = completedUses.length;
  const isMobile = canvas.width < 600;
  const PANEL_W = isMobile ? canvas.width : 280;
  const BTN_W = 72;
  const BTN_H = 38;
  const BTN_X = canvas.width - BTN_W - 8;
  const BTN_Y = 10;

  // Journal toggle button (always visible)
  journalBtnRect = { x: BTN_X, y: BTN_Y, w: BTN_W, h: BTN_H };
  ctx.fillStyle = journalOpen ? '#5D4037' : 'rgba(0,0,0,0.55)';
  roundRect(BTN_X, BTN_Y, BTN_W, BTN_H, 8);
  ctx.fill();
  ctx.strokeStyle = journalOpen ? '#FFD54F' : '#8D6E63';
  ctx.lineWidth = 2;
  roundRect(BTN_X, BTN_Y, BTN_W, BTN_H, 8);
  ctx.stroke();
  ctx.fillStyle = '#FFECB3';
  ctx.font = 'bold 12px "Comic Sans MS", cursive';
  ctx.textAlign = 'center';
  ctx.fillText('📖', BTN_X + BTN_W / 2, BTN_Y + 14);
  ctx.fillStyle = done === total && total > 0 ? '#FFD54F' : '#FFECB3';
  ctx.font = '11px "Comic Sans MS", cursive';
  ctx.fillText(`${done}/${total}`, BTN_X + BTN_W / 2, BTN_Y + 29);

  if (!journalOpen) return;

  // Smooth scroll
  journalScrollTarget = Math.max(0, journalScrollTarget);
  journalScroll += (journalScrollTarget - journalScroll) * 0.18;

  const PANEL_H = isMobile ? canvas.height : canvas.height;
  const PANEL_X = isMobile ? 0 : canvas.width - PANEL_W;
  const PANEL_Y = 0;

  journalPanelRect = { x: PANEL_X, y: PANEL_Y, w: PANEL_W, h: PANEL_H };

  // Semi-transparent overlay on mobile
  if (isMobile) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // Panel background
  ctx.fillStyle = '#2a1a0a';
  ctx.fillRect(PANEL_X, PANEL_Y, PANEL_W, PANEL_H);
  ctx.strokeStyle = '#8D6E63';
  ctx.lineWidth = 2;
  ctx.strokeRect(PANEL_X, PANEL_Y, PANEL_W, PANEL_H);

  // Clip to panel
  ctx.save();
  ctx.beginPath();
  ctx.rect(PANEL_X, PANEL_Y, PANEL_W, PANEL_H);
  ctx.clip();

  const HEADER_H = 110;
  const PAD = 14;

  // Header background
  ctx.fillStyle = '#3E2723';
  ctx.fillRect(PANEL_X, PANEL_Y, PANEL_W, HEADER_H);
  ctx.strokeStyle = '#5D4037';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(PANEL_X, PANEL_Y + HEADER_H);
  ctx.lineTo(PANEL_X + PANEL_W, PANEL_Y + HEADER_H);
  ctx.stroke();

  // Title
  ctx.fillStyle = '#FFD54F';
  ctx.font = 'bold 18px "Comic Sans MS", cursive';
  ctx.textAlign = 'left';
  ctx.fillText('📖 Adventure Journal', PANEL_X + PAD, PANEL_Y + 30);

  // Close button
  const closeBtnX = PANEL_X + PANEL_W - 36;
  const closeBtnY = PANEL_Y + 8;
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  roundRect(closeBtnX, closeBtnY, 30, 30, 6);
  ctx.fill();
  ctx.fillStyle = '#FFECB3';
  ctx.font = 'bold 16px "Comic Sans MS", cursive';
  ctx.textAlign = 'center';
  ctx.fillText('×', closeBtnX + 15, closeBtnY + 21);

  // Progress bar
  const BAR_X = PANEL_X + PAD;
  const BAR_Y = PANEL_Y + 44;
  const BAR_W = PANEL_W - PAD * 2;
  const BAR_H = 14;
  ctx.fillStyle = '#4E342E';
  roundRect(BAR_X, BAR_Y, BAR_W, BAR_H, 7);
  ctx.fill();
  const fillW = total > 0 ? (done / total) * BAR_W : 0;
  if (fillW > 0) {
    ctx.fillStyle = done === total ? '#FFD54F' : '#FF8F00';
    roundRect(BAR_X, BAR_Y, fillW, BAR_H, 7);
    ctx.fill();
  }

  // Progress text
  ctx.fillStyle = '#FFECB3';
  ctx.font = '13px "Comic Sans MS", cursive';
  ctx.textAlign = 'left';
  const progressText = done === total && total > 0
    ? `🎉 All ${total} adventures complete!`
    : `${done} of ${total} adventures complete`;
  ctx.fillText(progressText, BAR_X, BAR_Y + BAR_H + 16);

  // Keyboard hint (desktop only)
  if (!isMobile) {
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.font = '10px "Comic Sans MS", cursive';
    ctx.textAlign = 'right';
    ctx.fillText('J to close', PANEL_X + PANEL_W - PAD, BAR_Y + BAR_H + 16);
  }

  // Completed entries list
  const ITEM_H = 68;
  const listTop = PANEL_Y + HEADER_H + 6;
  const scrollY = Math.round(journalScroll);

  ctx.save();
  ctx.beginPath();
  ctx.rect(PANEL_X, listTop, PANEL_W, PANEL_H - HEADER_H);
  ctx.clip();

  // Calculate max scroll
  const totalHeight = done * ITEM_H + 8;
  const maxScroll = Math.max(0, totalHeight - (PANEL_H - HEADER_H));
  journalScrollTarget = Math.min(journalScrollTarget, maxScroll);
  journalScroll = Math.min(journalScroll, maxScroll);

  if (done === 0) {
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.font = '13px "Comic Sans MS", cursive';
    ctx.textAlign = 'center';
    ctx.fillText('No adventures yet!', PANEL_X + PANEL_W / 2, listTop + 40);
    ctx.fillText('Pick up items and use them', PANEL_X + PANEL_W / 2, listTop + 60);
    ctx.fillText('at other spots to fill your journal.', PANEL_X + PANEL_W / 2, listTop + 80);
  }

  for (let i = 0; i < done; i++) {
    const entry = completedUses[done - 1 - i]; // newest first
    const ey = listTop + 8 + i * ITEM_H - scrollY;
    if (ey + ITEM_H < listTop || ey > PANEL_Y + PANEL_H) continue;

    // Card background
    ctx.fillStyle = i % 2 === 0 ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.1)';
    ctx.fillRect(PANEL_X + 4, ey, PANEL_W - 8, ITEM_H - 4);

    // Emoji
    ctx.font = '28px serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(entry.itemEmoji, PANEL_X + 30, ey + 36);

    // Item name + hotspot
    ctx.fillStyle = '#FFD54F';
    ctx.font = 'bold 13px "Comic Sans MS", cursive';
    ctx.textAlign = 'left';
    ctx.fillText(entry.itemName, PANEL_X + 52, ey + 18);

    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = '11px "Comic Sans MS", cursive';
    ctx.fillText('at ' + entry.hotspotName, PANEL_X + 52, ey + 33);

    // Use text (truncated to 2 lines)
    ctx.fillStyle = '#FFECB3';
    ctx.font = '11px "Comic Sans MS", cursive';
    wrapTextMaxLines(entry.text, PANEL_X + 52, ey + 49, PANEL_W - 64, 14, 2);

    // Separator
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(PANEL_X + 8, ey + ITEM_H - 4);
    ctx.lineTo(PANEL_X + PANEL_W - 8, ey + ITEM_H - 4);
    ctx.stroke();
  }

  ctx.restore(); // restore list clip
  ctx.restore(); // restore panel clip
}

function wrapTextMaxLines(text, x, y, maxWidth, lineHeight, maxLines) {
  const words = text.split(' ');
  let line = '';
  let lineY = y;
  let lineCount = 0;
  for (const word of words) {
    const testLine = line + word + ' ';
    if (ctx.measureText(testLine).width > maxWidth && line) {
      if (lineCount >= maxLines - 1) {
        // Truncate last line with ellipsis
        let truncated = line.trim();
        while (ctx.measureText(truncated + '…').width > maxWidth && truncated.length > 0) {
          truncated = truncated.slice(0, -1);
        }
        ctx.fillText(truncated + '…', x, lineY);
        return;
      }
      ctx.fillText(line.trim(), x, lineY);
      line = word + ' ';
      lineY += lineHeight;
      lineCount++;
    } else {
      line = testLine;
    }
  }
  if (lineCount < maxLines) ctx.fillText(line.trim(), x, lineY);
}

// --- Item Use Dialog ---
function drawItemUseDialog() {
  drawGame();

  currentItemUse.timer++;
  itemUseAnimation = Math.min(1, itemUseAnimation + 0.06);

  // Dark overlay
  ctx.fillStyle = `rgba(0, 0, 0, ${0.6 * itemUseAnimation})`;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const panelW = Math.min(520, canvas.width - 40);
  const panelH = 290;
  const panelX = canvas.width / 2 - panelW / 2;
  const panelY = Math.max(10, canvas.height / 2 - panelH / 2);
  const scale = itemUseAnimation;

  ctx.save();
  ctx.translate(canvas.width / 2, canvas.height / 2);
  ctx.scale(scale, scale);
  ctx.translate(-canvas.width / 2, -canvas.height / 2);

  // Panel
  ctx.fillStyle = '#3E2723';
  ctx.strokeStyle = '#FFD54F';
  ctx.lineWidth = 3;
  roundRect(panelX, panelY, panelW, panelH, 16);
  ctx.fill();
  ctx.stroke();

  // Inner border
  ctx.strokeStyle = '#5D4037';
  ctx.lineWidth = 1;
  roundRect(panelX + 6, panelY + 6, panelW - 12, panelH - 12, 12);
  ctx.stroke();

  // Item emoji (big, left side)
  const t = currentItemUse.timer * 0.1;
  ctx.font = '52px serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffffff';
  const emojiX = panelX + 58;
  const emojiY = panelY + 80 + Math.sin(t * 2) * 5;
  ctx.fillText(currentItemUse.item.emoji || '?', emojiX, emojiY);

  // Star burst around emoji (subtle)
  ctx.globalAlpha = 0.25 + Math.sin(t * 3) * 0.15;
  ctx.font = '16px serif';
  for (let i = 0; i < 6; i++) {
    const ang = (i / 6) * Math.PI * 2 + t;
    const starX = emojiX + Math.cos(ang) * 38;
    const starY = emojiY - 14 + Math.sin(ang) * 22;
    ctx.fillText('✨', starX, starY);
  }
  ctx.globalAlpha = 1;

  // Hotspot name
  ctx.fillStyle = '#FFD54F';
  ctx.font = 'bold 15px "Comic Sans MS", cursive';
  ctx.textAlign = 'left';
  ctx.fillText('At ' + currentItemUse.hotspot.name, panelX + 100, panelY + 34);

  // Item name
  ctx.fillStyle = '#FFECB3';
  ctx.font = 'bold 22px "Comic Sans MS", cursive';
  ctx.fillText(currentItemUse.item.name, panelX + 100, panelY + 60);

  // Use text with typewriter effect (left-aligned in right column)
  ctx.fillStyle = '#FFECB3';
  ctx.font = '16px "Comic Sans MS", cursive';
  ctx.textAlign = 'left';
  const text = currentItemUse.use.text;
  const visibleChars = Math.min(text.length, Math.floor(currentItemUse.timer * 1.1));
  const displayText = text.substring(0, visibleChars);
  wrapText(displayText, panelX + 104, panelY + 100, panelW - 124, 22);

  // Action animation at bottom
  drawActionAnimation(currentItemUse.animation, canvas.width / 2, panelY + panelH - 55, currentItemUse.timer);

  // Close hint
  ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
  ctx.font = '12px "Comic Sans MS", cursive';
  ctx.textAlign = 'center';
  ctx.fillText(isTouchDevice() ? 'Tap to close' : 'Press Space or Esc to close', canvas.width / 2, panelY + panelH - 15);

  ctx.restore();

  // Journal still shows on top
  drawJournal();
}

function drawCompletionToast() {
  if (!completionToast) return;
  completionToast.age++;
  const DURATION = 180;
  if (completionToast.age > DURATION) { completionToast = null; return; }
  const alpha = completionToast.age < 30
    ? completionToast.age / 30
    : completionToast.age > DURATION - 30
      ? (DURATION - completionToast.age) / 30
      : 1;
  ctx.save();
  ctx.globalAlpha = alpha;
  const panelW = Math.min(420, canvas.width - 40);
  const panelH = 90;
  const panelX = canvas.width / 2 - panelW / 2;
  const panelY = canvas.height / 2 - 160;
  ctx.fillStyle = '#1B5E20';
  ctx.strokeStyle = '#FFD54F';
  ctx.lineWidth = 3;
  roundRect(panelX, panelY, panelW, panelH, 16);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#FFD54F';
  ctx.font = 'bold 22px "Comic Sans MS", cursive';

  ctx.fillStyle = '#FFECB3';
